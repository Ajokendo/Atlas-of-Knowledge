<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2240" viewBox="0 0 760 2240" role="img" aria-labelledby="t d">
<title id="t">Самоиндукция, RL и LC — мобильная схема</title><desc id="d">Вертикальная инфографика с законом самоиндукции, графиками роста и спада тока в RL-цепи и обменом энергией в идеальном LC-контуре.</desc>
<defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d65b43"/></marker><style>path{fill:none}.bg{fill:#f7f8fa}.p{fill:#fff;stroke:#d7dde5;stroke-width:3}.h{font:700 28px Arial,sans-serif;fill:#172b45}.lab{font:21px Arial,sans-serif;fill:#26384d}.en{font:19px Arial,sans-serif;fill:#68788c}.f{font:700 28px Arial,sans-serif;fill:#172b45}.axis{stroke:#526174;stroke-width:3}.grid{stroke:#dce2e9;stroke-width:2;stroke-dasharray:6 7}.red{fill:none;stroke:#d65b43;stroke-width:6}.blue{fill:none;stroke:#2367a8;stroke-width:6}.green{fill:none;stroke:#25805a;stroke-width:6}.purple{fill:none;stroke:#8055a5;stroke-width:6}</style></defs>
<rect class="bg" width="760" height="2240"/><text class="h" x="35" y="55">Самоиндукция и колебания / Self-induction</text>
<rect class="p" x="25" y="95" width="710" height="430" rx="20"/><text class="h" x="55" y="150">1. Самоиндукция / Self-induction</text>
<path d="M70 280 H135 M135 280 C135 220 185 220 185 280 S235 340 235 280 S285 220 285 280 S335 340 335 280 H390" fill="none" stroke="#26384d" stroke-width="8"/><path d="M410 280 H500" class="red" marker-end="url(#r)"/>
<text class="lab" x="65" y="385">ЭДС катушки противодействует изменению тока.</text><text class="en" x="65" y="425">The coil's EMF opposes a change in current.</text><text class="f" x="65" y="485">εL = −L dI/dt</text><text class="f" x="420" y="485">U_B = ½LI²</text>
<rect class="p" x="25" y="555" width="710" height="760" rx="20"/><text class="h" x="55" y="610">2. RL-цепь / RL circuit</text>
<text class="lab" x="65" y="670">Рост тока / Current rise</text><path class="grid" d="M125 740 H680 M125 835 H680 M125 930 H680"/><path class="axis" d="M125 720 V955 H690"/><path class="red" d="M125 950 C180 820 245 765 340 745 C440 725 560 725 675 725"/><text class="lab" x="145" y="715">I∞ = V/R</text><text class="lab" x="610" y="990">t (с/s)</text><text class="lab" x="70" y="850">I (A)</text>
<text class="lab" x="65" y="1050">Спад тока / Current decay</text><path class="grid" d="M125 1110 H680 M125 1200 H680 M125 1280 H680"/><path class="axis" d="M125 1090 V1295 H690"/><path class="blue" d="M125 1100 C200 1100 260 1150 340 1210 C430 1270 560 1290 675 1290"/><text class="lab" x="145" y="1085">I(0) = I₀</text><text class="lab" x="610" y="1325">t (с/s)</text><text class="lab" x="70" y="1190">I (A)</text><text class="f" x="65" y="1270">τ = L/R</text>
<rect class="p" x="25" y="1345" width="710" height="820" rx="20"/><text class="h" x="55" y="1400">3. LC-контур / LC oscillator</text>
<text class="lab" x="65" y="1460">Заряд и ток / Charge and current</text><path class="grid" d="M95 1540 H680 M95 1625 H680 M95 1710 H680"/><path class="axis" d="M95 1625 H690 M95 1525 V1730"/><path class="red" d="M95 1545 C145 1545 165 1705 215 1705 S285 1545 335 1545 S405 1705 455 1705 S525 1545 575 1545 S645 1705 680 1705"/><path class="blue" d="M95 1625 C145 1705 165 1625 215 1545 S285 1625 335 1705 S405 1625 455 1545 S525 1625 575 1705 S645 1625 680 1545"/><text class="lab" x="95" y="1510" fill="#d65b43">q(t)=Q₀ cos(ωt)</text><text class="lab" x="95" y="1755" fill="#2367a8">I(t)=−ωQ₀ sin(ωt)</text><text class="en" x="95" y="1795">q (Кл/C); I (A); t (с/s)</text>
<text class="lab" x="65" y="1870">Обмен энергией / Energy exchange</text><path class="grid" d="M95 1940 H680 M95 2020 H680 M95 2100 H680"/><path class="axis" d="M95 1930 V2120 H690"/><path class="green" d="M95 1940 C145 1940 165 2100 215 2100 S285 1940 335 1940 S405 2100 455 2100 S525 1940 575 1940 S645 2100 680 2100"/><path class="purple" d="M95 2100 C145 2100 165 1940 215 1940 S285 2100 335 2100 S405 1940 455 1940 S525 2100 575 2100 S645 1940 680 1940"/><text class="lab" x="95" y="1910" fill="#25805a">UE = ½CV²</text><text class="lab" x="390" y="1910" fill="#8055a5">UB = ½LI²</text><text class="f" x="65" y="2185">ω = 1/√(LC)</text><text class="en" x="350" y="2185">q(0)=Q₀, I(0)=0</text>
