<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1510" viewBox="0 0 760 1510" role="img" aria-labelledby="t d">
<title id="t">Закон Ленца — мобильная схема</title><desc id="d">Приближение и удаление северного полюса магнита от катушки; индуцированное поле направлено против изменения магнитного потока.</desc>
<defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d65b43"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2367a8"/></marker><style>path{fill:none}.bg{fill:#f7f8fa}.p{fill:#fff;stroke:#d7dde5;stroke-width:3}.h{font:700 28px Arial,sans-serif;fill:#172b45}.lab{font:21px Arial,sans-serif;fill:#26384d}.en{font:19px Arial,sans-serif;fill:#68788c}.f{font:700 30px Arial,sans-serif;fill:#172b45}.n{fill:#d65b43}.s{fill:#2367a8}.coil{fill:none;stroke:#26384d;stroke-width:8}.b{fill:none;stroke:#2367a8;stroke-width:6;stroke-dasharray:12 8;marker-end:url(#b)}.r{fill:none;stroke:#d65b43;stroke-width:6;marker-end:url(#r)}</style></defs>
<rect class="bg" width="760" height="1510"/><text class="h" x="35" y="55">Закон Ленца / Lenz's law</text><text class="en" x="35" y="95">Ток противодействует изменению потока, а не движению магнита.</text><text class="en" x="35" y="128">Current opposes flux change, not the magnet's motion.</text>
<rect class="p" x="25" y="165" width="710" height="600" rx="20"/><text class="h" x="55" y="220">1. Приближение / Approaching</text>
<rect class="s" x="90" y="330" width="105" height="90" rx="8"/><rect class="n" x="195" y="330" width="105" height="90" rx="8"/><text x="142" y="390" fill="#fff" font-size="36" text-anchor="middle">S</text><text x="247" y="390" fill="#fff" font-size="36" text-anchor="middle">N</text>
<path d="M310 375 H395" class="r"/><text class="lab" x="325" y="340">v →</text>
<g class="coil"><ellipse cx="475" cy="375" rx="22" ry="78"/><ellipse cx="510" cy="375" rx="22" ry="78"/><ellipse cx="545" cy="375" rx="22" ry="78"/><ellipse cx="580" cy="375" rx="22" ry="78"/></g>
<path d="M300 280 Q450 210 640 280" class="b"/><path d="M640 470 Q450 540 300 470" class="b"/><path d="M640 375 H420" class="r"/><text class="lab" x="445" y="260">Bинд ←</text>
<text class="lab" x="65" y="565">Поток вправо растёт; Bинд направлено влево.</text><text class="en" x="65" y="600">Rightward flux increases; induced field points left.</text><text class="lab" x="65" y="650">Ближняя сторона катушки — N; ток против часовой стрелки.</text><text class="en" x="65" y="685">Near coil face is N; current is counterclockwise.</text>
<rect class="p" x="25" y="795" width="710" height="600" rx="20"/><text class="h" x="55" y="850">2. Удаление / Receding</text>
<rect class="s" x="90" y="960" width="105" height="90" rx="8"/><rect class="n" x="195" y="960" width="105" height="90" rx="8"/><text x="142" y="1020" fill="#fff" font-size="36" text-anchor="middle">S</text><text x="247" y="1020" fill="#fff" font-size="36" text-anchor="middle">N</text>
<path d="M80 1005 H20" class="r"/><text class="lab" x="35" y="950">v ←</text>
<g class="coil"><ellipse cx="475" cy="1005" rx="22" ry="78"/><ellipse cx="510" cy="1005" rx="22" ry="78"/><ellipse cx="545" cy="1005" rx="22" ry="78"/><ellipse cx="580" cy="1005" rx="22" ry="78"/></g>
<path d="M300 910 Q450 840 640 910" class="b"/><path d="M640 1100 Q450 1170 300 1100" class="b"/><path d="M420 1005 H640" class="r"/><text class="lab" x="445" y="890">Bинд →</text>
<text class="lab" x="65" y="1195">Поток вправо уменьшается; Bинд направлено вправо.</text><text class="en" x="65" y="1230">Rightward flux decreases; induced field points right.</text><text class="lab" x="65" y="1280">Ближняя сторона катушки — S; ток по часовой стрелке.</text><text class="en" x="65" y="1315">Near coil face is S; current is clockwise.</text>
<text class="f" x="380" y="1460" text-anchor="middle">ε = −N dΦ/dt</text>
</svg>