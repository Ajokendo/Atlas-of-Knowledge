<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1640" viewBox="0 0 760 1640" role="img" aria-labelledby="t d">
<title id="t">ЭДС движения — мобильная схема</title><desc id="d">Стержень движется вправо в магнитном поле, направленном в плоскость рисунка. Сила q(v cross B) разделяет заряды; показаны замкнутая и разомкнутая цепи.</desc>
<defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d65b43"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2367a8"/></marker><style>path{fill:none}.bg{fill:#f7f8fa}.p{fill:#fff;stroke:#d7dde5;stroke-width:3}.h{font:700 28px Arial,sans-serif;fill:#172b45}.lab{font:21px Arial,sans-serif;fill:#26384d}.en{font:19px Arial,sans-serif;fill:#68788c}.f{font:700 30px Arial,sans-serif;fill:#172b45}.rail{stroke:#26384d;stroke-width:12;stroke-linecap:round}.rod{stroke:#d65b43;stroke-width:16;stroke-linecap:round}.r{fill:none;stroke:#d65b43;stroke-width:6;marker-end:url(#r)}.b{fill:none;stroke:#2367a8;stroke-width:6;marker-end:url(#b)}</style></defs>
<rect class="bg" width="760" height="1640"/><text class="h" x="35" y="55">ЭДС движения / Motional EMF</text><text class="en" x="35" y="100">B направлено в плоскость рисунка (×); B, v и стержень взаимно перпендикулярны.</text><text class="en" x="35" y="133">B is into the page (×); B, v and the rod are mutually perpendicular.</text>
<rect class="p" x="25" y="170" width="710" height="650" rx="20"/><text class="h" x="55" y="225">Замкнутая цепь / Closed circuit</text>
<g fill="#2367a8" font-size="28" font-weight="700"><text x="120" y="335">×</text><text x="250" y="335">×</text><text x="380" y="335">×</text><text x="510" y="335">×</text><text x="630" y="335">×</text><text x="120" y="535">×</text><text x="250" y="535">×</text><text x="380" y="535">×</text><text x="510" y="535">×</text><text x="630" y="535">×</text></g>
<path class="rail" d="M100 370 H640 M100 520 H640"/><path class="rod" d="M530 370 V520"/><path d="M530 445 H680" class="r"/><text class="lab" x="565" y="410">v →</text><path d="M530 500 V385" class="b"/><text class="lab" x="545" y="395">q(v × B)</text><text class="lab" x="545" y="360" fill="#d65b43">+</text><text class="lab" x="545" y="555" fill="#2367a8">−</text>
<path d="M530 510 V370 H100 V520 H530" fill="none" stroke="#d65b43" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#r)"/><path d="M530 445 H445" class="r"/><text class="lab" x="365" y="430">Fмагн ←</text>
<text class="lab" x="65" y="620">Положительный заряд смещается вверх; ток в контуре против часовой стрелки.</text><text class="en" x="65" y="660">Positive charge moves up; conventional loop current is counterclockwise.</text><text class="lab" x="65" y="715">Магнитная сила на стержень направлена влево.</text><text class="en" x="65" y="755">The magnetic force on the rod points left.</text>
<rect class="p" x="25" y="850" width="710" height="620" rx="20"/><text class="h" x="55" y="905">Разомкнутая цепь / Open circuit</text>
<g fill="#2367a8" font-size="28" font-weight="700"><text x="120" y="1010">×</text><text x="250" y="1010">×</text><text x="380" y="1010">×</text><text x="510" y="1010">×</text><text x="630" y="1010">×</text><text x="120" y="1210">×</text><text x="250" y="1210">×</text><text x="380" y="1210">×</text><text x="510" y="1210">×</text><text x="630" y="1210">×</text></g>
<path class="rail" d="M100 1045 H270 M330 1045 H640 M100 1195 H640"/><path class="rod" d="M530 1045 V1195"/><path d="M530 1120 H680" class="r"/><text class="lab" x="565" y="1085">v →</text><path d="M530 1175 V1060" class="b"/><text class="lab" x="545" y="1070">q(v × B)</text><text class="lab" x="545" y="1035" fill="#d65b43">+</text><text class="lab" x="545" y="1230" fill="#2367a8">−</text>
<text class="lab" x="65" y="1300">Заряды разделяются, но ток не течёт.</text><text class="en" x="65" y="1340">Charges separate, but no current flows.</text><text class="lab" x="65" y="1390">Между концами стержня возникает напряжение.</text><text class="en" x="65" y="1430">A potential difference appears across the rod.</text>
<text class="f" x="380" y="1570" text-anchor="middle">|ε| = BLv</text>
</svg>