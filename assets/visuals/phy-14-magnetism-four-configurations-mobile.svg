<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2500" viewBox="0 0 760 2500" role="img" aria-labelledby="t d">
<title id="t">Четыре конфигурации магнитного поля — мобильная схема</title><desc id="d">Вертикально расположенные схемы прямого проводника, кругового витка, соленоида и тороида с направлениями тока и магнитного поля.</desc>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2367a8"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d65b43"/></marker><style>.bg{fill:#f7f8fa}.p{fill:#fff;stroke:#d7dde5;stroke-width:3}.h{font:700 32px Arial,sans-serif;fill:#172b45}.lab{font:26px Arial,sans-serif;fill:#26384d}.en{font:22px Arial,sans-serif;fill:#68788c}.f{font:700 30px Arial,sans-serif;fill:#172b45}.field{fill:none;stroke:#2367a8;stroke-width:6}.blue{fill:none;stroke:#2367a8;stroke-width:6;marker-end:url(#b)}.red{fill:none;stroke:#d65b43;stroke-width:6;marker-end:url(#r)}</style></defs>
<rect class="bg" width="760" height="2500"/><text class="h" x="35" y="55">Магнитные поля токов / Magnetic fields</text>
<rect class="p" x="25" y="90" width="710" height="500" rx="20"/><text class="h" x="55" y="145">1. Прямой проводник / Straight wire</text>
<circle cx="205" cy="330" r="16" fill="#d65b43"/><circle cx="205" cy="330" r="55" class="field"/><circle cx="205" cy="330" r="100" class="field"/><circle cx="205" cy="330" r="145" class="field"/><path d="M205 185 Q100 330 205 475" class="blue"/>
<text class="lab" x="405" y="245">I выходит из плоскости</text><text class="en" x="405" y="278">I out of the page</text><text class="lab" x="405" y="340">B — окружности</text><text class="en" x="405" y="373">B — circular loops</text><text class="f" x="405" y="435">B = μ₀I/(2πr)</text><text class="en" x="405" y="475">Длинный проводник / Long wire</text>
<rect class="p" x="25" y="620" width="710" height="500" rx="20"/><text class="h" x="55" y="675">2. Круговой виток / Circular loop</text>
<ellipse cx="210" cy="865" rx="150" ry="80" fill="none" stroke="#26384d" stroke-width="12"/><path d="M350 820 Q280 755 205 785" class="red"/><path d="M75 910 Q145 980 220 945" class="red"/><path d="M210 970 V730" class="blue"/>
<text class="lab" x="405" y="790">I против часовой стрелки</text><text class="en" x="405" y="823">I counterclockwise</text><text class="lab" x="405" y="880">B вдоль оси витка</text><text class="en" x="405" y="913">B along loop axis</text><text class="f" x="405" y="975">Bцентр = μ₀I/(2R)</text><text class="en" x="405" y="1015">В центре одного витка / At loop centre</text>
<rect class="p" x="25" y="1150" width="710" height="500" rx="20"/><text class="h" x="55" y="1205">3. Соленоид / Solenoid</text>
<g fill="none" stroke="#26384d" stroke-width="8"><path d="M90 1390 C90 1310 145 1310 145 1390 S200 1470 200 1390 S255 1310 255 1390 S310 1470 310 1390 S365 1310 365 1390 S420 1470 420 1390 S475 1310 475 1390"/></g>
<path d="M130 1390 H455" class="blue"/><path d="M105 1320 Q125 1295 145 1320" class="red"/><path d="M420 1460 Q400 1485 380 1460" class="red"/>
<text class="lab" x="80" y="1530">Внутри поле почти однородно</text><text class="en" x="80" y="1565">Nearly uniform field inside</text><text class="f" x="80" y="1615">B ≈ μ₀nI</text><text class="en" x="360" y="1615">Длинный соленоид / Long solenoid</text>
<rect class="p" x="25" y="1680" width="710" height="500" rx="20"/><text class="h" x="55" y="1735">4. Тороид / Toroid</text>
<ellipse cx="210" cy="1950" rx="165" ry="112" fill="#e9eef4" stroke="#26384d" stroke-width="8"/><ellipse cx="210" cy="1950" rx="85" ry="55" fill="#fff" stroke="#26384d" stroke-width="8"/><ellipse cx="210" cy="1950" rx="125" ry="82" fill="none" stroke="#2367a8" stroke-width="7" stroke-dasharray="14 8"/><path d="M300 1910 Q340 1950 300 1990" class="blue"/>
<circle cx="80" cy="1950" r="8" fill="#d65b43"/><circle cx="280" cy="1858" r="8" fill="#d65b43"/><circle cx="280" cy="2042" r="8" fill="#d65b43"/><g fill="#2367a8" font-size="30" font-weight="700"><text x="165" y="1867">×</text><text x="370" y="1960">×</text><text x="165" y="2055">×</text></g>
<text class="lab" x="405" y="1870">B внутри сердечника</text><text class="en" x="405" y="1903">B mainly inside core</text><text class="f" x="405" y="1965">B = μ₀NI/(2πr)</text><text class="lab" x="405" y="2025">Снаружи ≈ 0*</text><text class="en" x="405" y="2058">Outside ≈ 0*</text><text class="en" x="55" y="2220">• I к наблюдателю; × I от него / • I out of page; × into page</text>
<text class="en" x="55" y="2260">*Идеализация: у идеального тороида поле снаружи ≈ 0.</text>
<text class="en" x="55" y="2300">Формулы предполагают воздушный сердечник;</text>
<text class="en" x="55" y="2340">для линейного материала используйте μ = μ₀μᵣ.</text>
<text class="en" x="55" y="2380">Idealisation: external field of an ideal toroid ≈ 0.</text>
<text class="en" x="55" y="2420">Air-core formulas; for linear core material use μ = μ₀μᵣ.</text>
<text class="en" x="55" y="2460">μ₀ is the permeability of free space.</text>
</svg>