<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Вращение: момент силы, момент инерции и сохранение момента импульса</title>
<desc id="d">Учебная схема из трёх частей: геометрия момента силы на рычаге; распределение массы в кольце и диске; фигурист, прижимающий руки к телу, и сохранение момента импульса.</desc>
<defs><marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c65b45"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4779b8"/></marker><marker id="dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#343a40"/></marker></defs>
<rect width="1200" height="720" rx="24" fill="#f5f4ef"/>
<text x="54" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#252b31">ВРАЩЕНИЕ: ТРИ КЛЮЧЕВЫЕ ИДЕИ</text>
<g font-family="Arial,sans-serif">
<rect x="40" y="94" width="1120" height="270" rx="18" fill="#fff" stroke="#d9d8d1"/>
<text x="70" y="137" font-size="23" font-weight="700" fill="#252b31">1. Момент силы зависит от плеча и направления силы</text>
<line x1="180" y1="278" x2="760" y2="278" stroke="#8b8d8e" stroke-width="9" stroke-linecap="round"/>
<circle cx="180" cy="278" r="15" fill="#343a40"/><text x="120" y="318" font-size="17" fill="#343a40">ось</text>
<line x1="180" y1="278" x2="180" y2="158" stroke="#4779b8" stroke-width="3" stroke-dasharray="7 6"/>
<text x="195" y="202" font-size="17" fill="#4779b8">r</text>
<line x1="180" y1="278" x2="690" y2="278" stroke="#343a40" stroke-width="2" marker-end="url(#dark)"/>
<text x="410" y="306" font-size="17" fill="#343a40">плечо r</text>
<circle cx="690" cy="278" r="8" fill="#c65b45"/>
<line x1="690" y1="278" x2="690" y2="155" stroke="#c65b45" stroke-width="5" marker-end="url(#red)"/>
<text x="710" y="165" font-size="19" font-weight="700" fill="#c65b45">F</text>
<path d="M245 278 A65 65 0 0 0 245 213" fill="none" stroke="#4779b8" stroke-width="3"/>
<text x="260" y="235" font-size="18" fill="#4779b8">φ</text>
<text x="815" y="205" font-size="27" font-weight="700" fill="#252b31">τ = rF sin φ</text>
<text x="815" y="245" font-size="18" fill="#454b50">Максимум при φ = 90°</text>
<text x="815" y="276" font-size="18" fill="#454b50">Ноль при φ = 0° или 180°</text>
<text x="815" y="318" font-size="17" fill="#454b50">Плечо — перпендикуляр от оси</text>
<text x="815" y="342" font-size="17" fill="#454b50">до линии действия силы.</text>
<rect x="40" y="386" width="545" height="280" rx="18" fill="#fff" stroke="#d9d8d1"/>
<text x="70" y="428" font-size="23" font-weight="700" fill="#252b31">2. Где расположена масса?</text>
<circle cx="190" cy="535" r="76" fill="none" stroke="#4779b8" stroke-width="18"/>
<circle cx="190" cy="535" r="4" fill="#343a40"/>
<circle cx="420" cy="535" r="76" fill="#dce8f3" stroke="#4779b8" stroke-width="3"/>
<circle cx="420" cy="535" r="4" fill="#343a40"/>
<text x="125" y="640" font-size="18" font-weight="700" fill="#252b31">Кольцо: I = MR²</text>
<text x="345" y="640" font-size="18" font-weight="700" fill="#252b31">Диск: I = ½MR²</text>
<text x="75" y="675" font-size="15" fill="#454b50">При одинаковых M и R кольцо труднее раскрутить.</text>
<rect x="605" y="386" width="555" height="280" rx="18" fill="#fff" stroke="#d9d8d1"/>
<text x="635" y="428" font-size="23" font-weight="700" fill="#252b31">3. Сохранение момента импульса</text>
<circle cx="760" cy="520" r="48" fill="#dce8f3" stroke="#4779b8" stroke-width="3"/>
<circle cx="760" cy="455" r="9" fill="#c65b45"/><circle cx="760" cy="585" r="9" fill="#c65b45"/>
<path d="M700 520 A60 60 0 1 1 718 562" fill="none" stroke="#4779b8" stroke-width="4" marker-end="url(#blue)"/>
<circle cx="1000" cy="520" r="48" fill="#dce8f3" stroke="#4779b8" stroke-width="3"/>
<circle cx="958" cy="520" r="9" fill="#c65b45"/><circle cx="1042" cy="520" r="9" fill="#c65b45"/>
<path d="M940 520 A60 60 0 1 1 958 562" fill="none" stroke="#4779b8" stroke-width="4" marker-end="url(#blue)"/>
<path d="M825 520 L915 520" stroke="#343a40" stroke-width="3" marker-end="url(#dark)"/>
<text x="690" y="612" font-size="16" fill="#454b50">Руки разведены</text><text x="945" y="612" font-size="16" fill="#454b50">Руки прижаты</text>
<text x="635" y="646" font-size="18" font-weight="700" fill="#252b31">L = Iω = const</text>
<text x="835" y="646" font-size="16" fill="#454b50">I уменьшается → ω растёт</text>
</g></svg>