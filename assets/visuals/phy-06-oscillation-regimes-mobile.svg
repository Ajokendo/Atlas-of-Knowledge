<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1320" role="img" aria-labelledby="title desc">
<title id="title">Три режима колебаний — мобильная схема</title>
<desc id="desc">Три вертикально расположенные панели: свободные незатухающие, затухающие и вынужденные колебания с резонансным максимумом.</desc>
<defs><style>
.panel{fill:#fbfbf8;stroke:#d7d8d2;stroke-width:2}.head{fill:#263e63;font:700 28px Arial,sans-serif}.sub{fill:#4d5158;font:22px Arial,sans-serif}.axis{stroke:#555b64;stroke-width:2;fill:none}.grid{stroke:#dfe1e5;stroke-width:1.5}.wave{stroke:#276fc2;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.env{stroke:#c47a30;stroke-width:2.5;fill:none;stroke-dasharray:8 7}.label{fill:#333943;font:20px Arial,sans-serif}.small{fill:#60656d;font:20px Arial,sans-serif}.accent{fill:#9a5424;font:700 22px Arial,sans-serif}
</style></defs>
<rect width="600" height="1320" rx="20" fill="#f1f3f6"/>
<g transform="translate(20 20)">
<rect class="panel" width="560" height="400" rx="18"/>
<text class="head" x="24" y="48">1. Свободные, без затухания</text><text class="sub" x="24" y="82">Энергия не теряется</text>
<path class="grid" d="M64 145H520 M64 220H520 M64 295H520 M178 110V325 M292 110V325 M406 110V325"/>
<path class="axis" d="M64 110V325 M64 220H525"/>
<path class="wave" d="M64 220 C93 130 122 130 151 220 S209 310 238 220 S296 130 325 220 S383 310 412 220 S470 130 499 220"/>
<text class="label" x="24" y="151">+A</text><text class="label" x="32" y="227">0</text><text class="label" x="24" y="303">−A</text><text class="small" x="515" y="248">t</text>
<text class="small" x="24" y="365">Амплитуда постоянна</text>
</g>
<g transform="translate(20 450)">
<rect class="panel" width="560" height="400" rx="18"/>
<text class="head" x="24" y="48">2. Свободные, затухающие</text><text class="sub" x="24" y="82">Часть энергии рассеивается</text>
<path class="grid" d="M64 145H520 M64 220H520 M64 295H520 M178 110V325 M292 110V325 M406 110V325"/>
<path class="axis" d="M64 110V325 M64 220H525"/>
<path class="env" d="M64 125 C170 170 330 208 510 218 M64 315 C170 270 330 232 510 222"/>
<path class="wave" d="M64 220 C78 125 92 125 106 220 S134 300 148 220 S176 160 190 220 S218 270 232 220 S260 190 274 220 S302 250 316 220 S344 204 358 220 S386 236 400 220 S428 211 442 220 S470 227 484 220 S498 217 510 220"/>
<text class="label" x="24" y="151">+A</text><text class="label" x="32" y="227">0</text><text class="label" x="24" y="303">−A</text><text class="small" x="515" y="248">t</text>
<text class="small" x="24" y="365">Амплитуда уменьшается</text>
</g>
<g transform="translate(20 880)">
<rect class="panel" width="560" height="400" rx="18"/>
<text class="head" x="24" y="48">3. Вынужденные колебания</text><text class="sub" x="24" y="82">Отклик на внешнюю периодическую силу</text>
<path class="grid" d="M64 145H520 M64 220H520 M64 295H520 M178 110V325 M292 110V325 M406 110V325"/>
<path class="axis" d="M64 110V325 M64 325H525"/>
<path d="M64 320 C145 315 180 285 220 220 C260 140 278 115 292 115 C306 115 324 140 364 220 C404 285 439 315 520 320" fill="none" stroke="#276fc2" stroke-width="5" stroke-linecap="round"/>
<path d="M292 112V325" stroke="#c47a30" stroke-width="2.5" stroke-dasharray="8 7"/>
<text class="label" x="26" y="140">A</text><text class="label" x="30" y="328">0</text><text class="accent" x="330" y="145">Резонанс</text>
<text class="small" x="24" y="365">Максимум отклика вблизи ω₀</text>
</g>
</svg>