<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1320" viewBox="0 0 600 1320" role="img" aria-labelledby="t d">
<title id="t">Вращение: момент силы, момент инерции и сохранение момента импульса</title>
<desc id="d">Вертикальная учебная схема: рычаг и момент силы; сравнение кольца и диска; сохранение момента импульса при изменении положения рук фигуриста.</desc>
<defs><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c65b45"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4779b8"/></marker><marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#343a40"/></marker></defs>
<rect width="600" height="1320" rx="24" fill="#f5f4ef"/><g font-family="Arial,sans-serif" fill="#252b31">
<text x="34" y="58" font-size="27" font-weight="700">ВРАЩЕНИЕ: ТРИ ИДЕИ</text>
<rect x="24" y="90" width="552" height="360" rx="18" fill="#fff" stroke="#d9d8d1"/>
<text x="48" y="133" font-size="22" font-weight="700">1. Момент силы</text>
<line x1="100" y1="310" x2="480" y2="310" stroke="#8b8d8e" stroke-width="10" stroke-linecap="round"/>
<circle cx="100" cy="310" r="14" fill="#343a40"/><line x1="100" y1="278" x2="420" y2="278" stroke="#4779b8" stroke-width="3" marker-end="url(#b)"/>
<text x="250" y="265" font-size="20" fill="#4779b8">r</text><circle cx="430" cy="310" r="8" fill="#c65b45"/>
<line x1="430" y1="310" x2="430" y2="190" stroke="#c65b45" stroke-width="5" marker-end="url(#r)"/><text x="450" y="200" font-size="21" fill="#c65b45">F</text>
<path d="M165 310 A65 65 0 0 0 100 245" fill="none" stroke="#4779b8" stroke-width="3"/><text x="152" y="260" font-size="20" fill="#4779b8">φ</text>
<text x="48" y="365" font-size="24" font-weight="700">τ = rF sin φ</text><text x="48" y="401" font-size="18">Максимум при 90°; ноль при 0° и 180°.</text><text x="48" y="428" font-size="17">Плечо — расстояние от оси до линии силы.</text>
<rect x="24" y="475" width="552" height="350" rx="18" fill="#fff" stroke="#d9d8d1"/>
<text x="48" y="520" font-size="22" font-weight="700">2. Распределение массы</text>
<circle cx="175" cy="655" r="78" fill="none" stroke="#4779b8" stroke-width="18"/><circle cx="175" cy="655" r="4" fill="#343a40"/>
<circle cx="425" cy="655" r="78" fill="#dce8f3" stroke="#4779b8" stroke-width="3"/><circle cx="425" cy="655" r="4" fill="#343a40"/>
<text x="100" y="770" font-size="20" font-weight="700">Кольцо</text><text x="100" y="800" font-size="20">I = MR²</text><text x="355" y="770" font-size="20" font-weight="700">Диск</text><text x="355" y="800" font-size="20">I = ½MR²</text>
<rect x="24" y="850" width="552" height="440" rx="18" fill="#fff" stroke="#d9d8d1"/>
<text x="48" y="895" font-size="22" font-weight="700">3. Сохранение момента импульса</text>
<circle cx="175" cy="1035" r="55" fill="#dce8f3" stroke="#4779b8" stroke-width="3"/><circle cx="175" cy="960" r="9" fill="#c65b45"/><circle cx="175" cy="1110" r="9" fill="#c65b45"/>
<path d="M105 1035 A70 70 0 1 1 125 1085" fill="none" stroke="#4779b8" stroke-width="4" marker-end="url(#b)"/>
<circle cx="425" cy="1035" r="55" fill="#dce8f3" stroke="#4779b8" stroke-width="3"/><circle cx="378" cy="1035" r="9" fill="#c65b45"/><circle cx="472" cy="1035" r="9" fill="#c65b45"/>
<path d="M355 1035 A70 70 0 1 1 375 1085" fill="none" stroke="#4779b8" stroke-width="4" marker-end="url(#b)"/>
<path d="M250 1035 L335 1035" stroke="#343a40" stroke-width="3" marker-end="url(#k)"/>
<text x="90" y="1165" font-size="17">Руки разведены</text><text x="350" y="1165" font-size="17">Руки прижаты</text>
