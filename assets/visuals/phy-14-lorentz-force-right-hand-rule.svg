<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
<marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769c2"/></marker>
<marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d83b35"/></marker>
<marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7939bd"/></marker>
<style>.title{font:700 42px Arial,sans-serif;fill:#fff}.h{font:700 28px Arial,sans-serif;fill:#17365d}.body{font:24px Arial,sans-serif;fill:#182536}.small{font:20px Arial,sans-serif;fill:#26364a}.math{font:italic 34px Georgia,serif;fill:#172b4d}.red{stroke:#d83b35;fill:none;stroke-width:8;marker-end:url(#red)}.purple{stroke:#7939bd;fill:none;stroke-width:8;marker-end:url(#purple)}</style>
</defs>
<rect width="1600" height="1100" fill="#f6f8fc"/><rect x="40" y="28" width="1520" height="82" rx="18" fill="#194b83"/>
<text x="800" y="83" text-anchor="middle" class="title">СИЛА ЛОРЕНЦА И ПРАВИЛО ПРАВОЙ РУКИ</text>
<rect x="40" y="135" width="1520" height="112" rx="18" fill="#fff1c9" stroke="#d7a72b" stroke-width="3"/>
<text x="800" y="180" text-anchor="middle" class="math">F⃗ = q (v⃗ × B⃗)</text>
<text x="800" y="220" text-anchor="middle" class="small">Сначала определяем направление v⃗ × B⃗ для положительного заряда; для отрицательного заряда меняем его на противоположное.</text>
<rect x="40" y="275" width="740" height="540" rx="18" fill="#eaf3ff" stroke="#6aa7e8" stroke-width="3"/>
<text x="410" y="320" text-anchor="middle" class="h">Положительный заряд (q &gt; 0)</text><text x="410" y="360" text-anchor="middle" class="small">B⃗ направлено вправо; v⃗ направлена в экран</text>
<g stroke="#1769c2" stroke-width="4"><path d="M105 455 H700" marker-end="url(#blue)"/><path d="M105 530 H700" marker-end="url(#blue)"/><path d="M105 605 H700" marker-end="url(#blue)"/></g>
<text x="690" y="425" class="math" fill="#1769c2">B⃗</text><circle cx="400" cy="530" r="62" fill="#e34b43" stroke="#9e2924" stroke-width="4"/><text x="400" y="550" text-anchor="middle" font="700 62px Arial" fill="white">+</text>
<circle cx="400" cy="530" r="83" fill="none" stroke="#21834a" stroke-width="3" stroke-dasharray="7 8"/><circle cx="400" cy="530" r="17" fill="none" stroke="#21834a" stroke-width="5"/><path d="M388 518 L412 542 M412 518 L388 542" stroke="#21834a" stroke-width="5"/>
<text x="500" y="525" class="small" fill="#21834a">v⃗ = ⊗</text><path d="M400 610 V745" class="red"/><text x="430" y="710" class="math" fill="#d83b35">F⃗ вниз</text><text x="410" y="780" text-anchor="middle" class="small">Для q &gt; 0: (−z) × (+x) = −y</text>
<rect x="820" y="275" width="740" height="540" rx="18" fill="#f3ecff" stroke="#aa83dc" stroke-width="3"/>
<text x="1190" y="320" text-anchor="middle" class="h">Отрицательный заряд (q &lt; 0)</text><text x="1190" y="360" text-anchor="middle" class="small">Те же направления B⃗ и v⃗</text>
<g stroke="#1769c2" stroke-width="4"><path d="M885 455 H1480" marker-end="url(#blue)"/><path d="M885 530 H1480" marker-end="url(#blue)"/><path d="M885 605 H1480" marker-end="url(#blue)"/></g>
<text x="1470" y="425" class="math" fill="#1769c2">B⃗</text><circle cx="1190" cy="530" r="62" fill="#367fd3" stroke="#174d91" stroke-width="4"/><text x="1190" y="550" text-anchor="middle" font="700 62px Arial" fill="white">−</text>
<circle cx="1190" cy="530" r="83" fill="none" stroke="#21834a" stroke-width="3" stroke-dasharray="7 8"/><circle cx="1190" cy="530" r="17" fill="none" stroke="#21834a" stroke-width="5"/><path d="M1178 518 L1202 542 M1202 518 L1178 542" stroke="#21834a" stroke-width="5"/>
<text x="1290" y="525" class="small" fill="#21834a">v⃗ = ⊗</text><path d="M1190 450 V375" class="purple"/><text x="1220" y="400" class="math" fill="#7939bd">F⃗ вверх</text><text x="1190" y="780" text-anchor="middle" class="small">Для q &lt; 0: направление силы противоположно</text>
<rect x="40" y="845" width="1520" height="215" rx="18" fill="#fff" stroke="#b8c5d6" stroke-width="3"/><text x="80" y="895" class="h">Как применять правило правой руки</text>
<text x="80" y="940" class="body">1. Указательный палец — по скорости v⃗.</text><text x="80" y="982" class="body">2. Средний палец — по магнитному полю B⃗.</text><text x="80" y="1024" class="body">3. Большой палец — по силе F⃗ для положительного заряда.</text>
<text x="850" y="940" class="body">⊗ — вектор направлен в экран, от наблюдателя.</text><text x="850" y="982" class="body">⊙ — вектор направлен из экрана, к наблюдателю.</text><text x="850" y="1024" class="body">|F| = |q|vB sin θ; сила перпендикулярна v⃗ и B⃗.</text>
</svg>