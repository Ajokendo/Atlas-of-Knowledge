<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Птицы Кыргызстана: горные, высокогорные и озёрные местообитания / Birds of Kyrgyzstan: mountain, alpine and lake habitats</title>
<desc id="desc">Беркут парит у скалы, гималайский улар стоит на каменистом высокогорном склоне, а обобщённые водоплавающие птицы показаны отдельно на берегу озера. Это три разных местообитания, а не одна общая территория. / Golden eagle soaring near a cliff, Himalayan snowcock standing on a rocky alpine slope, and generic waterfowl on a separate lake shore. Three distinct habitats, not a single shared microhabitat.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d9e8ed"/><stop offset="1" stop-color="#f5f0df"/></linearGradient>
 <linearGradient id="lake" x2="0" y2="1"><stop stop-color="#78aeb5"/><stop offset="1" stop-color="#356d78"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#a3a69a"/><stop offset="1" stop-color="#5e6b65"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1020" cy="110" r="48" fill="#f3dca4"/>
