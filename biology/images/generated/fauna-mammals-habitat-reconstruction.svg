<title id="t">Mountain mammals of Kyrgyzstan — habitat reconstruction</title>
<desc id="d">A snow leopard on a separate high rocky ledge, an argali on an open grassy slope, and a Siberian ibex on a distinct steep crag. This is an illustrative habitat reconstruction.</desc>
