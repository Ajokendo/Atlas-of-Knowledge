<g fill="#286b9b"><circle cx="985" cy="475" r="7"/><circle cx="1020" cy="505" r="7"/></g>
<text x="642" y="553" class="small">Через белок-канал; без АТФ</text><text x="642" y="575" class="en">Through a channel protein; no ATP</text>
<!-- osmosis -->
<text x="72" y="648" class="ru">3. Осмос</text><text x="72" y="673" class="en">Osmosis</text>
<path d="M300 704 V794" stroke="#286b9b" stroke-width="8" stroke-dasharray="8 7"/>
<text x="115" y="713" class="small">Больше растворённых</text><text x="115" y="735" class="en">More solute</text>
<text x="340" y="713" class="small">Меньше растворённых</text><text x="340" y="735" class="en">Less solute</text>
<path d="M385 760 H220" class="water"/>
<g fill="#286b9b"><circle cx="135" cy="770" r="7"/><circle cx="175" cy="790" r="7"/><circle cx="230" cy="790" r="7"/></g>
<text x="72" y="824" class="small">Вода движется к более концентрированному раствору</text>
<!-- active transport -->
<text x="642" y="648" class="ru">4. Активный транспорт</text><text x="642" y="673" class="en">Active transport</text>
<rect x="835" y="700" width="82" height="78" rx="24" class="protein"/>
<path d="M875 778 V698" class="active"/>
<g fill="#a66b12"><circle cx="735" cy="740" r="7"/><circle cx="770" cy="765" r="7"/><circle cx="1030" cy="710" r="7"/><circle cx="1060" cy="735" r="7"/><circle cx="1090" cy="760" r="7"/></g>
<path d="M785 752 Q810 752 835 752" class="active"/>
<text x="934" y="716" class="small">АТФ → АДФ + Pi</text><text x="934" y="741" class="en">ATP → ADP + Pi</text>
<text x="642" y="808" class="small">Против градиента; нужна энергия</text><text x="642" y="832" class="en">Against gradient; energy required</text>
<text x="600" y="878" text-anchor="middle" class="tiny">Схема условная, не в масштабе / Schematic, not to scale</text>
