<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Мембранный транспорт / Membrane transport</title>
<desc id="desc">Двуязычная схема фосфолипидного бислоя и четырёх способов переноса: простая диффузия, облегчённая диффузия через канал, осмос и активный перенос с использованием АТФ. / Bilingual diagram of a phospholipid bilayer and four transport mechanisms: simple diffusion, facilitated diffusion through a channel, osmosis and ATP-powered active transport.</desc>
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#245b49"/></marker>
 <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#286b9b"/></marker>
 <marker id="arrGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#a66b12"/></marker>
 <style>
 text{font-family:Arial,sans-serif;fill:#20332e}
 .ru{font-size:21px;font-weight:700}.en{font-size:17px;fill:#52645e}
 .small{font-size:17px}.tiny{font-size:14px}
 .panel{fill:#fffdf7;stroke:#c9d5cb;stroke-width:2}
 .head{fill:#e6b85c;stroke:#9c6c24;stroke-width:1.5}
 .tail{stroke:#b77b2c;stroke-width:5;stroke-linecap:round}
 .protein{fill:#91b9a6;stroke:#245b49;stroke-width:3}
 .flow{fill:none;stroke:#245b49;stroke-width:4;marker-end:url(#arr)}
 .water{fill:none;stroke:#286b9b;stroke-width:4;marker-end:url(#arrBlue)}
 .active{fill:none;stroke:#a66b12;stroke-width:4;marker-end:url(#arrGold)}
 </style>
</defs>
