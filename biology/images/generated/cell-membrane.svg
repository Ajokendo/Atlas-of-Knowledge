<g fill="#527e67"><circle cx="465" cy="470" r="7"/><circle cx="505" cy="486" r="7"/></g>
<text x="82" y="535" class="small">Вниз по градиенту; без АТФ</text><text x="82" y="559" class="en">Down gradient; no ATP</text>
<!-- channel facilitated -->
<text x="642" y="388" class="ru">2. Облегчённая диффузия</text><text x="642" y="413" class="en">Facilitated diffusion</text>
