<text x="212" y="500" font-size="22" font-weight="700">Прокариотическая клетка</text><text x="212" y="526">Prokaryotic cell</text>
<text x="599" y="500" font-size="22" font-weight="700">Прокариотическая клетка</text><text x="599" y="526">Prokaryotic cell</text>
<text x="986" y="500" font-size="22" font-weight="700">Эукариотическая клетка</text><text x="986" y="526">Eukaryotic cell</text>
</g>
<g font-size="18">
<text x="60" y="570">• Нет оформленного ядра</text><text x="60" y="596">• No membrane-bound nucleus</text><text x="60" y="630">• Стенка часто содержит</text><text x="60" y="654">  пептидогликан / Wall often</text><text x="60" y="678">  contains peptidoglycan</text>
<text x="447" y="570">• Нет оформленного ядра</text><text x="447" y="596">• No membrane-bound nucleus</text><text x="447" y="630">• Нет пептидогликана;</text><text x="447" y="654">  оболочки разнообразны /</text><text x="447" y="678">  No peptidoglycan; diverse walls</text>
<text x="834" y="570">• Есть ядро / Has a nucleus</text><text x="834" y="604">• Есть мембранные органеллы</text><text x="834" y="630">• Membrane-bound organelles</text><text x="834" y="664">• Часто крупнее, но размеры</text><text x="834" y="688">  клеток сильно различаются /</text>
</g>
</g>
<rect x="35" y="720" width="1130" height="135" rx="20" fill="#f7eeee" stroke="#b87979" stroke-width="3"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="760" font-size="25" font-weight="700" fill="#763e48">ВИРУСЫ НЕ ОТНОСЯТСЯ К ДОМЕНАМ КЛЕТОЧНОЙ ЖИЗНИ</text>
<text x="600" y="792" font-size="22" font-weight="700" fill="#763e48">VIRUSES ARE NOT A DOMAIN OF CELLULAR LIFE</text>
<text x="600" y="825" font-size="18" fill="#573e45">Вирусы — неклеточные биологические агенты / Viruses are acellular biological agents</text>
</g>
</g>
</svg>