<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Три домена клеточной жизни / Three domains of cellular life</title>
<desc id="desc">Сравнительная учебная схема бактерий, архей и эукариот. У бактерий и архей нет оформленного ядра; у эукариот есть ядро и мембранные органеллы. Бактериальная клеточная стенка часто содержит пептидогликан, у архей пептидогликана нет и оболочки разнообразны. Вирусы показаны отдельно, вне доменов клеточной жизни. A teaching comparison of Bacteria, Archaea and Eukarya. Bacteria and Archaea lack a membrane-bound nucleus; eukaryotes have a nucleus and membrane-bound organelles. Bacterial cell walls often contain peptidoglycan; Archaea lack peptidoglycan and have diverse cell coverings. Viruses are shown separately, outside the domains of cellular life.</desc>
<rect width="1200" height="900" rx="26" fill="#fbfcf8"/>
<g font-family="Arial,sans-serif" fill="#24364b">
<text x="600" y="58" text-anchor="middle" font-size="32" font-weight="700">ТРИ ДОМЕНА КЛЕТОЧНОЙ ЖИЗНИ</text>
<text x="600" y="94" text-anchor="middle" font-size="25" font-weight="700">THREE DOMAINS OF CELLULAR LIFE</text>
<text x="600" y="133" text-anchor="middle" font-size="18">Схема сравнивает общие признаки; внутри каждого домена есть разнообразие</text>
<text x="600" y="158" text-anchor="middle" font-size="17">Generalised comparison; each domain contains substantial diversity</text>
</g>
<g font-family="Arial,sans-serif">
