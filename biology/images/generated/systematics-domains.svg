<text x="599" y="235" fill="#735c2c">ARCHAEA</text><text x="599" y="269" font-size="21" fill="#735c2c">АРХЕИ</text>
<text x="986" y="235" fill="#574a7c">EUKARYA</text><text x="986" y="269" font-size="21" fill="#574a7c">ЭУКАРИОТЫ</text>
