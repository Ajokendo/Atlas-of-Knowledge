<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Ошская область: три местообитания и подтверждённые фотоловушками виды / Osh Region: three habitats and camera-trap documented wildlife</title>
<desc id="desc">Авторская учебная схема из трёх отдельных панелей. Лесной склон Кулун-Аты с тянь-шаньским бурым медведем; высокогорные скалы со снежным барсом; горный склон с сибирским горным козлом. Панели показывают разные местообитания и не подразумевают совместное присутствие животных в одной точке. Original educational schematic with three separate habitat panels. Panels do not imply that the animals occur together at one site.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dcecf0"/><stop offset="1" stop-color="#f4f0df"/></linearGradient>
