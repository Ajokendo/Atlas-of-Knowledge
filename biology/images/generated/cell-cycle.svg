<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">Клеточный цикл / The cell cycle</title>
<desc id="desc">Круговая схема фаз G1, S, G2 и M, контрольных точек G1/S, G2/M и веретена деления, а также выхода в G0. / Circular diagram of G1, S, G2 and M phases, the G1/S, G2/M and spindle checkpoints, and exit into G0.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#46675d" stroke-width="1.8"/></marker>
 <style>
 .h{font:700 30px Arial,sans-serif;fill:#203a32}.sub{font:17px Arial,sans-serif;fill:#61736b}
 .phase{stroke:#fff;stroke-width:5}.phaseTitle{font:700 30px Arial,sans-serif;fill:#17352d}.phaseText{font:18px Arial,sans-serif;fill:#29473e}
 .en{font:16px Arial,sans-serif;fill:#49645b}.small{font:15px Arial,sans-serif;fill:#435d54}
 .checkpoint{fill:#fff7e8;stroke:#bc8541;stroke-width:2.5}.cp{font:700 17px Arial,sans-serif;fill:#80531e}
 .arrow{fill:none;stroke:#46675d;stroke-width:5;marker-end:url(#arrow)}
 .card{fill:#fff;stroke:#d8e0d9;stroke-width:2}.label{font:700 19px Arial,sans-serif;fill:#263f36}
 </style>
</defs>
<rect width="1440" height="980" rx="28" fill="#f6f5ef"/>
<text x="720" y="58" text-anchor="middle" class="h">КЛЕТОЧНЫЙ ЦИКЛ / THE CELL CYCLE</text>
<text x="720" y="88" text-anchor="middle" class="sub">Рост, копирование ДНК и деление / Growth, DNA replication and division</text>
<!-- phase ring -->
<path class="phase" fill="#dcebdc" d="M720 180 A260 260 0 0 1 980 440 L850 440 A130 130 0 0 0 720 310Z"/>
<path class="phase" fill="#dce8f4" d="M980 440 A260 260 0 0 1 720 700 L720 570 A130 130 0 0 0 850 440Z"/>
<path class="phase" fill="#f5e7cb" d="M720 700 A260 260 0 0 1 460 440 L590 440 A130 130 0 0 0 720 570Z"/>
<path class="phase" fill="#eadff0" d="M460 440 A260 260 0 0 1 720 180 L720 310 A130 130 0 0 0 590 440Z"/>
<text x="840" y="300" text-anchor="middle" class="phaseTitle">G₁</text><text x="840" y="330" text-anchor="middle" class="phaseText">Рост клетки</text><text x="840" y="355" text-anchor="middle" class="en">Cell growth</text>
<text x="840" y="545" text-anchor="middle" class="phaseTitle">S</text><text x="840" y="575" text-anchor="middle" class="phaseText">Репликация ДНК</text><text x="840" y="600" text-anchor="middle" class="en">DNA replication</text>
<text x="600" y="545" text-anchor="middle" class="phaseTitle">G₂</text><text x="600" y="575" text-anchor="middle" class="phaseText">Подготовка к митозу</text><text x="600" y="600" text-anchor="middle" class="en">Preparation for mitosis</text>
<text x="600" y="300" text-anchor="middle" class="phaseTitle">M</text><text x="600" y="330" text-anchor="middle" class="phaseText">Митоз + цитокинез</text><text x="600" y="355" text-anchor="middle" class="en">Mitosis + cytokinesis</text>
<circle cx="720" cy="440" r="118" fill="#fff" stroke="#cbd7ce" stroke-width="3"/>
<text x="720" y="408" text-anchor="middle" class="label">ИНТЕРФАЗА</text><text x="720" y="435" text-anchor="middle" class="small">G₁ + S + G₂</text><text x="720" y="470" text-anchor="middle" class="label">INTERPHASE</text><text x="720" y="497" text-anchor="middle" class="small">Most of the cycle</text>
<!-- direction arrows -->
<path class="arrow" d="M900 170 Q960 190 980 245"/><path class="arrow" d="M1008 520 Q990 620 910 665"/><path class="arrow" d="M540 710 Q440 670 430 570"/><path class="arrow" d="M430 330 Q450 230 530 195"/>
<!-- checkpoint labels -->
<rect x="1000" y="180" width="260" height="78" rx="14" class="checkpoint"/><text x="1130" y="211" text-anchor="middle" class="cp">G₁/S checkpoint</text><text x="1130" y="237" text-anchor="middle" class="small">Проверка перед копированием ДНК</text>
<rect x="1010" y="650" width="250" height="78" rx="14" class="checkpoint"/><text x="1135" y="681" text-anchor="middle" class="cp">G₂/M checkpoint</text><text x="1135" y="707" text-anchor="middle" class="small">ДНК скопирована и проверена?</text>
<rect x="170" y="650" width="245" height="78" rx="14" class="checkpoint"/><text x="292" y="681" text-anchor="middle" class="cp">Контроль веретена</text><text x="292" y="707" text-anchor="middle" class="small">Spindle checkpoint</text>
<!-- G0 branch -->
<path d="M720 180 L720 135 L720 128" fill="none" stroke="#73847b" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="560" y="112" width="320" height="82" rx="15" class="card"/>
<text x="720" y="143" text-anchor="middle" class="label">G₀ — состояние покоя</text>
<text x="720" y="168" text-anchor="middle" class="small">G₀ — quiescent / non-dividing state</text>
<!-- explanatory notes -->
<rect x="130" y="790" width="560" height="125" rx="18" class="card"/>
<text x="160" y="826" class="label">Важно / Key idea</text>
<text x="160" y="856" class="small">Интерфаза — G₁, S и G₂; ДНК удваивается только в S-фазе.</text>
<text x="160" y="882" class="small">Interphase includes G₁, S and G₂; DNA is copied in S phase.</text>
<rect x="730" y="790" width="580" height="125" rx="18" class="card"/>
<text x="760" y="826" class="label">Контроль / Checkpoints</text>
<text x="760" y="856" class="small">Переходы могут задерживаться при повреждении ДНК или ошибках.</text>
<text x="760" y="882" class="small">Progress can pause if DNA is damaged or chromosome attachment is faulty.</text>
<text x="720" y="950" text-anchor="middle" class="small">Схема обобщённая: длительность фаз и выход в G₀ зависят от типа клетки. / Generalised model: phase duration and entry into G₀ vary by cell type.</text>
</svg>