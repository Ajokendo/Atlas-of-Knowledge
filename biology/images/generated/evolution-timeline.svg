<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">История жизни на геологической шкале / History of life on the geological timescale</title>
<desc id="desc">Геологическая история Земли от её формирования около 4,54 миллиарда лет назад до настоящего времени. На основной пропорциональной шкале показаны эоны и ранние этапы: первые свидетельства жизни около 3,5–3,8 миллиарда лет назад, Великое кислородное событие около 2,4 миллиарда лет назад и появление эукариот не позднее примерно 1,8 миллиарда лет назад. Отдельная увеличенная шкала показывает разнообразие жизни за последние 539 миллионов лет: кембрийское разнообразие животных, выход растений и позвоночных на сушу, динозавров, птиц, границу мел-палеоген и развитие Homo sapiens около 300 тысяч лет назад. / Geological history from Earth's formation about 4.54 billion years ago to the present. The proportionate main scale shows eons and early milestones; a separate magnified scale details the last 539 million years. Dates are approximate; evolutionary history is branching, not a ladder.</desc>
<defs><style>
.bg{fill:#f5f8fc}.head{fill:#164b7a}.title{font:700 29px Arial;fill:#fff}.sub{font:17px Arial;fill:#eaf3fb}.panel{fill:#fff;stroke:#cbd7e4;stroke-width:2}.h{font:700 21px Arial;fill:#183d60}.label{font:16px Arial;fill:#304d68}.small{font:14px Arial;fill:#536b82}.axis{stroke:#294f75;stroke-width:4}.tick{stroke:#294f75;stroke-width:2}.band1{fill:#e9d9c5}.band2{fill:#d9e8d6}.band3{fill:#dce8f4}.band4{fill:#f5e6bd}.event{fill:#fff;stroke:#315f89;stroke-width:3}.life{fill:#e3f1e7;stroke:#5a9b6b;stroke-width:2}.warn{fill:#fff1d8;stroke:#d5a04b;stroke-width:2}.note{font:700 16px Arial;fill:#28583b}.white{fill:#fff}.line{stroke:#7890a8;stroke-width:1.7;fill:none}
</style></defs>
<rect class="bg" width="1200" height="900"/>
<rect class="head" x="18" y="16" width="1164" height="78" rx="16"/>
<text class="title" x="600" y="49" text-anchor="middle">История жизни на геологической шкале</text>
<text class="sub" x="600" y="76" text-anchor="middle">History of life on the geological timescale</text>
<rect class="panel" x="25" y="112" width="1150" height="365" rx="16"/>
<text class="h" x="55" y="151">Земля: 4,54 млрд лет — настоящее время / Earth: 4.54 billion years — present</text>
<text class="small" x="55" y="177">Основная шкала пропорциональна времени; отметки событий до фанерозоя расположены по возрасту.</text>
<text class="small" x="55" y="197">The main scale is proportional to time; pre-Phanerozoic events are positioned by age.</text>
<!-- Eon bar, linear 4.54Ga to now x=90..1110 -->
<rect class="band1" x="90" y="220" width="121" height="46" rx="5"/><rect class="band2" x="211" y="220" width="335" height="46"/><rect class="band3" x="546" y="220" width="479" height="46"/><rect class="band4" x="1025" y="220" width="85" height="46" rx="5"/>
<g class="label" text-anchor="middle"><text x="150" y="248">Гадей / Hadean</text><text x="378" y="248">Архей / Archean</text><text x="785" y="248">Протерозой / Proterozoic</text><text x="1067" y="248">Фанерозой</text></g>
<path class="axis" d="M90 286 H1110"/>
<g class="tick"><path d="M90 278 V296 M211 278 V296 M546 278 V296 M1025 278 V296 M1110 278 V296"/></g>
<g class="small" text-anchor="middle"><text x="90" y="316">4,54 млрд / Ga</text><text x="211" y="316">4,0 млрд / Ga</text><text x="546" y="316">2,5 млрд / Ga</text><text x="1025" y="316">539 млн / Ma</text><text x="1110" y="316">0 · сейчас / now</text></g>
<!-- milestones -->
<circle class="event" cx="90" cy="286" r="8"/><path class="line" d="M90 275 V338 H130"/>
<text class="label" x="135" y="344">Формирование Земли / Earth forms</text><text class="small" x="135" y="365">≈ 4,54 млрд лет / Ga</text>
<circle class="event" cx="258" cy="286" r="8"/><path class="line" d="M258 298 V382 H275"/>
<text class="label" x="280" y="388">Ранние свидетельства жизни / Earliest evidence of life</text><text class="small" x="280" y="409">≈ 3,5–3,8 млрд лет; датировка обсуждается / Ga; evidence debated</text>
<circle class="event" cx="570" cy="286" r="8"/><path class="line" d="M570 298 V338 H590"/>
<text class="label" x="595" y="344">Великое кислородное событие / Great Oxidation Event</text><text class="small" x="595" y="365">≈ 2,4 млрд лет назад / Ga ago</text>
<circle class="event" cx="705" cy="286" r="8"/><path class="line" d="M705 298 V382 H725"/>
<text class="label" x="730" y="388">Эукариоты уже существуют / Eukaryotes established</text><text class="small" x="730" y="409">не позднее ≈ 1,8 млрд лет назад / by ≈ 1.8 Ga ago</text>
<rect class="warn" x="55" y="430" width="1090" height="32" rx="9"/>
<text x="600" y="452" text-anchor="middle" style="font:15px Arial;fill:#654a1d">Первые следы жизни и ранние даты эукариот уточняются по мере появления новых данных / Earliest-life and early-eukaryote dates remain subject to new evidence</text>
<rect class="panel" x="25" y="495" width="1150" height="370" rx="16"/>
<text class="h" x="55" y="535">Увеличенный обзор последних 539 млн лет / Magnified view of the last 539 million years</text>
<text class="small" x="55" y="559">Детали фанерозоя показаны отдельно, чтобы недавние события не сливались у края основной шкалы.</text>
<text class="small" x="55" y="579">The Phanerozoic is magnified separately so recent events remain readable.</text>
<!-- geological periods bar -->
<rect class="band2" x="90" y="600" width="543" height="35" rx="4"/><rect class="band3" x="633" y="600" width="352" height="35"/><rect class="band4" x="985" y="600" width="125" height="35" rx="4"/>
<g class="label" text-anchor="middle"><text x="360" y="623">Палеозой / Paleozoic</text><text x="809" y="623">Мезозой / Mesozoic</text><text x="1047" y="623">Кайнозой</text></g>
<path class="axis" d="M90 657 H1110"/>
<!-- positions approx within magnified panel -->
<g><circle class="event" cx="90" cy="657" r="7"/><path class="line" d="M90 665 V690 H110"/><text class="label" x="115" y="695">≈539 млн лет: кембрийское разнообразие животных</text><text class="small" x="115" y="714">≈539 Ma: Cambrian diversification of animals</text></g>
<g><circle class="event" cx="220" cy="657" r="7"/><path class="line" d="M220 649 V738 H240"/><text class="label" x="245" y="743">≈470 млн лет: растения осваивают сушу</text><text class="small" x="245" y="762">≈470 Ma: plants colonise land</text></g>
<g><circle class="event" cx="410" cy="657" r="7"/><path class="line" d="M410 665 V690 H430"/><text class="label" x="435" y="695">≈370 млн лет: первые четвероногие</text><text class="small" x="435" y="714">≈370 Ma: early tetrapods</text></g>
<g><circle class="event" cx="675" cy="657" r="7"/><path class="line" d="M675 649 V738 H690"/><text class="label" x="695" y="743">≈230 млн лет: первые динозавры</text><text class="small" x="695" y="762">≈230 Ma: early dinosaurs</text></g>
<g><circle class="event" cx="827" cy="657" r="7"/><path class="line" d="M827 665 V690 H840"/><text class="label" x="845" y="695">≈150 млн лет: ранние птицы</text><text class="small" x="845" y="714">≈150 Ma: early birds</text></g>
<g><circle class="event" cx="985" cy="657" r="7"/><path class="line" d="M985 649 V738 H970"/><text class="label" x="965" y="743">66 млн лет: мел–палеоген</text><text class="small" x="965" y="762">66 Ma: Cretaceous–Paleogene boundary</text><text class="small" x="965" y="781"></text></g>
<rect class="life" x="90" y="790" width="1020" height="52" rx="12"/>
<text class="note" x="600" y="812" text-anchor="middle">Homo sapiens: около 300 000 лет назад — совсем недавно на этой шкале</text>
<text class="note" x="600" y="832" text-anchor="middle">Homo sapiens: about 300,000 years ago — very recent on this timescale</text>
</svg>