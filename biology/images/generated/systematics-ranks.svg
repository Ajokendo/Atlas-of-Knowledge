<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Таксономическая иерархия серого волка / Taxonomic hierarchy of the grey wolf</title>
<desc id="desc">Восемь последовательных рангов классификации: домен Эукариоты, царство Животные, тип Хордовые, класс Млекопитающие, отряд Хищные, семейство Псовые, род Canis, вид Canis lupus. / Eight successive taxonomic ranks: domain Eukarya, kingdom Animalia, phylum Chordata, class Mammalia, order Carnivora, family Canidae, genus Canis, species Canis lupus.</desc>
<defs><style>
.bg{fill:#f5f7fb}.head{font:700 30px Arial,sans-serif;fill:#172b4d}.sub{font:18px Arial,sans-serif;fill:#52627a}
.card{fill:#fff;stroke:#c8d4e4;stroke-width:2}.rank{font:700 17px Arial,sans-serif;fill:#36516f}.value{font:700 21px Arial,sans-serif;fill:#172b4d}.translation{font:16px Arial,sans-serif;fill:#53657c}.num{fill:#315d8a}.numt{font:700 17px Arial,sans-serif;fill:#fff}.arrow{stroke:#7187a2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.note{font:16px Arial,sans-serif;fill:#42536a}
</style></defs>
<rect class="bg" width="1200" height="900" rx="24"/>
<text x="600" y="52" text-anchor="middle" class="head">Таксономическая иерархия · Taxonomic hierarchy</text>
<text x="600" y="82" text-anchor="middle" class="sub">Серый волк / Grey wolf · учебная схема / teaching example</text>
<g transform="translate(180 112)">
<g transform="translate(0 0)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">1</text><text class="rank" x="76" y="25">ДОМЕН · DOMAIN</text><text class="value" x="300" y="31">Eukarya</text><text class="translation" x="300" y="54">Эукариоты / organisms with cells containing a nucleus</text></g><path class="arrow" d="M420 72 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 88)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">2</text><text class="rank" x="76" y="25">ЦАРСТВО · KINGDOM</text><text class="value" x="300" y="31">Animalia</text><text class="translation" x="300" y="54">Животные / animals</text></g><path class="arrow" d="M420 160 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 176)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">3</text><text class="rank" x="76" y="25">ТИП · PHYLUM</text><text class="value" x="300" y="31">Chordata</text><text class="translation" x="300" y="54">Хордовые / chordates</text></g><path class="arrow" d="M420 248 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 264)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">4</text><text class="rank" x="76" y="25">КЛАСС · CLASS</text><text class="value" x="300" y="31">Mammalia</text><text class="translation" x="300" y="54">Млекопитающие / mammals</text></g><path class="arrow" d="M420 336 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 352)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">5</text><text class="rank" x="76" y="25">ОТРЯД · ORDER</text><text class="value" x="300" y="31">Carnivora</text><text class="translation" x="300" y="54">Хищные / carnivorans</text></g><path class="arrow" d="M420 424 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 440)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">6</text><text class="rank" x="76" y="25">СЕМЕЙСТВО · FAMILY</text><text class="value" x="300" y="31">Canidae</text><text class="translation" x="300" y="54">Псовые / canids</text></g><path class="arrow" d="M420 512 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 528)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">7</text><text class="rank" x="76" y="25">РОД · GENUS</text><text class="value" x="300" y="31">Canis</text><text class="translation" x="300" y="54">Волки и близкие виды / wolves and close relatives</text></g><path class="arrow" d="M420 600 v12 m-7 -7 7 7 7 -7"/><g transform="translate(0 616)"><rect class="card" x="0" y="0" width="840" height="72" rx="13"/><circle class="num" cx="36" cy="36" r="21"/><text class="numt" x="36" y="42" text-anchor="middle">8</text><text class="rank" x="76" y="25">ВИД · SPECIES</text><text class="value" x="300" y="31"><tspan font-style='italic'>Canis lupus</tspan></text><text class="translation" x="300" y="54">Серый волк / grey wolf</text></g>
</g>
<text x="600" y="842" text-anchor="middle" class="note">Каждый следующий ранг уже предыдущего; реальные классификации могут уточняться.</text>
<text x="600" y="866" text-anchor="middle" class="note">Each successive rank is more specific; scientific classifications may be revised.</text>
</svg>