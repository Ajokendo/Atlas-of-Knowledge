<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Amphibian and reptile habitats of Kyrgyzstan</title>
<desc id="d">Two separate natural-history habitat scenes. A generic green toad beside a shallow wet breeding pool with reeds and damp stones; a generic lizard on a sun-warmed rocky slope with sparse shrubs. Neither animal is assigned a species name or precise locality.</desc>
