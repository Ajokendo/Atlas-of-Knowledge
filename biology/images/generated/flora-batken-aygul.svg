<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Айгуль — Fritillaria eduardii / Aygul — Eduard's fritillary</title>
<desc id="d">Ботаническая учебная пластина с одним растением Fritillaria eduardii: прямостоячий стебель, ланцетные листья и поникающие колокольчатые оранжево-красные цветки с листовидными прицветниками. Рядом увеличенная схема цветка. Не изображает точную численность или современное состояние популяции / Educational botanical plate of Fritillaria eduardii with an upright stem, lance-shaped leaves and nodding orange-red bell-shaped flowers with leafy bracts, plus an enlarged flower diagram. It does not depict population size or current population status.</desc>
