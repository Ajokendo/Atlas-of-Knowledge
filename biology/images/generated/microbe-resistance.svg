<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Естественный отбор устойчивых вариантов / Selection of antimicrobial-resistant variants</title>
<desc id="desc">Three stages show a microbial population with many susceptible cells and a few heritably resistant variants, exposure to an antimicrobial agent that suppresses susceptible cells, and reproduction of surviving resistant cells. Resistance may arise through mutation or acquisition of genes; the drug selects among variants rather than teaching cells to adapt deliberately. Три этапа показывают популяцию с чувствительными клетками и редкими наследуемо устойчивыми вариантами, воздействие препарата и размножение выживших устойчивых клеток. Устойчивость может возникать вследствие мутаций или приобретения генов; препарат отбирает варианты, а не обучает клетки целенаправленно приспосабливаться.</desc>
<defs>
<style>
.bg{fill:#f3f4f1}.card{fill:#fff;stroke:#d7ddd6;stroke-width:2}.ink{fill:#222c26;font-family:Arial,sans-serif}.muted{fill:#657168;font-family:Arial,sans-serif}.sus{fill:#dcebdc;stroke:#5a805f;stroke-width:3}.res{fill:#dce9f2;stroke:#4d7893;stroke-width:3}.drug{fill:#f2e1bf;stroke:#9a7842;stroke-width:2}.arr{fill:none;stroke:#607a65;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.head{font-size:31px;font-weight:bold}.stage{font-size:23px;font-weight:bold}.body{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}
</style>
<g id="bacterium"><rect class="sus" x="-23" y="-12" width="46" height="24" rx="12"/><path d="M-8-2q8-8 16 0" fill="none" stroke="#5a805f" stroke-width="2"/></g>
<g id="resistant"><rect class="res" x="-23" y="-12" width="46" height="24" rx="12"/><path d="M-8-2q8-8 16 0" fill="none" stroke="#4d7893" stroke-width="2"/><path d="M0-14v-8m-5 4 5-4 5 4" fill="none" stroke="#4d7893" stroke-width="2"/></g>
</defs>
<rect class="bg" width="1200" height="900"/>
<text class="ink" x="600" y="50" text-anchor="middle" font-size="32" font-weight="bold">КАК ОТБИРАЮТСЯ УСТОЙЧИВЫЕ МИКРОБЫ</text>
<text class="muted" x="600" y="84" text-anchor="middle" font-size="21">HOW ANTIMICROBIAL RESISTANCE IS SELECTED</text>
<text class="muted body" x="600" y="119" text-anchor="middle">Не целенаправленное «привыкание», а отбор наследуемых вариантов / Selection of heritable variants, not purposeful adaptation</text>
<!-- card 1 -->
<rect class="card" x="35" y="165" width="350" height="430" rx="20"/>
<circle cx="75" cy="207" r="23" fill="#5a805f"/><text x="75" y="215" fill="#fff" font-size="23" text-anchor="middle" font-weight="bold">1</text>
<text class="ink stage" x="112" y="215">До воздействия</text><text class="muted small" x="112" y="239">Before exposure</text>
<rect x="65" y="270" width="290" height="190" rx="18" fill="#f7faf6" stroke="#d7e2d5" stroke-width="2"/>
<use href="#bacterium" x="110" y="310"/><use href="#bacterium" x="175" y="305"/><use href="#bacterium" x="240" y="315"/><use href="#bacterium" x="305" y="310"/>
<use href="#bacterium" x="120" y="370"/><use href="#bacterium" x="190" y="365"/><use href="#resistant" x="270" y="370"/>
<use href="#bacterium" x="105" y="425"/><use href="#bacterium" x="180" y="420"/><use href="#bacterium" x="235" y="425"/><use href="#bacterium" x="315" y="420"/>
<text class="ink body" x="210" y="500" text-anchor="middle">Разнообразие вариантов</text>
<text class="muted small" x="210" y="525" text-anchor="middle">Variation exists in the population</text>
<text class="muted small" x="210" y="555" text-anchor="middle">Редкие устойчивые варианты</text>
<text class="muted small" x="210" y="576" text-anchor="middle">Rare resistant variants</text>
<!-- card 2 -->
<rect class="card" x="425" y="165" width="350" height="430" rx="20"/>
<circle cx="465" cy="207" r="23" fill="#5a805f"/><text x="465" y="215" fill="#fff" font-size="23" text-anchor="middle" font-weight="bold">2</text>
<text class="ink stage" x="502" y="215">Воздействие препарата</text><text class="muted small" x="502" y="239">Antimicrobial exposure</text>
<rect x="455" y="270" width="290" height="190" rx="18" fill="#f7faf6" stroke="#d7e2d5" stroke-width="2"/>
<use href="#bacterium" x="500" y="310" opacity=".22"/><use href="#bacterium" x="565" y="305" opacity=".22"/><use href="#bacterium" x="630" y="315" opacity=".22"/><use href="#bacterium" x="695" y="310" opacity=".22"/>
<use href="#bacterium" x="510" y="370" opacity=".22"/><use href="#bacterium" x="580" y="365" opacity=".22"/><use href="#resistant" x="660" y="370"/>
<use href="#bacterium" x="495" y="425" opacity=".22"/><use href="#bacterium" x="570" y="420" opacity=".22"/><use href="#bacterium" x="625" y="425" opacity=".22"/><use href="#bacterium" x="705" y="420" opacity=".22"/>
<g fill="#f2e1bf" stroke="#9a7842" stroke-width="2"><circle cx="520" cy="285" r="8"/><circle cx="610" cy="345" r="8"/><circle cx="700" cy="285" r="8"/><circle cx="540" cy="405" r="8"/><circle cx="690" cy="445" r="8"/></g>
<text class="ink body" x="600" y="500" text-anchor="middle">Чувствительные клетки подавляются</text>
<text class="muted small" x="600" y="525" text-anchor="middle">Susceptible cells are suppressed</text>
<text class="muted small" x="600" y="555" text-anchor="middle">Устойчивые варианты выживают чаще</text>
<text class="muted small" x="600" y="576" text-anchor="middle">Resistant variants are more likely to survive</text>
<!-- card 3 -->
<rect class="card" x="815" y="165" width="350" height="430" rx="20"/>
<circle cx="855" cy="207" r="23" fill="#5a805f"/><text x="855" y="215" fill="#fff" font-size="23" text-anchor="middle" font-weight="bold">3</text>
<text class="ink stage" x="892" y="215">После размножения</text><text class="muted small" x="892" y="239">After reproduction</text>
<rect x="845" y="270" width="290" height="190" rx="18" fill="#f7faf6" stroke="#d7e2d5" stroke-width="2"/>
<use href="#resistant" x="900" y="310"/><use href="#resistant" x="970" y="310"/><use href="#resistant" x="1040" y="310"/>
<use href="#resistant" x="890" y="370"/><use href="#resistant" x="960" y="370"/><use href="#resistant" x="1030" y="370"/>
<use href="#resistant" x="900" y="425"/><use href="#resistant" x="970" y="425"/><use href="#resistant" x="1040" y="425"/>
<text class="ink body" x="990" y="500" text-anchor="middle">Доля устойчивых растёт</text>
<text class="muted small" x="990" y="525" text-anchor="middle">The resistant fraction increases</text>
<text class="muted small" x="990" y="555" text-anchor="middle">Потомки наследуют признаки</text>
<text class="muted small" x="990" y="576" text-anchor="middle">Descendants inherit the traits</text>
<!-- arrows -->
<path class="arr" d="M390 365h28m-10-10 10 10-10 10M780 365h28m-10-10 10 10-10 10"/>
<!-- footnote -->
<rect x="105" y="640" width="990" height="180" rx="18" fill="#f8f5eb" stroke="#d8c99f" stroke-width="2"/>
<text class="ink stage" x="600" y="682" text-anchor="middle">ОТКУДА БЕРЁТСЯ УСТОЙЧИВОСТЬ?</text>
<text class="muted body" x="600" y="718" text-anchor="middle">Мутации или приобретение генов устойчивости; затем естественный отбор.</text>
<text class="muted body" x="600" y="746" text-anchor="middle">Mutations or acquisition of resistance genes, followed by natural selection.</text>
<text class="ink body" x="600" y="784" text-anchor="middle">Препарат не «учит» микроб становиться устойчивым. / The drug does not teach a microbe to become resistant.</text>
<text class="muted tiny" x="600" y="865" text-anchor="middle">Упрощённая модель популяционного процесса; не все механизмы устойчивости одинаковы. / Simplified population model; resistance mechanisms differ.</text>
</svg>