<title id="title">Freshwater habitats of Kyrgyzstan: Issyk-Kul and a mountain stream</title>
<desc id="desc">Two separate schematic aquatic habitats. Left: a large alpine lake with distant mountains, a stony shore and generic unlabelled fish silhouettes underwater. Right: a cold fast-flowing mountain stream over rocks, with generic unlabelled fish silhouettes and aquatic insect larvae. No species are identified.</desc>
