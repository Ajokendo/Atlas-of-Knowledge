<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Западный Тянь-Шань: отдельные местообитания / Western Tien Shan: distinct habitats</title>
<desc id="desc">Три условные зоны: лесистые склоны у Сары-Челека, речное ущелье Беш-Арала и высокогорный каменистый склон с сурком Мензбира. Это не карта ареалов и не изображение совместного обитания / Three conceptual zones: forested Sary-Chelek slopes, the Besh-Aral river gorge, and a rocky highland slope with Menzbier's marmot. Not a range map or a claim of shared habitat.</desc>
