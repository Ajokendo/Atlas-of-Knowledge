<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Баткенская область: сурки и горные местообитания / Batken Region: marmots and mountain habitats</title>
<desc id="desc">Три учебные панели: сурок как объект весеннего учёта 2026 года; сухие предгорья Баткенской области; горные ландшафты Сурматашского заповедника и Саркентского парка. Числа приведены по сообщению Минприроды и относятся к учёту, а не к постоянной численности популяции. Three educational panels: a marmot as the subject of the 2026 spring census, Batken dry foothills, and mountain landscapes of Surmatash Reserve and Sarkent Park. Figures describe a survey, not a permanent population estimate.</desc>
