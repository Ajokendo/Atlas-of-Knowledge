<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Thermoregulation by negative feedback / Терморегуляция посредством отрицательной обратной связи</title>
<desc id="desc">Two branches show how the body responds when temperature rises or falls. Receptors signal the hypothalamus; effectors counter the change and temperature moves back toward its normal range. / Две ветви показывают ответы организма при повышении и снижении температуры. Рецепторы передают сигнал гипоталамусу; эффекторы противодействуют изменению, и температура возвращается к обычному диапазону.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526b55"/></marker><marker id="hot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b66a42"/></marker><marker id="cold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#477b9a"/></marker></defs>
<rect width="960" height="620" rx="18" fill="#fbfbfa"/>
<text x="480" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202522"><tspan class="ru">Терморегуляция: отрицательная обратная связь</tspan><tspan class="en">Thermoregulation: negative feedback</tspan></text>
<rect x="335" y="65" width="290" height="68" rx="12" fill="#e8eae4" stroke="#557c58" stroke-width="2"/>
<text x="480" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#202522"><tspan class="ru">Гипоталамус</tspan><tspan class="en">Hypothalamus</tspan></text>
<text x="480" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#4e5750"><tspan class="ru">центр регуляции</tspan><tspan class="en">control centre</tspan></text>
<rect x="35" y="175" width="400" height="72" rx="12" fill="#f7e9e1" stroke="#b66a42" stroke-width="2"/>
<text x="235" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#633d2c"><tspan class="ru">Температура повышается</tspan><tspan class="en">Body temperature rises</tspan></text>
<text x="235" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#633d2c"><tspan class="ru">Терморецепторы обнаруживают изменение</tspan><tspan class="en">Thermoreceptors detect the change</tspan></text>
<rect x="525" y="175" width="400" height="72" rx="12" fill="#e5eff4" stroke="#477b9a" stroke-width="2"/>
<text x="725" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#294e64"><tspan class="ru">Температура понижается</tspan><tspan class="en">Body temperature falls</tspan></text>
<text x="725" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#294e64"><tspan class="ru">Терморецепторы обнаруживают изменение</tspan><tspan class="en">Thermoreceptors detect the change</tspan></text>
<path d="M235 175V150H410V133" fill="none" stroke="#b66a42" stroke-width="3" marker-end="url(#hot)"/><path d="M725 175V150H550V133" fill="none" stroke="#477b9a" stroke-width="3" marker-end="url(#cold)"/>
<rect x="35" y="315" width="400" height="110" rx="12" fill="#f7eee8" stroke="#b66a42" stroke-width="2"/>
<text x="235" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#633d2c"><tspan class="ru">Ответ эффекторов</tspan><tspan class="en">Effector response</tspan></text>
<text x="235" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#633d2c"><tspan class="ru">Расширение сосудов кожи</tspan><tspan class="en">Skin blood vessels dilate</tspan></text>
<text x="235" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#633d2c"><tspan class="ru">Потоотделение усиливается</tspan><tspan class="en">Sweating increases</tspan></text>
<rect x="525" y="315" width="400" height="110" rx="12" fill="#eaf1f5" stroke="#477b9a" stroke-width="2"/>
<text x="725" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#294e64"><tspan class="ru">Ответ эффекторов</tspan><tspan class="en">Effector response</tspan></text>
<text x="725" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#294e64"><tspan class="ru">Сужение сосудов кожи</tspan><tspan class="en">Skin blood vessels constrict</tspan></text>
<text x="725" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#294e64"><tspan class="ru">Дрожь усиливает теплопродукцию</tspan><tspan class="en">Shivering increases heat production</tspan></text>
<path d="M235 247V315" fill="none" stroke="#b66a42" stroke-width="3" marker-end="url(#hot)"/><path d="M725 247V315" fill="none" stroke="#477b9a" stroke-width="3" marker-end="url(#cold)"/>
<rect x="190" y="485" width="580" height="88" rx="14" fill="#e8eae4" stroke="#557c58" stroke-width="2"/>
<text x="480" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202522"><tspan class="ru">Температура возвращается к рабочему диапазону</tspan><tspan class="en">Temperature moves back toward its normal range</tspan></text>
<text x="480" y="546" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4e5750"><tspan class="ru">Ответ уменьшает исходное отклонение — это и есть отрицательная обратная связь</tspan><tspan class="en">The response reduces the initial deviation — this is negative feedback</tspan></text>
<path d="M235 425V455H390V485" fill="none" stroke="#b66a42" stroke-width="3" marker-end="url(#hot)"/><path d="M725 425V455H570V485" fill="none" stroke="#477b9a" stroke-width="3" marker-end="url(#cold)"/>
<text x="480" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6b716c"><tspan class="ru">Учебная схема; реакции организма сложнее и взаимосвязаны</tspan><tspan class="en">Educational schematic; body responses are more complex and interconnected</tspan></text>
</svg>