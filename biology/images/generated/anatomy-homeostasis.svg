<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Thermoregulation by negative feedback / Терморегуляция посредством отрицательной обратной связи</title>
<desc id="desc">Two branches show how the body responds when temperature rises or falls. Receptors signal the hypothalamus; effectors counter the change and temperature moves back toward its normal range. / Две ветви показывают ответы организма при повышении и снижении температуры. Рецепторы передают сигнал гипоталамусу; эффекторы противодействуют изменению, и температура возвращается к обычному диапазону.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526b55"/></marker><marker id="hot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b66a42"/></marker><marker id="cold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#477b9a"/></marker></defs>
<rect width="960" height="620" rx="18" fill="#fbfbfa"/>
<text x="480" y="27" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#202522">Терморегуляция: отрицательная обратная связь</text>
<text x="480" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202522">Thermoregulation: negative feedback</text>
<rect x="335" y="65" width="290" height="68" rx="12" fill="#e8eae4" stroke="#557c58" stroke-width="2"/>
<text x="480" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202522">Гипоталамус</text>
<text x="480" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202522">Hypothalamus</text>
<text x="480" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#4e5750">Центр регуляции / Control centre</text>
<rect x="35" y="175" width="400" height="72" rx="12" fill="#f7e9e1" stroke="#b66a42" stroke-width="2"/>
<text x="235" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#633d2c">Температура повышается</text>
<text x="235" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#633d2c">Body temperature rises</text>
<text x="235" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#633d2c">Терморецепторы обнаруживают изменение</text>
<text x="235" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#633d2c">Thermoreceptors detect the change</text>
<rect x="525" y="175" width="400" height="72" rx="12" fill="#e5eff4" stroke="#477b9a" stroke-width="2"/>
<text x="725" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#294e64">Температура понижается</text>
<text x="725" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#294e64">Body temperature falls</text>
<text x="725" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#294e64">Терморецепторы обнаруживают изменение</text>
<text x="725" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#294e64">Thermoreceptors detect the change</text>
<path d="M235 175V150H410V133" fill="none" stroke="#b66a42" stroke-width="3" marker-end="url(#hot)"/><path d="M725 175V150H550V133" fill="none" stroke="#477b9a" stroke-width="3" marker-end="url(#cold)"/>
<rect x="35" y="315" width="400" height="110" rx="12" fill="#f7eee8" stroke="#b66a42" stroke-width="2"/>
<text x="235" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#633d2c">Ответ эффекторов / Effector response</text>
<text x="235" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#633d2c">Расширение сосудов кожи</text>
<text x="235" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#633d2c">Skin blood vessels dilate</text>
<text x="235" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#633d2c">Потоотделение усиливается / Sweating increases</text>
<rect x="525" y="315" width="400" height="110" rx="12" fill="#eaf1f5" stroke="#477b9a" stroke-width="2"/>
<text x="725" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#294e64">Ответ эффекторов / Effector response</text>
<text x="725" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#294e64">Сужение сосудов кожи</text>
<text x="725" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#294e64">Skin blood vessels constrict</text>
<text x="725" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#294e64">Дрожь усиливает теплопродукцию / Shivering increases heat production</text>
<path d="M235 247V315" fill="none" stroke="#b66a42" stroke-width="3" marker-end="url(#hot)"/><path d="M725 247V315" fill="none" stroke="#477b9a" stroke-width="3" marker-end="url(#cold)"/>
<rect x="190" y="485" width="580" height="88" rx="14" fill="#e8eae4" stroke="#557c58" stroke-width="2"/>
<text x="480" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202522">Температура возвращается к рабочему диапазону</text>
<text x="480" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202522">Temperature moves back toward its normal range</text>
<text x="480" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#4e5750">Ответ уменьшает исходное отклонение — отрицательная обратная связь</text>
<text x="480" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#4e5750">The response reduces the initial deviation — negative feedback</text>
<path d="M235 425V455H390V485" fill="none" stroke="#b66a42" stroke-width="3" marker-end="url(#hot)"/><path d="M725 425V455H570V485" fill="none" stroke="#477b9a" stroke-width="3" marker-end="url(#cold)"/>
<text x="480" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6b716c">Учебная схема; реакции организма сложнее и взаимосвязаны</text>
<text x="480" y="607" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6b716c">Educational schematic; body responses are more complex and interconnected</text>
</svg>