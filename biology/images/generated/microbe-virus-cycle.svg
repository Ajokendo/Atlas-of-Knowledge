<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Цикл репликации вируса / Generalised viral replication cycle</title>
<desc id="desc">Пять условных этапов: прикрепление к подходящей клетке, проникновение вируса или его генома, синтез вирусных компонентов с использованием клетки-хозяина, сборка новых частиц и выход. Пути проникновения, стратегии копирования генома и способы выхода различаются у разных вирусов. Five schematic stages: attachment to a suitable host cell, entry of the virus or its genome, production of viral components using the host cell, assembly of new particles, and release. Entry routes, genome replication strategies and release mechanisms vary among viruses.</desc>
<defs>
<style>
.bg{fill:#f3f4f1}.panel{fill:#fff;stroke:#d5ddd5;stroke-width:2}.ink{fill:#202a25;font-family:Arial,sans-serif}.muted{fill:#647168;font-family:Arial,sans-serif}.green{fill:#e0ecdf;stroke:#557b5c;stroke-width:3}.blue{fill:#dceaf0;stroke:#547e8c;stroke-width:3}.gold{fill:#f1e5c9;stroke:#9a8050;stroke-width:3}.virus{fill:#e7dced;stroke:#80628c;stroke-width:3}.line{fill:none;stroke:#4b6252;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#637b68;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.head{font-size:28px;font-weight:bold}.stage{font-size:22px;font-weight:bold}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:13px}
</style>
<g id="virion"><circle class="virus" r="23"/><g stroke="#80628c" stroke-width="3" stroke-linecap="round"><path d="M0-23v-9M16-16l7-7M23 0h9M16 16l7 7M0 23v9M-16 16l-7 7M-23 0h-9M-16-16l-7-7"/></g><path d="M-10 1q10-16 20 0q-10 15-20 0" fill="none" stroke="#80628c" stroke-width="3"/></g>
</defs>
<rect class="bg" width="1200" height="900"/>
<text class="ink" x="600" y="48" text-anchor="middle" font-size="32" font-weight="bold">ЦИКЛ РЕПЛИКАЦИИ ВИРУСА</text>
<text class="muted" x="600" y="80" text-anchor="middle" font-size="21">A GENERALISED VIRAL REPLICATION CYCLE</text>
<text class="muted body" x="600" y="112" text-anchor="middle">Обобщённая модель: детали зависят от семейства вируса / General model: details depend on the virus family</text>
<!-- top row cards -->
<rect class="panel" x="35" y="155" width="350" height="245" rx="18"/>
<circle cx="70" cy="190" r="21" fill="#557b5c"/><text x="70" y="198" fill="white" font-size="22" text-anchor="middle" font-weight="bold">1</text>
<text class="ink stage" x="105" y="198">Прикрепление / Attachment</text>
<path class="green" d="M75 280 Q210 215 345 280 Q210 355 75 280Z"/>
<path class="line" d="M180 250v-18m0 0l-9-9m9 9 9-9"/>
<use href="#virion" x="180" y="220"/>
<path class="gold" d="M180 257l-8-10m8 10 8-10"/>
<text class="muted small" x="60" y="365">Вирус связывается с подходящей молекулой-мишенью</text>
<text class="muted small" x="60" y="385">The virus binds to a compatible cell-surface target</text>

<rect class="panel" x="425" y="155" width="350" height="245" rx="18"/>
<circle cx="460" cy="190" r="21" fill="#557b5c"/><text x="460" y="198" fill="white" font-size="22" text-anchor="middle" font-weight="bold">2</text>
<text class="ink stage" x="495" y="198">Проникновение / Entry</text>
<path class="green" d="M465 280 Q600 215 735 280 Q600 355 465 280Z"/>
<use href="#virion" x="600" y="258"/>
<path class="arrow" d="M600 225v-20m-9 9 9-9 9 9"/>
<path class="gold" d="M600 300q-20 12 0 24q20-12 0-24Z"/>
<text class="muted small" x="450" y="365">В клетку входит вирус или его геном</text>
<text class="muted small" x="450" y="385">The virus or its genome enters the cell</text>

<rect class="panel" x="815" y="155" width="350" height="245" rx="18"/>
<circle cx="850" cy="190" r="21" fill="#557b5c"/><text x="850" y="198" fill="white" font-size="22" text-anchor="middle" font-weight="bold">3</text>
<text class="ink stage" x="885" y="198">Синтез / Synthesis</text>
<path class="green" d="M855 280 Q990 215 1125 280 Q990 355 855 280Z"/>
<path class="blue" d="M945 250q45-30 90 0q-10 55-45 60q-35-5-45-60Z"/>
<path d="M960 272q20-30 40 0t40 0" fill="none" stroke="#547e8c" stroke-width="4"/>
<circle cx="970" cy="292" r="7" fill="#80628c"/><circle cx="1010" cy="292" r="7" fill="#80628c"/><circle cx="1035" cy="260" r="7" fill="#80628c"/>
<text class="muted small" x="840" y="365">Клетка производит вирусные компоненты</text>
<text class="muted small" x="840" y="385">The host cell makes viral components</text>
<!-- arrows top -->
<path class="arrow" d="M390 275h28m-9-9 9 9-9 9M780 275h28m-9-9 9 9-9 9"/>
<!-- bottom row -->
<rect class="panel" x="225" y="455" width="350" height="245" rx="18"/>
<circle cx="260" cy="490" r="21" fill="#557b5c"/><text x="260" y="498" fill="white" font-size="22" text-anchor="middle" font-weight="bold">4</text>
<text class="ink stage" x="295" y="498">Сборка / Assembly</text>
<path class="green" d="M265 580 Q400 515 535 580 Q400 655 265 580Z"/>
<use href="#virion" x="360" y="570"/><use href="#virion" x="425" y="555"/><use href="#virion" x="455" y="605"/>
<text class="muted small" x="250" y="665">Геном и белки формируют новые частицы</text>
<text class="muted small" x="250" y="685">Genomes and proteins form new particles</text>

<rect class="panel" x="625" y="455" width="350" height="245" rx="18"/>
<circle cx="660" cy="490" r="21" fill="#557b5c"/><text x="660" y="498" fill="white" font-size="22" text-anchor="middle" font-weight="bold">5</text>
<text class="ink stage" x="695" y="498">Выход / Release</text>
<path class="green" d="M665 580 Q800 515 935 580 Q800 655 665 580Z"/>
<use href="#virion" x="800" y="548"/><use href="#virion" x="920" y="568"/>
<path class="arrow" d="M865 575h38m-10-10 10 10-10 10"/>
<path class="line" d="M690 552q-18 25 0 50m220-50q18 25 0 50"/>
<text class="muted small" x="650" y="665">Выход через лизис, почкование или иной путь</text>
<text class="muted small" x="650" y="685">Release by lysis, budding or another route</text>
<path class="arrow" d="M800 410v36m-9-9 9 9 9-9M575 575h46m-10-9 10 9-10 9"/>
<!-- variation panel -->
<rect x="140" y="740" width="920" height="112" rx="16" fill="#f8f5eb" stroke="#d8c99f" stroke-width="2"/>
<text class="ink stage" x="600" y="775" text-anchor="middle">ВАЖНО: У ВИРУСОВ НЕТ ОДНОГО УНИВЕРСАЛЬНОГО МЕХАНИЗМА</text>
<text class="muted small" x="600" y="805" text-anchor="middle">Пути проникновения, копирование ДНК- или РНК-генома и выход частиц различаются.</text>
<text class="muted small" x="600" y="828" text-anchor="middle">Entry routes, DNA or RNA genome replication, and particle release vary among viruses.</text>
<text class="muted tiny" x="600" y="880" text-anchor="middle">Схема условная; не предназначена для описания конкретного вируса. / Simplified schematic; not a description of any one virus.</text>
</svg>