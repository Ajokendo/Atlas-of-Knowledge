<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Системы органов человека / Human organ systems</title>
<desc id="desc">Учебная схема тела человека спереди с условно показанными головным мозгом, лёгкими, сердцем, пищеварительным трактом, почками и мочевым пузырём. Подписи связывают органы с нервной, дыхательной, кровеносной, пищеварительной и мочевыделительной системами. / Educational anterior view of the human body with schematic brain, lungs, heart, digestive tract, kidneys and urinary bladder, labelled by organ system.</desc>
<defs><style>
.title{font:700 30px Arial,sans-serif;fill:#26352f}.head{font:700 22px Arial,sans-serif;fill:#26352f}.label{font:20px Arial,sans-serif;fill:#34433d}.sub{font:17px Arial,sans-serif;fill:#5b6861}.leader{fill:none;stroke:#87958c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style></defs>
<rect width="1200" height="900" rx="26" fill="#fbfaf6"/>
<text x="600" y="54" text-anchor="middle" class="title">Системы органов человека / Human organ systems</text>
<!-- neutral body silhouette -->
