<g>
<text x="85" y="125" class="head">Нервная система</text><text x="85" y="153" class="sub">Nervous system</text><text x="85" y="185" class="sub">Головной мозг / Brain</text>
<text x="85" y="325" class="head">Дыхательная система</text><text x="85" y="353" class="sub">Respiratory system</text><text x="85" y="385" class="sub">Лёгкие / Lungs</text>
<text x="875" y="345" class="head">Кровеносная система</text><text x="875" y="373" class="sub">Circulatory system</text><text x="875" y="405" class="sub">Сердце / Heart</text>
<text x="875" y="480" class="head">Пищеварительная система</text><text x="875" y="508" class="sub">Digestive system</text><text x="875" y="540" class="sub">Желудок и кишечник</text><text x="875" y="565" class="sub">Stomach and intestines</text>
<text x="875" y="605" class="head">Мочевыделительная система</text><text x="875" y="633" class="sub">Urinary system</text><text x="875" y="665" class="sub">Почки и мочевой пузырь</text><text x="875" y="690" class="sub">Kidneys and urinary bladder</text>
</g>
<rect x="80" y="735" width="1040" height="100" rx="18" fill="#f0eee8" stroke="#d8d3c8" stroke-width="2"/>
<text x="600" y="775" text-anchor="middle" class="label">Органы работают совместно; одна система может включать органы,</text>
<text x="600" y="805" text-anchor="middle" class="label">расположенные в разных частях тела. / Organ systems work together.</text>
<text x="600" y="865" text-anchor="middle" class="sub">Упрощённая схема, не в масштабе. / Simplified schematic, not to scale.</text>
</svg>