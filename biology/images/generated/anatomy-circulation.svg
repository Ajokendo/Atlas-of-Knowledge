<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Два круга кровообращения / The two circulatory circuits</title>
<desc id="desc">Учебная схема сердца, лёгочного и системного кругов кровообращения. Синяя стрелка показывает путь крови с низким содержанием кислорода к лёгким, красная — путь крови с высоким содержанием кислорода к органам тела. / Educational diagram of the heart, pulmonary and systemic circuits. Blue arrows show oxygen-poor blood travelling to the lungs; red arrows show oxygen-rich blood travelling to the body.</desc>
<defs>
 <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b94d43"/></marker>
 <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397ba8"/></marker>
 <style>
 .t{font: bold 25px Arial,sans-serif;fill:#222}.s{font:20px Arial,sans-serif;fill:#454545}.small{font:17px Arial,sans-serif;fill:#555}.red{stroke:#b94d43;fill:none;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#397ba8;fill:none;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.heart{stroke:#6c3b3a;stroke-width:4}.chamber{stroke:#fff;stroke-width:5}
 </style>
</defs>
<rect width="1200" height="900" rx="28" fill="#fbfaf6"/>
<text x="600" y="58" text-anchor="middle" class="t" font-size="32">Два круга кровообращения / The two circulatory circuits</text>
<rect x="65" y="105" width="330" height="185" rx="24" fill="#eaf2f6" stroke="#9bbdce" stroke-width="3"/>
<text x="230" y="145" text-anchor="middle" class="t">ЛЁГКИЕ / LUNGS</text>
<g fill="#d4e6ef" stroke="#6d9eb7" stroke-width="4"><path d="M210 165C150 145 120 205 135 255C145 282 190 272 218 238Z"/><path d="M250 165C310 145 340 205 325 255C315 282 270 272 242 238Z"/></g>
<path d="M230 165V245" stroke="#6d9eb7" stroke-width="9" stroke-linecap="round"/>
<text x="230" y="315" text-anchor="middle" class="small">Газообмен: кровь получает O₂</text>
<text x="230" y="339" text-anchor="middle" class="small">Gas exchange: blood gains O₂</text>
<rect x="805" y="105" width="330" height="185" rx="24" fill="#f8ece9" stroke="#d9aaa3" stroke-width="3"/>
<text x="970" y="145" text-anchor="middle" class="t">ОРГАНЫ ТЕЛА / BODY</text>
<g fill="#f0d9d4" stroke="#b97870" stroke-width="4"><circle cx="970" cy="205" r="34"/><path d="M900 263Q970 185 1040 263" fill="none" stroke-width="22" stroke-linecap="round"/></g>
<text x="970" y="315" text-anchor="middle" class="small">Клетки используют O₂</text>
<text x="970" y="339" text-anchor="middle" class="small">Cells use oxygen</text>
<!-- heart -->
<path class="heart" fill="#e7b5aa" d="M600 270C540 200 440 240 455 335C470 420 560 485 600 520C640 485 730 420 745 335C760 240 660 200 600 270Z"/>
<path class="chamber" fill="#397ba8" d="M485 300Q525 260 575 295L575 390Q535 420 495 375Q470 340 485 300Z"/>
<path class="chamber" fill="#b94d43" d="M625 295Q675 260 715 300Q730 340 705 375Q665 420 625 390Z"/>
<path class="chamber" fill="#397ba8" d="M500 395Q540 375 575 410L590 485Q550 470 520 445Q495 425 500 395Z"/>
<path class="chamber" fill="#b94d43" d="M625 410Q660 375 700 395Q705 425 680 445Q650 470 610 485Z"/>
<path d="M600 278V485" stroke="#fff" stroke-width="7"/>
<text x="530" y="342" text-anchor="middle" class="small" fill="#fff">ПП / RA</text>
<text x="670" y="342" text-anchor="middle" class="small" fill="#fff">ЛП / LA</text>
<text x="540" y="440" text-anchor="middle" class="small" fill="#fff">ПЖ / RV</text>
<text x="660" y="440" text-anchor="middle" class="small" fill="#fff">ЛЖ / LV</text>
<text x="600" y="555" text-anchor="middle" class="t">СЕРДЦЕ / HEART</text>
<text x="600" y="585" text-anchor="middle" class="small">Клапаны поддерживают однонаправленный ток</text>
<text x="600" y="609" text-anchor="middle" class="small">Valves maintain one-way flow</text>
<!-- flow arrows -->
<path class="blue" marker-end="url(#blueArrow)" d="M510 455C400 470 350 390 330 270"/>
<path class="red" marker-end="url(#redArrow)" d="M395 195C435 195 465 220 490 270"/>
<path class="red" marker-end="url(#redArrow)" d="M710 270C745 220 770 195 805 195"/>
<path class="red" marker-end="url(#redArrow)" d="M890 270C860 420 790 470 690 455"/>
<text x="405" y="505" class="small" fill="#397ba8">Лёгочная артерия / Pulmonary artery</text>
<text x="770" y="505" class="small" fill="#b94d43">Лёгочные вены / Pulmonary veins</text>
<!-- systemic return -->
<path class="blue" marker-end="url(#blueArrow)" d="M805 245C760 650 650 690 535 690C420 690 300 650 230 520"/>
<path class="blue" marker-end="url(#blueArrow)" d="M230 520C180 430 190 390 260 355C350 310 420 330 490 330"/>
<text x="600" y="690" text-anchor="middle" class="s">Венозная кровь возвращается к правой половине сердца</text>
<text x="600" y="718" text-anchor="middle" class="s">Oxygen-poor blood returns to the right side of the heart</text>
<rect x="95" y="760" width="1010" height="95" rx="18" fill="#f0eee8" stroke="#d8d3c8" stroke-width="2"/>
<path d="M145 795H255" class="blue" marker-end="url(#blueArrow)"/><text x="280" y="802" class="s">Меньше O₂ / Lower O₂</text>
<path d="M600 795H710" class="red" marker-end="url(#redArrow)"/><text x="735" y="802" class="s">Больше O₂ / Higher O₂</text>
<text x="600" y="835" text-anchor="middle" class="small">Цвета условны; схема упрощена и не в масштабе. / Colours are conventional; diagram simplified and not to scale.</text>
</svg>