  <g fill="#59615a" stroke="none"><circle cx="-18" cy="-4" r="4"/><circle cx="0" cy="6" r="4"/><circle cx="16" cy="-5" r="4"/><circle cx="40" cy="-15" r="2"/></g>
 </g>
 <text x="18" y="36" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#233a32">01 · ROCKY ALPINE HABITAT</text>
 <text x="18" y="62" font-family="Arial,sans-serif" font-size="15" fill="#314c42">Скалы · снежный барс · горный козёл</text>
 <text x="18" y="83" font-family="Arial,sans-serif" font-size="14" fill="#314c42">Cliffs · snow leopard · Siberian ibex</text>
 <text x="18" y="530" font-family="Arial,sans-serif" font-size="13" fill="#fff">Отдельная высокогорная сцена / Separate alpine scene</text>
</g>
