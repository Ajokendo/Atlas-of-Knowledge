 <text x="18" y="36" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#233a32">02 · SPRUCE–JUNIPER SLOPES</text>
 <text x="18" y="62" font-family="Arial,sans-serif" font-size="15" fill="#314c42">Ель и арча · марал</text>
 <text x="18" y="83" font-family="Arial,sans-serif" font-size="14" fill="#314c42">Spruce and juniper · maral deer</text>
