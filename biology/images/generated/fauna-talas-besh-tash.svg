<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Беш-Таш: местообитания и фауна / Besh-Tash: habitats and fauna</title>
<desc id="desc">Три отдельные сцены: высокогорные скалы со снежным барсом и сибирским горным козлом; елово-арчовый склон с маралом; река Беш-Таш с условным силуэтом рыбы. Это учебная реконструкция местообитаний, а не единая фотография или карта распространения / Three separate scenes: alpine cliffs with snow leopard and Siberian ibex; spruce-juniper slope with maral deer; Besh-Tash River with a generic fish silhouette. An educational habitat reconstruction, not one photograph or a distribution map.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dce9e7"/><stop offset="1" stop-color="#f4f0df"/></linearGradient>
 <linearGradient id="mount" x2="0" y2="1"><stop stop-color="#879b91"/><stop offset="1" stop-color="#526d62"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#8eb8b2"/><stop offset="1" stop-color="#477c7c"/></linearGradient>
 <g id="spruce" fill="#365b4a"><path d="M0 0L-25 47H-12L-34 83H34L12 47H25Z"/><rect x="-4" y="80" width="8" height="18" fill="#795f49"/></g>
</defs>
