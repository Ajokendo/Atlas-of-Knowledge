 <text x="18" y="36" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#233a32">03 · RIVER CORRIDOR</text>
 <text x="18" y="62" font-family="Arial,sans-serif" font-size="15" fill="#314c42">Река Беш-Таш · водная среда</text>
 <text x="18" y="83" font-family="Arial,sans-serif" font-size="14" fill="#314c42">Besh-Tash River · aquatic habitat</text>
 <text x="18" y="530" font-family="Arial,sans-serif" font-size="13" fill="#fff">Рыба показана условно, без видовой подписи</text>
 <text x="18" y="550" font-family="Arial,sans-serif" font-size="12" fill="#fff">Generic fish silhouette; no species label</text>
</g>
<text x="600" y="626" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#53675b">Учебная реконструкция местообитаний · Educational habitat reconstruction</text>
<text x="600" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#7b8278">Разные экологические сцены; не карта ареалов и не утверждение о совместном присутствии видов</text>
