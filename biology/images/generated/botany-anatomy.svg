<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Внутреннее строение корня, стебля и листа / Internal anatomy of root, stem and leaf</title>
<desc id="desc">Три обобщённых поперечных среза: корень двудольного растения со звездчатой ксилемой, стебель двудольного растения с кольцом открытых проводящих пучков и лист с палисадной и губчатой мезофильной тканью.</desc>
<defs>
 <style>
 .h{font:700 27px Arial,sans-serif;fill:#fff}.sub{font:700 19px Arial,sans-serif;fill:#243b2a}
 .lab{font:17px Arial,sans-serif;fill:#26372d}.small{font:15px Arial,sans-serif;fill:#26372d}
 .line{stroke:#344b3b;stroke-width:2;fill:none}.panel{fill:#fbfcf6;stroke:#9ab58b;stroke-width:2}
 .outer{fill:#b8d69a;stroke:#5e8b54;stroke-width:3}.cortex{fill:#e5edc9;stroke:#a5b978;stroke-width:2}
 .x{fill:#55a9dc;stroke:#176b9e;stroke-width:3}.p{fill:#b78acb;stroke:#75428f;stroke-width:2}
 .ep{fill:#8fbd69;stroke:#4e8045;stroke-width:2}.ground{fill:#dce9bd;stroke:#a4bf80;stroke-width:2}
 </style>
</defs>
<rect width="1440" height="760" fill="#f5f8ef"/>
<rect x="18" y="14" width="1404" height="64" rx="16" fill="#285f3a"/>
<text x="720" y="55" text-anchor="middle" class="h">Внутреннее строение растений / Internal Structure of Plants</text>
<!-- ROOT -->
<rect x="18" y="94" width="450" height="590" rx="18" class="panel"/>
<rect x="18" y="94" width="450" height="54" rx="16" fill="#a66a27"/>
<text x="243" y="130" text-anchor="middle" class="h">Корень / Root</text>
<text x="243" y="174" text-anchor="middle" class="sub">Поперечный срез / Cross-section</text>
<circle cx="242" cy="430" r="164" class="outer"/>
<circle cx="242" cy="430" r="143" class="cortex"/>
<circle cx="242" cy="430" r="82" fill="#f2d98e" stroke="#bb8d35" stroke-width="5"/>
<!-- root xylem star -->
<path d="M242 360 C226 385 220 402 242 430 C264 402 258 385 242 360Z
 M312 430 C285 414 267 412 242 430 C267 448 285 446 312 430Z
 M242 500 C258 475 264 458 242 430 C220 458 226 475 242 500Z
 M172 430 C199 446 217 448 242 430 C217 412 199 414 172 430Z" class="x"/>
<g class="p">
 <circle cx="205" cy="393" r="11"/><circle cx="279" cy="393" r="11"/>
 <circle cx="205" cy="467" r="11"/><circle cx="279" cy="467" r="11"/>
</g>
<g fill="#d9b7df" stroke="#8a5b9c" stroke-width="1.5">
 <circle cx="222" cy="411" r="7"/><circle cx="262" cy="411" r="7"/><circle cx="222" cy="449" r="7"/><circle cx="262" cy="449" r="7"/>
</g>
<g class="line">
 <path d="M105 275L145 300L170 320"/><path d="M335 260L310 300L300 340"/>
 <path d="M95 570L160 520L170 495"/><path d="M360 570L300 520L285 490"/>
 <path d="M242 545L242 515"/>
</g>
<g class="lab">
 <text x="35" y="235">Ризодерма / Rhizodermis</text><text x="35" y="256" class="small">(эпидерма / epidermis)</text>
 <text x="300" y="225">Кора / Cortex</text>
 <text x="30" y="602">Эндодерма / Endodermis</text>
 <text x="300" y="602">Перицикл / Pericycle</text>
 <text x="242" y="574" text-anchor="middle">Центральный цилиндр</text><text x="242" y="594" text-anchor="middle" class="small">Stele (central cylinder)</text>
 <text x="242" y="648" text-anchor="middle" fill="#176b9e">Ксилема / Xylem — звезда</text>
 <text x="242" y="670" text-anchor="middle" fill="#75428f">Флоэма / Phloem — между лучами</text>
</g>
<!-- STEM -->
<rect x="495" y="94" width="450" height="590" rx="18" class="panel"/>
<rect x="495" y="94" width="450" height="54" rx="16" fill="#4d843e"/>
<text x="720" y="130" text-anchor="middle" class="h">Стебель / Stem</text>
<text x="720" y="174" text-anchor="middle" class="sub">Травянистый стебель двудольного / Herbaceous eudicot</text>
<circle cx="720" cy="430" r="165" class="ep"/>
<circle cx="720" cy="430" r="148" class="ground"/>
<circle cx="720" cy="430" r="112" fill="#edf2d7" stroke="#b4c98e" stroke-width="2"/>
<!-- vascular bundles around ring; phloem outer, cambium, xylem inner -->
<g>
 <g transform="translate(720 292)"><path d="M-23 0Q0 -15 23 0L20 28Q0 40 -20 28Z" class="p"/><path d="M-16 28Q0 17 16 28L13 68Q0 80 -13 68Z" class="x"/></g>
