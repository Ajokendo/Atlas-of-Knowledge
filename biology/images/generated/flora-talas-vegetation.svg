<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Растительность Таласского Ала-Тоо / Vegetation of Talas Ala-Too</title>
<desc id="desc">Conceptual cross-section of a Besh-Tash mountain valley showing a river floodplain, spruce woodland, open juniper woodland, subalpine meadow and alpine meadow with rocky slopes. Not to scale; no fixed elevation boundaries.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dcecf0"/><stop offset="1" stop-color="#f5f0df"/></linearGradient>
 <linearGradient id="mountain" x2="0" y2="1"><stop stop-color="#849d91"/><stop offset="1" stop-color="#536e61"/></linearGradient>
 <linearGradient id="meadow" x2="0" y2="1"><stop stop-color="#a9b879"/><stop offset="1" stop-color="#6e8b55"/></linearGradient>
 <style>
 .label{font:700 19px sans-serif;fill:#23352e}.sub{font:15px sans-serif;fill:#334b42}.small{font:14px sans-serif;fill:#263a32}.water{fill:#6da9b8}.line{stroke:#304b40;stroke-width:3;stroke-linecap:round;fill:none}
 </style>
</defs>
