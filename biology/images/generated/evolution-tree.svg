<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Филогенетическое дерево и общий предок / Phylogenetic tree and common ancestry</title>
<desc id="desc">Ветвящееся дерево с корнем, общим предком всех групп, двумя парами сестринских таксонов и выделенной кладой A+B. Длина ветвей не обозначает время или степень прогресса. / A branching tree with a root, the common ancestor of all groups, two pairs of sister taxa and a highlighted A+B clade. Branch length does not represent time or progress.</desc>
<defs><style>.bg{fill:#f7f8f4}.panel{fill:#fff;stroke:#d9e0d6;stroke-width:2}.branch{fill:none;stroke:#557c58;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.highlight{fill:none;stroke:#b47a46;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fff;stroke:#557c58;stroke-width:5}.tip{fill:#557c58}.head{font:600 27px Inter,Arial,sans-serif;fill:#243329}.label{font:600 22px Inter,Arial,sans-serif;fill:#243329}.small{font:16px Inter,Arial,sans-serif;fill:#536258}.tiny{font:14px Inter,Arial,sans-serif;fill:#617066}</style></defs>
<rect width="1200" height="900" class="bg"/>
<text x="60" y="62" class="head">ДРЕВО ЭВОЛЮЦИОННОГО РОДСТВА / EVOLUTIONARY TREE</text>
<text x="60" y="96" class="small">Родство определяется общими предками, а не сходством «ступеней прогресса» / Relatedness is defined by common ancestry, not a ladder of progress</text>
<rect x="55" y="130" width="1090" height="610" rx="18" class="panel"/>
<!-- Root to two descendant clades -->
<path d="M270 485H480L650 285H880M650 285L880 440" class="branch"/>
<path d="M480 485L650 635L880 575M650 635L880 700" class="branch"/>
<!-- Highlight the A+B clade -->
<path d="M270 485H480L650 285L880 285M650 285L880 440" class="highlight"/>
<!-- nodes and terminal tips -->
<circle cx="270" cy="485" r="14" class="node"/>
<circle cx="480" cy="485" r="14" class="node"/>
<circle cx="650" cy="285" r="14" class="node"/>
<circle cx="650" cy="635" r="14" class="node"/>
<g class="tip"><circle cx="880" cy="285" r="10"/><circle cx="880" cy="440" r="10"/><circle cx="880" cy="575" r="10"/><circle cx="880" cy="700" r="10"/></g>
<g class="label"><text x="910" y="293">Таксон A / Taxon A</text><text x="910" y="448">Таксон B / Taxon B</text><text x="910" y="583">Таксон C / Taxon C</text><text x="910" y="708">Таксон D / Taxon D</text></g>
<text x="95" y="455" class="small">Общий предок всех групп</text><text x="95" y="480" class="tiny">Common ancestor of all groups</text>
<path d="M220 470L258 480" stroke="#557c58" stroke-width="2" fill="none"/>
<rect x="80" y="205" width="270" height="76" rx="12" fill="#f4eadc" stroke="#d6b78c" stroke-width="2"/>
<text x="100" y="237" class="small">Клада A+B</text><text x="100" y="261" class="tiny">Clade A+B</text>
<path d="M350 245L430 245L430 340L480 485" stroke="#b47a46" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
<rect x="55" y="770" width="1090" height="90" rx="14" fill="#e9eee6" stroke="#cbd7c9" stroke-width="2"/>
<text x="82" y="805" class="small">Узлы обозначают общих предков; концы ветвей — таксоны. A и B — сестринские группы; C и D — другая сестринская пара.</text>
<text x="82" y="833" class="tiny">Nodes represent common ancestors; branch tips are taxa. A and B are sister groups, as are C and D.</text>
<text x="82" y="880" class="tiny">Длины ветвей условны: они не показывают время, «сложность» или эволюционный ранг. / Branch lengths are schematic, not time, complexity or evolutionary rank.</text>
</svg>