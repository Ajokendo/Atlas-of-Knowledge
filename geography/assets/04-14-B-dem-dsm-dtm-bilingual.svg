<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">DEM, DSM И DTM / DEM, DSM AND DTM</title><desc id="desc">Сравнение цифровой модели высот, поверхности с объектами и модели рельефа с учётом подповерхностной геометрии. / Comparison of elevation model, surface model including objects, and terrain model with subsurface geometry.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">DEM, DSM И DTM / DEM, DSM AND DTM</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="55" y="120" width="330" height="450" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="220" y="165" font-size="24" font-weight="700">DEM</text><path d="M90 420 L160 350 L220 390 L300 300 L350 420" fill="none" stroke="#1d4ed8" stroke-width="10"/><text x="220" y="500" font-size="20">Поверхность высот</text><text x="220" y="530" font-size="18">Elevation surface</text></g><g><rect x="435" y="120" width="330" height="450" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="600" y="165" font-size="24" font-weight="700">DSM</text><path d="M470 420 L510 350 L540 420 L570 280 L600 420 L650 310 L690 420 L730 330" fill="none" stroke="#15803d" stroke-width="10"/><rect x="550" y="260" width="42" height="65" fill="#64748b"/><circle cx="505" cy="340" r="24" fill="#16a34a"/><circle cx="670" cy="300" r="26" fill="#16a34a"/><text x="600" y="500" font-size="20">Здания и растительность</text><text x="600" y="530" font-size="18">Buildings and vegetation</text></g><g><rect x="815" y="120" width="330" height="450" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="980" y="165" font-size="24" font-weight="700">DTM</text><path d="M850 420 L920 350 L980 390 L1060 300 L1110 420" fill="none" stroke="#c2410c" stroke-width="10"/><path d="M850 450 Q980 500 1110 450" fill="none" stroke="#92400e" stroke-width="5" stroke-dasharray="8 7"/><text x="980" y="500" font-size="20">Модель поверхности земли</text><text x="980" y="530" font-size="18">Terrain representation</text></g></g><text x="600" y="640" text-anchor="middle" font-size="18" fill="#475569">Термины DEM/DTM различаются между организациями; всегда проверяйте определение, разрешение, точность, дату и вертикальную систему отсчёта.</text><text x="600" y="670" text-anchor="middle" font-size="18" fill="#475569">DEM/DTM terminology varies by provider; check definition, resolution, accuracy, date and vertical datum.</text><text x="600" y="715" text-anchor="middle" font-size="16" fill="#64748b">Учебная схема, не реальные данные высот / Teaching schematic, not actual elevation data</text></svg>