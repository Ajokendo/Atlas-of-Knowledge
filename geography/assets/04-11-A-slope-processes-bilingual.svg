<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ПРОЦЕССЫ НА СКЛОНАХ / SLOPE PROCESSES</title><desc id="desc">Схема падения, опрокидывания, вращательного и поступательного оползней, селя, осыпи и медленного ползучего движения. / Diagram of fall, topple, rotational and translational slides, debris flow, talus and slow creep.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">ПРОЦЕССЫ НА СКЛОНАХ / SLOPE PROCESSES</text>
<path d="M70 580 L310 180 L560 580 L810 180 L1130 580" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/><g stroke="#dc2626" stroke-width="5" fill="none"><path d="M200 290 L250 380 M235 360 L250 380 L265 350"/><path d="M400 300 Q450 370 510 420"/><path d="M670 300 L740 370 L780 410"/><path d="M900 300 Q970 430 1050 500"/></g><g fill="#64748b"><circle cx="215" cy="430" r="20"/><circle cx="250" cy="455" r="16"/><circle cx="290" cy="480" r="12"/></g><path d="M820 480 Q900 520 1010 550" fill="none" stroke="#92400e" stroke-width="22"/><g font-family="Arial,sans-serif" font-size="19" fill="#1e293b"><text x="90" y="140">Падение / Fall</text><text x="330" y="140">Опрокидывание / Topple</text><text x="570" y="140">Оползень / Slide</text><text x="840" y="140">Сель / Debris flow</text><text x="190" y="535">Осыпь / Talus</text><text x="720" y="620">Ползучесть / Creep</text></g><text x="600" y="700" text-anchor="middle" font-size="18" fill="#475569">Схематические типы движения; реальный механизм зависит от геологии, воды, уклона и внешних воздействий. / Schematic movement types; actual mechanisms depend on geology, water, slope and triggers.</text></svg>