<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="t d">
<title id="t">Горно-долинная циркуляция / Mountain-valley circulation</title><desc id="d">Daytime upslope valley breeze and nighttime downslope mountain breeze, with schematic temperature inversion in the valley.</desc>
<rect width="1400" height="850" fill="#f4f7fb"/><rect x="35" y="35" width="1330" height="780" rx="26" fill="#fff" stroke="#d9e2ec" stroke-width="2"/>
<text x="78" y="100" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17324d">Горно-долинная циркуляция</text><text x="78" y="143" font-family="Arial,sans-serif" font-size="23" fill="#587086">Mountain–valley circulation</text>
<g transform="translate(70 190)">
<rect width="600" height="530" rx="18" fill="#fff7e8"/><text x="30" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#a45e13">ДЕНЬ / DAY</text><circle cx="510" cy="95" r="34" fill="#f2bd4c"/>
<path d="M25 390 L150 270 L260 345 L360 345 L470 260 L575 390 L575 445 L25 445 Z" fill="#c8d7b3" stroke="#708b66" stroke-width="4"/>
<path d="M150 270 Q175 190 220 160 M470 260 Q425 185 390 160" fill="none" stroke="#d47a23" stroke-width="8" stroke-linecap="round"/><path d="M205 160 l20 -5 -5 22 M400 160 l-20 -5 5 22" fill="none" stroke="#d47a23" stroke-width="6"/>
<text x="70" y="485" font-family="Arial,sans-serif" font-size="18" fill="#79501d">Нагретый воздух поднимается по склонам</text><text x="70" y="510" font-family="Arial,sans-serif" font-size="16" fill="#79501d">Warm air flows upslope from the valley</text>
<text x="230" y="315" font-family="Arial,sans-serif" font-size="18" fill="#345b42">Долина / Valley</text>
</g>
<g transform="translate(730 190)">
<rect width="600" height="530" rx="18" fill="#edf3fb"/><text x="30" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#315d91">НОЧЬ / NIGHT</text><path d="M500 65 a32 32 0 1 0 35 45 a27 27 0 1 1 -35 -45" fill="#7d91b5"/>
<path d="M25 390 L150 270 L260 345 L360 345 L470 260 L575 390 L575 445 L25 445 Z" fill="#c8d7b3" stroke="#708b66" stroke-width="4"/>
<path d="M220 160 Q175 205 150 270 M390 160 Q425 205 470 260" fill="none" stroke="#3978b9" stroke-width="8" stroke-linecap="round"/><path d="M150 270 l-4 -22 20 9 M470 260 l-18 -7 18 -12" fill="none" stroke="#3978b9" stroke-width="6"/>
<path d="M195 350 Q300 325 405 350" fill="none" stroke="#7b8ca8" stroke-width="5" stroke-dasharray="10 8"/>
<text x="70" y="485" font-family="Arial,sans-serif" font-size="18" fill="#315d91">Охлаждённый воздух стекает вниз</text><text x="70" y="510" font-family="Arial,sans-serif" font-size="16" fill="#315d91">Cool dense air drains downslope</text>
<text x="180" y="375" font-family="Arial,sans-serif" font-size="16" fill="#4b5d79">Возможная инверсия / Possible inversion</text>
</g>
<text x="78" y="770" font-family="Arial,sans-serif" font-size="16" fill="#66788a">Схема показывает типичную местную циркуляцию; направление и сила ветра зависят от облачности, синоптической обстановки и рельефа.</text>
<text x="78" y="794" font-family="Arial,sans-serif" font-size="15" fill="#66788a">Typical local circulation; actual wind direction and strength depend on cloud, synoptic conditions and terrain.</text>
</svg>