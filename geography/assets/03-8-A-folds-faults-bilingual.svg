<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">СКЛАДКИ И РАЗЛОМЫ / FOLDS AND FAULTS</title>
<desc id="desc">Два типа складок показаны в верхней части. В нижней части сравниваются сброс, взброс и сдвиговый разлом; для наклонных разломов показано относительное движение висячего и лежачего крыла. / Two fold types are shown above. The lower panels compare normal, reverse and strike-slip faults; relative movement of the hanging wall and footwall is shown for the inclined faults.</desc>
<rect width="1200" height="850" rx="24" fill="#f8fafc"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">СКЛАДКИ И РАЗЛОМЫ / FOLDS AND FAULTS</text>
<g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle">
 <text x="600" y="92" font-size="24" font-weight="700">Складки / Folds</text>
 <text x="600" y="420" font-size="24" font-weight="700">Разломы / Faults</text>
</g>
<!-- Fold panels -->
<g>
 <rect x="65" y="115" width="500" height="270" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
 <rect x="635" y="115" width="500" height="270" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
 <text x="315" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Антиклиналь / Anticline</text>
 <text x="885" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#166534">Синклиналь / Syncline</text>
 <g fill="none" stroke-width="13" stroke-linecap="round">
  <path d="M115 300 Q315 125 515 300" stroke="#2563eb"/>
  <path d="M115 325 Q315 165 515 325" stroke="#0f766e"/>
  <path d="M115 350 Q315 205 515 350" stroke="#ca8a04"/>
  <path d="M685 205 Q885 365 1085 205" stroke="#2563eb"/>
  <path d="M685 180 Q885 340 1085 180" stroke="#0f766e"/>
  <path d="M685 155 Q885 315 1085 155" stroke="#ca8a04"/>
 </g>
 <text x="315" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">Слои выгнуты вверх / Layers arch upward</text>
 <text x="885" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">Слои прогнуты вниз / Layers bend downward</text>
</g>
<!-- Normal fault -->
<g>
 <rect x="45" y="445" width="350" height="335" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
 <text x="220" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#9a3412">Сброс / Normal fault</text>
 <path d="M85 565 L160 565 L205 725 L85 725 Z" fill="#d6b38a" stroke="#92400e" stroke-width="3"/>
 <path d="M160 565 L355 600 L310 760 L205 725 Z" fill="#d6b38a" stroke="#92400e" stroke-width="3"/>
 <path d="M85 610 L192 610 L147 770 M85 655 L180 655 L135 770" fill="none" stroke="#2563eb" stroke-width="7"/>
 <path d="M205 610 L342 642 M192 655 L330 687" fill="none" stroke="#2563eb" stroke-width="7"/>
 <path d="M160 565 L205 725" stroke="#7c2d12" stroke-width="7"/>
 <path d="M120 535 L120 585 M105 570 L120 585 L135 570" fill="none" stroke="#dc2626" stroke-width="5"/>
 <path d="M290 585 L290 645 M275 630 L290 645 L305 630" fill="none" stroke="#dc2626" stroke-width="5"/>
 <text x="110" y="520" font-family="Arial,sans-serif" font-size="16" fill="#334155">Лежачее крыло</text>
 <text x="110" y="539" font-family="Arial,sans-serif" font-size="14" fill="#334155">Footwall</text>
 <text x="245" y="520" font-family="Arial,sans-serif" font-size="16" fill="#334155">Висячее крыло</text>
 <text x="245" y="539" font-family="Arial,sans-serif" font-size="14" fill="#334155">Hanging wall</text>
 <text x="220" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12">Висячее крыло опускается / Hanging wall moves down</text>
</g>
<!-- Reverse fault -->
<g>
 <rect x="425" y="445" width="350" height="335" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
 <text x="600" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#991b1b">Взброс / Reverse fault</text>
 <path d="M465 565 L540 565 L585 725 L465 725 Z" fill="#d6b38a" stroke="#92400e" stroke-width="3"/>
 <path d="M540 565 L735 530 L690 690 L585 725 Z" fill="#d6b38a" stroke="#92400e" stroke-width="3"/>
 <path d="M465 610 L572 610 L527 770 M465 655 L560 655 L515 770" fill="none" stroke="#2563eb" stroke-width="7"/>
 <path d="M585 610 L722 578 M572 655 L710 623" fill="none" stroke="#2563eb" stroke-width="7"/>
 <path d="M540 565 L585 725" stroke="#7c2d12" stroke-width="7"/>
 <path d="M500 590 L500 530 M485 545 L500 530 L515 545" fill="none" stroke="#dc2626" stroke-width="5"/>
 <path d="M675 650 L675 590 M660 605 L675 590 L690 605" fill="none" stroke="#dc2626" stroke-width="5"/>
 <text x="490" y="520" font-family="Arial,sans-serif" font-size="15" fill="#334155">Footwall</text>
 <text x="630" y="520" font-family="Arial,sans-serif" font-size="15" fill="#334155">Hanging wall</text>
 <text x="600" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12">Висячее крыло поднимается / Hanging wall moves up</text>
</g>
<!-- Strike-slip -->
<g>
 <rect x="805" y="445" width="350" height="335" rx="18" fill="#f0fdfa" stroke="#99f6e4" stroke-width="3"/>
 <text x="980" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#115e59">Сдвиг / Strike-slip fault</text>
 <text x="980" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Вид сверху / Plan view</text>
 <rect x="850" y="545" width="260" height="180" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="3"/>
 <path d="M980 545 L980 725" stroke="#7c2d12" stroke-width="8" stroke-dasharray="13 8"/>
 <path d="M915 600 L970 600 M955 585 L970 600 L955 615" fill="none" stroke="#dc2626" stroke-width="6"/>
 <path d="M1045 670 L990 670 M1005 655 L990 670 L1005 685" fill="none" stroke="#dc2626" stroke-width="6"/>
 <text x="915" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">Блок / Block</text>
 <text x="1045" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">Блок / Block</text>
 <text x="980" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#115e59">Горизонтальное смещение / Horizontal motion</text>
</g>
<text x="600" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Схемы условны и не в масштабе; геометрия зависит от ориентации сечения и направления взгляда. / Conceptual, not to scale; geometry depends on section orientation and viewing direction.</text>
</svg>