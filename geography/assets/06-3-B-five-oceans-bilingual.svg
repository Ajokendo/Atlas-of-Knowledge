<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Пять океанов / The five oceans</title><desc id="d">Обобщённая учебная карта мира с условными контурами материков и подписями пяти океанов. Границы океанов показаны схематично; карта не предназначена для навигации.</desc><rect width="1200" height="680" fill="#dceff7"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#16384c">Пять океанов / The five oceans</text><g fill="#d8d1b5" stroke="#827c68" stroke-width="3"><path d="M90 145 160 105 250 112 315 150 340 210 300 260 265 320 210 300 175 245 120 220Z"/><path d="M285 330 340 355 365 425 345 520 310 590 275 525 265 445Z"/><path d="M475 150 540 115 625 125 660 165 625 205 560 215 510 195Z"/><path d="M540 230 620 220 685 265 690 345 655 430 620 515 575 470 555 385 520 305Z"/><path d="M670 145 770 110 900 125 1010 185 1065 245 1010 300 925 290 865 335 805 295 740 260 680 215Z"/><path d="M900 390 970 375 1035 415 1010 485 950 520 900 475Z"/><path d="M1080 500 1110 490 1130 520 1100 545Z"/></g><g font-family="Arial" font-weight="bold" fill="#164a69" text-anchor="middle"><text x="190" y="390" font-size="28">Тихий / Pacific</text><text x="420" y="290" font-size="25">Атлантический / Atlantic</text><text x="760" y="390" font-size="27">Индийский / Indian</text><text x="600" y="105" font-size="24">Северный Ледовитый / Arctic</text><text x="610" y="610" font-size="27">Южный / Southern</text></g><path d="M45 555 Q600 525 1155 555" fill="none" stroke="#2c789a" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="17" fill="#294b5d">Условная учебная схема, не в масштабе / Generalized teaching map, not to scale</text></svg>