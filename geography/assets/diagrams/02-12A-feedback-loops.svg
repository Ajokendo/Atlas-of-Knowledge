<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Positive and negative feedback / Положительная и отрицательная обратная связь</title><desc id="d">Positive feedback amplifies an initial change; negative feedback counteracts it. / Положительная обратная связь усиливает исходное изменение; отрицательная противодействует ему.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Feedback in natural systems / Обратные связи в природных системах</text><rect x="100" y="150" width="600" height="620" rx="28" fill="#fff0ee" stroke="#c65a4b" stroke-width="4"/><rect x="800" y="150" width="600" height="620" rx="28" fill="#edf5ee" stroke="#56874b" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><text x="400" y="215" font-size="34" font-weight="700" fill="#8b2e28">Positive feedback / Положительная</text><text x="1100" y="215" font-size="34" font-weight="700" fill="#386432">Negative feedback / Отрицательная</text><rect x="220" y="290" width="360" height="90" rx="18" fill="#f5d5d2"/><text x="400" y="345" font-size="25" fill="#8b2e28">Warming / Потепление</text><rect x="220" y="470" width="360" height="90" rx="18" fill="#f5d5d2"/><text x="400" y="525" font-size="25" fill="#8b2e28">Less snow and ice / Меньше снега и льда</text><rect x="220" y="650" width="360" height="80" rx="18" fill="#f5d5d2"/><text x="400" y="700" font-size="23" fill="#8b2e28">Lower albedo, more absorption / Ниже альбедо, больше поглощение</text><path d="M400 380V455 M400 560V635 M580 690Q650 690 650 500Q650 300 590 330" stroke="#c65a4b" stroke-width="7" fill="none"/><path d="M385 440l15 25 15-25z M385 620l15 25 15-25z M570 315l25 15-25 15z" fill="#c65a4b"/><rect x="920" y="290" width="360" height="90" rx="18" fill="#d9eadf"/><text x="1100" y="345" font-size="25" fill="#386432">More prey / Больше добычи</text><rect x="920" y="470" width="360" height="90" rx="18" fill="#d9eadf"/><text x="1100" y="525" font-size="25" fill="#386432">More predators / Больше хищников</text><rect x="920" y="650" width="360" height="80" rx="18" fill="#d9eadf"/><text x="1100" y="700" font-size="23" fill="#386432">Prey fall; predators may later decline / Добычи меньше; хищники могут сокращаться</text><path d="M1100 380V455 M1100 560V635 M1280 690Q1350 690 1350 500Q1350 300 1290 330" stroke="#56874b" stroke-width="7" fill="none"/><path d="M1085 440l15 25 15-25z M1085 620l15 25 15-25z M1270 315l25 15-25 15z" fill="#56874b"/></g><text x="750" y="835" text-anchor="middle" font-family="Arial" font-size="23" fill="#38566f">“Positive” and “negative” describe the direction of the response, not good or bad / «Положительная» и «отрицательная» описывают направление эффекта, а не оценку</text></svg>