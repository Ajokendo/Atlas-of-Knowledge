<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Сценарии численности населения (концептуальная схема) / Population scenarios (conceptual schematic)</title><desc id="desc">Три траектории от базового года; значения не показаны. / Three trajectories from the baseline year; values are not shown.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Сценарии численности населения (концептуальная схема)</text><text x="40" y="74" class="sub" style="fill:#526579">Population scenarios (conceptual schematic)</text><line x1="120" y1="620" x2="1280" y2="620" stroke="#44586b" stroke-width="2"/><line x1="120" y1="140" x2="120" y2="620" stroke="#44586b" stroke-width="2"/><circle cx="260" cy="450" r="9" fill="#243447"/><text x="280" y="440" class="lab" text-anchor="start" >2026: 7,404 млн (НСК)</text><text x="280" y="462" class="sm" text-anchor="start" style="fill:#526579">2026: 7.404 million (NSC)</text><path d="M260 450 C600 384 900 250 1200 230" fill="none" stroke="#c0392b" stroke-width="5"/><text x="1215" y="236" class="lab" text-anchor="start" style="fill:#c0392b">высокий сценарий</text><text x="1215" y="256" class="sm" text-anchor="start" >high scenario</text><path d="M260 450 C600 414 900 350 1200 330" fill="none" stroke="#2e86ab" stroke-width="5"/><text x="1215" y="336" class="lab" text-anchor="start" style="fill:#2e86ab">базовый сценарий</text><text x="1215" y="356" class="sm" text-anchor="start" >base scenario</text><path d="M260 450 C600 441 900 440 1200 420" fill="none" stroke="#27ae60" stroke-width="5"/><text x="1215" y="426" class="lab" text-anchor="start" style="fill:#27ae60">низкий сценарий</text><text x="1215" y="446" class="sm" text-anchor="start" >low scenario</text><text x="130" y="130" class="sm" text-anchor="start" >Численность населения (условная шкала) / Population (conventional scale)</text><text x="1100" y="650" class="sm" text-anchor="middle" >время / time</text><text x="40" y="766" class="sm">Концептуальная схема: расходятся траектории из-за допущений о рождаемости, смертности и миграции; реальные прогнозы — с источником и датой.</text><text x="40" y="786" class="sm" style="fill:#526579">Conceptual schematic: trajectories diverge because of assumptions on fertility, mortality and migration; real projections need a source and date.</text></svg>