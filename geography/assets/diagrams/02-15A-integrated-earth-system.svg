<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="t d"><title id="t">Earth as an integrated system / Земля как целостная система</title><desc id="d">Bilingual overview of the atmosphere, hydrosphere, lithosphere, biosphere and cryosphere, linked by water and biogeochemical cycles, energy flows and human influence. / Двуязычная схема атмосферы, гидросферы, литосферы, биосферы и криосферы, связанных круговоротом воды и биогеохимических элементов, потоками энергии и воздействием человека.</desc><rect width="1500" height="1000" fill="#f7fafc"/><text x="750" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#17324d">Earth as an Integrated System / Земля как целостная система</text><text x="750" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#38566f">Interacting spheres, matter cycles, energy flows and human influence / Взаимодействующие оболочки, круговороты вещества, потоки энергии и влияние человека</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="520" y="155" width="460" height="110" rx="22" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="750" y="200" font-size="32" font-weight="700" fill="#174e78">Atmosphere / Атмосфера</text><text x="750" y="238" font-size="22" fill="#17324d">Air, weather, climate / Воздух, погода, климат</text><rect x="70" y="365" width="390" height="125" rx="22" fill="#d9eef0" stroke="#278c96" stroke-width="4"/><text x="265" y="412" font-size="30" font-weight="700" fill="#17656d">Hydrosphere / Гидросфера</text><text x="265" y="452" font-size="21" fill="#17324d">Oceans, rivers, groundwater / Океаны, реки, подземные воды</text><rect x="555" y="365" width="390" height="125" rx="22" fill="#f3e9d9" stroke="#a66b35" stroke-width="4"/><text x="750" y="412" font-size="30" font-weight="700" fill="#805024">Lithosphere / Литосфера</text><text x="750" y="452" font-size="21" fill="#17324d">Crust and rigid upper mantle / Кора и жёсткая верхняя мантия</text><rect x="1040" y="365" width="390" height="125" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="1235" y="412" font-size="30" font-weight="700" fill="#386432">Biosphere / Биосфера</text><text x="1235" y="452" font-size="21" fill="#17324d">Living organisms / Живые организмы</text><rect x="520" y="585" width="460" height="105" rx="22" fill="#e8e4f4" stroke="#7766a8" stroke-width="4"/><text x="750" y="628" font-size="30" font-weight="700" fill="#514477">Cryosphere / Криосфера</text><text x="750" y="665" font-size="21" fill="#30294a">Glaciers, snow, permafrost / Ледники, снег, мерзлота</text><rect x="85" y="780" width="400" height="115" rx="20" fill="#fff0e6" stroke="#c47a3b" stroke-width="4"/><text x="285" y="825" font-size="27" font-weight="700" fill="#8a4b20">Matter cycles /</text><text x="285" y="862" font-size="25" fill="#8a4b20">Круговороты вещества</text><rect x="550" y="780" width="400" height="115" rx="20" fill="#fff8d9" stroke="#b28a28" stroke-width="4"/><text x="750" y="825" font-size="27" font-weight="700" fill="#7a5c16">Energy flows /</text><text x="750" y="862" font-size="25" fill="#7a5c16">Потоки энергии</text><rect x="1015" y="780" width="400" height="115" rx="20" fill="#f7e5e5" stroke="#b65d5d" stroke-width="4"/><text x="1215" y="825" font-size="27" font-weight="700" fill="#8b3e3e">Human influence /</text><text x="1215" y="862" font-size="25" fill="#8b3e3e">Воздействие человека</text></g><g stroke="#52697c" stroke-width="6" fill="none" stroke-linecap="round"><path d="M650 265L350 355 M850 265L1150 355 M460 425H545 M955 425H1030 M750 490V575 M350 490L250 770 M750 690V770 M1150 490L1250 770"/></g><g fill="#52697c"><path d="M345 340l5 25 25-15z"/><path d="M1130 340l25 15 5-25z"/><path d="M530 415l15 10-15 10z"/><path d="M1015 415l15 10-15 10z"/><path d="M740 560l10 15 10-15z"/></g><text x="750" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#38566f">Schematic model: boundaries overlap; arrows show examples, not measured quantities / Схема: оболочки перекрываются; стрелки показывают примеры связей, а не измеренные величины</text></svg>