<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="t d"><title id="t">Многовременное выявление изменений / Multitemporal change detection</title><desc id="d">Две спутниковые сцены разных дат проходят радиометрическую подготовку и точную геометрическую регистрацию. После применения согласованной классификации или индексов создаётся карта изменений, которую проверяют по независимым эталонным данным. Сезонность, облака, тени и различия сенсоров могут создавать ложные изменения. / Two satellite scenes from different dates undergo radiometric preparation and precise geometric co-registration. A change map is created using consistent classification or indices and checked against independent reference data. Seasonality, clouds, shadows and sensor differences can create false change.</desc><style>.h{font:700 29px Arial;fill:#17324d}.th{font:700 19px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.sm{font:14px Arial;fill:#526879}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}.a{stroke:#397a8d;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397a8d"/></marker></defs><rect width="1300" height="720" fill="white"/><text x="650" y="48" text-anchor="middle" class="h">Выявление изменений по снимкам разных дат / Change detection across dates</text><g transform="translate(40 100)"><rect width="270" height="170" rx="12" class="p"/><text x="135" y="35" text-anchor="middle" class="th">Дата 1 / Date 1</text><rect x="25" y="55" width="220" height="85" fill="#d9e9ed"/><path d="M25 110L80 65L135 120L180 70L245 125" stroke="#638b58" stroke-width="18" fill="none"/><text x="135" y="158" text-anchor="middle" class="sm">Сцена A / Scene A</text></g><g transform="translate(40 360)"><rect width="270" height="170" rx="12" class="p"/><text x="135" y="35" text-anchor="middle" class="th">Дата 2 / Date 2</text><rect x="25" y="55" width="220" height="85" fill="#d9e9ed"/><path d="M25 110L80 65L135 120L180 70L245 125" stroke="#638b58" stroke-width="18" fill="none"/><path d="M120 95L160 55L200 90" stroke="#b66a3c" stroke-width="20" fill="none"/><text x="135" y="158" text-anchor="middle" class="sm">Сцена B / Scene B</text></g><g><rect x="390" y="195" width="220" height="115" rx="12" class="p"/><text x="500" y="230" text-anchor="middle" class="th">Подготовка / Prepare</text><text x="500" y="260" text-anchor="middle" class="s">Облака, атмосферные</text><text x="500" y="284" text-anchor="middle" class="s">поправки / QA</text><rect x="690" y="195" width="220" height="115" rx="12" class="p"/><text x="800" y="230" text-anchor="middle" class="th">Регистрация / Register</text><text x="800" y="260" text-anchor="middle" class="s">Совпадающие пиксели</text><text x="800" y="284" text-anchor="middle" class="s">/ Co-registration</text><rect x="990" y="195" width="260" height="115" rx="12" class="p"/><text x="1120" y="230" text-anchor="middle" class="th">Анализ / Analyse</text><text x="1120" y="260" text-anchor="middle" class="s">Индексы или классы</text><text x="1120" y="284" text-anchor="middle" class="s">/ Indices or classes</text><path d="M310 185H380 M310 445H350V310H380 M610 252H680 M910 252H980" class="a" marker-end="url(#a)"/></g><rect x="990" y="400" width="260" height="105" rx="12" fill="#e7f1eb" stroke="#638b58" stroke-width="2"/><text x="1120" y="438" text-anchor="middle" class="th">Карта изменений</text><text x="1120" y="468" text-anchor="middle" class="s">Change map</text><path d="M1120 310V390" class="a" marker-end="url(#a)"/><rect x="690" y="400" width="220" height="105" rx="12" fill="#fff7ed" stroke="#b66a3c" stroke-width="2"/><text x="800" y="438" text-anchor="middle" class="th">Проверка</text><text x="800" y="468" text-anchor="middle" class="s">Validation</text><path d="M990 452H920" class="a" marker-end="url(#a)"/><text x="650" y="575" text-anchor="middle" class="s">Сопоставляйте один сезон, разрешение и сенсор; проверяйте независимыми эталонными данными.</text><text x="650" y="602" text-anchor="middle" class="s">Match season, resolution and sensor; validate with independent reference data.</text><text x="650" y="650" text-anchor="middle" class="sm">Сезонность, облака, тени и геометрические сдвиги могут имитировать изменения. / Seasonality, clouds, shadows and misregistration can mimic change.</text></svg>