<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Shelford's ecological tolerance curve / Кривая экологической толерантности Шелфорда</title>
<desc id="desc">Conceptual bell-shaped response curve. Outside the lower and upper tolerance limits are zones of intolerance; between each limit and the optimum are zones of pessimum or physiological stress; the central optimum range is most favourable. Axes show biological performance and environmental-factor intensity. No numerical scale is implied. / Концептуальная колоколообразная кривая реакции. За нижним и верхним пределами толерантности находятся зоны непереносимости; между каждым пределом и оптимумом — зоны пессимума или физиологического стресса; центральная область оптимума наиболее благоприятна. Оси показывают жизненную активность и интенсивность экологического фактора. Числовой шкалы нет.</desc>
<rect width="1500" height="900" fill="#f8fafc"/>
<text x="750" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17324d">Shelford's law of tolerance / Закон толерантности Шелфорда</text>
<rect x="190" y="185" width="190" height="465" fill="#f5e4e1"/>
<rect x="380" y="185" width="210" height="465" fill="#f6edda"/>
<rect x="590" y="185" width="320" height="465" fill="#dceee4"/>
<rect x="910" y="185" width="210" height="465" fill="#f6edda"/>
<rect x="1120" y="185" width="190" height="465" fill="#f5e4e1"/>
<g stroke="#9aa9b5" stroke-width="3" stroke-dasharray="10 10">
<path d="M380 185V650"/><path d="M590 185V650"/><path d="M910 185V650"/><path d="M1120 185V650"/>
</g>
