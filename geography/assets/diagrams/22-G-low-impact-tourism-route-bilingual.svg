<text x="680" y="200" text-anchor="middle" class="t">Чувствительная зона / Sensitive habitat</text><text x="680" y="238" text-anchor="middle" class="s">Закрыта для прохода / No entry</text><path d="M680 305 L680 390" stroke="#a46f68" stroke-width="4" stroke-dasharray="10 8"/>
<rect x="65" y="150" width="330" height="150" rx="18" fill="#e4eff6" stroke="#64869b" stroke-width="3"/><text x="230" y="195" text-anchor="middle" class="t">Инструктаж / Briefing</text><text x="230" y="235" text-anchor="middle" class="s">Правила, вода, погода, безопасность</text><text x="230" y="265" text-anchor="middle" class="s">Rules, water, weather, safety</text>
