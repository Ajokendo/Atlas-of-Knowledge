<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Устойчивый маршрут в природной территории / Low-impact route in a protected area</title><desc id="desc">Концептуальная схема управления посетителями; не реальная тропа или карта ООПТ. / Conceptual visitor-management diagram; not a real trail or protected-area map.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Устойчивый маршрут в природной территории / Low-impact route in a protected area</text><text x="50" y="88" class="sub">Концептуальная схема управления посетителями; не реальная тропа или карта ООПТ. / Conceptual visitor-management diagram; not a real trail or protected-area map.</text>
<path d="M80 550 Q230 420 370 470 T650 430 T930 470 T1300 360" stroke="#8b9c7d" stroke-width="24" fill="none" stroke-linecap="round"/>
