<circle cx="430" cy="455" r="24" fill="#e6efdf" stroke="#6c8a63" stroke-width="4"/><text x="430" y="405" text-anchor="middle" class="s">Остановка / Rest point</text>
<circle cx="890" cy="465" r="24" fill="#f4ecd9" stroke="#a48b56" stroke-width="4"/><text x="890" y="415" text-anchor="middle" class="s">Сбор отходов / Waste collection</text>
<circle cx="1290" cy="365" r="28" fill="#e6efdf" stroke="#6c8a63" stroke-width="4"/><text x="1290" y="320" text-anchor="middle" class="s">Выход / Exit</text>
