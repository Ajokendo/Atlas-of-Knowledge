<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Основные типы тематических карт / Main types of thematic maps</title><desc id="d">Пять схематичных типов тематических карт и подходящие данные: картограмма для относительных показателей по территориям, пропорциональные символы для абсолютных величин, точечная карта для пространственного распределения счётных объектов, изолинии для непрерывных полей, карта потоков для перемещений и связей. Все геометрии условны. / Five schematic thematic-map types and suitable data: choropleth for normalized values by area, proportional symbols for absolute quantities, dot density for spatial distribution of counts, isolines for continuous surfaces, and flow maps for movements and connections. All geometries are conceptual.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:16px Arial;fill:#526879}.p{fill:#f3f7f9;stroke:#7893a1;stroke-width:2}.c1{fill:#dbe9f0;stroke:#66899b;stroke-width:2}.c2{fill:#9fc5d7;stroke:#66899b;stroke-width:2}.c3{fill:#5d92ad;stroke:#66899b;stroke-width:2}.dot{fill:#b75e46}.flow{stroke:#b77a4d;stroke-width:5;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#b77a4d"/></marker></defs><rect width="1400" height="900" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="h">Тип тематической карты зависит от данных / Choose map type to match the data</text><g transform="translate(35 115)"><rect width="640" height="215" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Картограмма / Choropleth</text><text x="320" y="62" text-anchor="middle" class="s">Относительные показатели по площадям</text><text x="320" y="85" text-anchor="middle" class="s">Normalized rates by area</text><g transform="translate(165 10)"><path d="M40 90 L115 70 L150 130 L100 185 L35 160Z" class="c1"/><path d="M150 130 L220 100 L260 165 L205 220 L100 185Z" class="c2"/><path d="M115 70 L200 45 L220 100 L150 130Z" class="c3"/></g></g><g transform="translate(715 115)"><rect width="640" height="215" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Пропорциональные символы / Proportional symbols</text><text x="320" y="62" text-anchor="middle" class="s">Абсолютные значения и объёмы</text><text x="320" y="85" text-anchor="middle" class="s">Absolute totals and quantities</text><g transform="translate(165 10)"><circle cx="85" cy="140" r="20" class="dot"/><circle cx="160" cy="140" r="40" class="dot"/><circle cx="245" cy="140" r="60" class="dot"/></g></g><g transform="translate(35 360)"><rect width="640" height="215" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Точечная карта / Dot density</text><text x="320" y="62" text-anchor="middle" class="s">Счётные объекты и их распределение</text><text x="320" y="85" text-anchor="middle" class="s">Counts and their distribution</text><g transform="translate(165 10)"><circle cx="40" cy="80" r="5" class="dot"/><circle cx="77" cy="133" r="5" class="dot"/><circle cx="114" cy="186" r="5" class="dot"/><circle cx="151" cy="89" r="5" class="dot"/><circle cx="188" cy="142" r="5" class="dot"/><circle cx="225" cy="195" r="5" class="dot"/><circle cx="42" cy="98" r="5" class="dot"/><circle cx="79" cy="151" r="5" class="dot"/><circle cx="116" cy="204" r="5" class="dot"/><circle cx="153" cy="107" r="5" class="dot"/><circle cx="190" cy="160" r="5" class="dot"/><circle cx="227" cy="213" r="5" class="dot"/><circle cx="44" cy="116" r="5" class="dot"/><circle cx="81" cy="169" r="5" class="dot"/><circle cx="118" cy="222" r="5" class="dot"/><circle cx="155" cy="125" r="5" class="dot"/><circle cx="192" cy="178" r="5" class="dot"/><circle cx="229" cy="81" r="5" class="dot"/><circle cx="46" cy="134" r="5" class="dot"/><circle cx="83" cy="187" r="5" class="dot"/><circle cx="120" cy="90" r="5" class="dot"/><circle cx="157" cy="143" r="5" class="dot"/><circle cx="194" cy="196" r="5" class="dot"/><circle cx="231" cy="99" r="5" class="dot"/><circle cx="48" cy="152" r="5" class="dot"/><circle cx="85" cy="205" r="5" class="dot"/><circle cx="122" cy="108" r="5" class="dot"/><circle cx="159" cy="161" r="5" class="dot"/><circle cx="196" cy="214" r="5" class="dot"/><circle cx="233" cy="117" r="5" class="dot"/><circle cx="50" cy="170" r="5" class="dot"/><circle cx="87" cy="223" r="5" class="dot"/><circle cx="124" cy="126" r="5" class="dot"/><circle cx="161" cy="179" r="5" class="dot"/><circle cx="198" cy="82" r="5" class="dot"/><circle cx="235" cy="135" r="5" class="dot"/><circle cx="52" cy="188" r="5" class="dot"/><circle cx="89" cy="91" r="5" class="dot"/><circle cx="126" cy="144" r="5" class="dot"/><circle cx="163" cy="197" r="5" class="dot"/><circle cx="200" cy="100" r="5" class="dot"/><circle cx="237" cy="153" r="5" class="dot"/><circle cx="54" cy="206" r="5" class="dot"/><circle cx="91" cy="109" r="5" class="dot"/><circle cx="128" cy="162" r="5" class="dot"/></g></g><g transform="translate(715 360)"><rect width="640" height="215" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Изолинии / Isolines</text><text x="320" y="62" text-anchor="middle" class="s">Непрерывные поля: температура, давление</text><text x="320" y="85" text-anchor="middle" class="s">Continuous fields: temperature, pressure</text><g transform="translate(165 10)"><path d="M35 190 Q80 60 145 110 T260 80 M35 220 Q95 100 150 150 T265 125 M35 245 Q100 150 165 190 T265 170" stroke="#4a90b4" stroke-width="4" fill="none"/></g></g><g transform="translate(35 605)"><rect width="640" height="215" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Карта потоков / Flow map</text><text x="320" y="62" text-anchor="middle" class="s">Перемещения, связи и направления</text><text x="320" y="85" text-anchor="middle" class="s">Movement, connections and direction</text><g transform="translate(165 10)"><path d="M35 200 Q100 90 150 140 T260 85" class="flow"/><path d="M40 95 Q115 160 260 215" class="flow"/><path d="M45 145 Q140 140 250 145" class="flow"/></g></g><text x="700" y="870" text-anchor="middle" class="s">Для картограммы обычно используют относительные показатели; абсолютные итоги чаще показывают символами. Выбор зависит от задачи и масштаба.</text><text x="700" y="895" text-anchor="middle" class="s">Choropleths usually use normalized values; absolute totals are often shown with symbols. Choice depends on purpose and scale.</text></svg>