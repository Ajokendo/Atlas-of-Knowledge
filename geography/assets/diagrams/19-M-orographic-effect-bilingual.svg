<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" role="img" aria-labelledby="t"><title id="t">Орографический эффект / The orographic effect</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="725" fill="#fbfcfe"/><text x="30" y="46" class="h">Орографический эффект</text><text x="30" y="76" class="sub">The orographic effect</text><path d="M40 460L380 460L560 180L760 460L960 460V500H40Z" fill="#c9b79a" stroke="#6b5a45" stroke-width="3"/><path d="M500 260L560 180L620 260Z" fill="#fff" stroke="#9aa9b6"/><path d="M60 400C250 400 360 330 470 235" stroke="#2e86c1" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M600 205C700 230 800 290 920 330" stroke="#c0392b" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/><ellipse cx="330" cy="250" rx="55" ry="26" fill="#e9eef3" stroke="#9aa9b6"/><ellipse cx="400" cy="236" rx="55" ry="26" fill="#e9eef3" stroke="#9aa9b6"/><ellipse cx="470" cy="222" rx="55" ry="26" fill="#e9eef3" stroke="#9aa9b6"/><path d="M420 290l-6 22" stroke="#2e86c1" stroke-width="3"/><path d="M442 286l-6 22" stroke="#2e86c1" stroke-width="3"/><path d="M464 282l-6 22" stroke="#2e86c1" stroke-width="3"/><path d="M486 278l-6 22" stroke="#2e86c1" stroke-width="3"/><path d="M508 274l-6 22" stroke="#2e86c1" stroke-width="3"/><path d="M530 270l-6 22" stroke="#2e86c1" stroke-width="3"/><text x="60" y="140" class="r" text-anchor="start">Наветренный склон</text><text x="60" y="164" class="e" text-anchor="start">Windward slope</text><text x="560" y="140" class="r" text-anchor="start">Подветренный склон</text><text x="560" y="164" class="e" text-anchor="start">Leeward slope</text><text x="60" y="545" class="r2" text-anchor="start">Воздух поднимается, остывает, образуются облака и осадки</text><text x="60" y="564" class="e2" text-anchor="start">Air rises, cools; clouds and precipitation form</text><text x="60" y="600" class="r2" text-anchor="start">Воздух опускается, нагревается — сухо («дождевая тень»)</text><text x="60" y="619" class="e2" text-anchor="start">Air sinks and warms — dry («rain shadow»)</text><text x="30" y="687" class="sm">Схема.</text><text x="30" y="709" class="sm" style="fill:#526579">A schematic.</text></svg>