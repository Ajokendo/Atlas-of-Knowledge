<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Four interacting Earth spheres / Четыре взаимодействующие оболочки Земли</title><desc id="d">Atmosphere, hydrosphere, lithosphere and biosphere exchange matter and energy. / Атмосфера, гидросфера, литосфера и биосфера обмениваются веществом и энергией.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">Four interacting Earth spheres / Четыре взаимодействующие оболочки Земли</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="170" width="550" height="220" rx="26" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="395" y="245" font-size="38" font-weight="700" fill="#174e78">Atmosphere / Атмосфера</text><text x="395" y="300" font-size="25" fill="#17324d">Air, winds, clouds, precipitation</text><text x="395" y="340" font-size="25" fill="#17324d">Воздух, ветры, облака, осадки</text><rect x="830" y="170" width="550" height="220" rx="26" fill="#d9eef0" stroke="#278c96" stroke-width="4"/><text x="1105" y="245" font-size="38" font-weight="700" fill="#17656d">Hydrosphere / Гидросфера</text><text x="1105" y="300" font-size="25" fill="#17324d">Oceans, rivers, groundwater, ice</text><text x="1105" y="340" font-size="25" fill="#17324d">Океаны, реки, подземные воды, лёд</text><rect x="120" y="510" width="550" height="220" rx="26" fill="#f1e4d2" stroke="#a66b35" stroke-width="4"/><text x="395" y="585" font-size="38" font-weight="700" fill="#805024">Lithosphere / Литосфера</text><text x="395" y="640" font-size="25" fill="#17324d">Rocks, crust, rigid upper mantle</text><text x="395" y="680" font-size="25" fill="#17324d">Породы, кора, жёсткая верхняя мантия</text><rect x="830" y="510" width="550" height="220" rx="26" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="1105" y="585" font-size="38" font-weight="700" fill="#386432">Biosphere / Биосфера</text><text x="1105" y="640" font-size="25" fill="#17324d">Living organisms and habitats</text><text x="1105" y="680" font-size="25" fill="#17324d">Живые организмы и среды обитания</text></g><g fill="none" stroke="#52697c" stroke-width="8" stroke-linecap="round"><path d="M680 280H820 M750 390V500 M680 620H820 M395 400V500 M1105 400V500"/></g><g fill="#52697c"><path d="M805 265l25 15-25 15z"/><path d="M735 485l15 25 15-25z"/><path d="M805 605l25 15-25 15z"/><path d="M380 485l15 25 15-25z"/><path d="M1090 485l15 25 15-25z"/></g><rect x="460" y="770" width="580" height="72" rx="36" fill="#17324d"/><text x="750" y="816" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">Matter + energy exchange / Обмен веществом и энергией</text></svg>