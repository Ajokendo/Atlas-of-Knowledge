<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Global carbon cycle / Глобальный круговорот углерода</title><desc id="d">Bilingual conceptual diagram of carbon reservoirs and exchanges among atmosphere, land biosphere, soils, ocean and geological stores, including human emissions. / Двуязычная концептуальная схема резервуаров и обмена углеродом между атмосферой, наземной биосферой, почвами, океаном и геологическими запасами, включая выбросы человека.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">The Global Carbon Cycle / Глобальный круговорот углерода</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="535" y="115" width="430" height="125" rx="22" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="750" y="165" font-size="31" font-weight="700" fill="#174e78">Atmosphere / Атмосфера</text><text x="750" y="205" font-size="22" fill="#17324d">CO₂ and other carbon gases / CO₂ и другие газы</text><rect x="80" y="390" width="390" height="150" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="275" y="445" font-size="30" font-weight="700" fill="#386432">Land biosphere / Биосфера суши</text><text x="275" y="485" font-size="22" fill="#17324d">Plants and organisms / Растения и организмы</text><text x="275" y="515" font-size="20" fill="#17324d">Photosynthesis / Фотосинтез</text><rect x="555" y="390" width="390" height="150" rx="22" fill="#f3e9d9" stroke="#a66b35" stroke-width="4"/><text x="750" y="445" font-size="30" font-weight="700" fill="#805024">Soils / Почвы</text><text x="750" y="485" font-size="22" fill="#17324d">Organic matter / Органическое вещество</text><text x="750" y="515" font-size="20" fill="#17324d">Decomposition / Разложение</text><rect x="1030" y="390" width="390" height="150" rx="22" fill="#d9eef0" stroke="#278c96" stroke-width="4"/><text x="1225" y="445" font-size="30" font-weight="700" fill="#17656d">Ocean / Океан</text><text x="1225" y="485" font-size="22" fill="#17324d">Dissolved carbon / Растворённый углерод</text><text x="1225" y="515" font-size="20" fill="#17324d">Air–sea exchange / Газообмен</text><rect x="410" y="690" width="680" height="125" rx="22" fill="#e8e4f4" stroke="#7766a8" stroke-width="4"/><text x="750" y="740" font-size="30" font-weight="700" fill="#514477">Geological stores / Геологические запасы</text><text x="750" y="780" font-size="22" fill="#30294a">Carbonate rocks, sediments and fossil carbon / Карбонатные породы, осадки и ископаемый углерод</text></g><g fill="none" stroke="#52697c" stroke-width="7" stroke-linecap="round"><path d="M610 240L340 380"/><path d="M890 240L1160 380"/><path d="M275 390Q260 300 610 240"/><path d="M750 390V250"/><path d="M1225 390Q1250 300 890 240"/><path d="M470 465H545"/><path d="M950 465H1020"/><path d="M750 540V680"/><path d="M420 690Q330 620 275 545"/><path d="M1080 690Q1180 620 1225 545"/></g><g fill="#52697c"><path d="M335 365l5 30 25-20z"/><path d="M1140 365l25 20 5-30z"/><path d="M600 235l20 15-25 10z"/><path d="M740 270l10-20 10 20z"/><path d="M540 450l5 15-5 15z"/><path d="M1010 450l10 15-10 15z"/><path d="M740 670l10 20 10-20z"/></g><rect x="85" y="590" width="300" height="75" rx="16" fill="#fff0e6" stroke="#c47a3b" stroke-width="3"/><text x="235" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8a4b20">Human activities /</text><text x="235" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#8a4b20">Деятельность человека</text><path d="M385 625Q510 580 600 540" fill="none" stroke="#c47a3b" stroke-width="7"/><path d="M580 535l25 0-15 23z" fill="#c47a3b"/><text x="750" y="860" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#38566f">Conceptual reservoirs and pathways; arrow widths do not represent measured fluxes / Концептуальные резервуары и пути обмена; толщина стрелок не показывает измеренные потоки</text></svg>