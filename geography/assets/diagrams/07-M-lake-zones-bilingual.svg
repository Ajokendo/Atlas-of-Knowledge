<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 719" role="img" aria-labelledby="t"><title id="t">Зоны озера / Zones of a lake</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="719" fill="#fbfcfe"/><text x="30" y="46" class="h">Зоны озера</text><text x="30" y="76" class="sub">Zones of a lake</text><path d="M60 190H940V400Q940 470 700 480Q500 500 300 480Q60 470 60 400Z" fill="#cfe5f3" stroke="#5d9bc4" stroke-width="3"/><path d="M60 190L200 150H800L940 190" fill="none"/><path d="M60 190Q60 410 60 400Q150 460 300 480" fill="none"/><rect x="60" y="190" width="880" height="18" fill="#a9d1ea"/><path d="M60 190C80 330 160 430 300 478" stroke="#243447" stroke-dasharray="6 6" fill="none"/><path d="M940 190C920 330 840 430 700 480" stroke="#243447" stroke-dasharray="6 6" fill="none"/><text x="90" y="170" class="r2" text-anchor="start">Прибрежная зона</text><text x="90" y="189" class="e2" text-anchor="start">Littoral zone</text><text x="380" y="260" class="r2" text-anchor="start">Открытая вода (свет)</text><text x="380" y="279" class="e2" text-anchor="start">Open water (light)</text><text x="420" y="420" class="r2" text-anchor="start">Глубинная зона</text><text x="420" y="439" class="e2" text-anchor="start">Profundal zone</text><text x="740" y="170" class="r2" text-anchor="start">Прибрежная зона</text><text x="740" y="189" class="e2" text-anchor="start">Littoral zone</text><text x="40" y="540" class="r2" text-anchor="start">Растения и больше всего жизни — у берега и на мелководье; в</text><text x="40" y="564" class="r2" text-anchor="start">тёмной глубине живут бактерии и донные животные.</text><text x="40" y="586" class="e2" text-anchor="start">Plants and most life are near the shore and in shallows; the dark depths hold</text><text x="40" y="605" class="e2" text-anchor="start">bacteria and bottom animals.</text><text x="30" y="681" class="sm">Схема.</text><text x="30" y="703" class="sm" style="fill:#526579">A schematic.</text></svg>