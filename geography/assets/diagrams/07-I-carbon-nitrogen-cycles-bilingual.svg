<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">Циклы углерода и азота / Carbon and nitrogen cycles</title><desc id="d">Двуязычная концептуальная схема. Углерод: CO2, фотосинтез, растения, дыхание, почвы, разложение, океан и захоронение. Азот: N2, фиксация, аммоний, нитрат, усвоение, органический азот, аммонификация и денитрификация. Стрелки показывают процессы, не количественные потоки. Bilingual conceptual diagram of carbon and nitrogen processes; arrows show pathways, not measured fluxes.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#29465a" stroke-width="1.2"/></marker></defs><rect width="1100" height="650" fill="#f8fafc"/><text x="550" y="40" text-anchor="middle" font-size="26" font-weight="bold">ЦИКЛЫ УГЛЕРОДА И АЗОТА / CARBON AND NITROGEN CYCLES</text><rect x="25" y="70" width="510" height="520" rx="15" fill="#eff7f1" stroke="#8ab59a" stroke-width="2"/><rect x="565" y="70" width="510" height="520" rx="15" fill="#eff5fb" stroke="#91adca" stroke-width="2"/><text x="280" y="110" text-anchor="middle" font-size="23" font-weight="bold">УГЛЕРОД / CARBON</text><text x="820" y="110" text-anchor="middle" font-size="23" font-weight="bold">АЗОТ / NITROGEN</text><g font-size="17" text-anchor="middle" fill="#18394d"><rect x="160" y="140" width="240" height="55" rx="9" fill="#d9ecdf" stroke="#669477"/><text x="280" y="174">Атмосферный CO₂ / Atmospheric CO₂</text><rect x="55" y="280" width="190" height="60" rx="9" fill="#d9ecdf" stroke="#669477"/><text x="150" y="305">Растения</text><text x="150" y="328">Plants</text><rect x="315" y="280" width="190" height="60" rx="9" fill="#e9e2cf" stroke="#9c8c68"/><text x="410" y="305">Почвы и детрит</text><text x="410" y="328">Soils and detritus</text><rect x="55" y="425" width="190" height="60" rx="9" fill="#d7eaf3" stroke="#699bb5"/><text x="150" y="460">Океан / Ocean</text><rect x="315" y="425" width="190" height="60" rx="9" fill="#e9e2cf" stroke="#9c8c68"/><text x="410" y="450">Геологические</text><text x="410" y="473">запасы / Stores</text></g><g stroke="#355d49" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M235 195L165 275"/><path d="M350 195L400 275"/><path d="M245 310L310 310"/><path d="M150 340L150 420"/><path d="M410 340L410 420"/><path d="M315 455L250 455"/></g><g font-size="14" fill="#244c3a"><text x="55" y="230">Фотосинтез / Photosynthesis</text><text x="360" y="230">Поглощение / Uptake</text><text x="245" y="295">Питание / Feeding</text><text x="160" y="390">Газообмен / Exchange</text><text x="420" y="390">Разложение / Decomposition</text><text x="280" y="510">Захоронение / Burial</text></g><g font-size="17" text-anchor="middle" fill="#18394d"><rect x="700" y="140" width="240" height="55" rx="9" fill="#dce9f6" stroke="#6c8eb3"/><text x="820" y="174">Атмосферный N₂ / Atmospheric N₂</text><rect x="590" y="280" width="190" height="60" rx="9" fill="#dce9f6" stroke="#6c8eb3"/><text x="685" y="305">Аммоний NH₄⁺</text><text x="685" y="328">Ammonium</text><rect x="850" y="280" width="190" height="60" rx="9" fill="#dce9f6" stroke="#6c8eb3"/><text x="945" y="305">Нитрат NO₃⁻</text><text x="945" y="328">Nitrate</text><rect x="590" y="425" width="190" height="60" rx="9" fill="#d9ecdf" stroke="#669477"/><text x="685" y="460">Растения / Plants</text><rect x="850" y="425" width="190" height="60" rx="9" fill="#e9e2cf" stroke="#9c8c68"/><text x="945" y="450">Органический азот</text><text x="945" y="473">Organic nitrogen</text></g><g stroke="#355d82" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M760 195L700 275"/><path d="M880 195L940 275"/><path d="M780 310L845 310"/><path d="M945 340L945 420"/><path d="M850 455L785 455"/><path d="M685 420L685 345"/><path d="M850 440L780 345"/><path d="M945 280C1010 220 950 165 940 165"/></g><g font-size="14" fill="#244c75"><text x="585" y="230">Фиксация / Fixation</text><text x="930" y="230">Молнии / Lightning</text><text x="785" y="295">Нитрификация / Nitrification</text><text x="955" y="390">Ассимиляция / Assimilation</text><text x="590" y="390">Аммонификация / Ammonification</text><text x="825" y="510">Денитрификация: NO₃⁻ → N₂ / Denitrification</text></g><text x="550" y="625" text-anchor="middle" font-size="16">Схемы показывают процессы, а не величины запасов или скоростей потоков. / Processes only; no reservoir sizes or flux rates are quantified.</text></svg>