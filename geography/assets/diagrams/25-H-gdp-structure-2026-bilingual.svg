<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Структура ВВП: доли и темпы роста раздельно / GDP structure: shares and growth shown separately</title><desc id="desc">Предварительная оценка НСК за январь–сентябрь 2026 года. / NSC preliminary estimate for January–September 2026.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Структура ВВП: доли и темпы роста раздельно</text><text x="40" y="74" class="sub" style="fill:#526579">GDP structure: shares and growth shown separately</text><text x="60" y="125" class="lab" text-anchor="start" >Доля в ВВП, % / Share of GDP</text><text x="800" y="125" class="lab" text-anchor="start" >Реальный прирост к янв.–сент. 2025, % / Real growth</text><text x="60" y="182" class="t" text-anchor="start" >Услуги</text><text x="60" y="206" class="s" text-anchor="start" style="fill:#526579">Services</text><rect x="430" y="160" width="300" height="34" fill="#2e86ab"/><text x="738" y="185" class="lab" text-anchor="start" >48,7 %</text><rect x="1000" y="160" width="29" height="34" fill="#c0392b"/><text x="1037" y="185" class="lab" text-anchor="start" >+6,1 %</text><text x="60" y="282" class="t" text-anchor="start" >Промышленность</text><text x="60" y="306" class="s" text-anchor="start" style="fill:#526579">Industry</text><rect x="430" y="260" width="113" height="34" fill="#2e86ab"/><text x="551" y="285" class="lab" text-anchor="start" >18,4 %</text><rect x="1000" y="260" width="34" height="34" fill="#c0392b"/><text x="1042" y="285" class="lab" text-anchor="start" >+7,1 %</text><text x="60" y="382" class="t" text-anchor="start" >Чистые налоги на продукты</text><text x="60" y="406" class="s" text-anchor="start" style="fill:#526579">Net taxes on products</text><rect x="430" y="360" width="95" height="34" fill="#2e86ab"/><text x="533" y="385" class="lab" text-anchor="start" >15,4 %</text><rect x="1000" y="360" width="52" height="34" fill="#c0392b"/><text x="1060" y="385" class="lab" text-anchor="start" >+10,8 %</text><text x="60" y="482" class="t" text-anchor="start" >Строительство</text><text x="60" y="506" class="s" text-anchor="start" style="fill:#526579">Construction</text><rect x="430" y="460" width="56" height="34" fill="#2e86ab"/><text x="494" y="485" class="lab" text-anchor="start" >9,1 %</text><rect x="1000" y="460" width="300" height="34" fill="#c0392b"/><text x="1308" y="485" class="lab" text-anchor="start" >+62,2 %</text><text x="60" y="582" class="t" text-anchor="start" >Сельское и лесное хозяйство, рыболовство</text><text x="60" y="606" class="s" text-anchor="start" style="fill:#526579">Agriculture, forestry, fishing</text><rect x="430" y="560" width="52" height="34" fill="#2e86ab"/><text x="490" y="585" class="lab" text-anchor="start" >8,4 %</text><rect x="1000" y="560" width="31" height="34" fill="#c0392b"/><text x="1039" y="585" class="lab" text-anchor="start" >+6,5 %</text><text x="60" y="690" class="s" text-anchor="start" >Строительство даёт 9,1 % ВВП, но растёт быстрее всех (+62,2 %): малая доля не мешает высокому темпу.</text><text x="60" y="714" class="s" text-anchor="start" style="fill:#526579">Construction is 9.1% of GDP but grows fastest (+62.2%): a small share can still show a high growth rate.</text><text x="40" y="766" class="sm">Источник: НСК, предварительная оценка за январь–сентябрь 2026 (таблица главы 25); данные предварительные, доли округлены.</text><text x="40" y="786" class="sm" style="fill:#526579">Source: NSC preliminary estimate for January–September 2026 (Chapter 25 table); data are preliminary, shares rounded.</text></svg>