<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t"><title id="t">Как устроен ледник / How a glacier works</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="660" fill="#fbfcfe"/><text x="30" y="46" class="h">Как устроен ледник</text><text x="30" y="76" class="sub">How a glacier works</text><path d="M40 380L120 150L420 230L760 340L940 420V470H40Z" fill="#c9b79a"/><path d="M120 150L420 230L760 340L880 400L780 410L420 300L130 210Z" fill="#f3f8fc" stroke="#9fc3dd" stroke-width="3"/><path d="M120 150L420 230" stroke="none"/><path d="M420 232L430 300" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/><text x="440" y="268" class="r2" style="fill:#c0392b">Линия равновесия</text><text x="440" y="288" class="e2">Equilibrium line (ELA)</text><path d="M880 400Q900 400 940 420" stroke="#2e86c1" stroke-width="5" fill="none"/><path d="M780 410Q800 380 830 400" stroke="#6b5a45" stroke-width="8" fill="none"/><text x="150" y="130" class="r" text-anchor="start">Область питания</text><text x="150" y="154" class="e" text-anchor="start">Accumulation zone</text><text x="560" y="395" class="r2" text-anchor="start">Область абляции (таяния)</text><text x="560" y="414" class="e2" text-anchor="start">Ablation zone</text><text x="640" y="520" class="r2" text-anchor="start">Талая вода → река</text><text x="640" y="539" class="e2" text-anchor="start">Meltwater → river</text><text x="40" y="520" class="r2" text-anchor="start">Снег прибавляется выше линии равновесия и тает ниже неё</text><text x="40" y="539" class="e2" text-anchor="start">Snow gains above the equilibrium line and melts below it</text><text x="700" y="440" class="r2" text-anchor="start">Морена</text><text x="700" y="459" class="e2" text-anchor="start">Moraine</text><text x="30" y="622" class="sm">Схема.</text><text x="30" y="644" class="sm" style="fill:#526579">A schematic.</text></svg>