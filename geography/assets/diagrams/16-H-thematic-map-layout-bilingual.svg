<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Макет тематической карты / Thematic map layout</title><desc id="d">Учебный макет показывает заголовок, вымышленные районы, легенду с единицами, дату и источник. Территория не геопривязана, поэтому масштаб и CRS неприменимы. / Teaching layout shows a title, fictional districts, legend with units, date and source. The area is not georeferenced, so scale and CRS are not applicable.</desc><style>.h{font:700 28px Arial;fill:#17324d}.th{font:700 20px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}</style><rect width="1200" height="700" fill="white"/><text x="600" y="45" text-anchor="middle" class="h">Пример оформления тематической карты / Thematic map layout</text><rect x="35" y="75" width="1130" height="575" rx="12" fill="white" stroke="#7893a1" stroke-width="2"/><text x="70" y="120" class="th">Условная плотность населения / Illustrative population density</text><text x="70" y="150" class="s">Учебный пример · вымышленные районы · 2025 / Teaching example · fictional districts · 2025</text><g transform="translate(70 185)"><rect width="650" height="350" fill="#f7fafb" stroke="#b8c8cf"/><path d="M65 45L235 20 320 90 285 180 130 190 55 125Z" fill="#d9e9ed" stroke="white" stroke-width="4"/><path d="M235 20L450 35 530 140 425 205 285 180 320 90Z" fill="#8eb9c5" stroke="white" stroke-width="4"/><path d="M55 125L130 190 285 180 310 290 165 325 40 250Z" fill="#b2cfd6" stroke="white" stroke-width="4"/><path d="M285 180L425 205 530 140 615 235 545 320 310 290Z" fill="#397a8d" stroke="white" stroke-width="4"/><text x="150" y="110" class="s">Район A / District A</text><text x="375" y="115" class="s">Район B / District B</text><text x="125" y="260" class="s">Район C / District C</text><text x="430" y="265" fill="white" class="s">Район D / District D</text></g><g transform="translate(770 190)"><rect width="350" height="345" rx="10" class="p"/><text x="22" y="38" class="th">Легенда / Legend</text><rect x="25" y="65" width="34" height="25" fill="#d9e9ed"/><text x="75" y="84" class="s">Низкая / Low</text><rect x="25" y="105" width="34" height="25" fill="#b2cfd6"/><text x="75" y="124" class="s">Умеренная / Moderate</text><rect x="25" y="145" width="34" height="25" fill="#8eb9c5"/><text x="75" y="164" class="s">Повышенная / High</text><rect x="25" y="185" width="34" height="25" fill="#397a8d"/><text x="75" y="204" class="s">Очень высокая / Very high</text><text x="22" y="255" class="s">Единица: чел./км² / Unit: people/km²</text><text x="22" y="285" class="s">Классы условные / Illustrative classes</text><text x="22" y="320" class="s">Не реальные данные / Not real data</text></g><text x="70" y="575" class="s">Источник: учебный макет / Source: teaching mock-up · Дата: 05.11.2026 / Date: 5 Nov 2026</text><text x="70" y="610" class="s">Проекция и CRS: не применяются — схема не геопривязана / Projection and CRS: not applicable — schematic is not georeferenced</text><text x="770" y="610" class="s">Масштабная линейка: не применяется / Scale bar: not applicable</text></svg>