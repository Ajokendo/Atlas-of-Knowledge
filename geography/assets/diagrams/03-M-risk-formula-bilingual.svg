<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 754" role="img" aria-labelledby="t"><title id="t">Из чего складывается риск / What risk is made of</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="754" fill="#fbfcfe"/><text x="30" y="46" class="h">Из чего складывается риск</text><text x="30" y="76" class="sub">What risk is made of</text><rect x="40" y="130" width="270" height="120" rx="14" fill="#f4d9cf" stroke="#647789" stroke-width="2"/><text x="60" y="170" class="r" text-anchor="start">Опасность</text><text x="60" y="194" class="e" text-anchor="start">Hazard</text><text x="60" y="225" class="e2">землетрясение, сель, паводок</text><rect x="365" y="130" width="270" height="120" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="385" y="170" class="r" text-anchor="start">Уязвимость</text><text x="385" y="194" class="e" text-anchor="start">Vulnerability</text><text x="385" y="225" class="e2">дома, дороги, подготовка людей</text><rect x="690" y="130" width="270" height="120" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="710" y="170" class="r" text-anchor="start">Экспозиция</text><text x="710" y="194" class="e" text-anchor="start">Exposure</text><text x="710" y="225" class="e2">кто и что оказалось в зоне</text><text x="337" y="205" class="h" text-anchor="middle">×</text><text x="662" y="205" class="h" text-anchor="middle">×</text><path d="M500 255L500 310" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="280" y="315" width="440" height="100" rx="14" fill="#f2c1b5" stroke="#c0392b" stroke-width="2"/><text x="500" y="358" class="r" text-anchor="middle">РИСК = возможные потери</text><text x="500" y="382" class="e" text-anchor="middle">RISK = possible losses</text><text x="40" y="470" class="r2" text-anchor="start">Стихия сама по себе — ещё не бедствие. Бедствие возникает там,</text><text x="40" y="494" class="r2" text-anchor="start">где опасность встречает людей и постройки.</text><text x="40" y="516" class="e2" text-anchor="start">A natural hazard is not yet a disaster. A disaster occurs where a hazard</text><text x="40" y="535" class="e2" text-anchor="start">meets people and buildings.</text><text x="40" y="575" class="r2" text-anchor="start">Снизить риск можно, уменьшив уязвимость и экспозицию:</text><text x="40" y="599" class="r2" text-anchor="start">сейсмостойкое строительство, карты селей, раннее оповещение.</text><text x="40" y="621" class="e2" text-anchor="start">Risk falls when vulnerability and exposure fall: seismic-resistant building,</text><text x="40" y="640" class="e2" text-anchor="start">mudflow maps, early warning.</text><text x="30" y="716" class="sm">Схема.</text><text x="30" y="738" class="sm" style="fill:#526579">A schematic.</text></svg>