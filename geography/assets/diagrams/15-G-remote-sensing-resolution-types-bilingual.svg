<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Четыре типа разрешения данных ДЗЗ / Four types of remote-sensing resolution</title><desc id="d">Схема сравнивает пространственное разрешение (размер пикселя), спектральное (ширина и число полос), радиометрическое (чувствительность к различиям яркости) и временное (частота повторных наблюдений). Это независимые характеристики сенсора и системы наблюдений; улучшение одной не гарантирует улучшение остальных. / Diagram compares spatial resolution (pixel size), spectral resolution (band width and number), radiometric resolution (sensitivity to brightness differences) and temporal resolution (repeat-observation frequency). These are distinct sensor and observing-system properties; improving one does not guarantee improvement in the others.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.p{fill:#f3f7f9;stroke:#7893a1;stroke-width:2}.g{fill:#d8e8ef;stroke:#4c829c;stroke-width:1.5}.bar{fill:#6a9cbb}</style><rect width="1400" height="820" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Четыре типа разрешения / Four types of resolution</text><g transform="translate(40 115)"><rect width="640" height="290" rx="14" class="p"/><text x="320" y="42" text-anchor="middle" class="t">Пространственное / Spatial</text><text x="320" y="75" text-anchor="middle" class="s">Размер пикселя и различимость мелких объектов</text><text x="320" y="98" text-anchor="middle" class="s">Pixel size and ability to distinguish small features</text><g><rect x="45" y="190" width="65" height="65" class="g"/><rect x="120" y="190" width="65" height="65" class="g"/><rect x="195" y="190" width="65" height="65" class="g"/><rect x="270" y="190" width="65" height="65" class="g"/><rect x="365" y="180" width="34" height="34" class="g"/><rect x="407" y="180" width="34" height="34" class="g"/><rect x="449" y="180" width="34" height="34" class="g"/><rect x="491" y="180" width="34" height="34" class="g"/><rect x="365" y="222" width="34" height="34" class="g"/><rect x="407" y="222" width="34" height="34" class="g"/><rect x="449" y="222" width="34" height="34" class="g"/><rect x="491" y="222" width="34" height="34" class="g"/></g><text x="200" y="285" text-anchor="middle" class="s">Крупный пиксель / Coarse</text><text x="430" y="285" text-anchor="middle" class="s">Мелкий пиксель / Fine</text></g><g transform="translate(720 115)"><rect width="640" height="290" rx="14" class="p"/><text x="320" y="42" text-anchor="middle" class="t">Спектральное / Spectral</text><text x="320" y="75" text-anchor="middle" class="s">Число и ширина спектральных полос</text><text x="320" y="98" text-anchor="middle" class="s">Number and width of spectral bands</text><g><rect x="55" y="185" width="28" height="85" class="bar"/><rect x="140" y="185" width="65" height="85" class="bar"/><rect x="225" y="185" width="28" height="85" class="bar"/><rect x="310" y="185" width="65" height="85" class="bar"/><rect x="395" y="185" width="28" height="85" class="bar"/></g><text x="255" y="285" text-anchor="middle" class="s">Широкие полосы / Broad bands</text><text x="490" y="285" text-anchor="middle" class="s">Узкие полосы / Narrow bands</text></g><g transform="translate(40 445)"><rect width="640" height="290" rx="14" class="p"/><text x="320" y="42" text-anchor="middle" class="t">Радиометрическое / Radiometric</text><text x="320" y="75" text-anchor="middle" class="s">Чувствительность к небольшим различиям сигнала</text><text x="320" y="98" text-anchor="middle" class="s">Sensitivity to small signal differences</text><g><rect x="55" y="185" width="38" height="35" fill="rgb(100,130,180)"/><rect x="98" y="185" width="38" height="39" fill="rgb(109,137,174)"/><rect x="141" y="185" width="38" height="43" fill="rgb(118,144,168)"/><rect x="184" y="185" width="38" height="47" fill="rgb(127,151,162)"/><rect x="227" y="185" width="38" height="51" fill="rgb(136,158,156)"/><rect x="270" y="185" width="38" height="55" fill="rgb(145,165,150)"/><rect x="313" y="185" width="38" height="59" fill="rgb(154,172,144)"/><rect x="356" y="185" width="38" height="63" fill="rgb(163,179,138)"/><rect x="399" y="185" width="38" height="67" fill="rgb(172,186,132)"/><rect x="442" y="185" width="38" height="71" fill="rgb(181,193,126)"/><rect x="485" y="185" width="38" height="75" fill="rgb(190,200,120)"/><rect x="528" y="185" width="38" height="79" fill="rgb(199,207,114)"/></g><text x="300" y="285" text-anchor="middle" class="s">Меньше уровней / Fewer levels → больше / more levels</text></g><g transform="translate(720 445)"><rect width="640" height="290" rx="14" class="p"/><text x="320" y="42" text-anchor="middle" class="t">Временное / Temporal</text><text x="320" y="75" text-anchor="middle" class="s">Как часто повторяется наблюдение территории</text><text x="320" y="98" text-anchor="middle" class="s">How often the area is observed again</text><g><rect x="70" y="190" width="58" height="85" class="bar"/><rect x="165" y="190" width="58" height="48" class="bar"/><rect x="260" y="190" width="58" height="85" class="bar"/><rect x="355" y="190" width="58" height="48" class="bar"/><rect x="450" y="190" width="58" height="85" class="bar"/></g><text x="300" y="285" text-anchor="middle" class="s">Редкие / Less frequent → частые / more frequent</text></g><rect x="70" y="790" width="1260" height="28" rx="10" fill="#f7f3e8" stroke="#b49a61" stroke-width="2"/><text x="700" y="811" text-anchor="middle" class="s">Высокое пространственное разрешение не означает автоматически высокое спектральное, радиометрическое или временное разрешение.</text></svg>