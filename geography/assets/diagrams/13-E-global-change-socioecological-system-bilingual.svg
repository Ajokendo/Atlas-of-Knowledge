<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Глобальные изменения как социально-экологическая система / Global change as a social-ecological system</title><desc id="d">Концептуальная система из шести взаимосвязанных элементов по рамке IPBES: природа, вклад природы в жизнь людей, антропогенные активы, институты и косвенные драйверы, прямые драйверы изменений, качество жизни. Стрелки показывают двусторонние связи и обратную связь; схема упрощает сложную систему. / Six interlinked elements from the IPBES conceptual framework: nature, nature's contributions to people, anthropogenic assets, institutions and indirect drivers, direct drivers of change, and quality of life. Arrows show two-way links and feedback; the diagram simplifies a complex system.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.n{fill:#edf4e9;stroke:#6e9270;stroke-width:3}.p{fill:#edf4f7;stroke:#66899b;stroke-width:3}.o{fill:#f8f1e5;stroke:#b49a61;stroke-width:3}.a{stroke:#526f80;stroke-width:4;fill:none;marker-end:url(#ar)}.d{stroke:#6e9270;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#gr)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#526f80"/></marker><marker id="gr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#6e9270"/></marker></defs><rect width="1400" height="820" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="h">Глобальные изменения: природа и общество / Global change: nature and society</text><g transform="translate(60 140)"><rect width="390" height="180" rx="18" class="n"/><text x="195" y="48" text-anchor="middle" class="t">Природа</text><text x="195" y="82" text-anchor="middle" class="s">Nature</text><text x="195" y="130" text-anchor="middle" class="s">Экосистемы • виды</text><text x="195" y="155" text-anchor="middle" class="s">процессы</text></g><g transform="translate(505 140)"><rect width="390" height="180" rx="18" class="p"/><text x="195" y="48" text-anchor="middle" class="t">Вклад природы в жизнь людей</text><text x="195" y="82" text-anchor="middle" class="s">Nature’s contributions</text><text x="195" y="130" text-anchor="middle" class="s">Пища • вода</text><text x="195" y="155" text-anchor="middle" class="s">защита • культура</text></g><g transform="translate(950 140)"><rect width="390" height="180" rx="18" class="o"/><text x="195" y="48" text-anchor="middle" class="t">Качество жизни</text><text x="195" y="82" text-anchor="middle" class="s">Good quality of life</text><text x="195" y="130" text-anchor="middle" class="s">Здоровье • безопасность</text><text x="195" y="155" text-anchor="middle" class="s">благополучие</text></g><g transform="translate(60 500)"><rect width="390" height="180" rx="18" class="p"/><text x="195" y="48" text-anchor="middle" class="t">Антропогенные активы</text><text x="195" y="82" text-anchor="middle" class="s">Anthropogenic assets</text><text x="195" y="130" text-anchor="middle" class="s">Технологии • инфраструктура</text><text x="195" y="155" text-anchor="middle" class="s">знания</text></g><g transform="translate(505 500)"><rect width="390" height="180" rx="18" class="p"/><text x="195" y="48" text-anchor="middle" class="t">Институты и косвенные драйверы</text><text x="195" y="82" text-anchor="middle" class="s">Institutions & indirect drivers</text><text x="195" y="130" text-anchor="middle" class="s">Правила • экономика</text><text x="195" y="155" text-anchor="middle" class="s">ценности</text></g><g transform="translate(950 500)"><rect width="390" height="180" rx="18" class="p"/><text x="195" y="48" text-anchor="middle" class="t">Прямые драйверы изменений</text><text x="195" y="82" text-anchor="middle" class="s">Direct drivers</text><text x="195" y="130" text-anchor="middle" class="s">Землепользование • климат</text><text x="195" y="155" text-anchor="middle" class="s">загрязнение</text></g><path d="M450 230 H505 M895 230 H950" class="a"/><path d="M255 320 V500 M700 320 V500 M1145 320 V500" class="a"/><path d="M450 590 H505 M895 590 H950" class="a"/><path d="M1145 680 C1145 765 255 765 255 680" class="d"/><text x="700" y="785" text-anchor="middle" class="s">Система действует на разных масштабах и включает обратные связи; это аналитическая рамка, а не линейная причинная цепочка. / The system operates across scales and includes feedbacks; this is an analytical framework, not a linear causal chain.</text></svg>