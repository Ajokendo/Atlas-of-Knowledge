<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Экологическая связность местообитаний / Habitat connectivity</title><desc id="desc">Схематический ландшафт с основными местообитаниями, буферными зонами, экологическим коридором, дорогой как барьером, фрагментированными участками и матрицей ландшафта. Пунктирная стрелка показывает гипотетическое перемещение животных, а не наблюдённый маршрут. Conceptual landscape with core habitats, buffers, corridor, road barrier, fragmented patches and landscape matrix. Dashed arrow is hypothetical, not an observed route.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#294c3c"/></marker></defs><rect width="1100" height="650" fill="#f8fafc"/><text x="550" y="38" text-anchor="middle" font-size="26" font-weight="bold">ЭКОЛОГИЧЕСКАЯ СВЯЗНОСТЬ / HABITAT CONNECTIVITY</text><rect x="40" y="85" width="1020" height="450" rx="18" fill="#e8ead8" stroke="#a7ae8d" stroke-width="2"/><text x="550" y="570" text-anchor="middle" font-size="16">Матрица ландшафта / Landscape matrix — окружающая территория с разными типами землепользования</text><path d="M75 150Q160 85 260 135T400 140L450 250Q340 310 260 280T90 300Z" fill="#b6d0a1" stroke="#658b5b" stroke-width="3" stroke-dasharray="8 6"/><path d="M700 120Q850 85 1015 170L1000 320Q875 360 760 300Z" fill="#b6d0a1" stroke="#658b5b" stroke-width="3" stroke-dasharray="8 6"/><path d="M95 170Q180 115 300 165L365 230Q290 285 180 260L100 270Z" fill="#397a4c" stroke="#245c39" stroke-width="4"/><path d="M750 155Q860 115 980 190L960 285Q850 325 770 275Z" fill="#397a4c" stroke="#245c39" stroke-width="4"/><path d="M365 230C470 170 600 165 750 220L735 280C590 245 490 255 365 300Z" fill="#8dbb76" stroke="#4e874e" stroke-width="4"/><path d="M500 90L550 90L620 535L570 535Z" fill="#777b80" stroke="#4b5054" stroke-width="3"/><path d="M510 95L580 530" stroke="#f4e7a5" stroke-width="5" stroke-dasharray="18 14"/><g fill="#4d8d5a" stroke="#2c653b" stroke-width="3"><ellipse cx="390" cy="410" rx="65" ry="38"/><ellipse cx="710" cy="420" rx="45" ry="30"/><ellipse cx="875" cy="390" rx="35" ry="23"/></g><g fill="none" stroke="#294c3c" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arr)"><path d="M260 220C360 170 420 210 485 235S640 255 790 220"/></g><g font-size="18" font-weight="bold" fill="#17384a"><text x="205" y="205" text-anchor="middle">Ядро местообитания A</text><text x="205" y="228" text-anchor="middle" font-size="15">Core habitat A</text><text x="870" y="205" text-anchor="middle">Ядро местообитания B</text><text x="870" y="228" text-anchor="middle" font-size="15">Core habitat B</text><text x="550" y="160" text-anchor="middle">Дорога — барьер</text><text x="550" y="183" text-anchor="middle" font-size="15">Road barrier</text><text x="560" y="315" text-anchor="middle">Коридор / Corridor</text><text x="540" y="470" text-anchor="middle">Фрагменты / Fragments</text></g><g font-size="15" fill="#17384a"><text x="70" y="115">Буферная зона / Buffer zone</text><text x="775" y="350">Разрозненные участки</text><text x="775" y="370">Isolated patches</text><text x="75" y="510">Пунктир — возможное перемещение / Dashed line — potential movement</text></g><rect x="60" y="590" width="980" height="40" rx="8" fill="#eef3ee" stroke="#c5d2c7"/><text x="550" y="615" text-anchor="middle" font-size="15">Элементы и маршрут условны; схема не показывает существующую сеть или реальное перемещение вида. / Elements and route are illustrative, not an existing mapped network or observed species movement.</text></svg>