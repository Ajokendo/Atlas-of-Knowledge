<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Три сценария до 2050 года (качественно) / Three scenarios to 2050 (qualitative)</title><desc id="desc">Как меры влияют на климат, воду, земли, воздух и жизнь. / How measures affect climate, water, land, air and quality of life.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Три сценария до 2050 года (качественно)</text><text x="40" y="74" class="sub" style="fill:#526579">Three scenarios to 2050 (qualitative)</text><text x="380" y="140" class="lab" text-anchor="middle" >Климат</text><text x="380" y="160" class="sm" text-anchor="middle" style="fill:#526579">Climate</text><text x="535" y="140" class="lab" text-anchor="middle" >Вода</text><text x="535" y="160" class="sm" text-anchor="middle" style="fill:#526579">Water</text><text x="690" y="140" class="lab" text-anchor="middle" >Земли</text><text x="690" y="160" class="sm" text-anchor="middle" style="fill:#526579">Land</text><text x="845" y="140" class="lab" text-anchor="middle" >Биоразнообразие</text><text x="845" y="160" class="sm" text-anchor="middle" style="fill:#526579">Biodiversity</text><text x="1000" y="140" class="lab" text-anchor="middle" >Воздух</text><text x="1000" y="160" class="sm" text-anchor="middle" style="fill:#526579">Air</text><text x="1155" y="140" class="lab" text-anchor="middle" >Качество жизни</text><text x="1155" y="160" class="sm" text-anchor="middle" style="fill:#526579">Quality of life</text><rect x="40" y="165" width="260" height="100" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="60" y="202" class="t" text-anchor="start" >Без дополнительных мер</text><text x="60" y="226" class="s" text-anchor="start" >No additional measures</text><text x="380" y="228" font-size="52" text-anchor="middle" style="fill:#c0392b">↓</text><text x="535" y="228" font-size="52" text-anchor="middle" style="fill:#c0392b">↓</text><text x="690" y="228" font-size="52" text-anchor="middle" style="fill:#c0392b">↓</text><text x="845" y="228" font-size="52" text-anchor="middle" style="fill:#c0392b">↓</text><text x="1000" y="228" font-size="52" text-anchor="middle" style="fill:#c0392b">↓</text><text x="1155" y="228" font-size="52" text-anchor="middle" style="fill:#c0392b">↓</text><rect x="40" y="295" width="260" height="100" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="60" y="332" class="t" text-anchor="start" >Частичные меры</text><text x="60" y="356" class="s" text-anchor="start" >Partial measures</text><text x="380" y="358" font-size="52" text-anchor="middle" style="fill:#e67e22">→</text><text x="535" y="358" font-size="52" text-anchor="middle" style="fill:#e67e22">→</text><text x="690" y="358" font-size="52" text-anchor="middle" style="fill:#e67e22">↓</text><text x="845" y="358" font-size="52" text-anchor="middle" style="fill:#e67e22">→</text><text x="1000" y="358" font-size="52" text-anchor="middle" style="fill:#e67e22">→</text><text x="1155" y="358" font-size="52" text-anchor="middle" style="fill:#e67e22">→</text><rect x="40" y="425" width="260" height="100" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="60" y="462" class="t" text-anchor="start" >Согласованные меры</text><text x="60" y="486" class="s" text-anchor="start" >Coordinated measures</text><text x="380" y="488" font-size="52" text-anchor="middle" style="fill:#27ae60">↑</text><text x="535" y="488" font-size="52" text-anchor="middle" style="fill:#27ae60">↑</text><text x="690" y="488" font-size="52" text-anchor="middle" style="fill:#27ae60">↑</text><text x="845" y="488" font-size="52" text-anchor="middle" style="fill:#27ae60">↑</text><text x="1000" y="488" font-size="52" text-anchor="middle" style="fill:#27ae60">↑</text><text x="1155" y="488" font-size="52" text-anchor="middle" style="fill:#27ae60">↑</text><text x="40" y="640" class="s" text-anchor="start" >Стрелки — качественная иллюстрация направления; числа зависят от допущений, которые нужно назвать.</text><text x="40" y="664" class="s" text-anchor="start" style="fill:#526579">Arrows are a qualitative illustration of direction; numbers depend on assumptions that must be stated.</text><text x="40" y="766" class="sm">Это не прогноз: учебная иллюстрация логики сценариев без чисел.</text><text x="40" y="786" class="sm" style="fill:#526579">Not a forecast: a teaching illustration of scenario logic without numbers.</text></svg>