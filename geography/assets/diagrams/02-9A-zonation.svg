<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Latitudinal and altitudinal zonation / Широтная зональность и высотная поясность</title><desc id="d">Conceptual comparison of latitudinal natural zones and mountain elevation belts. / Концептуальное сравнение природных зон по широте и высотных поясов гор.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Geographical zonation / Географическая зональность</text><text x="400" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">Latitude / Широта</text><text x="1100" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">Altitude / Высота</text><g><rect x="100" y="210" width="600" height="92" fill="#b8dca8"/><rect x="100" y="302" width="600" height="92" fill="#e4d59b"/><rect x="100" y="394" width="600" height="92" fill="#d6b58c"/><rect x="100" y="486" width="600" height="92" fill="#b9c9d7"/><rect x="100" y="578" width="600" height="92" fill="#e7edf2"/><g font-family="Arial" font-size="24" fill="#17324d" text-anchor="middle"><text x="400" y="267">Equatorial forests / Экваториальные леса</text><text x="400" y="359">Savannas and dry tropics / Саванны и сухие тропики</text><text x="400" y="451">Temperate forests and grasslands / Умеренные леса и степи</text><text x="400" y="543">Boreal forest and tundra / Тайга и тундра</text><text x="400" y="635">Polar environments / Полярные области</text></g></g><g><path d="M820 670L1010 250L1170 470L1370 670Z" fill="#d9c19a" stroke="#8a6b45" stroke-width="4"/><path d="M980 315L1010 250L1040 315Z" fill="#fff"/><path d="M820 670L890 515L970 550L1010 430L1090 550L1170 470L1240 565L1370 670Z" fill="#e1eedc"/><path d="M940 485L1010 330L1080 485Z" fill="#b8dca8"/><path d="M980 385L1010 315L1040 385Z" fill="#e7edf2"/><g font-family="Arial" font-size="22" fill="#17324d"><text x="1210" y="715">Foothills / Предгорья</text><text x="1110" y="570">Forest / Лес</text><text x="950" y="465">Alpine meadows / Альпийские луга</text><text x="1010" y="290">Nival zone / Нивальный пояс</text></g></g><text x="750" y="790" text-anchor="middle" font-family="Arial" font-size="22" fill="#52697c">Schematic patterns; boundaries vary with climate, relief and exposure / Схемы условны; границы зависят от климата, рельефа и экспозиции</text></svg>