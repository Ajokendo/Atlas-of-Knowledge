<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Давление — эффект — ответ управления / Pressure — ecological effect — management response</title><desc id="desc">Обобщённая причинно-управленческая схема; не оценка конкретного участка. / General causal-management framework; not an assessment of a specific site.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Давление — эффект — ответ управления / Pressure — ecological effect — management response</text><text x="50" y="88" class="sub">Обобщённая причинно-управленческая схема; не оценка конкретного участка. / General causal-management framework; not an assessment of a specific site.</text>
<rect x="55" y="155" width="390" height="485" fill="#f5e7e3" class="box"/><text x="73" y="190" class="t">Давление / Pressure</text><text x="73" y="225" class="s">Перевыпас / Overgrazing</text><text x="73" y="252" class="s">Браконьерство / Poaching</text><text x="73" y="279" class="s">Пожары / Wildfire</text><text x="73" y="306" class="s">Фрагментация / Fragmentation</text><text x="73" y="333" class="s">Изменение климата / Climate change</text>
<rect x="505" y="155" width="390" height="485" fill="#f4ecd9" class="box"/><text x="523" y="190" class="t">Экологический эффект / Ecological effect</text><text x="523" y="225" class="s">Потеря растительного покрова</text><text x="523" y="252" class="s">Vegetation-cover loss</text><text x="523" y="279" class="s">Снижение численности видов</text><text x="523" y="306" class="s">Population decline</text><text x="523" y="333" class="s">Эрозия и нарушение почв</text><text x="523" y="360" class="s">Erosion and soil disturbance</text><text x="523" y="387" class="s">Разрыв связности местообитаний</text><text x="523" y="414" class="s">Habitat connectivity loss</text><text x="523" y="441" class="s">Водный стресс / Water stress</text>
<rect x="955" y="155" width="390" height="485" fill="#e5efe3" class="box"/><text x="973" y="190" class="t">Ответ управления / Management response</text><text x="973" y="225" class="s">Ротация и контроль пастбищ</text><text x="973" y="252" class="s">Pasture rotation and monitoring</text><text x="973" y="279" class="s">Охрана и правоприменение</text><text x="973" y="306" class="s">Protection and enforcement</text><text x="973" y="333" class="s">Профилактика и контроль пожаров</text><text x="973" y="360" class="s">Fire prevention and control</text><text x="973" y="387" class="s">Восстановление коридоров</text><text x="973" y="414" class="s">Corridor restoration</text><text x="973" y="441" class="s">Адаптация и мониторинг</text><text x="973" y="468" class="s">Adaptation and monitoring</text>
<path d="M445 395 H505 M895 395 H955" class="arr"/>
<text x="700" y="700" text-anchor="middle" class="s">Меры оценивают по наблюдаемым результатам и корректируют / Evaluate actions using observed outcomes and adapt them</text>
<text x="50" y="770" class="sm">Atlas of Knowledge • Conceptual teaching visual; no site-specific boundaries or measured values are implied. / Учебная концептуальная схема; точные границы и измеренные значения не подразумеваются.</text></svg>