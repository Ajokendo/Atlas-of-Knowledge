<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" role="img" aria-labelledby="t d"><title id="t">Климатические воздействия: наблюдения и риски будущего / Climate impacts: observations and future risks</title><desc id="d">Матрица шести систем с двумя раздельными колонками: уже наблюдаемые воздействия, описанные в оценках IPCC, и риски, которые могут усилиться при дальнейшем потеплении. Примеры качественные; это не локальная оценка Кыргызстана и не количественный прогноз. / Matrix of six systems with separate columns for observed impacts reported in IPCC assessments and risks that may intensify with further warming. Examples are qualitative; this is not a local assessment for Kyrgyzstan or a quantitative forecast.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:16px Arial;fill:#526879}.head{fill:#315d76}.white{font:700 20px Arial;fill:#fff}.obs{fill:#edf4f7;stroke:#66899b;stroke-width:2}.proj{fill:#f8f2e6;stroke:#b49a61;stroke-width:2}.sys{fill:#eaf1e8;stroke:#6e9270;stroke-width:2}</style><rect width="1400" height="880" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Климатические воздействия / Climate impacts</text><rect x="35" y="95" width="1330" height="55" rx="10" class="head"/><text x="65" y="130" class="white">Система / System</text><text x="390" y="130" class="white">Наблюдаемые воздействия / Observed impacts</text><text x="900" y="130" class="white">Возможные будущие риски / Potential future risks</text><g transform="translate(35 170)"><rect width="300" height="90" rx="10" class="sys"/><text x="150" y="52" text-anchor="middle" class="t">Криосфера / Cryosphere</text><rect x="320" width="500" height="90" rx="10" class="obs"/><text x="345" y="38" class="s">Сокращение ледников и снежного покрова в ряде регионов</text><text x="345" y="65" class="s">Glacier and snow-cover loss in many regions</text><rect x="840" width="490" height="90" rx="10" class="proj"/><text x="865" y="38" class="s">Изменение сезонного стока, опасности ледниковых озёр</text><text x="865" y="65" class="s">Seasonal runoff shifts, glacial-lake hazards</text></g><g transform="translate(35 275)"><rect width="300" height="90" rx="10" class="sys"/><text x="150" y="52" text-anchor="middle" class="t">Вода / Water</text><rect x="320" width="500" height="90" rx="10" class="obs"/><text x="345" y="38" class="s">Изменения стока, засухи и экстремальные осадки</text><text x="345" y="65" class="s">Runoff changes, droughts and heavy precipitation</text><rect x="840" width="490" height="90" rx="10" class="proj"/><text x="865" y="38" class="s">Конкуренция за воду, дефицит в сухие сезоны</text><text x="865" y="65" class="s">Water competition, dry-season shortages</text></g><g transform="translate(35 380)"><rect width="300" height="90" rx="10" class="sys"/><text x="150" y="52" text-anchor="middle" class="t">Экосистемы / Ecosystems</text><rect x="320" width="500" height="90" rx="10" class="obs"/><text x="345" y="38" class="s">Сдвиги ареалов и сезонных циклов видов</text><text x="345" y="65" class="s">Species-range and seasonal-cycle shifts</text><rect x="840" width="490" height="90" rx="10" class="proj"/><text x="865" y="38" class="s">Потеря местообитаний, стресс экосистем</text><text x="865" y="65" class="s">Habitat loss, ecosystem stress</text></g><g transform="translate(35 485)"><rect width="300" height="90" rx="10" class="sys"/><text x="150" y="52" text-anchor="middle" class="t">Сельское хозяйство / Agriculture</text><rect x="320" width="500" height="90" rx="10" class="obs"/><text x="345" y="38" class="s">Тепловой стресс и изменения урожайности в отдельных регионах</text><text x="345" y="65" class="s">Heat stress and yield changes in some regions</text><rect x="840" width="490" height="90" rx="10" class="proj"/><text x="865" y="38" class="s">Риски для урожая, пастбищ и продовольствия</text><text x="865" y="65" class="s">Risks to crops, pastures and food security</text></g><g transform="translate(35 590)"><rect width="300" height="90" rx="10" class="sys"/><text x="150" y="52" text-anchor="middle" class="t">Города и инфраструктура / Cities & infrastructure</text><rect x="320" width="500" height="90" rx="10" class="obs"/><text x="345" y="38" class="s">Ущерб от жары, паводков и экстремальных явлений</text><text x="345" y="65" class="s">Heat, flood and extreme-event damage</text><rect x="840" width="490" height="90" rx="10" class="proj"/><text x="865" y="38" class="s">Рост нагрузки на сети, транспорт и жильё</text><text x="865" y="65" class="s">Greater stress on networks, transport and housing</text></g><g transform="translate(35 695)"><rect width="300" height="90" rx="10" class="sys"/><text x="150" y="52" text-anchor="middle" class="t">Здоровье / Health</text><rect x="320" width="500" height="90" rx="10" class="obs"/><text x="345" y="38" class="s">Тепловые воздействия и климаточувствительные болезни</text><text x="345" y="65" class="s">Heat impacts and climate-sensitive diseases</text><rect x="840" width="490" height="90" rx="10" class="proj"/><text x="865" y="38" class="s">Рост рисков для уязвимых групп</text><text x="865" y="65" class="s">Higher risks for vulnerable groups</text></g><rect x="60" y="820" width="1280" height="40" rx="10" fill="#f7f3e8" stroke="#b49a61" stroke-width="2"/><text x="700" y="846" text-anchor="middle" class="s">Наблюдения и прогнозы различаются по региону и уровню уверенности; не все риски проявляются одинаково в каждом месте.</text><text x="700" y="875" text-anchor="middle" class="s">Observations and projections vary by region and confidence; risks do not occur equally in every place.</text></svg>