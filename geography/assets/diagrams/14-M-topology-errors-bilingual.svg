<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 649" role="img" aria-labelledby="t"><title id="t">Топологические ошибки в данных / Topology errors in spatial data</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="649" fill="#fbfcfe"/><text x="30" y="46" class="h">Топологические ошибки в данных</text><text x="30" y="76" class="sub">Topology errors in spatial data</text><rect x="40" y="130" width="220" height="220" rx="14" fill="#fff" stroke="#9aa9b6" stroke-width="2"/><polygon points="60,150 145,150 145,330 60,330" fill="#cfe8d4" stroke="#243447" stroke-width="2"/><polygon points="160,150 240,150 240,330 160,330" fill="#f3e6b0" stroke="#243447" stroke-width="2"/><rect x="145" y="150" width="15" height="180" fill="#fff" stroke="#c0392b" stroke-dasharray="4 3"/><text x="150" y="385" class="r2" text-anchor="middle" style="fill:#c0392b">Разрыв</text><text x="150" y="405" class="e2" text-anchor="middle">Gap</text><rect x="280" y="130" width="220" height="220" rx="14" fill="#fff" stroke="#9aa9b6" stroke-width="2"/><polygon points="300,150 405,150 405,330 300,330" fill="#cfe8d4" stroke="#243447" stroke-width="2" opacity=".9"/><polygon points="375,150 480,150 480,330 375,330" fill="#f3e6b0" stroke="#243447" stroke-width="2" opacity=".75"/><rect x="375" y="150" width="30" height="180" fill="#f4b6a0" opacity=".8"/><text x="390" y="385" class="r2" text-anchor="middle" style="fill:#c0392b">Наложение</text><text x="390" y="405" class="e2" text-anchor="middle">Overlap</text><rect x="520" y="130" width="220" height="220" rx="14" fill="#fff" stroke="#9aa9b6" stroke-width="2"/><path d="M540 330V240H630M630 240H720V150M630 240V200" fill="none" stroke="#243447" stroke-width="3"/><circle cx="630" cy="200" r="9" fill="#c0392b"/><text x="630" y="385" class="r2" text-anchor="middle" style="fill:#c0392b">Висячая линия</text><text x="630" y="405" class="e2" text-anchor="middle">Dangle</text><rect x="760" y="130" width="220" height="220" rx="14" fill="#fff" stroke="#9aa9b6" stroke-width="2"/><polygon points="780,150 870,150 870,330 780,330" fill="#cfe8d4" stroke="#243447" stroke-width="2"/><polygon points="870,150 960,150 960,330 870,330" fill="#f3e6b0" stroke="#243447" stroke-width="2"/><text x="870" y="385" class="r2" text-anchor="middle" style="fill:#2e7d32">Правильно</text><text x="870" y="405" class="e2" text-anchor="middle">Correct</text><text x="40" y="470" class="r2" text-anchor="start">Соседние участки должны делить общую границу без щелей и</text><text x="40" y="494" class="r2" text-anchor="start">наложений: иначе неверна площадь и сбиваются расчёты.</text><text x="40" y="516" class="e2" text-anchor="start">Neighbouring parcels must share a boundary with no gaps or overlaps;</text><text x="40" y="535" class="e2" text-anchor="start">otherwise areas are wrong and analyses fail.</text><text x="30" y="611" class="sm">Схема.</text><text x="30" y="633" class="sm" style="fill:#526579">A schematic.</text></svg>