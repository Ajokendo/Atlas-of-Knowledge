<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">Схемы выборочного обследования / Sampling designs</title><desc id="d">Четыре условных плана выборки: случайная, систематическая, стратифицированная и кластерная. Все точки условные; схемы не задают рекомендуемый размер выборки. / Four conceptual sampling designs: random, systematic, stratified and cluster. All points are illustrative; the diagrams do not prescribe a sample size.</desc>
<style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 23px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.panel{fill:#f5f8fa;stroke:#c4d1d8;stroke-width:2}.grid{stroke:#c4d1d8;stroke-width:1.5}.pt{fill:#b64e38;stroke:#fff;stroke-width:2}.zone1{fill:#e4f0e4}.zone2{fill:#e6edf5}.zone3{fill:#f5ead8}</style>
<rect width="1400" height="760" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Выборки в географическом исследовании / Sampling in geographic research</text>
<g transform="translate(35 90)"><rect width="640" height="275" rx="12" class="panel"/><text x="320" y="40" text-anchor="middle" class="t">Случайная / Simple random</text><rect x="40" y="65" width="560" height="170" fill="#fff" stroke="#9aabb3" stroke-width="2"/><g class="grid"><path d="M150 65V235 M260 65V235 M370 65V235 M480 65V235 M40 150H600"/></g><circle cx="70" cy="90" r="9" class="pt"/><circle cx="205" cy="120" r="9" class="pt"/><circle cx="310" cy="85" r="9" class="pt"/><circle cx="445" cy="170" r="9" class="pt"/><circle cx="550" cy="105" r="9" class="pt"/><circle cx="130" cy="200" r="9" class="pt"/><circle cx="355" cy="205" r="9" class="pt"/><circle cx="520" cy="210" r="9" class="pt"/><circle cx="280" cy="160" r="9" class="pt"/><text x="320" y="260" text-anchor="middle" class="s">Каждая единица имеет известную ненулевую вероятность отбора / Each unit has a known non-zero selection probability</text></g>
<g transform="translate(725 90)"><rect width="640" height="275" rx="12" class="panel"/><text x="320" y="40" text-anchor="middle" class="t">Систематическая / Systematic</text><rect x="40" y="65" width="560" height="170" fill="#fff" stroke="#9aabb3" stroke-width="2"/><g class="grid"><path d="M150 65V235 M260 65V235 M370 65V235 M480 65V235 M40 150H600"/></g><circle cx="100" cy="100" r="9" class="pt"/><circle cx="220" cy="100" r="9" class="pt"/><circle cx="340" cy="100" r="9" class="pt"/><circle cx="460" cy="100" r="9" class="pt"/><circle cx="100" cy="190" r="9" class="pt"/><circle cx="220" cy="190" r="9" class="pt"/><circle cx="340" cy="190" r="9" class="pt"/><circle cx="460" cy="190" r="9" class="pt"/><text x="320" y="260" text-anchor="middle" class="s">Случайный старт + постоянный шаг / Random start + fixed interval</text></g>
<g transform="translate(35 405)"><rect width="640" height="275" rx="12" class="panel"/><text x="320" y="40" text-anchor="middle" class="t">Стратифицированная / Stratified</text><rect x="40" y="65" width="560" height="170" fill="#fff" stroke="#9aabb3" stroke-width="2"/><rect x="40" y="65" width="180" height="170" class="zone1"/><rect x="220" y="65" width="190" height="170" class="zone2"/><rect x="410" y="65" width="190" height="170" class="zone3"/><g><circle cx="90" cy="100" r="9" class="pt"/><circle cx="160" cy="190" r="9" class="pt"/><circle cx="270" cy="130" r="9" class="pt"/><circle cx="350" cy="90" r="9" class="pt"/><circle cx="365" cy="195" r="9" class="pt"/><circle cx="460" cy="120" r="9" class="pt"/><circle cx="530" cy="190" r="9" class="pt"/></g><text x="320" y="260" text-anchor="middle" class="s">Случайный отбор внутри каждой страты / Random selection within each stratum</text></g>
<g transform="translate(725 405)"><rect width="640" height="275" rx="12" class="panel"/><text x="320" y="40" text-anchor="middle" class="t">Кластерная / Cluster</text><rect x="40" y="65" width="560" height="170" fill="#fff" stroke="#9aabb3" stroke-width="2"/><g fill="none" stroke="#6d93a5" stroke-width="3" stroke-dasharray="7 5"><ellipse cx="150" cy="125" rx="80" ry="50"/><ellipse cx="390" cy="180" rx="95" ry="48"/></g><circle cx="90" cy="110" r="9" class="pt"/><circle cx="150" cy="90" r="9" class="pt"/><circle cx="180" cy="145" r="9" class="pt"/><circle cx="220" cy="120" r="9" class="pt"/><circle cx="320" cy="160" r="9" class="pt"/><circle cx="370" cy="140" r="9" class="pt"/><circle cx="410" cy="180" r="9" class="pt"/><circle cx="455" cy="190" r="9" class="pt"/><circle cx="390" cy="215" r="9" class="pt"/><text x="320" y="260" text-anchor="middle" class="s">Случайный выбор кластеров, затем обследование их единиц / Randomly select clusters, then survey their units</text></g>
<text x="700" y="730" text-anchor="middle" class="s">План выборки должен соответствовать исследовательскому вопросу, генеральной совокупности, доступности и ожидаемой ошибке; кластерный дизайн требует учёта внутрикластерного сходства. / Design must match the research question, population, access and target error; cluster designs require accounting for within-cluster similarity.</text></svg>