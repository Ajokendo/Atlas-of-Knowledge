<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Источники демографических данных / Demographic data sources</title><desc id="d">Разные источники измеряют разные события, группы и периоды. / Different sources measure different events, populations and periods.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.axis{stroke:#526579;stroke-width:3;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Источники демографических данных / Demographic data sources</text><text x="55" y="100" class="s">Разные источники измеряют разные события, группы и периоды. / Different sources measure different events, populations and periods.</text><rect x="520" y="330" width="360" height="145" fill="#dce9df" class="box"/><text x="538" y="368" class="b">НАСЕЛЕНИЕ / POPULATION</text><text x="538" y="405" class="s">Численность, структура, изменение</text><text x="538" y="435" class="n">Size, structure, change</text><rect x="55" y="155" width="350" height="145" fill="#e6f0fb" class="box"/><text x="73" y="193" class="b">Перепись / Census</text><text x="73" y="230" class="s">Численность и характеристики</text><text x="73" y="260" class="n">Population count and characteristics</text><rect x="525" y="145" width="350" height="145" fill="#f4e8d4" class="box"/><text x="543" y="183" class="b">Регистрация / Civil registration</text><text x="543" y="220" class="s">Рождения, смерти, браки</text><text x="543" y="250" class="n">Births, deaths, marriages</text><rect x="995" y="155" width="350" height="145" fill="#eee6db" class="box"/><text x="1013" y="193" class="b">Обследования / Surveys</text><text x="1013" y="230" class="s">Репрезентативные выборки</text><text x="1013" y="260" class="n">Representative samples</text><rect x="210" y="555" width="350" height="145" fill="#e7ecf2" class="box"/><text x="228" y="593" class="b">Административные данные / Administrative records</text><text x="228" y="630" class="s">Образование, здоровье, миграция</text><text x="228" y="660" class="n">Education, health, migration</text><rect x="840" y="555" width="350" height="145" fill="#e5f1f2" class="box"/><text x="858" y="593" class="b">Геоданные / Geospatial sources</text><text x="858" y="630" class="s">Расселение и застройка</text><text x="858" y="660" class="n">Settlement and built-up areas</text><path d="M405 230 L520 370" class="axis"/><path d="M700 290 L700 330" class="axis"/><path d="M995 230 L880 370" class="axis"/><path d="M385 555 L590 475" class="axis"/><path d="M1010 555 L850 475" class="axis"/><text x="55" y="725" class="n">Сопоставляйте определения, охват, дату и качество; источники не взаимозаменяемы. / Compare definitions, coverage, dates and quality; sources are not interchangeable.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No country-specific data implied</text></svg>