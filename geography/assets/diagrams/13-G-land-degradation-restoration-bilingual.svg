<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="t d"><title id="t">Деградация земель и восстановление / Land degradation and restoration</title><desc id="d">Четыре условных разреза показывают эрозию почвы водой, засоление при испарении и подъёме солей, уплотнение с уменьшением пор, а также утрату растительного покрова. Нижняя схема показывает предотвращение, снижение давления и восстановление с местными мерами управления. / Four conceptual sections show water erosion, salinisation as salts accumulate during evaporation, compaction that reduces pore space, and vegetation loss. The lower panel shows prevention, reducing pressure and restoration through context-specific management.</desc><style>.h{font:700 29px Arial;fill:#17324d}.th{font:700 19px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.sm{font:14px Arial;fill:#526879}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}.soil{fill:#b68b62}.sub{fill:#8b6b53}.root{stroke:#638b58;stroke-width:3;fill:none}.a{stroke:#397a8d;stroke-width:3;fill:none}</style><rect width="1300" height="760" fill="white"/><text x="650" y="48" text-anchor="middle" class="h">Процессы деградации земель / Land degradation processes</text><g transform="translate(35 90)"><rect width="290" height="235" rx="12" class="p"/><text x="145" y="34" text-anchor="middle" class="th">Эрозия / Erosion</text><path d="M20 105L95 85L165 135L270 170V205H20Z" class="soil"/><path d="M20 205H270" class="sub"/><path d="M45 80q45 15 75 40t65 30" stroke="#397a8d" stroke-width="5" fill="none"/><path d="M80 140l25 15 M145 160l25 15 M205 177l20 12" stroke="#8b6b53" stroke-width="5"/><text x="145" y="225" text-anchor="middle" class="sm">Смыв верхнего слоя / Topsoil loss</text></g><g transform="translate(350 90)"><rect width="290" height="235" rx="12" class="p"/><text x="145" y="34" text-anchor="middle" class="th">Засоление / Salinisation</text><rect x="20" y="115" width="250" height="90" class="soil"/><path d="M20 115H270" stroke="#fff" stroke-width="4"/><path d="M55 195V120 M120 195V120 M190 195V120" stroke="#397a8d" stroke-width="3" stroke-dasharray="6 5"/><g fill="#fff"><circle cx="65" cy="105" r="5"/><circle cx="110" cy="105" r="5"/><circle cx="165" cy="105" r="5"/><circle cx="220" cy="105" r="5"/></g><path d="M65 105V75 M145 105V75 M220 105V75" stroke="#b66a3c" stroke-width="3"/><text x="145" y="225" text-anchor="middle" class="sm">Накопление солей / Salt accumulation</text></g><g transform="translate(665 90)"><rect width="290" height="235" rx="12" class="p"/><text x="145" y="34" text-anchor="middle" class="th">Уплотнение / Compaction</text><rect x="20" y="110" width="250" height="95" class="soil"/><g fill="#fff" opacity=".9"><circle cx="65" cy="140" r="4"/><circle cx="110" cy="175" r="4"/><circle cx="170" cy="145" r="4"/><circle cx="230" cy="180" r="4"/></g><path d="M40 85H250 M60 70V105 M120 70V105 M180 70V105 M240 70V105" stroke="#b66a3c" stroke-width="4"/><path d="M35 115H255" stroke="#8b6b53" stroke-width="6"/><text x="145" y="225" text-anchor="middle" class="sm">Меньше пор и инфильтрации / Reduced pores</text></g><g transform="translate(980 90)"><rect width="285" height="235" rx="12" class="p"/><text x="142" y="34" text-anchor="middle" class="th">Утрата покрова / Cover loss</text><path d="M20 155H265V205H20Z" class="soil"/><path d="M60 155V95 M130 155V120 M215 155V80" class="root"/><path d="M45 95l15-25 15 25 M115 120l15-20 15 20 M200 80l15-30 15 30" stroke="#638b58" stroke-width="4" fill="none"/><path d="M35 145L80 135 M110 150L150 145 M190 150L235 145" stroke="#b66a3c" stroke-width="3" stroke-dasharray="5 5"/><text x="142" y="225" text-anchor="middle" class="sm">Меньше защиты почвы / Less soil cover</text></g><rect x="65" y="380" width="1170" height="275" rx="14" class="p"/><text x="650" y="420" text-anchor="middle" class="th">Иерархия действий: предотвратить → сократить → обратить вспять / Response: avoid → reduce → reverse</text><g><rect x="105" y="470" width="300" height="135" rx="12" fill="#e4efe8" stroke="#638b58" stroke-width="2"/><text x="255" y="505" text-anchor="middle" class="th">Предотвращение / Avoid</text><text x="255" y="540" text-anchor="middle" class="s">Покров, контурное</text><text x="255" y="565" text-anchor="middle" class="s">земледелие, пастбищный режим</text><rect x="500" y="470" width="300" height="135" rx="12" fill="#f6efe0" stroke="#b68b62" stroke-width="2"/><text x="650" y="505" text-anchor="middle" class="th">Снижение / Reduce</text><text x="650" y="540" text-anchor="middle" class="s">Управление стоком,</text><text x="650" y="565" text-anchor="middle" class="s">орошением и нагрузкой</text><rect x="895" y="470" width="300" height="135" rx="12" fill="#e1edf0" stroke="#397a8d" stroke-width="2"/><text x="1045" y="505" text-anchor="middle" class="th">Восстановление / Reverse</text><text x="1045" y="540" text-anchor="middle" class="s">Растительный покров,</text><text x="1045" y="565" text-anchor="middle" class="s">почва и водный режим</text></g><text x="650" y="700" text-anchor="middle" class="sm">Меры зависят от причины, почвы, климата и землепользования; не существует одного решения для всех участков. / Measures depend on cause, soil, climate and land use; no single remedy fits every site.</text></svg>