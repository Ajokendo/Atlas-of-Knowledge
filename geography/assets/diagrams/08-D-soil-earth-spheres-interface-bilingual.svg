<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Почва — интерфейс геосфер / Soil as an Earth-spheres interface</title><desc id="d">Взаимодействия вещества и энергии показаны качественно. / Matter and energy interactions are qualitative.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:26px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Почва — интерфейс геосфер / Soil as an Earth-spheres interface</text><text x="55" y="100" class="s">Взаимодействия вещества и энергии показаны качественно. / Matter and energy interactions are qualitative.</text><rect x="55" y="160" width="285" height="155" fill="#e6f0fb" class="box"/><text x="75" y="198" class="b">Атмосфера</text><text x="75" y="226" class="b">Atmosphere</text><text x="75" y="263" class="s">Осадки, тепло, газы</text><text x="75" y="291" class="n">Rain, heat, gases</text><rect x="390" y="160" width="285" height="155" fill="#e4eee3" class="box"/><text x="410" y="198" class="b">Биосфера</text><text x="410" y="226" class="b">Biosphere</text><text x="410" y="263" class="s">Корни, микробы, фауна</text><text x="410" y="291" class="n">Roots, microbes, fauna</text><rect x="725" y="160" width="285" height="155" fill="#e5f1f2" class="box"/><text x="745" y="198" class="b">Гидросфера</text><text x="745" y="226" class="b">Hydrosphere</text><text x="745" y="263" class="s">Инфильтрация, сток</text><text x="745" y="291" class="n">Infiltration, runoff</text><rect x="1060" y="160" width="285" height="155" fill="#eee6db" class="box"/><text x="1080" y="198" class="b">Литосфера</text><text x="1080" y="226" class="b">Lithosphere</text><text x="1080" y="263" class="s">Порода и минералы</text><text x="1080" y="291" class="n">Rock and minerals</text><rect x="340" y="450" width="720" height="205" rx="22" fill="#c3a27e" stroke="#526579" stroke-width="4"/><text x="700" y="510" text-anchor="middle" class="h">ПОЧВА / SOIL</text><text x="700" y="565" text-anchor="middle" class="b">Минералы • органика • вода • воздух</text><text x="700" y="605" text-anchor="middle" class="s">Minerals • organic matter • water • air</text><path d="M195 315 V390 L470 450" stroke="#526579" stroke-width="4" fill="none"/><path d="M530 315 V390 L470 450" stroke="#526579" stroke-width="4" fill="none"/><path d="M865 315 V390 L930 450" stroke="#526579" stroke-width="4" fill="none"/><path d="M1200 315 V390 L930 450" stroke="#526579" stroke-width="4" fill="none"/><text x="55" y="710" class="n">Стрелки не обозначают измеренные потоки. / Arrows do not represent measured fluxes.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual teaching diagram • Conceptual, not site-specific</text></svg>