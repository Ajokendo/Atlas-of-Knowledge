<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="t d"><title id="t">Классификация и независимая проверка / Classification and independent validation</title><desc id="d">Сравниваются контролируемая классификация с обучающими образцами и неконтролируемая классификация с алгоритмическими кластерами. Для оценки точности нужна отдельная независимая проверочная выборка и матрица ошибок, сопоставляющая прогнозные и эталонные классы. / Supervised classification uses labelled training samples; unsupervised classification forms algorithmic clusters. Accuracy assessment requires a separate independent validation sample and a confusion matrix comparing mapped and reference classes.</desc><style>.h{font:700 29px Arial;fill:#17324d}.th{font:700 20px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.sm{font:14px Arial;fill:#526879}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}.a{stroke:#397a8d;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397a8d"/></marker></defs><rect width="1300" height="760" fill="white"/><text x="650" y="48" text-anchor="middle" class="h">Классификация спутниковых данных / Satellite-image classification</text><g transform="translate(35 95)"><rect width="590" height="245" rx="14" class="p"/><text x="295" y="38" text-anchor="middle" class="th">Контролируемая / Supervised</text><rect x="30" y="72" width="145" height="70" rx="8" fill="#e1edf0" stroke="#7893a1"/><text x="102" y="100" text-anchor="middle" class="s">Обучающие</text><text x="102" y="123" text-anchor="middle" class="s">образцы / Training</text><rect x="220" y="72" width="145" height="70" rx="8" fill="#e1edf0" stroke="#7893a1"/><text x="292" y="100" text-anchor="middle" class="s">Классификатор</text><text x="292" y="123" text-anchor="middle" class="s">/ Classifier</text><rect x="410" y="72" width="145" height="70" rx="8" fill="#e1edf0" stroke="#7893a1"/><text x="482" y="100" text-anchor="middle" class="s">Карта классов</text><text x="482" y="123" text-anchor="middle" class="s">/ Class map</text><path d="M175 107H210 M365 107H400" class="a" marker-end="url(#a)"/><text x="295" y="190" text-anchor="middle" class="sm">Эталонные метки задаются до обучения / Reference labels are supplied before training</text></g><g transform="translate(675 95)"><rect width="590" height="245" rx="14" class="p"/><text x="295" y="38" text-anchor="middle" class="th">Неконтролируемая / Unsupervised</text><rect x="30" y="72" width="145" height="70" rx="8" fill="#e1edf0" stroke="#7893a1"/><text x="102" y="100" text-anchor="middle" class="s">Спектральные</text><text x="102" y="123" text-anchor="middle" class="s">данные / Pixels</text><rect x="220" y="72" width="145" height="70" rx="8" fill="#e1edf0" stroke="#7893a1"/><text x="292" y="100" text-anchor="middle" class="s">Алгоритм</text><text x="292" y="123" text-anchor="middle" class="s">кластеризации</text><rect x="410" y="72" width="145" height="70" rx="8" fill="#e1edf0" stroke="#7893a1"/><text x="482" y="100" text-anchor="middle" class="s">Кластеры</text><text x="482" y="123" text-anchor="middle" class="s">/ Clusters</text><path d="M175 107H210 M365 107H400" class="a" marker-end="url(#a)"/><text x="295" y="190" text-anchor="middle" class="sm">Кластеры интерпретируют и именуют после группировки / Clusters are interpreted and labelled after grouping</text></g><path d="M325 340V395H650 M975 340V395H650V405" class="a" marker-end="url(#a)"/><rect x="360" y="415" width="580" height="85" rx="12" fill="#fff7ed" stroke="#b66a3c" stroke-width="2"/><text x="650" y="450" text-anchor="middle" class="th">Независимая проверочная выборка / Independent validation sample</text><text x="650" y="480" text-anchor="middle" class="s">Не использовать обучающие точки повторно / Do not reuse training samples</text><path d="M650 500V540" class="a" marker-end="url(#a)"/><rect x="360" y="550" width="580" height="150" rx="12" class="p"/><text x="650" y="580" text-anchor="middle" class="th">Матрица ошибок / Confusion matrix</text><g transform="translate(455 600)"><rect width="130" height="36" fill="#d9e9ed" stroke="#7893a1"/><rect x="130" width="130" height="36" fill="#eef3f5" stroke="#7893a1"/><rect x="260" width="130" height="36" fill="#eef3f5" stroke="#7893a1"/><rect y="36" width="130" height="36" fill="#eef3f5" stroke="#7893a1"/><rect x="130" y="36" width="130" height="36" fill="#d9e9ed" stroke="#7893a1"/><rect x="260" y="36" width="130" height="36" fill="#eef3f5" stroke="#7893a1"/><text x="195" y="92" text-anchor="middle" class="sm">Reference classes × mapped classes</text></g><text x="650" y="735" text-anchor="middle" class="sm">Точность зависит от схемы выборки, независимости эталона и качества классов. / Accuracy depends on sampling design, reference independence and class quality.</text></svg>