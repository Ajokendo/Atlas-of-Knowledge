<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t"><title id="t">Почвенный профиль и горизонты / Soil profile and horizons</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="640" fill="#fbfcfe"/><text x="30" y="46" class="h">Почвенный профиль и горизонты</text><text x="30" y="76" class="sub">Soil profile and horizons</text><rect x="80" y="130" width="300" height="50" fill="#6b4a2f" stroke="#fff" stroke-width="2"/><text x="230" y="165.0" class="h" text-anchor="middle" style="fill:#fff">O</text><text x="420" y="155" class="r2">Подстилка</text><text x="420" y="175" class="e2">Litter</text><rect x="80" y="180" width="300" height="80" fill="#4a3220" stroke="#fff" stroke-width="2"/><text x="230" y="230.0" class="h" text-anchor="middle" style="fill:#fff">A</text><text x="420" y="220" class="r2">Гумусовый</text><text x="420" y="240" class="e2">Humus</text><rect x="80" y="260" width="300" height="60" fill="#c9b79a" stroke="#fff" stroke-width="2"/><text x="230" y="300.0" class="h" text-anchor="middle" style="fill:#243447">E</text><text x="420" y="290" class="r2">Вымывания</text><text x="420" y="310" class="e2">Leached</text><rect x="80" y="320" width="300" height="90" fill="#b07a4a" stroke="#fff" stroke-width="2"/><text x="230" y="375.0" class="h" text-anchor="middle" style="fill:#fff">B</text><text x="420" y="365" class="r2">Накопления</text><text x="420" y="385" class="e2">Accumulation</text><rect x="80" y="410" width="300" height="90" fill="#cdb892" stroke="#fff" stroke-width="2"/><text x="230" y="465.0" class="h" text-anchor="middle" style="fill:#243447">C</text><text x="420" y="455" class="r2">Материнская порода</text><text x="420" y="475" class="e2">Parent material</text><rect x="80" y="500" width="300" height="80" fill="#8b8b8b" stroke="#fff" stroke-width="2"/><text x="230" y="550.0" class="h" text-anchor="middle" style="fill:#fff">R</text><text x="420" y="540" class="r2">Коренная порода</text><text x="420" y="560" class="e2">Bedrock</text><path d="M900 140L900 570" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="880" y="355" class="e2" text-anchor="end">глубина / depth</text><text x="30" y="602" class="sm">Типовая схема; у разных почв набор горизонтов различается.</text><text x="30" y="624" class="sm" style="fill:#526579">A typical scheme; the set of horizons differs between soils.</text></svg>