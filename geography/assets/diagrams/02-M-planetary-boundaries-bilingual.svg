<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t"><title id="t">Девять планетарных границ / Nine planetary boundaries</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="720" fill="#fbfcfe"/><text x="30" y="46" class="h">Девять планетарных границ</text><text x="30" y="76" class="sub">Nine planetary boundaries</text><path d="M500 295L500 190A160 160 0 0 1 603 227L535 308A55 55 0 0 0 500 295Z" fill="#f4b6a0" stroke="#fff" stroke-width="3"/><text x="567" y="171" class="r2" text-anchor="start">1. Изменение климата</text><text x="567" y="190" class="e2" text-anchor="start">Climate change</text><path d="M535 308L603 227A160 160 0 0 1 658 322L554 340A55 55 0 0 0 535 308Z" fill="#b7dba5" stroke="#fff" stroke-width="3"/><text x="669" y="255" class="r2" text-anchor="start">2. Целостность биосферы</text><text x="669" y="274" class="e2" text-anchor="start">Biosphere integrity</text><path d="M554 340L658 322A160 160 0 0 1 639 430L548 378A55 55 0 0 0 554 340Z" fill="#d9c3a0" stroke="#fff" stroke-width="3"/><text x="692" y="383" class="r2" text-anchor="start">3. Землепользование</text><text x="692" y="402" class="e2" text-anchor="start">Land-system change</text><path d="M548 378L639 430A160 160 0 0 1 555 500L519 402A55 55 0 0 0 548 378Z" fill="#a5d3e8" stroke="#fff" stroke-width="3"/><text x="625" y="496" class="r2" text-anchor="start">4. Пресная вода</text><text x="625" y="515" class="e2" text-anchor="start">Freshwater use</text><path d="M519 402L555 500A160 160 0 0 1 445 500L481 402A55 55 0 0 0 519 402Z" fill="#f3d98b" stroke="#fff" stroke-width="3"/><text x="500" y="540" class="r2" text-anchor="middle">5. Потоки азота и фосфора</text><text x="500" y="559" class="e2" text-anchor="middle">Nitrogen and phosphorus flows</text><path d="M481 402L445 500A160 160 0 0 1 361 430L452 378A55 55 0 0 0 481 402Z" fill="#9fd9cc" stroke="#fff" stroke-width="3"/><text x="375" y="496" class="r2" text-anchor="end">6. Закисление океана</text><text x="375" y="515" class="e2" text-anchor="end">Ocean acidification</text><path d="M452 378L361 430A160 160 0 0 1 342 322L446 340A55 55 0 0 0 452 378Z" fill="#d3c1e8" stroke="#fff" stroke-width="3"/><text x="308" y="383" class="r2" text-anchor="end">7. Аэрозоли в атмосфере</text><text x="308" y="402" class="e2" text-anchor="end">Atmospheric aerosols</text><path d="M446 340L342 322A160 160 0 0 1 397 227L465 308A55 55 0 0 0 446 340Z" fill="#f0b7c4" stroke="#fff" stroke-width="3"/><text x="331" y="255" class="r2" text-anchor="end">8. Озоновый слой</text><text x="331" y="274" class="e2" text-anchor="end">Stratospheric ozone</text><path d="M465 308L397 227A160 160 0 0 1 500 190L500 295A55 55 0 0 0 465 308Z" fill="#c9d3dc" stroke="#fff" stroke-width="3"/><text x="433" y="171" class="r2" text-anchor="end">9. Новые вещества</text><text x="433" y="190" class="e2" text-anchor="end">Novel entities</text><text x="500" y="355" class="e2" text-anchor="middle">9 границ</text><text x="30" y="682" class="sm">Концепция планетарных границ (Рокстрём и др., 2009). Состояние границ не показано.</text><text x="30" y="704" class="sm" style="fill:#526579">Planetary-boundaries framework (Rockström et al., 2009). Status of boundaries not shown.</text></svg>