<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Как критически читать политическую карту / How to read a political map critically</title><desc id="d">Проверяйте дату, границы, статус, проекцию, масштаб, источник и подписи. / Check date, boundaries, status, projection, scale, source and labels.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.line{stroke:#526579;stroke-width:4;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Как критически читать политическую карту / How to read a political map critically</text><text x="55" y="100" class="s">Проверяйте дату, границы, статус, проекцию, масштаб, источник и подписи. / Check date, boundaries, status, projection, scale, source and labels.</text><rect x="55" y="155" width="390" height="145" fill="#e6f0fb" class="box"/><text x="73" y="193" class="b">1. Дата / Date</text><text x="73" y="230" class="s">Когда данные были актуальны?</text><text x="73" y="260" class="n">When were the data current?</text><rect x="505" y="155" width="390" height="145" fill="#e4eee3" class="box"/><text x="523" y="193" class="b">2. Источник / Source</text><text x="523" y="230" class="s">Кто создал границы и названия?</text><text x="523" y="260" class="n">Who produced boundaries and names?</text><rect x="955" y="155" width="390" height="145" fill="#f4e8d4" class="box"/><text x="973" y="193" class="b">3. Статус / Status</text><text x="973" y="230" class="s">Право, признание или контроль?</text><text x="973" y="260" class="n">Law, recognition or control?</text><rect x="55" y="390" width="390" height="145" fill="#e7ecf2" class="box"/><text x="73" y="428" class="b">4. Проекция / Projection</text><text x="73" y="465" class="s">Какие искажения возникают?</text><text x="73" y="495" class="n">What distortions occur?</text><rect x="505" y="390" width="390" height="145" fill="#eee6db" class="box"/><text x="523" y="428" class="b">5. Масштаб / Scale</text><text x="523" y="465" class="s">Какие детали обобщены?</text><text x="523" y="495" class="n">Which details are generalised?</text><rect x="955" y="390" width="390" height="145" fill="#e5f1f2" class="box"/><text x="973" y="428" class="b">6. Легенда / Legend</text><text x="973" y="465" class="s">Есть ли пояснения и оговорки?</text><text x="973" y="495" class="n">Are notes and qualifications provided?</text><rect x="280" y="610" width="840" height="80" rx="18" fill="#dce9df" stroke="#526579" stroke-width="3"/><text x="700" y="660" text-anchor="middle" class="b">Проверяйте контекст до интерпретации / Check context before interpretation</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No disputed or real-world boundary claims</text></svg>