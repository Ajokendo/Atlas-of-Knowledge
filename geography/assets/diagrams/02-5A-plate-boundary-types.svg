<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Three plate-boundary types / Три типа границ плит</title><desc id="d">Divergent, convergent and transform plate boundaries shown schematically. / Схематично показаны дивергентная, конвергентная и трансформная границы плит.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Plate boundaries / Границы литосферных плит</text><g font-family="Arial" font-size="26" fill="#17324d" text-anchor="middle"><text x="250" y="150" font-weight="700">Divergent / Расходящаяся</text><text x="750" y="150" font-weight="700">Convergent / Сходящаяся</text><text x="1250" y="150" font-weight="700">Transform / Сдвиговая</text></g><g stroke="#8a6b45" stroke-width="4"><path d="M60 520H440V760H60Z" fill="#d8bd96"/><path d="M560 520H940V760H560Z" fill="#d8bd96"/><path d="M1060 520H1440V760H1060Z" fill="#d8bd96"/></g><g fill="#a66b35"><path d="M60 520l160-55 80 55z"/><path d="M440 520l-160-55-80 55z"/><path d="M560 520l160-55 80 55z"/><path d="M940 520l-160-55-80 55z"/></g><g stroke="#3979a8" stroke-width="12" fill="none"><path d="M170 430V310 M330 430V310"/><path d="M690 420L820 520 M810 420L680 520"/><path d="M1120 420H1300"/></g><g fill="#3979a8"><path d="M150 330l20-30 20 30z"/><path d="M310 330l20-30 20 30z"/><path d="M800 490l30 20-30 20z"/><path d="M700 490l-30 20 30 20z"/><path d="M1280 400l30 20-30 20z"/></g><path d="M750 520V370" stroke="#c65a4b" stroke-width="12"/><path d="M730 390l20-30 20 30z" fill="#c65a4b"/><g font-family="Arial" font-size="22" fill="#38566f" text-anchor="middle"><text x="250" y="810">New crust forms / Образуется новая кора</text><text x="750" y="810">Subduction or collision / Субдукция или столкновение</text><text x="1250" y="810">Lateral slip / Горизонтальное смещение</text></g><text x="750" y="860" text-anchor="middle" font-family="Arial" font-size="20" fill="#52697c">Schematic cross-sections, not to scale / Условные разрезы, не в масштабе</text></svg>