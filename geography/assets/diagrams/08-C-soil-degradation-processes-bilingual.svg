<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Деградация почв / Soil degradation</title><desc id="d">Схематические процессы и меры снижения риска. / Schematic processes and risk-reduction measures.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:26px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Деградация почв / Soil degradation</text><text x="55" y="100" class="s">Схематические процессы и меры снижения риска. / Schematic processes and risk-reduction measures.</text><rect x="55" y="155" width="390" height="245" fill="#f4e3d7" class="box"/><text x="75" y="195" class="b">Водная эрозия / Water erosion</text><text x="75" y="235" class="s">Капли и сток переносят частицы.</text><text x="75" y="267" class="n">Raindrops and runoff move soil particles.</text><path d="M90 330 Q220 275 400 335" fill="none" stroke="#9b6545" stroke-width="18"/><path d="M130 220 l25 65 M220 215 l25 65 M310 220 l25 65" stroke="#4c9ac2" stroke-width="5"/><path d="M330 335 q35 15 65 0" fill="none" stroke="#4c9ac2" stroke-width="5"/><rect x="505" y="155" width="390" height="245" fill="#e7ecf2" class="box"/><text x="525" y="195" class="b">Ветровая дефляция / Wind erosion</text><text x="525" y="235" class="s">Ветер уносит мелкие частицы.</text><text x="525" y="267" class="n">Wind removes fine particles.</text><path d="M545 330 H850 M570 260 q100 -50 210 0" stroke="#9b7652" stroke-width="12" fill="none"/><path d="M600 250 l150 -20" stroke="#526579" stroke-width="5"/><rect x="955" y="155" width="390" height="245" fill="#f1e7c8" class="box"/><text x="975" y="195" class="b">Засоление / Salinisation</text><text x="975" y="235" class="s">Соли накапливаются при плохом дренаже.</text><text x="975" y="267" class="n">Salts accumulate under poor drainage.</text><path d="M990 335 H1300 M1030 325 v-70 M1150 325 v-70 M1270 325 v-70" stroke="#b58a53" stroke-width="7"/><rect x="230" y="465" width="390" height="220" fill="#e4eee3" class="box"/><text x="250" y="505" class="b">Уплотнение / Compaction</text><text x="250" y="545" class="s">Техника уменьшает крупные поры.</text><text x="250" y="577" class="n">Machinery reduces macropores.</text><path d="M270 620 H580 M320 580 v75 M420 580 v75 M520 580 v75" stroke="#9b7652" stroke-width="20"/><rect x="780" y="465" width="390" height="220" fill="#e4eee3" class="box"/><text x="800" y="505" class="b">Охрана / Conservation</text><text x="800" y="545" class="s">Покровные культуры, контурная обработка, террасы.</text><text x="800" y="577" class="n">Cover crops, contour farming, terraces.</text><path d="M820 615 q90 -70 180 0 t120 0" stroke="#4d7c48" stroke-width="16" fill="none"/><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual teaching diagram • Conceptual, not site-specific</text></svg>