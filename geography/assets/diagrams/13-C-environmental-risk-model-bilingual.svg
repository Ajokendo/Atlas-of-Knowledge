<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Модель экологического риска / Environmental risk model</title>
<desc id="desc">Три взаимосвязанных компонента оценки риска: опасное явление, экспозиция людей и активов, уязвимость этих людей и систем. Риск возникает из их взаимодействия; это концептуальная модель, а не универсальная числовая формула. / Three interacting components of risk assessment: a hazardous event, exposure of people and assets, and the vulnerability of those people and systems. Risk emerges from their interaction; this is a conceptual model, not a universal numerical formula.</desc>
<style>.h{font:700 30px Arial,sans-serif;fill:#17324d}.t{font:22px Arial,sans-serif;fill:#17324d}.s{font:17px Arial,sans-serif;fill:#536b7c}.box{fill:#f5f8fa;stroke:#607e8b;stroke-width:3}.arr{stroke:#587887;stroke-width:4;fill:none}</style>
<rect width="1200" height="650" fill="#fff"/><text x="600" y="52" text-anchor="middle" class="h">Экологический риск / Environmental risk</text>
<rect x="70" y="150" width="300" height="210" rx="20" class="box"/><text x="220" y="205" text-anchor="middle" class="h">Опасность</text><text x="220" y="240" text-anchor="middle" class="t">Hazard</text><text x="220" y="290" text-anchor="middle" class="s">Засуха, паводок, загрязнение</text><text x="220" y="320" text-anchor="middle" class="s">Drought, flood, pollution</text>
<rect x="450" y="150" width="300" height="210" rx="20" class="box"/><text x="600" y="205" text-anchor="middle" class="h">Экспозиция</text><text x="600" y="240" text-anchor="middle" class="t">Exposure</text><text x="600" y="290" text-anchor="middle" class="s">Люди, здания, экосистемы</text><text x="600" y="320" text-anchor="middle" class="s">People, buildings, ecosystems</text>
<rect x="830" y="150" width="300" height="210" rx="20" class="box"/><text x="980" y="205" text-anchor="middle" class="h">Уязвимость</text><text x="980" y="240" text-anchor="middle" class="t">Vulnerability</text><text x="980" y="290" text-anchor="middle" class="s">Чувствительность и способность</text><text x="980" y="320" text-anchor="middle" class="s">Sensitivity and coping capacity</text>
<path d="M370 255 H445 M750 255 H825" class="arr"/>
<path d="M600 360 V450" class="arr"/>
<rect x="360" y="450" width="480" height="115" rx="20" fill="#f3e7dd" stroke="#9a674a" stroke-width="3"/><text x="600" y="495" text-anchor="middle" class="h">Риск / Risk</text><text x="600" y="530" text-anchor="middle" class="s">Вероятные потери и последствия / Potential losses and consequences</text>
<text x="600" y="610" text-anchor="middle" class="s">Оценка требует сценария, периода, масштаба и данных; один показатель не описывает весь риск. / Assessment needs a scenario, period, scale and data; one indicator cannot describe total risk.</text>
</svg>