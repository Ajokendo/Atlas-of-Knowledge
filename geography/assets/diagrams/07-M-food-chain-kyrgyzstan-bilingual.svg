<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 699" role="img" aria-labelledby="t"><title id="t">Цепь питания в горах Кыргызстана / A food chain in the mountains of Kyrgyzstan</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="699" fill="#fbfcfe"/><text x="30" y="46" class="h">Цепь питания в горах Кыргызстана</text><text x="30" y="76" class="sub">A food chain in the mountains of Kyrgyzstan</text><rect x="40" y="170" width="260" height="170" rx="14" fill="#b7dba5" stroke="#647789" stroke-width="2"/><text x="170" y="215" class="r" text-anchor="middle">Продуценты</text><text x="170" y="240" class="e" text-anchor="middle">Producers</text><text x="170" y="285" class="r2" text-anchor="middle">трава, арча</text><text x="170" y="306" class="e2" text-anchor="middle">grass, juniper</text><path d="M305 255L355 255" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="360" y="170" width="260" height="170" rx="14" fill="#f3d98b" stroke="#647789" stroke-width="2"/><text x="490" y="215" class="r" text-anchor="middle">Травоядные</text><text x="490" y="240" class="e" text-anchor="middle">Herbivores</text><text x="490" y="285" class="r2" text-anchor="middle">архар, горный козёл</text><text x="490" y="306" class="e2" text-anchor="middle">argali, ibex</text><path d="M625 255L675 255" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="680" y="170" width="260" height="170" rx="14" fill="#f1b9a3" stroke="#647789" stroke-width="2"/><text x="810" y="215" class="r" text-anchor="middle">Хищники</text><text x="810" y="240" class="e" text-anchor="middle">Predators</text><text x="810" y="285" class="r2" text-anchor="middle">снежный барс</text><text x="810" y="306" class="e2" text-anchor="middle">snow leopard</text><rect x="40" y="400" width="900" height="70" rx="14" fill="#e8e4dc" stroke="#647789" stroke-width="2"/><text x="60" y="432" class="r2" text-anchor="start">Разрушители: бактерии, грибы возвращают вещества в почву</text><text x="60" y="451" class="e2" text-anchor="start">Decomposers: bacteria and fungi return nutrients to the soil</text><text x="40" y="520" class="r2" text-anchor="start">С каждого уровня дальше передаётся лишь малая часть энергии (в</text><text x="40" y="544" class="r2" text-anchor="start">среднем порядка 10 %), поэтому хищников всегда мало.</text><text x="40" y="566" class="e2" text-anchor="start">Only a small part of energy passes up each level (on average about 10 %), so</text><text x="40" y="585" class="e2" text-anchor="start">predators are always few.</text><text x="30" y="661" class="sm">Схема.</text><text x="30" y="683" class="sm" style="fill:#526579">A schematic.</text></svg>