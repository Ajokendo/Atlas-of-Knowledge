<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Лесные экосистемы Кыргызстана / Forest ecosystems of Kyrgyzstan</title><desc id="desc">Четыре обобщённых типа; состав и границы меняются по региону. / Four broad types; composition and extent vary by region.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Лесные экосистемы Кыргызстана / Forest ecosystems of Kyrgyzstan</text><text x="50" y="88" class="sub">Четыре обобщённых типа; состав и границы меняются по региону. / Four broad types; composition and extent vary by region.</text>
<rect x="45" y="145" width="315" height="520" fill="#e7efe4" class="box"/><text x="63" y="180" class="t">Еловые леса / Spruce forests</text><text x="63" y="215" class="s">Пример: Picea schrenkiana</text><text x="63" y="242" class="s">Example: Tien Shan spruce</text><text x="63" y="269" class="s">Функции: защита склонов,</text><text x="63" y="296" class="s">водорегулирование</text><text x="63" y="323" class="s">Functions: slope protection,</text><text x="63" y="350" class="s">water regulation</text><text x="63" y="377" class="s">Угрозы: пожары, фрагментация</text><text x="63" y="404" class="s">Threats: fire, fragmentation</text>
<rect x="390" y="145" width="315" height="520" fill="#e9efe0" class="box"/><text x="408" y="180" class="t">Арчовые редколесья / Juniper woodlands</text><text x="408" y="215" class="s">Пример: Juniperus spp.</text><text x="408" y="242" class="s">Example: juniper species</text><text x="408" y="269" class="s">Функции: почвозащита,</text><text x="408" y="296" class="s">среда обитания</text><text x="408" y="323" class="s">Functions: soil protection,</text><text x="408" y="350" class="s">habitat</text><text x="408" y="377" class="s">Угрозы: выпас, рубка, пожар</text><text x="408" y="404" class="s">Threats: grazing, cutting, fire</text>
<rect x="735" y="145" width="315" height="520" fill="#f2eadb" class="box"/><text x="753" y="180" class="t">Орехоплодовые леса / Walnut-fruit forests</text><text x="753" y="215" class="s">Примеры: Juglans regia,</text><text x="753" y="242" class="s">Malus spp., Prunus spp.</text><text x="753" y="269" class="s">Examples: walnut, wild apple,</text><text x="753" y="296" class="s">stone-fruit trees</text><text x="753" y="323" class="s">Функции: генетическое</text><text x="753" y="350" class="s">разнообразие, пищевые ресурсы</text><text x="753" y="377" class="s">Functions: genetic diversity,</text><text x="753" y="404" class="s">food resources</text><text x="753" y="431" class="s">Угрозы: распашка, сбор, выпас</text><text x="753" y="458" class="s">Threats: conversion, harvesting, grazing</text>
<rect x="1080" y="145" width="275" height="520" fill="#e3eef2" class="box"/><text x="1098" y="180" class="t">Тугайные леса / Tugai forests</text><text x="1098" y="215" class="s">Примеры: Populus, Salix</text><text x="1098" y="242" class="s">Examples: poplar, willow</text><text x="1098" y="269" class="s">Функции: пойменная среда,</text><text x="1098" y="296" class="s">береговая защита</text><text x="1098" y="323" class="s">Functions: floodplain habitat,</text><text x="1098" y="350" class="s">bank stabilisation</text><text x="1098" y="377" class="s">Угрозы: водозабор, изменение</text><text x="1098" y="404" class="s">стока, освоение</text><text x="1098" y="431" class="s">Threats: abstraction, flow</text><text x="1098" y="458" class="s">alteration, conversion</text>
<text x="50" y="770" class="sm">Atlas of Knowledge • Conceptual teaching visual; no site-specific boundaries or measured values are implied. / Учебная концептуальная схема; точные границы и измеренные значения не подразумеваются.</text></svg>