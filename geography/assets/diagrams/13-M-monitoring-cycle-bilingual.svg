<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t"><title id="t">Цикл экологического мониторинга / The environmental monitoring cycle</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="640" fill="#fbfcfe"/><text x="30" y="46" class="h">Цикл экологического мониторинга</text><text x="30" y="76" class="sub">The environmental monitoring cycle</text><rect x="375" y="95" width="250" height="70" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="500" y="128" class="r2" text-anchor="middle">1. Вопрос и цели</text><text x="500" y="149" class="e2" text-anchor="middle">Question and goals</text><path d="M603 170L661 192" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="634" y="195" width="250" height="70" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="760" y="228" class="r2" text-anchor="middle">2. Показатели</text><text x="760" y="249" class="e2" text-anchor="middle">Indicators</text><path d="M759 310L759 354" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="634" y="395" width="250" height="70" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="760" y="428" class="r2" text-anchor="middle">3. Наблюдения</text><text x="760" y="449" class="e2" text-anchor="middle">Observations</text><path d="M655 470L598 492" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="375" y="495" width="250" height="70" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="500" y="528" class="r2" text-anchor="middle">4. Анализ и оценка</text><text x="500" y="549" class="e2" text-anchor="middle">Analysis and assessment</text><path d="M396 490L338 468" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="115" y="395" width="250" height="70" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="240" y="428" class="r2" text-anchor="middle">5. Решение и действия</text><text x="240" y="449" class="e2" text-anchor="middle">Decision and action</text><path d="M240 350L240 306" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="115" y="194" width="250" height="70" rx="14" fill="#d6e6f3" stroke="#647789" stroke-width="2"/><text x="240" y="228" class="r2" text-anchor="middle">6. Проверка результата</text><text x="240" y="249" class="e2" text-anchor="middle">Check the result</text><path d="M344 189L401 168" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="500" y="325" class="r" text-anchor="middle">Цикл мониторинга</text><text x="500" y="349" class="e" text-anchor="middle">Monitoring cycle</text><text x="30" y="602" class="sm">Схема.</text><text x="30" y="624" class="sm" style="fill:#526579">A schematic.</text></svg>