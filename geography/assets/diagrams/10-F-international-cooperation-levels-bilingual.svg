<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Уровни международного сотрудничества / Levels of international cooperation</title><desc id="d">Компетенции и обязательность решений различаются между форматами. / Powers and binding force differ between arrangements.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.line{stroke:#526579;stroke-width:4;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Уровни международного сотрудничества / Levels of international cooperation</text><text x="55" y="100" class="s">Компетенции и обязательность решений различаются между форматами. / Powers and binding force differ between arrangements.</text><rect x="55" y="170" width="280" height="180" fill="#e6f0fb" class="box"/><text x="73" y="208" class="b">Двустороннее / Bilateral</text><text x="73" y="245" class="s">Два государства; договор или комиссия</text><text x="73" y="275" class="n">Two states; treaty or commission</text><rect x="390" y="170" width="280" height="180" fill="#e4eee3" class="box"/><text x="408" y="208" class="b">Региональное / Regional</text><text x="408" y="245" class="s">Организация нескольких государств</text><text x="408" y="275" class="n">Organisation of several states</text><rect x="725" y="170" width="280" height="180" fill="#f4e8d4" class="box"/><text x="743" y="208" class="b">Универсальное / Universal</text><text x="743" y="245" class="s">Глобальная организация государств</text><text x="743" y="275" class="n">Global organisation of states</text><rect x="1060" y="170" width="280" height="180" fill="#e7ecf2" class="box"/><text x="1078" y="208" class="b">Местный уровень / Local</text><text x="1078" y="245" class="s">Муниципалитеты и сообщества</text><text x="1078" y="275" class="n">Municipalities and communities</text><path d="M335 260 H390 M670 260 H725 M1005 260 H1060" stroke="#526579" stroke-width="4"/><rect x="150" y="470" width="1100" height="170" rx="20" fill="#f1f4f7" stroke="#526579" stroke-width="3"/><text x="700" y="525" text-anchor="middle" class="b">Повестки / Shared agendas</text><text x="700" y="570" text-anchor="middle" class="s">Вода • климат • торговля • безопасность • образование</text><text x="700" y="610" text-anchor="middle" class="s">Water • climate • trade • security • education</text><text x="55" y="700" class="n">Схема показывает возможные масштабы, а не иерархию верховной власти. / The diagram shows possible scales, not a hierarchy of sovereign authority.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No disputed or real-world boundary claims</text></svg>