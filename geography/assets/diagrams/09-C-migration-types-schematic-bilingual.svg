<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Формы миграции / Forms of migration</title><desc id="d">Типы перемещения показаны схематично; стрелки не обозначают реальные маршруты. / Movement types are schematic; arrows are not real routes.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.axis{stroke:#526579;stroke-width:3;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Формы миграции / Forms of migration</text><text x="55" y="100" class="s">Типы перемещения показаны схематично; стрелки не обозначают реальные маршруты. / Movement types are schematic; arrows are not real routes.</text><rect x="55" y="165" width="360" height="150" fill="#e6f0fb" class="box"/><text x="73" y="203" class="b">Внутренняя / Internal</text><text x="73" y="240" class="s">В пределах государства</text><text x="73" y="270" class="n">Within one country</text><rect x="520" y="165" width="360" height="150" fill="#e4eee3" class="box"/><text x="538" y="203" class="b">Международная / International</text><text x="538" y="240" class="s">Через государственную границу</text><text x="538" y="270" class="n">Across a state border</text><rect x="995" y="165" width="350" height="150" fill="#f4e8d4" class="box"/><text x="1013" y="203" class="b">Сезонная / Seasonal</text><text x="1013" y="240" class="s">Временная повторяющаяся</text><text x="1013" y="270" class="n">Temporary and recurring</text><rect x="55" y="445" width="360" height="150" fill="#eee6db" class="box"/><text x="73" y="483" class="b">Возвратная / Return</text><text x="73" y="520" class="s">Переезд с последующим возвращением</text><text x="73" y="550" class="n">Movement followed by return</text><rect x="520" y="445" width="360" height="150" fill="#f5e7d9" class="box"/><text x="538" y="483" class="b">Вынужденная / Forced</text><text x="538" y="520" class="s">Перемещение из-за угроз и кризисов</text><text x="538" y="550" class="n">Movement due to threats or crises</text><rect x="995" y="445" width="350" height="150" fill="#e7ecf2" class="box"/><text x="1013" y="483" class="b">Поток и запас / Flow and stock</text><text x="1013" y="520" class="s">Перемещения за период vs. число людей на дату</text><text x="1013" y="550" class="n">Moves over time vs. people at a date</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No country-specific data implied</text></svg>