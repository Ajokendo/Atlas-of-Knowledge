<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Почвенный профиль / Soil profile</title><desc id="d">Обобщённая последовательность; не все горизонты есть в каждой почве. / Generalised sequence; not every soil contains every horizon.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:26px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Почвенный профиль / Soil profile</text><text x="55" y="100" class="s">Обобщённая последовательность; не все горизонты есть в каждой почве. / Generalised sequence; not every soil contains every horizon.</text><rect x="180" y="165" width="500" height="520" fill="#d7c4a6" stroke="#526579" stroke-width="4"/><rect x="182" y="167" width="496" height="55" fill="#40332d"/><rect x="182" y="222" width="496" height="75" fill="#664b39"/><rect x="182" y="297" width="496" height="65" fill="#d9cba9"/><rect x="182" y="362" width="496" height="105" fill="#a36c4c"/><rect x="182" y="467" width="496" height="105" fill="#bd9870"/><rect x="182" y="572" width="496" height="111" fill="#817d75"/><path d="M680 194 H760" stroke="#526579" stroke-width="3"/><text x="790" y="202" class="b">H</text><text x="850" y="200" class="n">Органический / Organic</text><path d="M680 264 H760" stroke="#526579" stroke-width="3"/><text x="790" y="272" class="b">O</text><text x="850" y="270" class="n">Подстилка / Litter</text><path d="M680 334 H760" stroke="#526579" stroke-width="3"/><text x="790" y="342" class="b">A</text><text x="850" y="340" class="n">Верхний минеральный / Topsoil</text><path d="M680 404 H760" stroke="#526579" stroke-width="3"/><text x="790" y="412" class="b">E</text><text x="850" y="410" class="n">Вымывание / Eluviation</text><path d="M680 474 H760" stroke="#526579" stroke-width="3"/><text x="790" y="482" class="b">B</text><text x="850" y="480" class="n">Накопление / Accumulation</text><path d="M680 544 H760" stroke="#526579" stroke-width="3"/><text x="790" y="552" class="b">C</text><text x="850" y="550" class="n">Материнский материал / Parent material</text><path d="M680 614 H760" stroke="#526579" stroke-width="3"/><text x="790" y="622" class="b">R</text><text x="850" y="620" class="n">Коренная порода / Bedrock</text><text x="55" y="720" class="n">Горизонты описывают слои, но не заменяют классификацию WRB. / Horizons describe layers; they do not replace WRB classification.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual teaching diagram • Conceptual, not site-specific</text></svg>