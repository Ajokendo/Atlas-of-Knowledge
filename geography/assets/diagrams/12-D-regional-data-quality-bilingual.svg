<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Проверка качества региональных данных / Regional data quality checks</title><desc id="d">Шесть вопросов перед сравнением региональных данных: границы и территория, дата и период, классификация, единицы и знаменатель, источник и метод, сопоставимость и неопределённость. / Six checks before comparing regional data: boundaries and territory, date and period, classification, units and denominator, source and method, comparability and uncertainty.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.c{fill:#f2f7f9;stroke:#7893a1;stroke-width:2}.n{font:700 28px Arial;fill:#fff}.circle{fill:#315d76}</style><rect width="1200" height="760" fill="#fff"/><text x="600" y="55" text-anchor="middle" class="h">Можно ли сравнивать эти регионы? / Are these regions comparable?</text><g transform="translate(45 110)"><rect width="520" height="170" rx="14" class="c"/><circle cx="45" cy="45" r="27" class="circle"/><text x="45" y="55" text-anchor="middle" class="n">1</text><text x="90" y="43" class="t">Границы и территория</text><text x="90" y="70" class="s">Boundaries and territory</text><text x="25" y="115" class="s">Одинаковы ли границы и статус территории?</text><text x="25" y="143" class="s">Same boundaries and territorial status?</text></g><g transform="translate(605 110)"><rect width="520" height="170" rx="14" class="c"/><circle cx="45" cy="45" r="27" class="circle"/><text x="45" y="55" text-anchor="middle" class="n">2</text><text x="90" y="43" class="t">Дата и период</text><text x="90" y="70" class="s">Date and period</text><text x="25" y="115" class="s">Совпадают ли годы и временные интервалы?</text><text x="25" y="143" class="s">Same years and reference periods?</text></g><g transform="translate(45 315)"><rect width="520" height="170" rx="14" class="c"/><circle cx="45" cy="45" r="27" class="circle"/><text x="45" y="55" text-anchor="middle" class="n">3</text><text x="90" y="43" class="t">Классификация</text><text x="90" y="70" class="s">Classification</text><text x="25" y="115" class="s">Одинаково ли определены категории?</text><text x="25" y="143" class="s">Are categories defined consistently?</text></g><g transform="translate(605 315)"><rect width="520" height="170" rx="14" class="c"/><circle cx="45" cy="45" r="27" class="circle"/><text x="45" y="55" text-anchor="middle" class="n">4</text><text x="90" y="43" class="t">Единицы и знаменатель</text><text x="90" y="70" class="s">Units and denominator</text><text x="25" y="115" class="s">Одинаковые ли единицы, население и площадь?</text><text x="25" y="143" class="s">Same units, population and area denominator?</text></g><g transform="translate(45 520)"><rect width="520" height="170" rx="14" class="c"/><circle cx="45" cy="45" r="27" class="circle"/><text x="45" y="55" text-anchor="middle" class="n">5</text><text x="90" y="43" class="t">Источник и метод</text><text x="90" y="70" class="s">Source and method</text><text x="25" y="115" class="s">Известны ли происхождение и метод расчёта?</text><text x="25" y="143" class="s">Are provenance and calculation method known?</text></g><g transform="translate(605 520)"><rect width="520" height="170" rx="14" class="c"/><circle cx="45" cy="45" r="27" class="circle"/><text x="45" y="55" text-anchor="middle" class="n">6</text><text x="90" y="43" class="t">Сопоставимость и неопределённость</text><text x="90" y="70" class="s">Comparability and uncertainty</text><text x="25" y="115" class="s">Описаны ли разрывы, пропуски и погрешность?</text><text x="25" y="143" class="s">Are breaks, gaps and uncertainty described?</text></g><text x="600" y="745" text-anchor="middle" class="s">Если хотя бы один пункт не совпадает, объясните ограничение или не объединяйте показатели в один рейтинг. / If any item differs, explain the limitation or do not combine the indicators into one ranking.</text></svg>