<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Дикие родичи культурных растений Кыргызстана / Crop wild relatives of Kyrgyzstan</title><desc id="desc">Таблица основных диких родичей плодовых и орехоплодных культур. / Table of the main wild relatives of fruit and nut crops.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Дикие родичи культурных растений Кыргызстана</text><text x="40" y="74" class="sub" style="fill:#526579">Crop wild relatives of Kyrgyzstan</text><text x="60" y="125" class="lab" text-anchor="start" >Культура / Crop</text><text x="400" y="125" class="lab" text-anchor="start" >Латинское название / Latin name</text><text x="780" y="125" class="lab" text-anchor="start" >Где растёт / Typical habitat</text><rect x="40" y="150" width="1320" height="92" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="60" y="188" class="t" text-anchor="start" >Яблоня Сиверса</text><text x="60" y="216" class="s" text-anchor="start" >Sievers' apple</text><text x="400" y="196" class="t" text-anchor="start" style="font-style:italic">Malus sieversii</text><text x="780" y="188" class="s" text-anchor="start" >Дикий родич яблони</text><text x="780" y="216" class="s" text-anchor="start" style="fill:#526579">Wild relative of apple</text><rect x="40" y="260" width="1320" height="92" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="60" y="298" class="t" text-anchor="start" >Абрикос</text><text x="60" y="326" class="s" text-anchor="start" >Apricot</text><text x="400" y="306" class="t" text-anchor="start" style="font-style:italic">Prunus armeniaca</text><text x="780" y="298" class="s" text-anchor="start" >Плодовые леса и склоны</text><text x="780" y="326" class="s" text-anchor="start" style="fill:#526579">Fruit forests and slopes</text><rect x="40" y="370" width="1320" height="92" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="60" y="408" class="t" text-anchor="start" >Грецкий орех</text><text x="60" y="436" class="s" text-anchor="start" >Walnut</text><text x="400" y="416" class="t" text-anchor="start" style="font-style:italic">Juglans regia</text><text x="780" y="408" class="s" text-anchor="start" >Ореховые леса юга Кыргызстана</text><text x="780" y="436" class="s" text-anchor="start" style="fill:#526579">Walnut forests in the south</text><rect x="40" y="480" width="1320" height="92" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="60" y="518" class="t" text-anchor="start" >Фисташка</text><text x="60" y="546" class="s" text-anchor="start" >Pistachio</text><text x="400" y="526" class="t" text-anchor="start" style="font-style:italic">Pistacia vera</text><text x="780" y="518" class="s" text-anchor="start" >Сухие южные склоны</text><text x="780" y="546" class="s" text-anchor="start" style="fill:#526579">Dry southern slopes</text><rect x="40" y="590" width="1320" height="92" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="60" y="628" class="t" text-anchor="start" >Груша</text><text x="60" y="656" class="s" text-anchor="start" >Pear</text><text x="400" y="636" class="t" text-anchor="start" style="font-style:italic">Pyrus spp.</text><text x="780" y="628" class="s" text-anchor="start" >Горные леса и кустарники</text><text x="780" y="656" class="s" text-anchor="start" style="fill:#526579">Mountain forests and scrub</text><text x="40" y="766" class="sm">Названия приведены по тексту главы; таксоны и охранный статус проверяйте по ботаническим источникам и Красной книге КР.</text><text x="40" y="786" class="sm" style="fill:#526579">Names follow the chapter text; verify taxa and conservation status against botanical sources and the Red Data Book of Kyrgyzstan.</text></svg>