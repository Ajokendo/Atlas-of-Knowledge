<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="t"><title id="t">Широта и долгота / Latitude and longitude</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="700" fill="#fbfcfe"/><text x="30" y="46" class="h">Широта и долгота</text><text x="30" y="76" class="sub">Latitude and longitude</text><circle cx="300" cy="340" r="190" fill="#e3f0fa" stroke="#5d9bc4" stroke-width="3"/><ellipse cx="300" cy="340" rx="190" ry="55" fill="none" stroke="#243447" stroke-width="2"/><text x="500" y="346" class="r2">0° экватор</text><ellipse cx="300" cy="211" rx="139" ry="35" fill="none" stroke="#c0392b" stroke-width="3"/><text x="451" y="217" class="r2" style="fill:#c0392b">42,9° с. ш.</text><ellipse cx="300" cy="340" rx="55" ry="190" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><ellipse cx="385" cy="340" rx="85" ry="190" fill="none" stroke="#c0392b" stroke-width="3" transform="rotate(0)" clip-path="none" opacity="0"/><text x="300" y="136" class="r2" text-anchor="middle">С</text><text x="300" y="564" class="r2" text-anchor="middle">Ю</text><rect x="620" y="150" width="340" height="200" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="640" y="190" class="r" text-anchor="start">Бишкек</text><text x="640" y="214" class="e" text-anchor="start">Bishkek</text><text x="640" y="255" class="r2">широта ≈ 42,9° с. ш.</text><text x="640" y="276" class="e2">latitude ≈ 42.9° N</text><text x="640" y="310" class="r2">долгота ≈ 74,6° в. д.</text><text x="640" y="331" class="e2">longitude ≈ 74.6° E</text><text x="620" y="400" class="r2" text-anchor="start">Широта — угол к северу или югу от</text><text x="620" y="424" class="r2" text-anchor="start">экватора (0–90°). Долгота — угол к</text><text x="620" y="448" class="r2" text-anchor="start">востоку или западу от Гринвича</text><text x="620" y="472" class="r2" text-anchor="start">(0–180°).</text><text x="620" y="494" class="e2" text-anchor="start">Latitude is the angle north or south of</text><text x="620" y="513" class="e2" text-anchor="start">the equator (0–90°). Longitude is the</text><text x="620" y="532" class="e2" text-anchor="start">angle east or west of Greenwich (0–180°).</text><text x="30" y="662" class="sm">Координаты Бишкека округлены до 0,1°.</text><text x="30" y="684" class="sm" style="fill:#526579">Bishkek coordinates rounded to 0.1°.</text></svg>