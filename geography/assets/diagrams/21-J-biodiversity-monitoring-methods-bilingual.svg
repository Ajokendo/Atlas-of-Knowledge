<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Методы мониторинга биоразнообразия / Biodiversity monitoring methods</title><desc id="desc">Методы дополняют друг друга; выбор зависит от вида, среды, вопроса и разрешений. / Methods are complementary; selection depends on taxa, habitat, question and permits.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Методы мониторинга биоразнообразия / Biodiversity monitoring methods</text><text x="50" y="88" class="sub">Методы дополняют друг друга; выбор зависит от вида, среды, вопроса и разрешений. / Methods are complementary; selection depends on taxa, habitat, question and permits.</text>
<rect x="45" y="145" width="420" height="175" fill="#e5efe3" class="box"/><text x="63" y="180" class="t">Трансекты и учётные площадки / Transects and plots</text><text x="63" y="215" class="s">Встречаемость, покров, состав</text><text x="63" y="242" class="s">Encounters, cover, composition</text><text x="63" y="269" class="s">Ограничение: сезонность и обнаруживаемость</text><text x="63" y="296" class="s">Limit: season and detectability</text>
<rect x="490" y="145" width="420" height="175" fill="#e5edf4" class="box"/><text x="508" y="180" class="t">Фотоловушки / Camera traps</text><text x="508" y="215" class="s">Активность и присутствие животных</text><text x="508" y="242" class="s">Animal activity and presence</text><text x="508" y="269" class="s">Ограничение: размещение и смещение выборки</text><text x="508" y="296" class="s">Limit: placement and sampling bias</text>
<rect x="935" y="145" width="420" height="175" fill="#f4ecd9" class="box"/><text x="953" y="180" class="t">GPS-телеметрия / GPS telemetry</text><text x="953" y="215" class="s">Перемещения и использование местообитаний</text><text x="953" y="242" class="s">Movement and habitat use</text><text x="953" y="269" class="s">Ограничение: разрешения и благополучие животных</text><text x="953" y="296" class="s">Limit: permits and animal welfare</text>
<rect x="45" y="365" width="420" height="175" fill="#f2e9e5" class="box"/><text x="63" y="400" class="t">eDNA / Environmental DNA</text><text x="63" y="435" class="s">Следы видов в воде и субстратах</text><text x="63" y="462" class="s">Species traces in water and substrates</text><text x="63" y="489" class="s">Ограничение: загрязнение и контроль проб</text><text x="63" y="516" class="s">Limit: contamination and sample controls</text>
<rect x="490" y="365" width="420" height="175" fill="#e8eef4" class="box"/><text x="508" y="400" class="t">Спутниковый анализ / Satellite analysis</text><text x="508" y="435" class="s">Покров, изменения и связность</text><text x="508" y="462" class="s">Cover, change and connectivity</text><text x="508" y="489" class="s">Ограничение: разрешение и полевая проверка</text><text x="508" y="516" class="s">Limit: resolution and ground validation</text>
<rect x="935" y="365" width="420" height="175" fill="#e7efe2" class="box"/><text x="953" y="400" class="t">Совместная интерпретация / Integrated interpretation</text><text x="953" y="435" class="s">Сопоставление независимых данных</text><text x="953" y="462" class="s">Compare independent evidence</text><text x="953" y="489" class="s">Повторяемый протокол и метаданные</text><text x="953" y="516" class="s">Repeatable protocol and metadata</text>
<path d="M255 320 V350 M700 320 V350 M1145 320 V350 M465 455 H490 M910 455 H935" class="arr"/>
<text x="700" y="640" text-anchor="middle" class="s">Чувствительные координаты редких видов обобщают при публикации / Generalise sensitive locations of rare species before publication</text>
<text x="50" y="770" class="sm">Atlas of Knowledge • Conceptual teaching visual; no site-specific boundaries or measured values are implied. / Учебная концептуальная схема; точные границы и измеренные значения не подразумеваются.</text></svg>