<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Высотная поясность растительности / Altitudinal vegetation belts</title><desc id="desc">Качественная последовательность сообществ; высотные границы меняются по экспозиции, влажности и региону. / Qualitative sequence; belt limits vary with aspect, moisture and region.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Высотная поясность растительности / Altitudinal vegetation belts</text><text x="50" y="88" class="sub">Качественная последовательность сообществ; высотные границы меняются по экспозиции, влажности и региону. / Qualitative sequence; belt limits vary with aspect, moisture and region.</text>
<path d="M65 610 L190 565 L315 505 L445 430 L575 330 L690 250 L805 315 L930 400 L1060 475 L1200 545 L1340 605 L1340 700 L65 700Z" fill="#d9e5d3" stroke="#647c66" stroke-width="4"/>
<rect x="65" y="140" width="220" height="150" fill="#f5ecd9" class="box"/><text x="83" y="175" class="t">Сухие предгорья / Dry foothills</text><text x="83" y="210" class="s">Степи и кустарники</text><text x="83" y="237" class="s">Steppe and shrubs</text>
<rect x="305" y="140" width="220" height="150" fill="#e7edda" class="box"/><text x="323" y="175" class="t">Горная степь / Montane steppe</text><text x="323" y="210" class="s">Травы и кустарники</text><text x="323" y="237" class="s">Grasses and shrubs</text>
<rect x="545" y="140" width="220" height="150" fill="#e1eedf" class="box"/><text x="563" y="175" class="t">Еловые леса / Spruce forests</text><text x="563" y="210" class="s">Picea schrenkiana</text><text x="563" y="237" class="s">На подходящих склонах / Suitable slopes</text>
<rect x="785" y="140" width="220" height="150" fill="#e5f0e8" class="box"/><text x="803" y="175" class="t">Субальпийские и альпийские луга / Subalpine and alpine meadows</text><text x="803" y="210" class="s">Луга и высокогорные травы</text><text x="803" y="237" class="s">Meadows and alpine herbs</text>
<rect x="1025" y="140" width="310" height="150" fill="#e8eef4" class="box"/><text x="1043" y="175" class="t">Нивально-скальный пояс / Nival and rocky belt</text><text x="1043" y="210" class="s">Скалы, снег, ледники</text><text x="1043" y="237" class="s">Rock, snow and glaciers</text>
