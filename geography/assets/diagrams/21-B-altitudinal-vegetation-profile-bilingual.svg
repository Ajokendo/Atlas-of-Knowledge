<text x="700" y="735" text-anchor="middle" class="s">Высота обычно растёт слева направо / Elevation generally increases from left to right</text><text x="50" y="770" class="sm">Atlas of Knowledge • Conceptual teaching visual; no site-specific boundaries or measured values are implied. / Учебная концептуальная схема; точные границы и измеренные значения не подразумеваются.</text></svg>