<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">Панорама наземных биомов / Terrestrial biome panorama</title><desc id="desc">Одиннадцать схематических ландшафтных сцен: влажный и сезонный тропические леса, тропические хвойные леса, саванна, пустыня, средиземноморское редколесье, умеренный широколиственный лес, умеренный хвойный лес, тайга, горные луга, а также затопляемые луга и мангры. Scenes are conceptual and do not represent specific locations or current land cover.</desc><rect width="1200" height="1150" fill="#f7fafc"/><text x="600" y="42" text-anchor="middle" font-size="27" font-weight="bold">ПАНОРАМА НАЗЕМНЫХ БИОМОВ / TERRESTRIAL BIOME PANORAMA</text><text x="600" y="72" text-anchor="middle" font-size="15">11 схематических примеров / 11 conceptual examples</text>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17384a">
