<g transform="translate(25 610)"><rect width="360" height="230" rx="12" fill="#e5f0df" stroke="#8ba27e"/><rect x="8" y="8" width="344" height="125" rx="8" fill="#d6e8d4"/><path d="M8 122Q120 105 220 121T352 120V133H8Z" fill="#6e965c"/><g fill="#43744c"><circle cx="80" cy="86" r="25"/><circle cx="105" cy="91" r="20"/><circle cx="245" cy="86" r="28"/><circle cx="275" cy="94" r="20"/></g><text x="180" y="158" font-size="18" font-weight="bold">Умеренный широколиственный лес</text><text x="180" y="181" font-size="15">Temperate broadleaf forest</text><text x="180" y="207" font-size="13">Сезонность · листопадные деревья</text><text x="180" y="224" font-size="13">Seasonality · deciduous trees</text></g>
