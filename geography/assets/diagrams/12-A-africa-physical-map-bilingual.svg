<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Физическая география Африки / Physical Geography of Africa</title>
<desc id="desc">Физическая карта рельефа и батиметрии Африки с приблизительными учебными метками Атласских гор, Сахары, нагорья Ахаггар, Эфиопского нагорья, Восточно-Африканского рифта, бассейна Конго, Калахари и Драконовых гор. Справа приведён список основных рек: Нил, Нигер, Конго и Замбези. Метки ориентировочные и не являются точной геопривязкой. / Physical relief and bathymetry map of Africa with approximate teaching markers for the Atlas Mountains, Sahara, Ahaggar Highlands, Ethiopian Highlands, East African Rift, Congo Basin, Kalahari and Drakensberg. A side list names the Nile, Niger, Congo and Zambezi rivers. Markers are approximate and are not precise georeferencing.</desc>
<style>
.h{font:700 25px Arial,sans-serif;fill:#172b36}.t{font:20px Arial,sans-serif;fill:#172b36}.s{font:16px Arial,sans-serif;fill:#344b56}.num{font:700 18px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.marker{fill:#a43d2e;stroke:#fff;stroke-width:3}.panel{fill:#f7fafb;stroke:#536d78;stroke-width:2}
</style>
<rect width="1200" height="1000" fill="#fff"/>
<image href="https://upload.wikimedia.org/wikipedia/commons/c/cb/%C3%81frica_-_mapa_f%C3%ADsico_mudo_con_relieve_%28Atlas_Abierto%29.png" x="0" y="0" width="960" height="1000" preserveAspectRatio="xMidYMid meet"/>
<rect x="970" y="20" width="215" height="960" rx="18" class="panel"/>
<text x="1077" y="60" text-anchor="middle" class="h">Рельеф / Relief</text>
<g>
<circle cx="250" cy="205" r="17" class="marker"/><text x="250" y="205" class="num">1</text>
<circle cx="440" cy="325" r="17" class="marker"/><text x="440" y="325" class="num">2</text>
<circle cx="360" cy="390" r="17" class="marker"/><text x="360" y="390" class="num">3</text>
<circle cx="700" cy="400" r="17" class="marker"/><text x="700" y="400" class="num">4</text>
<circle cx="735" cy="610" r="17" class="marker"/><text x="735" y="610" class="num">5</text>
<circle cx="500" cy="585" r="17" class="marker"/><text x="500" y="585" class="num">6</text>
<circle cx="540" cy="760" r="17" class="marker"/><text x="540" y="760" class="num">7</text>
<circle cx="620" cy="850" r="17" class="marker"/><text x="620" y="850" class="num">8</text>
</g>
<g transform="translate(990 100)">
<text x="0" y="0" class="t">1. Атласские горы</text><text x="0" y="25" class="s">Atlas Mountains</text>
<text x="0" y="88" class="t">2. Сахара</text><text x="0" y="113" class="s">Sahara</text>
<text x="0" y="176" class="t">3. Ахаггар</text><text x="0" y="201" class="s">Ahaggar Highlands</text>
<text x="0" y="264" class="t">4. Эфиопское нагорье</text><text x="0" y="289" class="s">Ethiopian Highlands</text>
<text x="0" y="352" class="t">5. Восточно-Афр. рифт</text><text x="0" y="377" class="s">East African Rift</text>
<text x="0" y="440" class="t">6. Бассейн Конго</text><text x="0" y="465" class="s">Congo Basin</text>
<text x="0" y="528" class="t">7. Калахари</text><text x="0" y="553" class="s">Kalahari</text>
<text x="0" y="616" class="t">8. Драконовы горы</text><text x="0" y="641" class="s">Drakensberg</text>
<path d="M0 690 H175" stroke="#78909a" stroke-width="2"/>
<text x="0" y="730" class="h">Реки / Rivers</text>
<text x="0" y="770" class="t">Нил / Nile</text>
<text x="0" y="808" class="t">Нигер / Niger</text>
<text x="0" y="846" class="t">Конго / Congo</text>
<text x="0" y="884" class="t">Замбези / Zambezi</text>
</g>
<text x="480" y="982" text-anchor="middle" class="s">Основа рельефа: Atlas Abierto (2026), CC BY 4.0; ETOPO 2022 и Natural Earth. Метки добавлены для учебной ориентации. / Relief base: Atlas Abierto (2026), CC BY 4.0; ETOPO 2022 and Natural Earth. Labels added for teaching orientation.</text>
</svg>