<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Воспроизводимый географический проект / Reproducible geographic project</title><desc id="d">Схема связывает исходные данные, метаданные, скрипты, программную среду, обработку и результаты. Внизу показаны лицензии, журнал изменений, контроль доступа и защита чувствительных данных. / Diagram links raw data, metadata, scripts, software environment, processing and outputs. The footer covers licences, change log, access control and protection of sensitive data.</desc><style>.h{font:700 28px Arial;fill:#17324d}.th{font:700 19px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.p{fill:#f2f7f8;stroke:#397a8d;stroke-width:2.5}.a{stroke:#397a8d;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397a8d"/></marker></defs><rect width="1200" height="700" fill="white"/><text x="600" y="45" text-anchor="middle" class="h">Воспроизводимый географический проект / Reproducible project</text><g><rect x="35" y="100" width="350" height="110" rx="12" class="p"/><text x="210" y="135" text-anchor="middle" class="th">01. Исходные данные / Raw data</text><text x="210" y="168" text-anchor="middle" class="s">Источник, дата, лицензия / Source, date, licence</text><text x="210" y="192" text-anchor="middle" class="s">Неизменённая копия / Immutable copy</text><rect x="425" y="100" width="350" height="110" rx="12" class="p"/><text x="600" y="135" text-anchor="middle" class="th">02. Метаданные / Metadata</text><text x="600" y="168" text-anchor="middle" class="s">CRS, период, единицы / CRS, period, units</text><text x="600" y="192" text-anchor="middle" class="s">Точность и ограничения / Accuracy and limits</text><rect x="815" y="100" width="350" height="110" rx="12" class="p"/><text x="990" y="135" text-anchor="middle" class="th">03. Скрипты / Scripts</text><text x="990" y="168" text-anchor="middle" class="s">Версионируемый код / Versioned code</text><text x="990" y="192" text-anchor="middle" class="s">Параметры и зависимости / Parameters and dependencies</text><rect x="35" y="330" width="350" height="110" rx="12" class="p"/><text x="210" y="365" text-anchor="middle" class="th">04. Среда / Environment</text><text x="210" y="398" text-anchor="middle" class="s">Версии ПО и библиотек / Software versions</text><rect x="425" y="330" width="350" height="110" rx="12" class="p"/><text x="600" y="365" text-anchor="middle" class="th">05. Обработка / Processing</text><text x="600" y="398" text-anchor="middle" class="s">Workflow и проверки / Workflow and checks</text><rect x="815" y="330" width="350" height="110" rx="12" class="p"/><text x="990" y="365" text-anchor="middle" class="th">06. Результаты / Outputs</text><text x="990" y="398" text-anchor="middle" class="s">Карты, таблицы, данные / Maps, tables, data</text></g><g class="a" marker-end="url(#a)"><path d="M385 155H415"/><path d="M775 155H805"/><path d="M990 210V270H210V320"/><path d="M385 385H415"/><path d="M775 385H805"/></g><rect x="155" y="520" width="890" height="105" rx="12" fill="#fff7ed" stroke="#b66a3c" stroke-width="2.5"/><text x="600" y="557" text-anchor="middle" class="th">Права и ответственная публикация / Rights and responsible publication</text><text x="600" y="590" text-anchor="middle" class="s">Авторство · лицензии · журнал изменений · доступ · защита чувствительных данных</text><text x="600" y="615" text-anchor="middle" class="s">Authorship · licences · change log · access · sensitive-data protection</text><path d="M210 440V510 M990 440V510" class="a" marker-end="url(#a)"/><text x="600" y="670" text-anchor="middle" class="s">Схема процесса, а не обязательный программный стек. / Workflow model, not a mandatory software stack.</text></svg>