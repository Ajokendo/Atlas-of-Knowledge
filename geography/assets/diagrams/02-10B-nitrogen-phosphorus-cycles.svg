<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Nitrogen and phosphorus cycles / Круговороты азота и фосфора</title><desc id="d">Side-by-side bilingual conceptual diagrams. Nitrogen has a major atmospheric reservoir and microbial transformations; phosphorus cycles mainly through rocks, soils, water and organisms, with no major gaseous phase. / Две концептуальные схемы. У азота есть крупный атмосферный резервуар и микробные превращения; фосфор циркулирует главным образом между породами, почвами, водой и организмами без значительной газовой фазы.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">Nitrogen and Phosphorus Cycles / Круговороты азота и фосфора</text><rect x="55" y="105" width="680" height="710" rx="24" fill="#edf5fb" stroke="#3979a8" stroke-width="4"/><rect x="765" y="105" width="680" height="710" rx="24" fill="#f2f0e8" stroke="#a66b35" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="395" y="160" font-size="32" font-weight="700" fill="#174e78">Nitrogen cycle / Азотный цикл</text><rect x="220" y="205" width="350" height="78" rx="16" fill="#dcecf8" stroke="#3979a8" stroke-width="3"/><text x="395" y="253" font-size="25" fill="#174e78">Atmospheric N₂ / N₂ атмосферы</text><rect x="95" y="390" width="260" height="95" rx="16" fill="#e1eedc" stroke="#56874b" stroke-width="3"/><text x="225" y="430" font-size="23" fill="#386432">Plants / Растения</text><text x="225" y="460" font-size="19" fill="#386432">Assimilation / Усвоение</text><rect x="435" y="390" width="260" height="95" rx="16" fill="#f3e9d9" stroke="#a66b35" stroke-width="3"/><text x="565" y="430" font-size="23" fill="#805024">Soil NH₄⁺ / Почва</text><text x="565" y="460" font-size="19" fill="#805024">Ammonium / Аммоний</text><rect x="220" y="600" width="350" height="95" rx="16" fill="#e8e4f4" stroke="#7766a8" stroke-width="3"/><text x="395" y="640" font-size="23" fill="#514477">NO₂⁻ and NO₃⁻</text><text x="395" y="670" font-size="20" fill="#514477">Nitrite and nitrate / Нитрит и нитрат</text><path d="M395 283V375 M355 440H425 M565 485Q565 550 475 590 M315 600Q225 560 225 495 M225 390Q150 330 255 280 M535 600Q650 555 565 485" fill="none" stroke="#52697c" stroke-width="6"/><g fill="#52697c"><path d="M385 365l10 15 10-15z"/><path d="M415 430l15 10-15 10z"/><path d="M460 580l15 15-25 0z"/><path d="M215 505l10-15 10 15z"/></g><text x="395" y="755" font-size="20" fill="#38566f">Fixation • nitrification • uptake •</text><text x="395" y="785" font-size="20" fill="#38566f">ammonification • denitrification / фиксация • нитрификация • усвоение • аммонификация • денитрификация</text><text x="1105" y="160" font-size="32" font-weight="700" fill="#805024">Phosphorus cycle / Фосфорный цикл</text><rect x="930" y="205" width="350" height="78" rx="16" fill="#f3e9d9" stroke="#a66b35" stroke-width="3"/><text x="1105" y="253" font-size="25" fill="#805024">Phosphate rocks / Фосфатные породы</text><rect x="815" y="390" width="260" height="95" rx="16" fill="#e1eedc" stroke="#56874b" stroke-width="3"/><text x="945" y="430" font-size="23" fill="#386432">Plants / Растения</text><text x="945" y="460" font-size="19" fill="#386432">Uptake / Поглощение</text><rect x="1135" y="390" width="260" height="95" rx="16" fill="#d9eef0" stroke="#278c96" stroke-width="3"/><text x="1265" y="430" font-size="23" fill="#17656d">Water / Вода</text><text x="1265" y="460" font-size="19" fill="#17656d">Dissolved phosphate / Фосфат</text><rect x="930" y="600" width="350" height="95" rx="16" fill="#e8e4f4" stroke="#7766a8" stroke-width="3"/><text x="1105" y="640" font-size="23" fill="#514477">Sediments / Осадки</text><text x="1105" y="670" font-size="20" fill="#514477">Burial and uplift / Захоронение и поднятие</text><path d="M1105 283V375 M1075 440H1125 M1265 485Q1265 550 1180 590 M1030 600Q945 555 945 495 M945 390Q870 330 965 280" fill="none" stroke="#8a6b43" stroke-width="6"/><g fill="#8a6b43"><path d="M1095 365l10 15 10-15z"/><path d="M1115 430l15 10-15 10z"/><path d="M1165 580l15 15-25 0z"/><path d="M935 505l10-15 10 15z"/></g><text x="1105" y="755" font-size="20" fill="#38566f">Weathering • uptake • food webs •</text><text x="1105" y="785" font-size="20" fill="#38566f">decomposition • sedimentation / выветривание • усвоение • пищевые цепи • разложение • осаждение</text><text x="750" y="860" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#38566f">Conceptual pathways; the phosphorus cycle has no major gaseous phase / Концептуальные пути; у фосфорного цикла нет значительной газовой фазы</text></g></svg>