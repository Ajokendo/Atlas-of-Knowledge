<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="t d"><title id="t">Nitrogen and phosphorus cycles / Круговороты азота и фосфора</title><desc id="d">Two bilingual conceptual cycles. Nitrogen moves from atmospheric N2 through microbial fixation, ammonium, nitrate and organisms, with ammonification and denitrification returning nitrogen. Phosphorus moves from rocks through soil, water and organisms to sediments and geological uplift; it has no major gaseous phase. / Два двуязычных цикла. Азот проходит из атмосферного N2 через микробную фиксацию, аммоний, нитрат и организмы; аммонификация и денитрификация возвращают азот. Фосфор перемещается из пород через почву, воду и организмы в осадки и возвращается при геологическом поднятии; значительной газовой фазы нет.</desc><rect width="1500" height="1000" fill="#f7fafc"/><text x="750" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">Nitrogen and Phosphorus Cycles / Круговороты азота и фосфора</text><rect x="45" y="100" width="700" height="825" rx="24" fill="#edf5fb" stroke="#3979a8" stroke-width="4"/><rect x="755" y="100" width="700" height="825" rx="24" fill="#f2f0e8" stroke="#a66b35" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="395" y="155" font-size="32" font-weight="700" fill="#174e78">Nitrogen cycle / Азотный цикл</text><rect x="245" y="190" width="300" height="76" rx="16" fill="#dcecf8" stroke="#3979a8" stroke-width="3"/><text x="395" y="238" font-size="25" fill="#174e78">Atmospheric N₂ / N₂ атмосферы</text><rect x="245" y="330" width="300" height="82" rx="16" fill="#e8e4f4" stroke="#7766a8" stroke-width="3"/><text x="395" y="365" font-size="22" fill="#514477">Microbial fixation /</text><text x="395" y="393" font-size="21" fill="#514477">Микробная фиксация</text><rect x="245" y="475" width="300" height="76" rx="16" fill="#f3e9d9" stroke="#a66b35" stroke-width="3"/><text x="395" y="523" font-size="25" fill="#805024">Soil NH₄⁺ / NH₄⁺ в почве</text><rect x="245" y="615" width="300" height="76" rx="16" fill="#f3e9d9" stroke="#a66b35" stroke-width="3"/><text x="395" y="663" font-size="25" fill="#805024">Soil NO₃⁻ / NO₃⁻ в почве</text><rect x="245" y="755" width="300" height="76" rx="16" fill="#e1eedc" stroke="#56874b" stroke-width="3"/><text x="395" y="803" font-size="24" fill="#386432">Organisms / Организмы</text><path d="M395 266V322 M395 412V467 M395 551V607 M395 691V747" stroke="#52697c" stroke-width="6" fill="none"/><g fill="#52697c"><path d="M385 312l10 15 10-15z"/><path d="M385 457l10 15 10-15z"/><path d="M385 597l10 15 10-15z"/><path d="M385 737l10 15 10-15z"/></g><text x="425" y="298" font-size="18" fill="#38566f">Fixation / фиксация</text><text x="425" y="445" font-size="18" fill="#38566f">NH₄⁺ production / образование NH₄⁺</text><text x="425" y="585" font-size="18" fill="#38566f">Nitrification / нитрификация</text><text x="425" y="725" font-size="18" fill="#38566f">Plant uptake / усвоение</text><path d="M545 653Q680 650 680 230Q680 170 555 220" stroke="#56874b" stroke-width="6" fill="none"/><path d="M570 205l-18 15 20 10z" fill="#56874b"/><text x="665" y="455" font-size="18" fill="#386432" transform="rotate(-90 665 455)">Denitrification / денитрификация</text><path d="M545 795Q610 875 620 500Q620 480 555 510" stroke="#a66b35" stroke-width="5" fill="none"/><path d="M565 493l-10 18 20-1z" fill="#a66b35"/><text x="590" y="860" font-size="17" fill="#805024">Ammonification / Аммонификация</text><text x="395" y="890" font-size="18" fill="#38566f">Simplified pathways; microbes drive key transformations / Упрощённая схема; микроорганизмы обеспечивают ключевые превращения</text><text x="1105" y="155" font-size="32" font-weight="700" fill="#805024">Phosphorus cycle / Фосфорный цикл</text><rect x="955" y="190" width="300" height="76" rx="16" fill="#f3e9d9" stroke="#a66b35" stroke-width="3"/><text x="1105" y="238" font-size="25" fill="#805024">Phosphate rocks / Фосфатные породы</text><rect x="955" y="330" width="300" height="76" rx="16" fill="#f3e9d9" stroke="#a66b35" stroke-width="3"/><text x="1105" y="378" font-size="25" fill="#805024">Soil phosphate / Фосфат в почве</text><rect x="955" y="475" width="300" height="76" rx="16" fill="#e1eedc" stroke="#56874b" stroke-width="3"/><text x="1105" y="523" font-size="25" fill="#386432">Plants and food webs /</text><text x="1105" y="550" font-size="19" fill="#386432">Растения и пищевые цепи</text><rect x="955" y="625" width="300" height="76" rx="16" fill="#d9eef0" stroke="#278c96" stroke-width="3"/><text x="1105" y="673" font-size="25" fill="#17656d">Water phosphate /</text><text x="1105" y="699" font-size="19" fill="#17656d">Фосфат в воде</text><rect x="955" y="775" width="300" height="76" rx="16" fill="#e8e4f4" stroke="#7766a8" stroke-width="3"/><text x="1105" y="823" font-size="25" fill="#514477">Sediments / Донные осадки</text><path d="M955 515Q875 515 875 368H945" stroke="#56874b" stroke-width="5" fill="none"/><path d="M930 353l18 15-20 10z" fill="#56874b"/><text x="865" y="465" font-size="18" fill="#386432" transform="rotate(-90 865 465)">Decomposition / разложение</text><path d="M1105 266V322 M1105 406V467 M1105 551V617 M1105 701V767" stroke="#8a6b43" stroke-width="6" fill="none"/><g fill="#8a6b43"><path d="M1095 312l10 15 10-15z"/><path d="M1095 457l10 15 10-15z"/><path d="M1095 607l10 15 10-15z"/><path d="M1095 757l10 15 10-15z"/></g><text x="1145" y="298" font-size="18" fill="#805024">Weathering / выветривание</text><text x="1145" y="445" font-size="18" fill="#805024">Plant uptake / усвоение</text><text x="1145" y="595" font-size="18" fill="#805024">Runoff and erosion / сток и эрозия</text><text x="1145" y="745" font-size="18" fill="#805024">Sedimentation / осаждение</text><path d="M955 810Q825 790 825 230Q825 180 945 220" stroke="#7766a8" stroke-width="5" fill="none"/><path d="M930 205l18 15-20 10z" fill="#7766a8"/><text x="820" y="500" font-size="18" fill="#514477" transform="rotate(-90 820 500)">Geological uplift / геологическое поднятие</text><text x="1105" y="890" font-size="20" fill="#38566f">No major gaseous phase / Нет значительной газовой фазы</text></g></svg>