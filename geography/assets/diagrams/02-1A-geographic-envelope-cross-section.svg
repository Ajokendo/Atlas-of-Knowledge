<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Geographic envelope cross-section / Разрез географической оболочки</title><desc id="d">A schematic landscape shows overlapping air, water, rock and living systems. / Схематичный ландшафт показывает взаимное наложение воздушной, водной, каменной и живой сред.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">Geographic envelope / Географическая оболочка</text><rect x="70" y="125" width="1360" height="220" rx="24" fill="#dcecf8"/><text x="115" y="180" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#174e78">Atmosphere / Атмосфера</text><path d="M70 545 Q240 490 390 530 T710 520 T1030 530 T1430 505 V790 H70Z" fill="#d9c19a" stroke="#9a754a" stroke-width="4"/><path d="M70 545 Q240 490 390 530 T710 520 T1030 530 T1430 505" fill="none" stroke="#56874b" stroke-width="18"/><path d="M760 550 Q850 510 940 540 T1120 545 T1430 535 V630 Q1260 640 1120 620 T900 625 T760 630Z" fill="#83c7df" stroke="#278c96" stroke-width="4"/><path d="M70 545 Q240 490 390 530 T710 520 T1030 530 T1430 505 V790 H70Z" fill="none" stroke="#a66b35" stroke-width="4"/><g fill="#56874b"><path d="M320 520l-24-90 24 15 22-15-8 90z"/><path d="M360 520l-18-70 18 12 18-12-6 70z"/><path d="M1120 520l-20-90 20 14 20-14-6 90z"/></g><g fill="#fff" opacity=".9"><ellipse cx="320" cy="250" rx="90" ry="28"/><ellipse cx="370" cy="240" rx="60" ry="38"/><ellipse cx="410" cy="255" rx="70" ry="25"/></g><g stroke="#278c96" stroke-width="5" fill="none"><path d="M980 300Q980 390 980 475"/><path d="M960 450l20 25 20-25"/></g><g font-family="Arial,sans-serif" font-size="28" font-weight="700"><text x="105" y="710" fill="#805024">Lithosphere / Литосфера</text><text x="820" y="600" fill="#17656d">Hydrosphere / Гидросфера</text><text x="220" y="470" fill="#386432">Biosphere / Биосфера</text></g><text x="750" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#38566f">Schematic, not to scale; boundaries overlap / Схема условная, не в масштабе; оболочки перекрываются</text></svg>