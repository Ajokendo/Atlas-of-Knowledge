<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Водоснабжение и канализация: цепочка / Water supply and sanitation: the chain</title><desc id="desc">Путь воды от источника до водоёма-приёмника. / The path of water from source to receiving water body.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Водоснабжение и канализация: цепочка</text><text x="40" y="74" class="sub" style="fill:#526579">Water supply and sanitation: the chain</text><rect x="30" y="250" width="170" height="130" rx="14" fill="#e4eff6" stroke="#647789" stroke-width="2"/><text x="115" y="310" class="lab" text-anchor="middle" >Водозабор</text><text x="115" y="334" class="sm" text-anchor="middle" style="fill:#526579">Intake</text><path d="M202 315 L218 315" class="arr"/><rect x="220" y="250" width="170" height="130" rx="14" fill="#e4eff6" stroke="#647789" stroke-width="2"/><text x="305" y="310" class="lab" text-anchor="middle" >Очистка воды</text><text x="305" y="334" class="sm" text-anchor="middle" style="fill:#526579">Water treatment</text><path d="M392 315 L408 315" class="arr"/><rect x="410" y="250" width="170" height="130" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="495" y="310" class="lab" text-anchor="middle" >Водопровод</text><text x="495" y="334" class="sm" text-anchor="middle" style="fill:#526579">Supply network</text><path d="M582 315 L598 315" class="arr"/><rect x="600" y="250" width="170" height="130" rx="14" fill="#f4ecd9" stroke="#647789" stroke-width="2"/><text x="685" y="310" class="lab" text-anchor="middle" >Потребители</text><text x="685" y="334" class="sm" text-anchor="middle" style="fill:#526579">Users</text><path d="M772 315 L788 315" class="arr"/><rect x="790" y="250" width="170" height="130" rx="14" fill="#f5e7e4" stroke="#647789" stroke-width="2"/><text x="875" y="310" class="lab" text-anchor="middle" >Канализация</text><text x="875" y="334" class="sm" text-anchor="middle" style="fill:#526579">Sewers</text><path d="M962 315 L978 315" class="arr"/><rect x="980" y="250" width="170" height="130" rx="14" fill="#f5e7e4" stroke="#647789" stroke-width="2"/><text x="1065" y="310" class="lab" text-anchor="middle" >Очистные сооружения</text><text x="1065" y="334" class="sm" text-anchor="middle" style="fill:#526579">Wastewater treatment</text><path d="M1152 315 L1168 315" class="arr"/><rect x="1170" y="250" width="170" height="130" rx="14" fill="#e4eff6" stroke="#647789" stroke-width="2"/><text x="1255" y="310" class="lab" text-anchor="middle" >Сброс в водоём</text><text x="1255" y="334" class="sm" text-anchor="middle" style="fill:#526579">Discharge to a water body</text><text x="40" y="470" class="s" text-anchor="start" >Потери в сетях, неочищенные стоки и сбросы в чувствительные водоёмы — места, где цепочка рвётся.</text><text x="40" y="494" class="s" text-anchor="start" style="fill:#526579">Network losses, untreated wastewater and discharges to sensitive waters are where the chain breaks.</text><text x="40" y="766" class="sm">Обобщённая схема; сведения о конкретных очистных сооружениях и сбросах — из официальных данных.</text><text x="40" y="786" class="sm" style="fill:#526579">A generalised schematic; data on specific treatment plants and discharges come from official sources.</text></svg>