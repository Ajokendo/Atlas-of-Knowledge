<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Векторная и растровая модели / Vector and raster data models</title>
<desc id="desc">Сравнение векторной модели с точками, линиями и полигонами и растровой модели с регулярной сеткой ячеек. Схема показывает типы представления, а не точность данных. / Comparison of vector points, lines and polygons with a raster regular cell grid. The diagram shows representation types, not data accuracy.</desc>
