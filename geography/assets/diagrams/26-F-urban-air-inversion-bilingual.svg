<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Городской воздух: инверсия, источники, наблюдения / Urban air: inversion, sources, monitoring</title><desc id="desc">Почему зимой воздух в котловинах хуже. / Why winter air is worse in basins.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Городской воздух: инверсия, источники, наблюдения</text><text x="40" y="74" class="sub" style="fill:#526579">Urban air: inversion, sources, monitoring</text><rect x="40" y="110" width="640" height="600" rx="14" fill="#fff" stroke="#647789" stroke-width="2"/><text x="60" y="145" class="t" text-anchor="start" >Зимняя температурная инверсия в котловине</text><text x="60" y="168" class="s" text-anchor="start" style="fill:#526579">Winter temperature inversion in a basin</text><path d="M60 560 L200 560 L300 330 L420 560 L520 560 L620 330 L660 560 L660 640 L60 640Z" fill="#b59a7a" stroke="#6b5a45" stroke-width="2"/><rect x="60" y="400" width="600" height="150" fill="#dfe6ec" fill-opacity=".8"/><path d="M60 400 L660 400" stroke="#2e86ab" stroke-width="3" stroke-dasharray="8 5"/><text x="280" y="385" class="sm" text-anchor="middle" >тёплый воздух сверху / warmer air above</text><text x="360" y="540" class="sm" text-anchor="middle" >холодный воздух и выбросы у земли</text><text x="360" y="558" class="sm" text-anchor="middle" >cold air and emissions trapped near the ground</text><rect x="710" y="110" width="650" height="600" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="730" y="145" class="t" text-anchor="start" >Источники и меры</text><text x="730" y="168" class="s" text-anchor="start" style="fill:#526579">Sources and responses</text><text x="740" y="225" class="lab" text-anchor="start" >• Печное отопление и уголь</text><text x="760" y="247" class="s" text-anchor="start" style="fill:#526579">Stove heating and coal</text><text x="740" y="305" class="lab" text-anchor="start" >• Транспорт</text><text x="760" y="327" class="s" text-anchor="start" style="fill:#526579">Traffic</text><text x="740" y="385" class="lab" text-anchor="start" >• Теплоэлектроцентрали</text><text x="760" y="407" class="s" text-anchor="start" style="fill:#526579">Heat and power plants</text><text x="740" y="465" class="lab" text-anchor="start" >• Пыль и сжигание отходов</text><text x="760" y="487" class="s" text-anchor="start" style="fill:#526579">Dust and waste burning</text><text x="740" y="545" class="lab" text-anchor="start" >• Посты наблюдений: PM2,5, PM10</text><text x="760" y="567" class="s" text-anchor="start" style="fill:#526579">Monitoring stations: PM2.5, PM10</text><text x="40" y="766" class="sm">Схема процесса, а не карта загрязнения; уровни загрязнения берут из постов наблюдений с датой.</text><text x="40" y="786" class="sm" style="fill:#526579">A process schematic, not a pollution map; pollution levels come from dated monitoring stations.</text></svg>