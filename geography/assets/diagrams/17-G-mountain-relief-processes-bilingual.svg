<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Формирование горного рельефа / Formation of mountain relief</title>
<desc id="desc">Концептуальный поперечный профиль горного ландшафта с тектоническим поднятием и складчато-надвиговыми структурами, ледниковым каром и мореной, речным врезанием, осыпью и конусом выноса. Эндогенные и экзогенные процессы обозначены отдельно. Не в масштабе и не является реальным геологическим разрезом. / Conceptual mountain-landscape cross-section showing tectonic uplift and fold-thrust structures, a glacial cirque and moraine, river incision, scree and an alluvial fan. Endogenic and exogenic processes are distinguished. Not to scale and not a real geological section.</desc>
