<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Пищевая сеть и пирамида энергии / Food web and energy pyramid</title>
<desc id="desc">Двуязычная схема луговой пищевой сети со стрелками от пищи к потребителю и условной пирамидой энергии с примерами из текста главы. / Bilingual grassland food web with arrows from food to consumer and an illustrative energy pyramid using the chapter's worked-example values.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#38566a" stroke-width="1.8"/></marker></defs>
<rect width="1400" height="760" rx="22" fill="#fbfdff"/><text x="700" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17384d">Пищевая сеть и поток энергии / Food web and energy flow</text>
<text x="55" y="88" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2d6741">ЛУГОВАЯ ПИЩЕВАЯ СЕТЬ / GRASSLAND FOOD WEB</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="55" y="300" width="190" height="95" rx="14" fill="#dff1d8" stroke="#5b9250" stroke-width="2"/><text x="150" y="337" font-size="21" font-weight="700" fill="#285735">Травы</text><text x="150" y="365" font-size="18" fill="#285735">Grasses</text>
<rect x="340" y="135" width="190" height="95" rx="14" fill="#fff0c9" stroke="#c79a3e" stroke-width="2"/><text x="435" y="172" font-size="20" font-weight="700" fill="#76521b">Насекомые</text><text x="435" y="200" font-size="18" fill="#76521b">Insects</text>
<rect x="340" y="300" width="190" height="95" rx="14" fill="#fff0c9" stroke="#c79a3e" stroke-width="2"/><text x="435" y="337" font-size="20" font-weight="700" fill="#76521b">Грызуны</text><text x="435" y="365" font-size="18" fill="#76521b">Rodents</text>
<rect x="340" y="465" width="190" height="95" rx="14" fill="#fff0c9" stroke="#c79a3e" stroke-width="2"/><text x="435" y="502" font-size="20" font-weight="700" fill="#76521b">Зайцы</text><text x="435" y="530" font-size="18" fill="#76521b">Hares</text>
<rect x="650" y="135" width="190" height="95" rx="14" fill="#e5eafa" stroke="#6879b0" stroke-width="2"/><text x="745" y="172" font-size="20" font-weight="700" fill="#394c83">Птицы</text><text x="745" y="200" font-size="18" fill="#394c83">Birds</text>
<rect x="650" y="365" width="190" height="95" rx="14" fill="#f6dfdf" stroke="#b66b6b" stroke-width="2"/><text x="745" y="402" font-size="20" font-weight="700" fill="#873f3f">Лисица</text><text x="745" y="430" font-size="18" fill="#873f3f">Fox</text>
<rect x="650" y="535" width="190" height="95" rx="14" fill="#f6dfdf" stroke="#b66b6b" stroke-width="2"/><text x="745" y="572" font-size="20" font-weight="700" fill="#873f3f">Ястреб</text><text x="745" y="600" font-size="18" fill="#873f3f">Hawk</text>
<rect x="930" y="300" width="190" height="95" rx="14" fill="#e8e2d8" stroke="#8b7964" stroke-width="2"/><text x="1025" y="337" font-size="20" font-weight="700" fill="#5e4b38">Грибы и бактерии</text><text x="1025" y="365" font-size="17" fill="#5e4b38">Fungi and bacteria</text>
</g>
<g fill="none" stroke="#38566a" stroke-width="3" marker-end="url(#a)"><path d="M245 325L330 205"/><path d="M245 345L330 345"/><path d="M245 365L330 495"/><path d="M530 180L640 180"/><path d="M530 345L640 410"/><path d="M530 495L640 420"/><path d="M530 345L640 565"/><path d="M530 180L640 565"/><path d="M150 395L920 395" stroke-dasharray="7 7" opacity=".0"/></g>
<g fill="none" stroke="#38566a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"><path d="M840 180L920 320"/><path d="M840 410L920 365"/><path d="M840 580L920 380"/></g>
<text x="55" y="116" font-family="Arial,sans-serif" font-size="13" fill="#526a78">Сплошные стрелки — питание; пунктир — мёртвые остатки / Solid arrows — feeding; dashed arrows — dead matter</text>
<rect x="55" y="655" width="1065" height="55" rx="10" fill="#f0f4f6" stroke="#b7c5cd"/><text x="75" y="678" font-family="Arial,sans-serif" font-size="16" fill="#3d5665">Мёртвые остатки всех уровней → редуценты → минеральные вещества → продуценты.</text><text x="75" y="699" font-family="Arial,sans-serif" font-size="16" fill="#3d5665">Dead organic matter from all levels → decomposers → mineral nutrients → producers.</text>

<text x="1270" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2d6741">ПИРАМИДА ЭНЕРГИИ</text><text x="1270" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2d6741">ENERGY PYRAMID</text>
<path d="M1170 610L1370 610L1335 485L1205 485Z" fill="#8bbd75" stroke="#4d8050" stroke-width="2"/><path d="M1205 475L1335 475L1305 355L1235 355Z" fill="#e9c46a" stroke="#b18a34" stroke-width="2"/><path d="M1235 345L1305 345L1270 220Z" fill="#cf8b79" stroke="#9b5c50" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#263b46"><text x="1270" y="570" font-size="18" font-weight="700">Продуценты / Producers</text><text x="1270" y="595" font-size="17">12 000 кДж / kJ</text><text x="1270" y="425" font-size="17" font-weight="700">Травоядные / Herbivores</text><text x="1270" y="450" font-size="17">1 200 кДж / kJ</text><text x="1270" y="310" font-size="16" font-weight="700">Хищники / Predators</text><text x="1270" y="332" font-size="16">90 кДж / kJ</text></g>
<text x="1270" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#536b78">Условный пример, не универсальное правило.</text><text x="1270" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#536b78">Worked example; not a universal rule.</text>
</svg>