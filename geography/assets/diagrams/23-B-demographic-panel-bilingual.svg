<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Демографическая панель Кыргызстана / Demographic panel of Kyrgyzstan</title><desc id="desc">Динамика численности населения и распределение по областям и городам. / Population trend and distribution by region and city.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Демографическая панель Кыргызстана</text><text x="40" y="74" class="sub" style="fill:#526579">Demographic panel of Kyrgyzstan</text><rect x="40" y="110" width="640" height="300" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="60" y="145" class="t" text-anchor="start" >Численность населения, млн</text><text x="60" y="168" class="s" text-anchor="start" style="fill:#526579">Population, million</text><rect x="90" y="307" width="100" height="83" fill="#7f8c8d"/><text x="140" y="299" class="lab" text-anchor="middle" >6,936</text><text x="140" y="408" class="sm" text-anchor="middle" >перепись 2022 / census 2022</text><rect x="240" y="264" width="100" height="126" fill="#2e86ab"/><text x="290" y="256" class="lab" text-anchor="middle" >7,162</text><text x="290" y="408" class="sm" text-anchor="middle" >01.01.2024</text><rect x="390" y="241" width="100" height="149" fill="#2e86ab"/><text x="440" y="233" class="lab" text-anchor="middle" >7,282</text><text x="440" y="408" class="sm" text-anchor="middle" >01.01.2025</text><rect x="540" y="218" width="100" height="172" fill="#2e86ab"/><text x="590" y="210" class="lab" text-anchor="middle" >7,404</text><text x="590" y="408" class="sm" text-anchor="middle" >01.01.2026</text><text x="60" y="430" class="sm" text-anchor="start" >Ось начинается с 6,5 млн, чтобы показать различия. Перепись и годовые оценки — разные источники.</text><text x="60" y="450" class="sm" text-anchor="start" style="fill:#526579">The axis starts at 6.5 million to show differences. Census and annual estimates are different sources.</text><rect x="710" y="110" width="650" height="420" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="730" y="145" class="t" text-anchor="start" >Население на 01.01.2026, тыс. чел.</text><text x="730" y="168" class="s" text-anchor="start" style="fill:#526579">Population on 1 January 2026, thousand</text><text x="730" y="209" class="sm" text-anchor="start" >Ошская область / Osh Region</text><rect x="1040" y="195" width="250" height="20" fill="#2e86ab"/><text x="1296" y="211" class="sm" text-anchor="start" >1 438,5</text><text x="730" y="245" class="sm" text-anchor="start" >Джалал-Абадская / Jalal-Abad</text><rect x="1040" y="231" width="240" height="20" fill="#2e86ab"/><text x="1286" y="247" class="sm" text-anchor="start" >1 379,9</text><text x="730" y="281" class="sm" text-anchor="start" >Бишкек (город) / Bishkek (city)</text><rect x="1040" y="267" width="236" height="20" fill="#a93226"/><text x="1282" y="283" class="sm" text-anchor="start" >1 358,6</text><text x="730" y="317" class="sm" text-anchor="start" >Чуйская / Chuy</text><rect x="1040" y="303" width="171" height="20" fill="#2e86ab"/><text x="1217" y="319" class="sm" text-anchor="start" >983,7</text><text x="730" y="353" class="sm" text-anchor="start" >Баткенская / Batken</text><rect x="1040" y="339" width="105" height="20" fill="#2e86ab"/><text x="1151" y="355" class="sm" text-anchor="start" >605,3</text><text x="730" y="389" class="sm" text-anchor="start" >Иссык-Кульская / Issyk-Kul</text><rect x="1040" y="375" width="96" height="20" fill="#2e86ab"/><text x="1142" y="391" class="sm" text-anchor="start" >554,3</text><text x="730" y="425" class="sm" text-anchor="start" >Ош (город) / Osh (city)</text><rect x="1040" y="411" width="84" height="20" fill="#a93226"/><text x="1130" y="427" class="sm" text-anchor="start" >484,9</text><text x="730" y="461" class="sm" text-anchor="start" >Нарынская / Naryn</text><rect x="1040" y="447" width="55" height="20" fill="#2e86ab"/><text x="1101" y="463" class="sm" text-anchor="start" >316,2</text><text x="730" y="497" class="sm" text-anchor="start" >Таласская / Talas</text><rect x="1040" y="483" width="49" height="20" fill="#2e86ab"/><text x="1095" y="499" class="sm" text-anchor="start" >282,9</text><rect x="40" y="560" width="1320" height="150" rx="14" fill="#fff" stroke="#647789" stroke-width="2"/><text x="60" y="595" class="lab" text-anchor="start" >Как читать панель</text><text x="60" y="622" class="s" text-anchor="start" >Переписные данные 2022 года и ежегодные оценки НСК различаются по методике; Бишкек и Ош — города республиканского значения, а не области.</text><text x="60" y="664" class="s" text-anchor="start" style="fill:#526579">How to read the panel: 2022 census data and annual NSC estimates differ in method; Bishkek and Osh are cities of republican significance, not oblasts.</text><text x="40" y="766" class="sm">Источник чисел: переписи 2022 года и НСК (открытые ряды) по тексту главы 23. Возрастно-половая пирамида на панель не вынесена.</text><text x="40" y="786" class="sm" style="fill:#526579">Figures: 2022 census and NSC open series as quoted in Chapter 23. The age-sex pyramid is not included in this panel.</text></svg>