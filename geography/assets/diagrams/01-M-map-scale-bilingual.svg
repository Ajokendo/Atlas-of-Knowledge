<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="t"><title id="t">Масштаб карты / Map scale: what one centimetre stands for</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="740" fill="#fbfcfe"/><text x="30" y="46" class="h">Масштаб карты</text><text x="30" y="76" class="sub">Map scale: what one centimetre stands for</text><rect x="30" y="130" width="940" height="120" rx="14" fill="#cfe8d4" stroke="#647789" stroke-width="2"/><text x="50" y="172" class="r" style="font-size:30px">1 : 50 000</text><text x="50" y="206" class="r2">1 см = 500 м</text><text x="50" y="228" class="e2">1 cm = 500 m</text><rect x="420" y="160" width="200" height="22" fill="#fff" stroke="#243447" stroke-width="2"/><rect x="420" y="160" width="100" height="22" fill="#243447"/><text x="420" y="208" class="r2">0</text><text x="620" y="208" class="r2" text-anchor="end">1 км</text><text x="520" y="228" class="e2" text-anchor="middle">2 см на карте = 1 km</text><rect x="30" y="270" width="940" height="120" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="50" y="312" class="r" style="font-size:30px">1 : 100 000</text><text x="50" y="346" class="r2">1 см = 1 км</text><text x="50" y="368" class="e2">1 cm = 1 km</text><rect x="420" y="300" width="200" height="22" fill="#fff" stroke="#243447" stroke-width="2"/><rect x="420" y="300" width="100" height="22" fill="#243447"/><text x="420" y="348" class="r2">0</text><text x="620" y="348" class="r2" text-anchor="end">2 км</text><text x="520" y="368" class="e2" text-anchor="middle">2 см на карте = 2 km</text><rect x="30" y="410" width="940" height="120" rx="14" fill="#e8cfe6" stroke="#647789" stroke-width="2"/><text x="50" y="452" class="r" style="font-size:30px">1 : 1 000 000</text><text x="50" y="486" class="r2">1 см = 10 км</text><text x="50" y="508" class="e2">1 cm = 10 km</text><rect x="420" y="440" width="200" height="22" fill="#fff" stroke="#243447" stroke-width="2"/><rect x="420" y="440" width="100" height="22" fill="#243447"/><text x="420" y="488" class="r2">0</text><text x="620" y="488" class="r2" text-anchor="end">20 км</text><text x="520" y="508" class="e2" text-anchor="middle">2 см на карте = 20 km</text><text x="30" y="580" class="r2" text-anchor="start">Чем меньше знаменатель, тем крупнее масштаб: больше</text><text x="30" y="604" class="r2" text-anchor="start">подробностей, меньше территория.</text><text x="30" y="626" class="e2" text-anchor="start">The smaller the denominator, the larger the scale: more detail, smaller area.</text><text x="30" y="702" class="sm">Схема.</text><text x="30" y="724" class="sm" style="fill:#526579">A schematic.</text></svg>