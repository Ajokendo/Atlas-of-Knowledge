<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Biogeochemical cycles overview / Обзор биогеохимических циклов</title><desc id="d">Carbon, nitrogen and phosphorus move between rocks, water, air and living organisms through different pathways. / Углерод, азот и фосфор перемещаются между породами, водой, воздухом и организмами разными путями.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Biogeochemical cycles / Биогеохимические циклы</text><g font-family="Arial" text-anchor="middle"><rect x="110" y="170" width="380" height="170" rx="24" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="300" y="235" font-size="34" font-weight="700" fill="#174e78">Carbon / Углерод</text><text x="300" y="285" font-size="22" fill="#17324d">Atmosphere, ocean, biomass, rocks</text><rect x="560" y="170" width="380" height="170" rx="24" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="750" y="235" font-size="34" font-weight="700" fill="#386432">Nitrogen / Азот</text><text x="750" y="285" font-size="22" fill="#17324d">Atmosphere, soil, organisms</text><rect x="1010" y="170" width="380" height="170" rx="24" fill="#f1e4d2" stroke="#a66b35" stroke-width="4"/><text x="1200" y="235" font-size="34" font-weight="700" fill="#805024">Phosphorus / Фосфор</text><text x="1200" y="285" font-size="22" fill="#17324d">Rocks, soil, water, organisms</text></g><g font-family="Arial" font-size="26" fill="#17324d"><text x="150" y="440" font-weight="700">Shared reservoirs / Общие компоненты:</text></g><g font-family="Arial" font-size="25" text-anchor="middle"><rect x="120" y="500" width="280" height="125" rx="22" fill="#dcecf8" stroke="#3979a8" stroke-width="3"/><text x="260" y="555" fill="#174e78" font-weight="700">Air / Воздух</text><text x="260" y="590" fill="#17324d" font-size="20">Gas exchange / Газообмен</text><rect x="450" y="500" width="280" height="125" rx="22" fill="#d9eef0" stroke="#278c96" stroke-width="3"/><text x="590" y="555" fill="#17656d" font-weight="700">Water / Вода</text><text x="590" y="590" fill="#17324d" font-size="20">Dissolved forms / Растворённые формы</text><rect x="780" y="500" width="280" height="125" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="3"/><text x="920" y="555" fill="#386432" font-weight="700">Life / Жизнь</text><text x="920" y="590" fill="#17324d" font-size="20">Uptake and decay / Поглощение и распад</text><rect x="1110" y="500" width="280" height="125" rx="22" fill="#f1e4d2" stroke="#a66b35" stroke-width="3"/><text x="1250" y="555" fill="#805024" font-weight="700">Rocks / Породы</text><text x="1250" y="590" fill="#17324d" font-size="20">Weathering and burial / Выветривание и захоронение</text></g><path d="M260 650Q750 780 1250 650" stroke="#52697c" stroke-width="5" fill="none"/><text x="750" y="760" text-anchor="middle" font-family="Arial" font-size="23" fill="#38566f">Pathways differ: carbon and nitrogen have major atmospheric phases; phosphorus has no major gaseous phase.</text><text x="750" y="805" text-anchor="middle" font-family="Arial" font-size="23" fill="#38566f">Пути различаются: у углерода и азота важна газовая фаза; у фосфора значительной газовой фазы нет.</text></svg>