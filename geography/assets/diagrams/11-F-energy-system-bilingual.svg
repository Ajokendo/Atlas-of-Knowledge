<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Энергетическая система и пример Кыргызстана за 2025 год / Energy system and Kyrgyzstan example for 2025</title><desc id="d">Схема энергетической системы: первичные ресурсы, генерация, передача, распределение, потребление, накопление, импорт и экспорт. Отдельная панель показывает опубликованные показатели Кыргызстана за 2025 год: производство 15.4 млрд кВт·ч, потребление 19.3 млрд кВт·ч, импорт около 3.8 млрд кВт·ч; источники генерации показаны отдельными значениями. Это не полный баланс, поскольку округления и потери/экспорт не раскрыты на диаграмме. / Energy-system diagram: primary resources, generation, transmission, distribution, consumption, storage, imports and exports. A separate panel shows published Kyrgyzstan indicators for 2025: generation 15.4 billion kWh, consumption 19.3 billion kWh, imports about 3.8 billion kWh; generation sources are shown separately. This is not a complete balance because rounding and losses/exports are not fully represented.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.b{fill:#edf4f7;stroke:#66899b;stroke-width:2}.n{fill:#f7f3e8;stroke:#b49a61;stroke-width:2}.a{stroke:#315d76;stroke-width:4;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#315d76"/></marker></defs><rect width="1400" height="900" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Энергетическая система / Energy system</text><g transform="translate(25 130)"><rect width="235" height="125" rx="14" class="b"/><text x="117" y="42" text-anchor="middle" class="t">Первичные ресурсы</text><text x="117" y="70" text-anchor="middle" class="s">Primary resources</text><text x="117" y="101" text-anchor="middle" class="s">Hydro • coal • gas • wind • solar</text></g><path d="M260 190 H285" class="a"/><g transform="translate(300 130)"><rect width="235" height="125" rx="14" class="b"/><text x="117" y="42" text-anchor="middle" class="t">Генерация</text><text x="117" y="70" text-anchor="middle" class="s">Generation</text><text x="117" y="101" text-anchor="middle" class="s">HPP • TPP • CHP • renewables</text></g><path d="M260 190 H560" class="a"/><g transform="translate(575 130)"><rect width="235" height="125" rx="14" class="b"/><text x="117" y="42" text-anchor="middle" class="t">Передача</text><text x="117" y="70" text-anchor="middle" class="s">Transmission</text><text x="117" y="101" text-anchor="middle" class="s">High-voltage grid</text></g><path d="M260 190 H835" class="a"/><g transform="translate(850 130)"><rect width="235" height="125" rx="14" class="b"/><text x="117" y="42" text-anchor="middle" class="t">Распределение</text><text x="117" y="70" text-anchor="middle" class="s">Distribution</text><text x="117" y="101" text-anchor="middle" class="s">Local networks</text></g><path d="M260 190 H1110" class="a"/><g transform="translate(1125 130)"><rect width="235" height="125" rx="14" class="b"/><text x="117" y="42" text-anchor="middle" class="t">Потребитель</text><text x="117" y="70" text-anchor="middle" class="s">Consumer</text><text x="117" y="101" text-anchor="middle" class="s">Homes • industry • services</text></g><g transform="translate(95 315)"><rect width="340" height="105" rx="14" class="n"/><text x="170" y="42" text-anchor="middle" class="t">Импорт / Export</text><text x="170" y="75" text-anchor="middle" class="s">Cross-border electricity trade</text></g><g transform="translate(530 315)"><rect width="340" height="105" rx="14" class="n"/><text x="170" y="42" text-anchor="middle" class="t">Накопление / Storage</text><text x="170" y="75" text-anchor="middle" class="s">Pumped hydro • batteries • other</text></g><g transform="translate(965 315)"><rect width="340" height="105" rx="14" class="n"/><text x="170" y="42" text-anchor="middle" class="t">Потери и баланс / Losses & balance</text><text x="170" y="75" text-anchor="middle" class="s">Measured separately in system accounts</text></g><text x="700" y="480" text-anchor="middle" class="h">Кыргызстан: опубликованные показатели 2025 года / Kyrgyzstan: published 2025 indicators</text><g transform="translate(60 520)"><rect width="400" height="230" rx="16" class="b"/><text x="200" y="45" text-anchor="middle" class="t">Производство / Generation</text><text x="200" y="95" text-anchor="middle" class="h">15.4 млрд кВт·ч</text><text x="200" y="130" text-anchor="middle" class="s">billion kWh</text><text x="25" y="170" class="s">Крупные ГЭС / Large HPPs: 12.9</text><text x="25" y="195" class="s">Малые ГЭС / Small HPPs: 0.223</text><text x="25" y="220" class="s">Мини-ГЭС и ВИЭ / Mini HPP & RES: 0.234; ТЭС / thermal: 2.01</text></g><g transform="translate(500 520)"><rect width="400" height="230" rx="16" class="b"/><text x="200" y="45" text-anchor="middle" class="t">Потребление / Consumption</text><text x="200" y="105" text-anchor="middle" class="h">19.3 млрд кВт·ч</text><text x="200" y="140" text-anchor="middle" class="s">billion kWh</text><text x="200" y="190" text-anchor="middle" class="s">По данным Минэнерго / Ministry of Energy</text></g><g transform="translate(940 520)"><rect width="400" height="230" rx="16" class="b"/><text x="200" y="45" text-anchor="middle" class="t">Импорт / Imports</text><text x="200" y="105" text-anchor="middle" class="h">≈3.8 млрд кВт·ч</text><text x="200" y="140" text-anchor="middle" class="s">billion kWh</text><text x="200" y="190" text-anchor="middle" class="s">Около / approximately</text></g><text x="700" y="800" text-anchor="middle" class="s">Показатели округлены и не складываются в полный баланс без учёта экспорта, сетевых потерь и методики учёта.</text><text x="700" y="830" text-anchor="middle" class="s">Rounded indicators do not form a complete balance without exports, network losses and accounting methodology.</text><text x="700" y="870" text-anchor="middle" class="s">Source: Ministry of Energy of the Kyrgyz Republic, 2025 results; CAWater-Info Yearbook 2025.</text></svg>