<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Биосфера и оболочки Земли / The biosphere and Earth's spheres</title>
<desc id="desc">Двуязычная концептуальная схема показывает перекрывающуюся область жизни в атмосфере, гидросфере и верхней литосфере. / Bilingual conceptual diagram showing the overlapping realm of life in the atmosphere, hydrosphere and upper lithosphere.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d9efff"/><stop offset="1" stop-color="#f5fbff"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#62b8dc"/><stop offset="1" stop-color="#12658e"/></linearGradient><linearGradient id="rock" x2="0" y2="1"><stop stop-color="#b9a17b"/><stop offset="1" stop-color="#6f5843"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#38566a" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="650" rx="22" fill="#fbfdff"/><text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17384d">Биосфера — область жизни / Biosphere — the realm of life</text>
<rect x="45" y="75" width="1110" height="180" rx="16" fill="url(#sky)" stroke="#8bbbd5"/><text x="75" y="111" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24536e">АТМОСФЕРА / ATMOSPHERE</text>
<path d="M45 285 Q180 250 300 282 T550 276 T820 285 T1155 270 L1155 400 L45 400Z" fill="#83b86d" stroke="#557f49" stroke-width="2"/>
<path d="M45 400 Q250 370 420 405 T800 398 T1155 390 L1155 565 L45 565Z" fill="url(#rock)" stroke="#72583f" stroke-width="2"/>
<path d="M690 310 Q790 285 900 310 T1155 305 L1155 425 Q1000 445 850 420 T690 425Z" fill="url(#sea)" stroke="#1e7198" stroke-width="2"/>
<text x="75" y="445" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">ЛИТОСФЕРА / LITHOSPHERE</text><text x="875" y="355" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">ГИДРОСФЕРА / HYDROSPHERE</text>
<g stroke="#315b36" stroke-width="5" fill="none"><path d="M230 282V205M230 235l-34-28M230 248l35-34M340 280V195M340 225l-28-26M340 238l30-30"/></g><g fill="#4f9b58"><circle cx="230" cy="190" r="28"/><circle cx="198" cy="207" r="21"/><circle cx="262" cy="210" r="22"/><circle cx="340" cy="181" r="27"/><circle cx="309" cy="199" r="20"/><circle cx="371" cy="202" r="20"/></g>
<g fill="#f6e5a7" stroke="#a67c2d" stroke-width="2"><ellipse cx="520" cy="280" rx="20" ry="9"/><path d="M520 272l-7-17 7-9 7 9z"/></g>
<g fill="#fff" stroke="#226a8b" stroke-width="2"><path d="M805 350q-12-16 0-28q12 12 0 28z"/><path d="M845 370q-12-16 0-28q12 12 0 28z"/><path d="M930 389q-12-16 0-28q12 12 0 28z"/></g>
<g fill="#d7c5a5" stroke="#5c4937" stroke-width="2"><ellipse cx="420" cy="460" rx="36" ry="12"/><circle cx="450" cy="455" r="10"/><path d="M400 470l-8 14m30-14l8 14"/></g><g fill="#f3e4c8"><circle cx="550" cy="480" r="5"/><circle cx="572" cy="495" r="4"/><circle cx="590" cy="475" r="5"/></g>
<path d="M80 160 C300 120 520 160 670 220 C800 270 930 290 1080 250" fill="none" stroke="#d18b32" stroke-width="5" stroke-dasharray="10 8"/>
<rect x="65" y="510" width="510" height="95" rx="12" fill="#fff" fill-opacity=".92" stroke="#8c7659"/><text x="88" y="543" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#3d3429">БИОСФЕРА / BIOSPHERE</text><text x="88" y="570" font-family="Arial,sans-serif" font-size="16" fill="#3d3429">Жизнь встречается в нескольких оболочках Земли.</text><text x="88" y="592" font-family="Arial,sans-serif" font-size="16" fill="#3d3429">Life occurs across several Earth spheres.</text>
<path d="M600 555L720 455" stroke="#38566a" stroke-width="2" marker-end="url(#arr)"/><text x="735" y="480" font-family="Arial,sans-serif" font-size="16" fill="#fff">Почвенные организмы / Soil life</text><text x="735" y="502" font-family="Arial,sans-serif" font-size="16" fill="#fff">Микроорганизмы в породах / Rock microbes</text>
<text x="600" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#536b78">Схема концептуальная, не в масштабе; границы биосферы не являются точными линиями. / Conceptual, not to scale; biosphere boundaries are not exact lines.</text></svg>