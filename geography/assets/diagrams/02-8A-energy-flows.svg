<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Energy sources and processes / Источники энергии и процессы</title><desc id="d">Solar, internal and gravitational energy drive different Earth processes. / Солнечная, внутренняя и гравитационная энергия приводят в движение разные процессы Земли.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Energy in the geographic envelope / Энергия географической оболочки</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="180" width="400" height="190" rx="25" fill="#fff0cc" stroke="#c28b24" stroke-width="4"/><circle cx="290" cy="235" r="38" fill="#e5ae37"/><g stroke="#e5ae37" stroke-width="6"><path d="M290 175v-25 M290 295v25 M230 235h-25 M350 235h25 M248 193l-18-18 M332 277l18 18 M332 193l18-18 M248 277l-18 18"/></g><text x="290" y="330" font-size="30" font-weight="700" fill="#805024">Solar / Солнечная</text><rect x="550" y="180" width="400" height="190" rx="25" fill="#f1e4d2" stroke="#a66b35" stroke-width="4"/><path d="M700 280l45-70 45 70z" fill="#a66b35"/><path d="M745 210v-45" stroke="#c65a4b" stroke-width="7"/><text x="750" y="330" font-size="30" font-weight="700" fill="#805024">Internal / Внутренняя</text><rect x="1010" y="180" width="400" height="190" rx="25" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><path d="M1210 210v95 M1185 280l25 25 25-25" fill="none" stroke="#3979a8" stroke-width="9"/><text x="1210" y="330" font-size="30" font-weight="700" fill="#174e78">Gravitational / Гравитационная</text></g><g font-family="Arial" font-size="25" fill="#17324d"><text x="110" y="470" font-weight="700">Drives / Обеспечивает:</text><text x="110" y="530">• Weather and climate / Погоду и климат</text><text x="110" y="580">• Evaporation and photosynthesis / Испарение и фотосинтез</text><text x="110" y="630">• Mantle convection and tectonics / Конвекцию мантии и тектонику</text><text x="110" y="680">• River flow, slope movement and glaciers / Речной сток, движение по склонам и ледники</text></g><rect x="100" y="760" width="1300" height="75" rx="24" fill="#17324d"/><text x="750" y="808" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Energy is transformed and transferred; it is not “used up” in one step / Энергия преобразуется и передаётся, а не исчезает за один этап</text></svg>