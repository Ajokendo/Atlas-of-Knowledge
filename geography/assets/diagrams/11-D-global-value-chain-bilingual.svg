<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">Глобальная цепочка создания стоимости / Global value chain</title><desc id="d">Условная последовательность создания продукта от исследований и проектирования через сырьё, компоненты, производство, сборку, международную логистику и рынок к сервису и переработке. Показаны вспомогательные условия: энергия, транспорт, финансы, навыки, стандарты и связь. / Conceptual product-value sequence from research and design through raw materials, components, manufacturing, assembly, international logistics and markets to services and recycling. Supporting conditions include energy, transport, finance, skills, standards and connectivity.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:16px Arial;fill:#526879}.b{fill:#edf4f7;stroke:#66899b;stroke-width:2}.a{stroke:#315d76;stroke-width:4;fill:none;marker-end:url(#ar)}.sup{fill:#f7f3e8;stroke:#b49a61;stroke-width:2}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#315d76"/></marker></defs><rect width="1400" height="700" fill="#fff"/><text x="700" y="50" text-anchor="middle" class="h">Глобальная цепочка создания стоимости / Global value chain</text><g transform="translate(25 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Исследования и дизайн</text><text x="85" y="85" text-anchor="middle" class="s">Research & design</text></g><path d="M195 242 H215" class="a"/><g transform="translate(220 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Сырьё</text><text x="85" y="85" text-anchor="middle" class="s">Raw materials</text></g><path d="M390 242 H410" class="a"/><g transform="translate(415 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Компоненты</text><text x="85" y="85" text-anchor="middle" class="s">Components</text></g><path d="M585 242 H605" class="a"/><g transform="translate(610 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Производство</text><text x="85" y="85" text-anchor="middle" class="s">Manufacturing</text></g><path d="M780 242 H800" class="a"/><g transform="translate(805 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Сборка</text><text x="85" y="85" text-anchor="middle" class="s">Assembly</text></g><path d="M975 242 H995" class="a"/><g transform="translate(1000 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Логистика</text><text x="85" y="85" text-anchor="middle" class="s">Logistics</text></g><path d="M1170 242 H1190" class="a"/><g transform="translate(1195 175)"><rect width="170" height="135" rx="14" class="b"/><text x="85" y="52" text-anchor="middle" class="t">Рынок и продажи</text><text x="85" y="85" text-anchor="middle" class="s">Market & sales</text></g><path d="M1320 315 V390 H80 V315" class="a"/><text x="700" y="425" text-anchor="middle" class="t">Сервис, ремонт и повторное использование / Service, repair and reuse</text><g><g transform="translate(70 510)"><rect width="220" height="78" rx="12" class="sup"/><text x="110" y="46" text-anchor="middle" class="t">Энергия / Energy</text></g><g transform="translate(330 510)"><rect width="220" height="78" rx="12" class="sup"/><text x="110" y="46" text-anchor="middle" class="t">Транспорт / Transport</text></g><g transform="translate(590 510)"><rect width="220" height="78" rx="12" class="sup"/><text x="110" y="46" text-anchor="middle" class="t">Финансы / Finance</text></g><g transform="translate(850 510)"><rect width="220" height="78" rx="12" class="sup"/><text x="110" y="46" text-anchor="middle" class="t">Навыки / Skills</text></g><g transform="translate(1110 510)"><rect width="220" height="78" rx="12" class="sup"/><text x="110" y="46" text-anchor="middle" class="t">Стандарты / Standards</text></g></g><text x="700" y="650" text-anchor="middle" class="s">Этапы могут находиться в одной стране или быть распределены между многими странами; география цепочки зависит от отрасли и конкретного товара. / Stages may occur in one country or be distributed across many; chain geography depends on the industry and product.</text></svg>