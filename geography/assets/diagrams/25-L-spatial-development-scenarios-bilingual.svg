<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Три сценария пространственного развития / Three spatial-development scenarios</title><desc id="desc">Качественное сравнение трёх путей развития. / A qualitative comparison of three development paths.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Три сценария пространственного развития</text><text x="40" y="74" class="sub" style="fill:#526579">Three spatial-development scenarios</text><rect x="40" y="110" width="420" height="500" rx="14" fill="#f4ecd9" stroke="#647789" stroke-width="2"/><text x="60" y="150" class="t" text-anchor="start" >Опора на крупные города</text><text x="60" y="176" class="s" text-anchor="start" style="fill:#526579">Large-city focus</text><text x="60" y="230" class="sm" text-anchor="start" >• Рост Бишкека и Оша, нагрузка на транспорт и воду</text><text x="60" y="300" class="sm" text-anchor="start" >• Села и высокогорье теряют население</text><rect x="490" y="110" width="420" height="500" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="510" y="150" class="t" text-anchor="start" >Сбалансированное развитие</text><text x="510" y="176" class="s" text-anchor="start" style="fill:#526579">Balanced development</text><text x="510" y="230" class="sm" text-anchor="start" >• Рост региональных центров и связей между ними</text><text x="510" y="300" class="sm" text-anchor="start" >• Умеренная нагрузка на Чуйскую и Ферганскую долины</text><rect x="940" y="110" width="420" height="500" rx="14" fill="#e4eff6" stroke="#647789" stroke-width="2"/><text x="960" y="150" class="t" text-anchor="start" >Сильные региональные центры</text><text x="960" y="176" class="s" text-anchor="start" style="fill:#526579">Strong regional centres</text><text x="960" y="230" class="sm" text-anchor="start" >• Рабочие места в областях, коридоры и цифровые услуги</text><text x="960" y="300" class="sm" text-anchor="start" >• Больше затрат на дороги и сети</text><text x="40" y="650" class="s" text-anchor="start" >Три условных сценария для обсуждения; измеримые показатели и допущения нужно задать отдельно (население, расходы, время в пути).</text><text x="40" y="676" class="s" text-anchor="start" style="fill:#526579">Three conventional scenarios for discussion; measurable indicators and assumptions must be set separately (population, spending, travel time).</text><text x="40" y="766" class="sm">Учебные сценарии без цифр: это не прогноз и не официальная программа.</text><text x="40" y="786" class="sm" style="fill:#526579">Teaching scenarios without numbers: not a forecast or an official programme.</text></svg>