<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Сезонный сток горной реки (условная схема) / Seasonal flow of a mountain river (schematic)</title><desc id="desc">Вклад снегового, ледникового и дождевого питания по месяцам. / Contribution of snowmelt, glacier melt and rain by month.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Сезонный сток горной реки (условная схема)</text><text x="40" y="74" class="sub" style="fill:#526579">Seasonal flow of a mountain river (schematic)</text><line x1="90" y1="620" x2="1330" y2="620" stroke="#44586b" stroke-width="2"/><line x1="90" y1="140" x2="90" y2="620" stroke="#44586b" stroke-width="2"/><text x="100" y="646" class="sm" text-anchor="middle" >янв/Jan</text><text x="200" y="646" class="sm" text-anchor="middle" >фев/Feb</text><text x="300" y="646" class="sm" text-anchor="middle" >мар/Mar</text><text x="400" y="646" class="sm" text-anchor="middle" >апр/Apr</text><text x="500" y="646" class="sm" text-anchor="middle" >май/May</text><text x="600" y="646" class="sm" text-anchor="middle" >июн/Jun</text><text x="700" y="646" class="sm" text-anchor="middle" >июл/Jul</text><text x="800" y="646" class="sm" text-anchor="middle" >авг/Aug</text><text x="900" y="646" class="sm" text-anchor="middle" >сен/Sep</text><text x="1000" y="646" class="sm" text-anchor="middle" >окт/Oct</text><text x="1100" y="646" class="sm" text-anchor="middle" >ноя/Nov</text><text x="1200" y="646" class="sm" text-anchor="middle" >дек/Dec</text><path d="M100 620 L200 617 L300 586 L400 444 L500 255 L600 316 L700 518 L800 606 L900 619 L1000 620 L1100 620 L1200 620" fill="none" stroke="#2e86c1" stroke-width="5"/><path d="M100 620 L200 620 L300 620 L400 617 L500 593 L600 494 L700 348 L800 348 L900 494 L1000 593 L1100 617 L1200 620" fill="none" stroke="#17a589" stroke-width="5"/><path d="M100 616 L200 596 L300 546 L400 502 L500 523 L600 579 L700 611 L800 619 L900 620 L1000 620 L1100 620 L1200 620" fill="none" stroke="#8e44ad" stroke-width="5" stroke-dasharray="10 6"/><text x="560" y="200" class="lab" text-anchor="middle" style="fill:#2e86c1">Снеговое питание: пик в мае–июне</text><text x="560" y="222" class="sm" text-anchor="middle" >Snowmelt: peak in May–June</text><text x="930" y="330" class="lab" text-anchor="middle" style="fill:#17a589">Ледниковое питание: пик в июле–августе</text><text x="930" y="352" class="sm" text-anchor="middle" >Glacier melt: peak in July–August</text><text x="430" y="520" class="lab" text-anchor="middle" style="fill:#8e44ad">Дожди: весна и начало лета</text><text x="430" y="542" class="sm" text-anchor="middle" >Rain: spring and early summer</text><text x="80" y="130" class="sm" text-anchor="start" >Расход воды (условные единицы) / Discharge (arbitrary units)</text><text x="40" y="766" class="sm">Условная схема без данных конкретного створа: форма и сроки пиков зависят от высоты бассейна и доли ледников.</text><text x="40" y="786" class="sm" style="fill:#526579">Schematic without data from a specific gauge: peak shape and timing depend on basin altitude and glacier share.</text></svg>