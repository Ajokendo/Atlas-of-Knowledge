<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="t d"><title id="t">Мониторинг окружающей среды / Environmental monitoring</title><desc id="d">Мониторинг начинается с целей и показателей. Полевые наблюдения, лабораторные измерения, дистанционное зондирование и общественные наблюдения являются разными потоками данных. Затем выполняются контроль качества, проверка и сопоставление, анализ, публикация и обратная связь для управления. / Monitoring starts with objectives and indicators. Field observations, laboratory measurements, remote sensing and community observations are separate data streams. Quality control, validation and harmonisation precede analysis, publication and feedback to management.</desc><style>.h{font:700 29px Arial;fill:#17324d}.th{font:700 19px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.sm{font:14px Arial;fill:#526879}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}.a{stroke:#397a8d;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397a8d"/></marker></defs><rect width="1300" height="720" fill="white"/><text x="650" y="48" text-anchor="middle" class="h">Цикл экологического мониторинга / Environmental monitoring cycle</text><rect x="400" y="85" width="500" height="80" rx="12" fill="#e1edf0" stroke="#397a8d" stroke-width="2"/><text x="650" y="118" text-anchor="middle" class="th">Цели, вопросы и показатели / Objectives, questions and indicators</text><text x="650" y="145" text-anchor="middle" class="s">Что измеряем и зачем? / What is measured and why?</text><g><rect x="40" y="250" width="270" height="110" rx="12" class="p"/><text x="175" y="290" text-anchor="middle" class="th">Полевые наблюдения</text><text x="175" y="320" text-anchor="middle" class="s">Field observations</text><rect x="355" y="250" width="270" height="110" rx="12" class="p"/><text x="490" y="290" text-anchor="middle" class="th">Лаборатория</text><text x="490" y="320" text-anchor="middle" class="s">Laboratory analysis</text><rect x="670" y="250" width="270" height="110" rx="12" class="p"/><text x="805" y="290" text-anchor="middle" class="th">ДЗЗ и GIS</text><text x="805" y="320" text-anchor="middle" class="s">Remote sensing and GIS</text><rect x="985" y="250" width="270" height="110" rx="12" class="p"/><text x="1120" y="290" text-anchor="middle" class="th">Наблюдения жителей</text><text x="1120" y="320" text-anchor="middle" class="s">Community observations</text></g><g class="a" marker-end="url(#a)"><path d="M650 165V205H175V240"/><path d="M650 205H490V240"/><path d="M650 205H805V240"/><path d="M650 205H1120V240"/><path d="M175 360V415H650V450"/><path d="M490 360V450"/><path d="M805 360V450"/><path d="M1120 360V415H650V450"/></g><rect x="350" y="460" width="600" height="95" rx="12" fill="#fff7ed" stroke="#b66a3c" stroke-width="2"/><text x="650" y="498" text-anchor="middle" class="th">QA/QC, проверка и сопоставление / QA/QC, validation and harmonisation</text><text x="650" y="530" text-anchor="middle" class="s">Калибровка · протоколы · пропуски · неопределённость / Calibration · protocols · gaps · uncertainty</text><path d="M650 555V590" class="a" marker-end="url(#a)"/><rect x="350" y="600" width="600" height="85" rx="12" fill="#e4efe8" stroke="#638b58" stroke-width="2"/><text x="650" y="635" text-anchor="middle" class="th">Анализ → публикация → решение / Analysis → publication → action</text><text x="650" y="662" text-anchor="middle" class="s">Открытые метаданные и обратная связь / Metadata and feedback</text><path d="M350 642H180V125H390" class="a" marker-end="url(#a)"/><text x="185" y="390" transform="rotate(-90 185 390)" class="sm">Пересмотр программы / Review the programme</text></svg>