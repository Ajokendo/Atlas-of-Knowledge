<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="t d"><title id="t">Климатические воздействия и адаптация в Кыргызстане / Climate impacts and adaptation in Kyrgyzstan</title><desc id="d">Матрица шести климатически чувствительных секторов с примерами воздействий и адаптационных мер: вода, сельское хозяйство и пастбища, энергетика, транспорт и инфраструктура, здоровье, экосистемы и города. Примеры иллюстративны, а не прогнозы для конкретного района. / Matrix of six climate-sensitive sectors with examples of impacts and adaptation measures: water, agriculture and pastures, energy, transport and infrastructure, health, and ecosystems and cities. Examples are illustrative, not forecasts for a specific locality.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.p{fill:#edf4f7;stroke:#66899b;stroke-width:2}.a{fill:#f4f8ef;stroke:#73946a;stroke-width:2}.th{fill:#315d76}.white{font:700 20px Arial;fill:#fff}</style><rect width="1400" height="860" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Климатические воздействия и адаптация / Climate impacts and adaptation</text><rect x="35" y="95" width="1330" height="55" rx="10" class="th"/><text x="65" y="130" class="white">Сектор / Sector</text><text x="400" y="130" class="white">Возможные воздействия / Potential impacts</text><text x="900" y="130" class="white">Примеры адаптации / Adaptation examples</text><g transform="translate(35 170)"><rect width="300" height="90" rx="10" class="p"/><text x="150" y="52" text-anchor="middle" class="t">Вода / Water</text><rect x="320" width="500" height="90" rx="10" class="p"/><text x="345" y="38" class="s">Сезонный сдвиг стока, засухи, паводки</text><text x="345" y="65" class="s">Seasonal runoff shifts, droughts, floods</text><rect x="840" width="490" height="90" rx="10" class="a"/><text x="865" y="38" class="s">Мониторинг, снижение потерь, хранение воды</text><text x="865" y="65" class="s">Monitoring, loss reduction, storage</text></g><g transform="translate(35 275)"><rect width="300" height="90" rx="10" class="p"/><text x="150" y="52" text-anchor="middle" class="t">Сельское хозяйство / Agriculture</text><rect x="320" width="500" height="90" rx="10" class="p"/><text x="345" y="38" class="s">Жара, дефицит влаги, деградация пастбищ</text><text x="345" y="65" class="s">Heat, water stress, pasture degradation</text><rect x="840" width="490" height="90" rx="10" class="a"/><text x="865" y="38" class="s">Водосберегающее орошение, устойчивые культуры</text><text x="865" y="65" class="s">Water-efficient irrigation, resilient crops</text></g><g transform="translate(35 380)"><rect width="300" height="90" rx="10" class="p"/><text x="150" y="52" text-anchor="middle" class="t">Энергетика / Energy</text><rect x="320" width="500" height="90" rx="10" class="p"/><text x="345" y="38" class="s">Изменение притока к ГЭС, экстремальные нагрузки</text><text x="345" y="65" class="s">Hydropower inflow shifts, peak demand</text><rect x="840" width="490" height="90" rx="10" class="a"/><text x="865" y="38" class="s">Диверсификация, управление спросом, устойчивость сетей</text><text x="865" y="65" class="s">Diversification, demand management, resilient grids</text></g><g transform="translate(35 485)"><rect width="300" height="90" rx="10" class="p"/><text x="150" y="52" text-anchor="middle" class="t">Транспорт / Transport</text><rect x="320" width="500" height="90" rx="10" class="p"/><text x="345" y="38" class="s">Сели, оползни, повреждение дорог и мостов</text><text x="345" y="65" class="s">Debris flows, landslides, damage to roads and bridges</text><rect x="840" width="490" height="90" rx="10" class="a"/><text x="865" y="38" class="s">Оценка рисков, дренаж, раннее предупреждение</text><text x="865" y="65" class="s">Risk assessment, drainage, early warning</text></g><g transform="translate(35 590)"><rect width="300" height="90" rx="10" class="p"/><text x="150" y="52" text-anchor="middle" class="t">Здоровье / Health</text><rect x="320" width="500" height="90" rx="10" class="p"/><text x="345" y="38" class="s">Тепловой стресс, качество воды, переносчики болезней</text><text x="345" y="65" class="s">Heat stress, water quality, disease vectors</text><rect x="840" width="490" height="90" rx="10" class="a"/><text x="865" y="38" class="s">Планы реагирования, санитарный мониторинг</text><text x="865" y="65" class="s">Response plans, public-health monitoring</text></g><g transform="translate(35 695)"><rect width="300" height="90" rx="10" class="p"/><text x="150" y="52" text-anchor="middle" class="t">Экосистемы и города / Ecosystems & cities</text><rect x="320" width="500" height="90" rx="10" class="p"/><text x="345" y="38" class="s">Пожары, утрата местообитаний, городской перегрев</text><text x="345" y="65" class="s">Fires, habitat loss, urban heat</text><rect x="840" width="490" height="90" rx="10" class="a"/><text x="865" y="38" class="s">Охрана экосистем, зелёная инфраструктура</text><text x="865" y="65" class="s">Ecosystem protection, green infrastructure</text></g><text x="700" y="825" text-anchor="middle" class="s">Меры требуют локальной оценки риска, финансирования и мониторинга результатов; один набор решений не подходит всем регионам.</text><text x="700" y="850" text-anchor="middle" class="s">Measures require local risk assessment, financing and outcome monitoring; one package does not fit every region.</text></svg>