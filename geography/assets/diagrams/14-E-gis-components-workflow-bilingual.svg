<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Компоненты и рабочий цикл ГИС / GIS components and workflow</title><desc id="d">Пять взаимосвязанных компонентов ГИС: люди, данные, программное обеспечение, оборудование и методы. Цикл показывает постановку задачи, сбор данных, хранение, анализ, проверку, картографическое представление и решение. / Five interrelated GIS components: people, data, software, hardware and methods. Workflow shows problem definition, data acquisition, storage, analysis, validation, cartographic presentation and decision-making.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 22px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.c{fill:#edf4f7;stroke:#66899b;stroke-width:2}.a{stroke:#315d76;stroke-width:4;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#315d76"/></marker></defs><rect width="1400" height="760" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">ГИС — это система, а не только программа / GIS is a system, not just software</text><g transform="translate(50 115)"><rect width="230" height="95" rx="16" class="c"/><text x="115" y="42" text-anchor="middle" class="t">Люди</text><text x="115" y="70" text-anchor="middle" class="s">People</text></g><g transform="translate(320 115)"><rect width="230" height="95" rx="16" class="c"/><text x="115" y="42" text-anchor="middle" class="t">Данные</text><text x="115" y="70" text-anchor="middle" class="s">Data</text></g><g transform="translate(590 115)"><rect width="230" height="95" rx="16" class="c"/><text x="115" y="42" text-anchor="middle" class="t">ПО</text><text x="115" y="70" text-anchor="middle" class="s">Software</text></g><g transform="translate(860 115)"><rect width="230" height="95" rx="16" class="c"/><text x="115" y="42" text-anchor="middle" class="t">Оборудование</text><text x="115" y="70" text-anchor="middle" class="s">Hardware</text></g><g transform="translate(1130 115)"><rect width="230" height="95" rx="16" class="c"/><text x="115" y="42" text-anchor="middle" class="t">Методы</text><text x="115" y="70" text-anchor="middle" class="s">Methods</text></g><text x="700" y="265" text-anchor="middle" class="t">Взаимодействуют на всех этапах / Work together throughout the process</text><g transform="translate(30 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Вопрос</text><text x="82" y="75" text-anchor="middle" class="s">Question</text></g><path d="M195 445 H215" class="a"/><g transform="translate(225 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Сбор данных</text><text x="82" y="75" text-anchor="middle" class="s">Acquire data</text></g><path d="M390 445 H410" class="a"/><g transform="translate(420 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Хранение</text><text x="82" y="75" text-anchor="middle" class="s">Store</text></g><path d="M585 445 H605" class="a"/><g transform="translate(615 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Анализ</text><text x="82" y="75" text-anchor="middle" class="s">Analyse</text></g><path d="M780 445 H800" class="a"/><g transform="translate(810 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Проверка</text><text x="82" y="75" text-anchor="middle" class="s">Validate</text></g><path d="M975 445 H995" class="a"/><g transform="translate(1005 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Карта и отчёт</text><text x="82" y="75" text-anchor="middle" class="s">Map & report</text></g><path d="M1170 445 H1190" class="a"/><g transform="translate(1200 390)"><rect width="165" height="110" rx="14" class="c"/><text x="82" y="45" text-anchor="middle" class="t">Решение</text><text x="82" y="75" text-anchor="middle" class="s">Decision</text></g><path d="M1275 515 V585 H110 V515" class="a"/><text x="700" y="640" text-anchor="middle" class="s">Обратная связь: результаты могут потребовать новых данных, изменения метода или пересмотра вопроса. / Feedback: results may require new data, a revised method or a refined question.</text></svg>