<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Natural geosystem structure / Структура природной геосистемы</title><desc id="d">Relief, climate, water, soil and living organisms interact in one landscape system. / Рельеф, климат, вода, почвы и живые организмы взаимодействуют в одной ландшафтной системе.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Natural geosystem / Природная геосистема</text><g font-family="Arial" text-anchor="middle"><rect x="550" y="150" width="400" height="115" rx="22" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="750" y="220" font-size="32" font-weight="700" fill="#174e78">Climate / Климат</text><rect x="110" y="390" width="360" height="130" rx="22" fill="#f1e4d2" stroke="#a66b35" stroke-width="4"/><text x="290" y="445" font-size="30" font-weight="700" fill="#805024">Relief / Рельеф</text><text x="290" y="485" font-size="21" fill="#17324d">Slope, elevation / Склон, высота</text><rect x="1030" y="390" width="360" height="130" rx="22" fill="#d9eef0" stroke="#278c96" stroke-width="4"/><text x="1210" y="445" font-size="30" font-weight="700" fill="#17656d">Water / Воды</text><text x="1210" y="485" font-size="21" fill="#17324d">Rivers, soil moisture / Реки, влага</text><rect x="300" y="680" width="360" height="130" rx="22" fill="#e9dfce" stroke="#a66b35" stroke-width="4"/><text x="480" y="735" font-size="30" font-weight="700" fill="#805024">Soil / Почва</text><text x="480" y="775" font-size="21" fill="#17324d">Texture, nutrients / Состав, вещества</text><rect x="840" y="680" width="360" height="130" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="1020" y="735" font-size="30" font-weight="700" fill="#386432">Biota / Биота</text><text x="1020" y="775" font-size="21" fill="#17324d">Plants, animals, microbes / Растения, животные, микробы</text></g><g stroke="#52697c" stroke-width="6" fill="none"><path d="M650 265L370 380 M850 265L1130 380 M400 520L470 670 M1100 520L1030 670 M660 745H830"/></g><g fill="#52697c"><path d="M375 350l-5 30 30-5z"/><path d="M1095 375l30 5-5-30z"/><path d="M445 645l25 25 5-30z"/><path d="M1050 640l-20 30-5-30z"/><path d="M810 730l20 15-20 15z"/></g><text x="750" y="865" text-anchor="middle" font-family="Arial" font-size="23" fill="#38566f">A change in one component can affect others / Изменение одного компонента может влиять на другие</text></svg>