<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Методы классификации данных для карт / Data-classification methods for maps</title><desc id="d">Сравнение трёх методов классификации одного условного набора данных: равные интервалы делят диапазон на одинаковые по ширине классы; квантили помещают одинаковое число объектов в каждый класс; естественные границы (Дженкса) группируют значения по внутренним кластерам данных. Границы классов искажать сравнение не должны; для сопоставления карт нужно фиксировать метод и интервалы. / Comparison of three classification methods for one hypothetical dataset: equal intervals divide the value range into equal-width classes; quantiles place the same number of features in each class; natural breaks (Jenks) group values around clusters in the data. Class breaks affect interpretation; comparable maps should use a consistent method and intervals.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:16px Arial;fill:#526879}.p{fill:#f3f7f9;stroke:#7893a1;stroke-width:2}.c1{fill:#dce9ef}.c2{fill:#a9c7d6}.c3{fill:#6e9db7}.c4{fill:#315f7a}.c5{fill:#1d415a}.dot{fill:#b65e46}</style><rect width="1400" height="820" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="h">Классификация меняет рисунок карты / Classification changes the map pattern</text><g transform="translate(40 120)"><rect width="420" height="590" rx="14" class="p"/><text x="210" y="45" text-anchor="middle" class="t">Равные интервалы / Equal interval</text><text x="210" y="75" text-anchor="middle" class="s">Одинаковая ширина диапазона / Equal-width ranges</text><g transform="translate(40 125)"><rect x="0" y="0" width="62" height="82" rx="6" class="c1"/><rect x="68" y="0" width="62" height="82" rx="6" class="c1"/><rect x="136" y="0" width="62" height="82" rx="6" class="c1"/><rect x="204" y="0" width="62" height="82" rx="6" class="c1"/><rect x="272" y="0" width="62" height="82" rx="6" class="c2"/><rect x="0" y="95" width="62" height="82" rx="6" class="c2"/><rect x="68" y="95" width="62" height="82" rx="6" class="c3"/><rect x="136" y="95" width="62" height="82" rx="6" class="c4"/><rect x="204" y="95" width="62" height="82" rx="6" class="c5"/><rect x="272" y="95" width="62" height="82" rx="6" class="c5"/></g><g transform="translate(45 340)"><rect x="0" y="0" width="60" height="28" class="c1"/><rect x="65" y="0" width="60" height="28" class="c2"/><rect x="130" y="0" width="60" height="28" class="c3"/><rect x="195" y="0" width="60" height="28" class="c4"/><rect x="260" y="0" width="60" height="28" class="c5"/></g><text x="210" y="420" text-anchor="middle" class="s">Легенда / Legend</text><text x="210" y="465" text-anchor="middle" class="s">Ширина классов одинакова / Same class width</text><text x="210" y="525" text-anchor="middle" class="s">Подходит для знакомых шкал</text><text x="210" y="550" text-anchor="middle" class="s">Useful for familiar scales</text></g><g transform="translate(495 120)"><rect width="420" height="590" rx="14" class="p"/><text x="210" y="45" text-anchor="middle" class="t">Квантили / Quantiles</text><text x="210" y="75" text-anchor="middle" class="s">Одинаковое число объектов / Equal number of features</text><g transform="translate(40 125)"><rect x="0" y="0" width="62" height="82" rx="6" class="c1"/><rect x="68" y="0" width="62" height="82" rx="6" class="c1"/><rect x="136" y="0" width="62" height="82" rx="6" class="c2"/><rect x="204" y="0" width="62" height="82" rx="6" class="c2"/><rect x="272" y="0" width="62" height="82" rx="6" class="c3"/><rect x="0" y="95" width="62" height="82" rx="6" class="c3"/><rect x="68" y="95" width="62" height="82" rx="6" class="c4"/><rect x="136" y="95" width="62" height="82" rx="6" class="c4"/><rect x="204" y="95" width="62" height="82" rx="6" class="c5"/><rect x="272" y="95" width="62" height="82" rx="6" class="c5"/></g><g transform="translate(45 340)"><rect x="0" y="0" width="60" height="28" class="c1"/><rect x="65" y="0" width="60" height="28" class="c2"/><rect x="130" y="0" width="60" height="28" class="c3"/><rect x="195" y="0" width="60" height="28" class="c4"/><rect x="260" y="0" width="60" height="28" class="c5"/></g><text x="210" y="420" text-anchor="middle" class="s">Легенда / Legend</text><text x="210" y="465" text-anchor="middle" class="s">В каждом классе одинаковое n / Same n per class</text><text x="210" y="525" text-anchor="middle" class="s">Удобно для ранжирования</text><text x="210" y="550" text-anchor="middle" class="s">Useful for ranking</text></g><g transform="translate(950 120)"><rect width="420" height="590" rx="14" class="p"/><text x="210" y="45" text-anchor="middle" class="t">Естественные границы / Natural breaks</text><text x="210" y="75" text-anchor="middle" class="s">Группировка по кластерам / Group by clusters</text><g transform="translate(40 125)"><rect x="0" y="0" width="62" height="82" rx="6" class="c1"/><rect x="68" y="0" width="62" height="82" rx="6" class="c1"/><rect x="136" y="0" width="62" height="82" rx="6" class="c1"/><rect x="204" y="0" width="62" height="82" rx="6" class="c2"/><rect x="272" y="0" width="62" height="82" rx="6" class="c2"/><rect x="0" y="95" width="62" height="82" rx="6" class="c4"/><rect x="68" y="95" width="62" height="82" rx="6" class="c4"/><rect x="136" y="95" width="62" height="82" rx="6" class="c5"/><rect x="204" y="95" width="62" height="82" rx="6" class="c5"/><rect x="272" y="95" width="62" height="82" rx="6" class="c5"/></g><g transform="translate(45 340)"><rect x="0" y="0" width="60" height="28" class="c1"/><rect x="65" y="0" width="60" height="28" class="c2"/><rect x="130" y="0" width="60" height="28" class="c3"/><rect x="195" y="0" width="60" height="28" class="c4"/><rect x="260" y="0" width="60" height="28" class="c5"/></g><text x="210" y="420" text-anchor="middle" class="s">Легенда / Legend</text><text x="210" y="465" text-anchor="middle" class="s">Классы следуют группам значений / Classes follow value clusters</text><text x="210" y="525" text-anchor="middle" class="s">Удобно для сгруппированных данных</text><text x="210" y="550" text-anchor="middle" class="s">Useful for clustered data</text></g><text x="700" y="750" text-anchor="middle" class="s">Классификация зависит от распределения, цели и числа классов; естественные границы разных лет могут быть несопоставимы.</text><text x="700" y="780" text-anchor="middle" class="s">Classification depends on distribution, purpose and class count; natural-breaks classes from different years may not be comparable.</text></svg>