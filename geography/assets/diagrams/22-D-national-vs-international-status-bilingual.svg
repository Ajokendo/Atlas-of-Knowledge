<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Национальный статус и международное признание / National status versus international recognition</title><desc id="desc">Две разные системы признания природных территорий. / Two separate systems of recognising natural areas.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Национальный статус и международное признание</text><text x="40" y="74" class="sub" style="fill:#526579">National status versus international recognition</text><rect x="80" y="120" width="600" height="540" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="104" y="160" class="t" text-anchor="start" >Национальный статус</text><text x="104" y="186" class="s" text-anchor="start" style="fill:#526579">National status</text><text x="110" y="240" class="s" text-anchor="start" >• Заповедник</text><text x="124" y="264" class="sm" text-anchor="start" style="fill:#526579">Nature reserve</text><text x="110" y="330" class="s" text-anchor="start" >• Природный парк</text><text x="124" y="354" class="sm" text-anchor="start" style="fill:#526579">Nature park</text><text x="110" y="420" class="s" text-anchor="start" >• Заказник</text><text x="124" y="444" class="sm" text-anchor="start" style="fill:#526579">Sanctuary</text><text x="110" y="510" class="s" text-anchor="start" >• Памятник природы</text><text x="124" y="534" class="sm" text-anchor="start" style="fill:#526579">Natural monument</text><rect x="740" y="120" width="600" height="540" rx="14" fill="#e4eff6" stroke="#647789" stroke-width="2"/><text x="764" y="160" class="t" text-anchor="start" >Международное признание</text><text x="764" y="186" class="s" text-anchor="start" style="fill:#526579">International recognition</text><text x="770" y="240" class="s" text-anchor="start" >• Биосферный резерват UNESCO (Сары-Челек)</text><text x="784" y="264" class="sm" text-anchor="start" style="fill:#526579">UNESCO biosphere reserve (Sary-Chelek)</text><text x="770" y="330" class="s" text-anchor="start" >• Рамсарское угодье</text><text x="784" y="354" class="sm" text-anchor="start" style="fill:#526579">Ramsar wetland</text><text x="770" y="420" class="s" text-anchor="start" >• Всемирное наследие UNESCO</text><text x="784" y="444" class="sm" text-anchor="start" style="fill:#526579">UNESCO World Heritage</text><text x="80" y="700" class="s" text-anchor="start" >Эти статусы не заменяют друг друга: у территории может быть один, другой или оба.</text><text x="80" y="724" class="s" text-anchor="start" style="fill:#526579">These statuses do not replace each other: an area may hold one, the other or both.</text><text x="40" y="766" class="sm">Схема без карты: показывает, что национальный статус и международные списки различаются; конкретные территории проверять по перечням.</text><text x="40" y="786" class="sm" style="fill:#526579">A non-map schematic: it shows that national status and international listings differ; check specific areas against the lists.</text></svg>