<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Ландшафтная мозаика / Landscape mosaic</title><desc id="d">Пятна, коридор, матрица и барьер. / Patches, corridor, matrix and barrier.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:26px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Ландшафтная мозаика / Landscape mosaic</text><text x="55" y="100" class="s">Пятна, коридор, матрица и барьер. / Patches, corridor, matrix and barrier.</text><rect x="65" y="150" width="1270" height="540" rx="20" fill="#e9dfc9" stroke="#526579" stroke-width="4"/><text x="100" y="205" class="b">Матрица: аграрный ландшафт / Matrix: agricultural landscape</text><path d="M145 330 Q300 255 450 330 T750 330 T1050 330 T1280 330" stroke="#4c9ac2" stroke-width="42" fill="none"/><text x="640" y="275" class="s">Речной коридор / River corridor</text><ellipse cx="340" cy="500" rx="150" ry="100" fill="#5e8a55" stroke="#315c3b" stroke-width="5"/><ellipse cx="980" cy="500" rx="180" ry="120" fill="#5e8a55" stroke="#315c3b" stroke-width="5"/><text x="340" y="510" text-anchor="middle" class="b">Пятно / Patch</text><text x="980" y="510" text-anchor="middle" class="b">Пятно / Patch</text><path d="M495 495 Q680 420 800 475" stroke="#315c3b" stroke-width="8" stroke-dasharray="18 14" fill="none"/><path d="M680 575 L760 655" stroke="#8b5e48" stroke-width="24"/><text x="700" y="680" class="s">Дорога-барьер / Road barrier</text><text x="80" y="735" class="n">Структурная связность = физическая конфигурация; функциональная = возможность перемещения конкретного вида.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual teaching diagram • Conceptual, not site-specific</text></svg>