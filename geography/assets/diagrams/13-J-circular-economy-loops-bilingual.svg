<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="t d"><title id="t">Циклы циркулярной экономики / Circular-economy loops</title><desc id="d">Схема показывает приоритет сохранения ценности технических продуктов: совместное использование, обслуживание, ремонт, повторное использование, восстановление и переработка в последнюю очередь. Биологические материалы, если они безопасны и биоразлагаемы, могут возвращаться в биологический цикл через компостирование или анаэробное сбраживание. Технические материалы не следует возвращать в биосферу. / The diagram prioritises retaining the value of technical products: sharing, maintenance, repair, reuse, refurbishment and recycling as a last resort. Safe biodegradable biological materials can return through composting or anaerobic digestion. Technical materials should not be returned to the biosphere.</desc><style>.h{font:700 29px Arial;fill:#17324d}.th{font:700 19px Arial;fill:#17324d}.s{font:16px Arial;fill:#405968}.sm{font:14px Arial;fill:#526879}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}.a{stroke:#397a8d;stroke-width:3;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397a8d"/></marker></defs><rect width="1300" height="720" fill="white"/><text x="650" y="48" text-anchor="middle" class="h">Сохранение ценности материалов / Keeping materials at value</text><rect x="55" y="95" width="810" height="520" rx="16" fill="#f2f7f8" stroke="#397a8d" stroke-width="2"/><text x="460" y="135" text-anchor="middle" class="th">Технический цикл / Technical cycle</text><g><rect x="105" y="185" width="220" height="90" rx="12" class="p"/><text x="215" y="220" text-anchor="middle" class="th">Дизайн</text><text x="215" y="248" text-anchor="middle" class="s">Design for durability</text><rect x="390" y="185" width="220" height="90" rx="12" class="p"/><text x="500" y="220" text-anchor="middle" class="th">Использование</text><text x="500" y="248" text-anchor="middle" class="s">Use / share</text><rect x="675" y="185" width="145" height="90" rx="12" class="p"/><text x="747" y="220" text-anchor="middle" class="th">Обслуживание</text><text x="747" y="248" text-anchor="middle" class="s">Maintain</text><rect x="675" y="365" width="145" height="90" rx="12" class="p"/><text x="747" y="400" text-anchor="middle" class="th">Ремонт</text><text x="747" y="428" text-anchor="middle" class="s">Repair</text><rect x="390" y="365" width="220" height="90" rx="12" class="p"/><text x="500" y="400" text-anchor="middle" class="th">Повторное использование</text><text x="500" y="428" text-anchor="middle" class="s">Reuse / redistribute</text><rect x="105" y="365" width="220" height="90" rx="12" class="p"/><text x="215" y="400" text-anchor="middle" class="th">Восстановление</text><text x="215" y="428" text-anchor="middle" class="s">Refurbish / remanufacture</text><rect x="105" y="510" width="220" height="70" rx="12" fill="#fff7ed" stroke="#b66a3c" stroke-width="2"/><text x="215" y="540" text-anchor="middle" class="th">Переработка</text><text x="215" y="563" text-anchor="middle" class="s">Recycle last</text></g><g class="a" marker-end="url(#a)"><path d="M325 230H380"/><path d="M610 230H665"/><path d="M747 275V355"/><path d="M675 410H620"/><path d="M390 410H335"/><path d="M215 455V500"/><path d="M105 545H75V230H95"/></g><rect x="900" y="95" width="345" height="520" rx="16" fill="#eef5ec" stroke="#638b58" stroke-width="2"/><text x="1072" y="135" text-anchor="middle" class="th">Биологический цикл / Biological cycle</text><rect x="950" y="190" width="245" height="85" rx="12" class="p"/><text x="1072" y="225" text-anchor="middle" class="th">Безопасные био-</text><text x="1072" y="250" text-anchor="middle" class="s">разлагаемые материалы</text><path d="M1072 275V330" class="a" marker-end="url(#a)"/><rect x="950" y="340" width="245" height="85" rx="12" class="p"/><text x="1072" y="375" text-anchor="middle" class="th">Компостирование</text><text x="1072" y="400" text-anchor="middle" class="s">или анаэробное сбраживание</text><path d="M1072 425V480" class="a" marker-end="url(#a)"/><rect x="950" y="490" width="245" height="85" rx="12" class="p"/><text x="1072" y="525" text-anchor="middle" class="th">Возврат питательных</text><text x="1072" y="550" text-anchor="middle" class="s">веществ в биосферу</text><text x="650" y="665" text-anchor="middle" class="s">Внутренние циклы обычно сохраняют больше встроенной ценности; переработка — не первая, а последняя опция.</text><text x="650" y="690" text-anchor="middle" class="sm">Inner loops generally retain more embedded value; recycling is not the first but the last option.</text></svg>