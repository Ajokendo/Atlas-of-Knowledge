<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Факторы размещения экономической деятельности / Location factors for economic activity</title>
<desc id="desc">Схема показывает, что размещение предприятия зависит от сочетания сырья, энергии, воды, труда, транспорта, рынка, агломерации, институтов и экологических ограничений. Вес факторов различается по видам деятельности. / Diagram showing that a firm's location depends on a combination of raw materials, energy, water, labour, transport, markets, agglomeration, institutions and environmental constraints. The importance of each factor varies by activity.</desc>
<style>.h{font:700 30px Arial,sans-serif;fill:#17324d}.t{font:21px Arial,sans-serif;fill:#17324d}.s{font:17px Arial,sans-serif;fill:#536b7c}.c{fill:#f3f7f8;stroke:#607e8b;stroke-width:2}.center{fill:#e6edf0;stroke:#284e60;stroke-width:3}.ln{stroke:#78939f;stroke-width:3;fill:none}</style>
<rect width="1200" height="700" fill="#fff"/><text x="600" y="52" text-anchor="middle" class="h">Факторы размещения / Location factors</text>
<rect x="425" y="265" width="350" height="150" rx="24" class="center"/><text x="600" y="325" text-anchor="middle" class="h">Предприятие</text><text x="600" y="365" text-anchor="middle" class="t">Firm / activity</text>
<g class="ln"><path d="M425 300 L280 185"/><path d="M600 265 L600 170"/><path d="M775 300 L920 185"/><path d="M425 380 L270 490"/><path d="M775 380 L930 490"/><path d="M600 415 L600 535"/><path d="M475 265 L420 180"/><path d="M725 265 L780 180"/></g>
<g><rect x="75" y="110" width="260" height="90" rx="15" class="c"/><text x="205" y="145" text-anchor="middle" class="t">Сырьё и ресурсы</text><text x="205" y="175" text-anchor="middle" class="s">Raw materials and resources</text>
<rect x="470" y="80" width="260" height="90" rx="15" class="c"/><text x="600" y="115" text-anchor="middle" class="t">Энергия и вода</text><text x="600" y="145" text-anchor="middle" class="s">Energy and water</text>
<rect x="865" y="110" width="260" height="90" rx="15" class="c"/><text x="995" y="145" text-anchor="middle" class="t">Труд и навыки</text><text x="995" y="175" text-anchor="middle" class="s">Labour and skills</text>
<rect x="65" y="470" width="270" height="90" rx="15" class="c"/><text x="200" y="505" text-anchor="middle" class="t">Транспорт и связь</text><text x="200" y="535" text-anchor="middle" class="s">Transport and connectivity</text>
<rect x="865" y="470" width="270" height="90" rx="15" class="c"/><text x="1000" y="505" text-anchor="middle" class="t">Рынок и поставщики</text><text x="1000" y="535" text-anchor="middle" class="s">Markets and suppliers</text>
<rect x="460" y="535" width="280" height="90" rx="15" class="c"/><text x="600" y="570" text-anchor="middle" class="t">Институты и земля</text><text x="600" y="600" text-anchor="middle" class="s">Institutions and land</text>
<rect x="325" y="80" width="125" height="90" rx="15" class="c"/><text x="387" y="115" text-anchor="middle" class="t">Экология</text><text x="387" y="145" text-anchor="middle" class="s">Environment</text>
<rect x="750" y="80" width="125" height="90" rx="15" class="c"/><text x="812" y="115" text-anchor="middle" class="t">Кластеры</text><text x="812" y="145" text-anchor="middle" class="s">Clusters</text></g>
<text x="600" y="670" text-anchor="middle" class="s">Нет универсального набора весов: значимость факторов зависит от отрасли, технологии и конкретного места. / There is no universal weighting: factor importance depends on industry, technology and place.</text>
</svg>