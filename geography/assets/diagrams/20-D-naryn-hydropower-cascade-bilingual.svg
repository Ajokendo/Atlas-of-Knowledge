<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Нижненарынский каскад ГЭС / Lower Naryn hydropower cascade</title><desc id="d">Схема последовательности пяти действующих ГЭС Нижненарынского каскада по течению Нарына: Токтогульская, Курпсайская, Таш-Кумырская, Шамалды-Сайская и Уч-Курганская. Суммарная установленная мощность по данным Национального плана управления водными ресурсами составляет 2 870 МВт. Кambar-Ata projects are shown separately and are not included in this operating total. / Schematic downstream sequence of five operating hydropower plants in the Lower Naryn cascade: Toktogul, Kurpsai, Tash-Kumyr, Shamaldy-Sai and Uch-Kurgan. Total installed capacity reported by the National Water Resources Management Plan is 2,870 MW. Kambar-Ata projects are shown separately and are not included in this operating total.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.p{fill:#eaf3f7;stroke:#4d829e;stroke-width:3}.f{stroke:#287fa7;stroke-width:6;fill:none;marker-end:url(#ar)}.future{fill:#fbf5e8;stroke:#b18a43;stroke-width:3;stroke-dasharray:9 7}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#287fa7"/></marker></defs><rect width="1400" height="760" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Нарынский каскад ГЭС / Naryn hydropower cascade</text><text x="700" y="95" text-anchor="middle" class="s">Условная последовательность по течению реки, не в масштабе / Schematic downstream sequence, not to scale</text><g transform="translate(35 225)"><rect width="225" height="150" rx="14" class="p"/><path d="M20 105 H205" stroke="#287fa7" stroke-width="7"/><path d="M65 55 L65 105 M160 55 L160 105 M65 55 H160" stroke="#6d8793" stroke-width="8"/><text x="112" y="35" text-anchor="middle" class="t">Токтогул</text><text x="112" y="135" text-anchor="middle" class="s">Toktogul</text></g><path d="M260 300 H290" class="f"/><g transform="translate(305 225)"><rect width="225" height="150" rx="14" class="p"/><path d="M20 105 H205" stroke="#287fa7" stroke-width="7"/><path d="M65 55 L65 105 M160 55 L160 105 M65 55 H160" stroke="#6d8793" stroke-width="8"/><text x="112" y="35" text-anchor="middle" class="t">Курпсай</text><text x="112" y="135" text-anchor="middle" class="s">Kurpsai</text></g><path d="M530 300 H560" class="f"/><g transform="translate(575 225)"><rect width="225" height="150" rx="14" class="p"/><path d="M20 105 H205" stroke="#287fa7" stroke-width="7"/><path d="M65 55 L65 105 M160 55 L160 105 M65 55 H160" stroke="#6d8793" stroke-width="8"/><text x="112" y="35" text-anchor="middle" class="t">Таш-Кумыр</text><text x="112" y="135" text-anchor="middle" class="s">Tash-Kumyr</text></g><path d="M800 300 H830" class="f"/><g transform="translate(845 225)"><rect width="225" height="150" rx="14" class="p"/><path d="M20 105 H205" stroke="#287fa7" stroke-width="7"/><path d="M65 55 L65 105 M160 55 L160 105 M65 55 H160" stroke="#6d8793" stroke-width="8"/><text x="112" y="35" text-anchor="middle" class="t">Шамалды-Сай</text><text x="112" y="135" text-anchor="middle" class="s">Shamaldy-Sai</text></g><path d="M1070 300 H1100" class="f"/><g transform="translate(1115 225)"><rect width="225" height="150" rx="14" class="p"/><path d="M20 105 H205" stroke="#287fa7" stroke-width="7"/><path d="M65 55 L65 105 M160 55 L160 105 M65 55 H160" stroke="#6d8793" stroke-width="8"/><text x="112" y="35" text-anchor="middle" class="t">Уч-Курган</text><text x="112" y="135" text-anchor="middle" class="s">Uch-Kurgan</text></g><rect x="90" y="455" width="1220" height="95" rx="14" fill="#f1f6f8" stroke="#7893a1" stroke-width="2"/><text x="700" y="495" text-anchor="middle" class="t">Суммарная установленная мощность каскада / Total installed capacity</text><text x="700" y="530" text-anchor="middle" class="h">2 870 МВт / MW</text><rect x="90" y="590" width="1220" height="105" rx="14" class="future"/><text x="700" y="630" text-anchor="middle" class="t">Камбаратинские проекты / Kambar-Ata projects</text><text x="700" y="665" text-anchor="middle" class="s">Показаны отдельно; не входят в суммарную мощность пяти перечисленных действующих ГЭС. Статус и проектные параметры требуют обновления по каждому объекту.</text><text x="700" y="690" text-anchor="middle" class="s">Shown separately; excluded from the operating five-plant total. Status and planned parameters must be updated for each project.</text><text x="700" y="735" text-anchor="middle" class="s">Источник / Source: AF NWRMP, Naryn–Syr Darya basin, hydropower section (accessed 5 Nov 2026).</text></svg>