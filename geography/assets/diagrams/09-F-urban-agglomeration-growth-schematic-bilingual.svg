<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Рост городской агломерации / Urban agglomeration growth</title><desc id="d">Три условных временных среза; административная граница не равна функциональной зоне. / Three hypothetical time slices; an administrative boundary is not the same as a functional urban area.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.axis{stroke:#526579;stroke-width:3;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Рост городской агломерации / Urban agglomeration growth</text><text x="55" y="100" class="s">Три условных временных среза; административная граница не равна функциональной зоне. / Three hypothetical time slices; an administrative boundary is not the same as a functional urban area.</text><text x="250" y="170" text-anchor="middle" class="b">Ранний этап / Early</text><rect x="80" y="205" width="340" height="430" rx="16" fill="#edf0e8" stroke="#526579" stroke-width="3"/><circle cx="250" cy="420" r="65" fill="#c78b79" opacity=".9"/><circle cx="250" cy="420" r="42" fill="#8a5b51"/><path d="M250 420 L250 235 M250 420 L380 500 M250 420 L130 525" stroke="#526579" stroke-width="8"/><path d="M105 230 H395 V610 H105 Z" stroke="#557aa8" stroke-width="3" stroke-dasharray="10 8" fill="none"/><text x="250" y="675" text-anchor="middle" class="n">Ядро + пригороды / Core + suburbs</text><text x="690" y="170" text-anchor="middle" class="b">Расширение / Expansion</text><rect x="520" y="205" width="340" height="430" rx="16" fill="#edf0e8" stroke="#526579" stroke-width="3"/><circle cx="690" cy="420" r="105" fill="#c78b79" opacity=".9"/><circle cx="690" cy="420" r="42" fill="#8a5b51"/><path d="M690 420 L690 235 M690 420 L820 500 M690 420 L570 525" stroke="#526579" stroke-width="8"/><path d="M545 230 H835 V610 H545 Z" stroke="#557aa8" stroke-width="3" stroke-dasharray="10 8" fill="none"/><text x="690" y="675" text-anchor="middle" class="n">Ядро + пригороды / Core + suburbs</text><text x="1130" y="170" text-anchor="middle" class="b">Поздний этап / Later</text><rect x="960" y="205" width="340" height="430" rx="16" fill="#edf0e8" stroke="#526579" stroke-width="3"/><circle cx="1130" cy="420" r="145" fill="#c78b79" opacity=".9"/><circle cx="1130" cy="420" r="42" fill="#8a5b51"/><path d="M1130 420 L1130 235 M1130 420 L1260 500 M1130 420 L1010 525" stroke="#526579" stroke-width="8"/><path d="M985 230 H1275 V610 H985 Z" stroke="#557aa8" stroke-width="3" stroke-dasharray="10 8" fill="none"/><text x="1130" y="675" text-anchor="middle" class="n">Ядро + пригороды / Core + suburbs</text><text x="80" y="730" class="n">Условная схема для объяснения роста; границы и даты не являются наблюдаемыми данными. / Hypothetical teaching model; boundaries and dates are not observed data.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No country-specific data implied</text></svg>