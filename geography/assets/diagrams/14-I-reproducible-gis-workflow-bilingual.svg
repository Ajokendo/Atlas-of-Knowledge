<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><title id="t">Воспроизводимый ГИС-проект / Reproducible GIS project</title><desc id="d">Рабочий цикл воспроизводимого ГИС-проекта: вопрос и область исследования, получение данных с лицензиями и метаданными, фиксация CRS и версий, обработка скриптами и параметрами, проверка качества, документирование результатов и публикация. Обратная связь позволяет повторить или исправить этап. / Workflow for a reproducible GIS project: define the question and study area, acquire data with licences and metadata, record CRS and versions, process using scripts and parameters, validate quality, document results and publish. Feedback allows steps to be repeated or corrected.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.p{fill:#edf4f7;stroke:#66899b;stroke-width:2}.a{stroke:#315d76;stroke-width:4;fill:none;marker-end:url(#ar)}.f{stroke:#73946a;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#gr)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#315d76"/></marker><marker id="gr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#73946a"/></marker></defs><rect width="1400" height="780" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="h">Воспроизводимый ГИС-проект / Reproducible GIS project</text><g transform="translate(25 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">Вопрос и область</text><text x="82" y="78" text-anchor="middle" class="s">Question & study area</text><text x="82" y="118" text-anchor="middle" class="s">Цель • масштаб • единицы</text></g><path d="M190 265 H215" class="a"/><g transform="translate(220 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">Данные и права</text><text x="82" y="78" text-anchor="middle" class="s">Data & rights</text><text x="82" y="118" text-anchor="middle" class="s">Источник • лицензия • дата</text></g><path d="M190 265 H410" class="a"/><g transform="translate(415 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">CRS и версии</text><text x="82" y="78" text-anchor="middle" class="s">CRS & versions</text><text x="82" y="118" text-anchor="middle" class="s">CRS • ПО • параметры</text></g><path d="M190 265 H605" class="a"/><g transform="translate(610 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">Обработка</text><text x="82" y="78" text-anchor="middle" class="s">Processing</text><text x="82" y="118" text-anchor="middle" class="s">Скрипты • шаги • настройки</text></g><path d="M190 265 H800" class="a"/><g transform="translate(805 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">Проверка</text><text x="82" y="78" text-anchor="middle" class="s">Validation</text><text x="82" y="118" text-anchor="middle" class="s">Точность • топология • QA</text></g><path d="M190 265 H995" class="a"/><g transform="translate(1000 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">Документация</text><text x="82" y="78" text-anchor="middle" class="s">Documentation</text><text x="82" y="118" text-anchor="middle" class="s">Метаданные • ограничения</text></g><path d="M190 265 H1190" class="a"/><g transform="translate(1195 190)"><rect width="165" height="155" rx="14" class="p"/><text x="82" y="45" text-anchor="middle" class="t">Публикация</text><text x="82" y="78" text-anchor="middle" class="s">Publication</text><text x="82" y="118" text-anchor="middle" class="s">Результат • цитирование</text></g><path d="M1270 365 V470 H110 V365" class="f"/><rect x="140" y="520" width="1120" height="135" rx="16" fill="#f4f8ef" stroke="#73946a" stroke-width="2"/><text x="700" y="565" text-anchor="middle" class="t">Что нужно сохранить / What to preserve</text><text x="700" y="605" text-anchor="middle" class="s">Исходные файлы • метаданные • лицензии • CRS • версии • скрипты • параметры • результаты проверок</text><text x="700" y="635" text-anchor="middle" class="s">Source files • metadata • licences • CRS • versions • scripts • parameters • validation results</text><text x="700" y="720" text-anchor="middle" class="s">Другой исследователь должен понимать, какие данные и действия привели к результату и как повторить процесс.</text><text x="700" y="750" text-anchor="middle" class="s">Another researcher should be able to identify the data and steps behind the result and reproduce the workflow.</text></svg>