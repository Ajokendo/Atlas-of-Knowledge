<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Ледниковые формы рельефа / Glacial landforms</title>
<desc id="desc">Учебная блок-схема горного ледникового ландшафта: кар, рог, арет, висячая долина, трог, боковая и конечная морены, конус выноса. Не в масштабе. / Teaching block diagram of a glaciated mountain landscape showing a cirque, horn, arête, hanging valley, trough, lateral and terminal moraines, and an outwash fan. Not to scale.</desc>
<style>.h{font:700 30px Arial,sans-serif;fill:#17324d}.t{font:21px Arial,sans-serif;fill:#17324d}.s{font:17px Arial,sans-serif;fill:#536b7c}.land{fill:#d9d0bf;stroke:#786b58;stroke-width:4}.ice{fill:#c7e8f4;stroke:#4e8eac;stroke-width:4}.line{stroke:#2f7898;stroke-width:5;fill:none}.mor{stroke:#9a7447;stroke-width:9;fill:none}.call{stroke:#3f5968;stroke-width:2.5;fill:none}</style>
<rect width="1200" height="720" fill="#fff"/>
