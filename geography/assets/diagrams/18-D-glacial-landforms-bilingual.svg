<text x="95" y="125" class="t">Кар / Cirque</text>
<text x="480" y="100" class="t">Рог / Horn</text>
<text x="575" y="190" class="t">Арет / Arête</text>
<text x="80" y="460" class="t">Висячая долина / Hanging valley</text>
<text x="650" y="270" class="t">Трог / Glacial trough</text>
<text x="865" y="325" class="t">Боковая морена / Lateral moraine</text>
<text x="955" y="415" class="t">Конечная морена / Terminal moraine</text>
<text x="600" y="660" text-anchor="middle" class="s">Эрозионные формы и отложения показаны схематично; реальные размеры и взаимное положение различаются. / Erosional forms and deposits are schematic; real dimensions and arrangements vary.</text>
</svg>