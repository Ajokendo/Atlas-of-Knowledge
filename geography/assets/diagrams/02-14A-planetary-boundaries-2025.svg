<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Planetary Boundaries 2025 / Планетарные границы 2025</title>
<desc id="desc">Nine Earth-system processes. Seven boundaries transgressed and two remain within the safe operating space in the 2025 assessment. / Девять процессов системы Земли. По оценке 2025 года семь границ пересечены, две остаются в безопасном пространстве.</desc>
<rect width="1600" height="1180" fill="#f7fafc"/>
<text x="800" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#17324d">Planetary Boundaries / Планетарные границы</text>
<text x="800" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#38566f">Planetary Health Check 2025 · scientific assessment / научная оценка</text>
<rect x="100" y="165" width="1400" height="115" rx="20" fill="#e8eef4"/>
<text x="800" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">7 of 9 boundaries transgressed / 7 из 9 границ пересечены</text>
<text x="800" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#38566f">Global assessment; not a country-level score / Глобальная оценка, не показатель отдельной страны</text>
<g font-family="Arial,sans-serif" font-size="25" fill="#17324d">
<text x="145" y="340" font-weight="700">Earth-system process / Процесс системы Земли</text>
<text x="1080" y="340" font-weight="700">2025 status / Статус 2025</text>
</g>
<g stroke="#d6e0e8" stroke-width="2">
<path d="M100 365H1500 M100 445H1500 M100 525H1500 M100 605H1500 M100 685H1500 M100 765H1500 M100 845H1500 M100 925H1500 M100 1005H1500 M100 1085H1500"/>
</g>
<g font-family="Arial,sans-serif" font-size="26" fill="#20394f">
<text x="145" y="416">Climate change / Изменение климата</text>
<text x="145" y="496">Biosphere integrity / Целостность биосферы</text>
<text x="145" y="576">Land-system change / Изменение землепользования</text>
<text x="145" y="656">Freshwater change / Изменение пресноводных систем</text>
<text x="145" y="736">Biogeochemical flows (N, P) / Потоки азота и фосфора</text>
<text x="145" y="816">Ocean acidification / Закисление океана</text>
<text x="145" y="896">Novel entities / Новые вещества и загрязнители</text>
<text x="145" y="976">Atmospheric aerosol loading / Аэрозольная нагрузка</text>
<text x="145" y="1056">Stratospheric ozone depletion / Истощение озонового слоя</text>
</g>
<g font-family="Arial,sans-serif" font-size="24" font-weight="700">
<g><rect x="1050" y="382" width="380" height="48" rx="24" fill="#f5d5d2"/><text x="1240" y="414" text-anchor="middle" fill="#8b2e28">Transgressed / Пересечена</text></g>
<g><rect x="1050" y="462" width="380" height="48" rx="24" fill="#f5d5d2"/><text x="1240" y="494" text-anchor="middle" fill="#8b2e28">Transgressed / Пересечена</text></g>
