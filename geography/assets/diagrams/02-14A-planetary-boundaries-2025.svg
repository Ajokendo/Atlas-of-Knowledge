<g><rect x="1050" y="702" width="380" height="48" rx="24" fill="#f5d5d2"/><text x="1240" y="734" text-anchor="middle" fill="#8b2e28">Transgressed / Пересечена</text></g>
<g><rect x="1050" y="782" width="380" height="48" rx="24" fill="#f5d5d2"/><text x="1240" y="814" text-anchor="middle" fill="#8b2e28">Transgressed / Пересечена</text></g>
<g><rect x="1050" y="862" width="380" height="48" rx="24" fill="#f5d5d2"/><text x="1240" y="894" text-anchor="middle" fill="#8b2e28">Transgressed / Пересечена</text></g>
