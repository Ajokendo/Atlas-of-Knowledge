</g>
<text x="120" y="1135" font-family="Arial,sans-serif" font-size="19" fill="#52697c">Note / Примечание: ozone depletion has regional exceedance over Antarctica. / Истощение озона регионально превышает границу над Антарктидой.</text>
</svg>