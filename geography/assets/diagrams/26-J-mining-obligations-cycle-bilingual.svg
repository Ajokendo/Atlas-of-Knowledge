<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Горнодобыча: от карьера до рекультивации / Mining: from pit to reclamation</title><desc id="desc">Последовательность экологических обязательств. / The sequence of environmental obligations.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Горнодобыча: от карьера до рекультивации</text><text x="40" y="74" class="sub" style="fill:#526579">Mining: from pit to reclamation</text><rect x="40" y="250" width="240" height="130" rx="14" fill="#f4ecd9" stroke="#647789" stroke-width="2"/><text x="160" y="310" class="lab" text-anchor="middle" >Карьер или шахта</text><text x="160" y="334" class="sm" text-anchor="middle" style="fill:#526579">Pit or mine</text><path d="M284 315 L306 315" class="arr"/><rect x="310" y="250" width="240" height="130" rx="14" fill="#f5e7e4" stroke="#647789" stroke-width="2"/><text x="430" y="310" class="lab" text-anchor="middle" >Хвостохранилище</text><text x="430" y="334" class="sm" text-anchor="middle" style="fill:#526579">Tailings storage</text><path d="M554 315 L576 315" class="arr"/><rect x="580" y="250" width="240" height="130" rx="14" fill="#f5e7e4" stroke="#647789" stroke-width="2"/><text x="700" y="310" class="lab" text-anchor="middle" >Нарушенные земли</text><text x="700" y="334" class="sm" text-anchor="middle" style="fill:#526579">Disturbed land</text><path d="M824 315 L846 315" class="arr"/><rect x="850" y="250" width="240" height="130" rx="14" fill="#e4eff6" stroke="#647789" stroke-width="2"/><text x="970" y="310" class="lab" text-anchor="middle" >Мониторинг</text><text x="970" y="334" class="sm" text-anchor="middle" style="fill:#526579">Monitoring</text><path d="M1094 315 L1116 315" class="arr"/><rect x="1120" y="250" width="240" height="130" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="1240" y="310" class="lab" text-anchor="middle" >Рекультивация</text><text x="1240" y="334" class="sm" text-anchor="middle" style="fill:#526579">Reclamation</text><text x="40" y="470" class="s" text-anchor="start" >Экологические обязательства начинаются до добычи (оценка воздействия) и продолжаются после закрытия.</text><text x="40" y="494" class="s" text-anchor="start" style="fill:#526579">Environmental obligations start before extraction (impact assessment) and continue after closure.</text><text x="40" y="766" class="sm">Схема цикла без карты: расположение хвостохранилищ и нарушенных земель — по официальным реестрам.</text><text x="40" y="786" class="sm" style="fill:#526579">A cycle schematic without a map: locations of tailings and disturbed land come from official registers.</text></svg>