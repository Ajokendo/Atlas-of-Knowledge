<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Уровни биоразнообразия и факторы утраты / Levels of biodiversity and drivers of loss</title><desc id="d">Три взаимосвязанных уровня биоразнообразия: генетическое разнообразие внутри видов, разнообразие видов и разнообразие экосистем. Внизу показаны пять основных прямых факторов изменений природы: изменение землепользования и моря, прямое использование организмов, изменение климата, загрязнение и инвазивные чужеродные виды. / Three interconnected levels of biodiversity: genetic diversity within species, species diversity and ecosystem diversity. Five major direct drivers of nature change are shown: land/sea-use change, direct exploitation, climate change, pollution and invasive alien species.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 22px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.c{fill:#edf4e9;stroke:#6e9270;stroke-width:3}.d{fill:#f7f3e8;stroke:#b49a61;stroke-width:2}.arr{stroke:#527d68;stroke-width:4;fill:none}</style><rect width="1400" height="760" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Биоразнообразие: три уровня и факторы изменений / Biodiversity: three levels and drivers</text><g transform="translate(55 115)"><rect width="390" height="190" rx="18" class="c"/><text x="195" y="55" text-anchor="middle" class="t">Генетическое разнообразие</text><text x="195" y="88" text-anchor="middle" class="s">Genetic diversity</text><text x="195" y="135" text-anchor="middle" class="s">Различия генов и признаков внутри популяций</text><text x="195" y="160" text-anchor="middle" class="s">Genetic variation within populations</text></g><g transform="translate(500 115)"><rect width="390" height="190" rx="18" class="c"/><text x="195" y="55" text-anchor="middle" class="t">Видовое разнообразие</text><text x="195" y="88" text-anchor="middle" class="s">Species diversity</text><text x="195" y="135" text-anchor="middle" class="s">Разнообразие видов и их численность</text><text x="195" y="160" text-anchor="middle" class="s">Variety and abundance of species</text></g><g transform="translate(945 115)"><rect width="390" height="190" rx="18" class="c"/><text x="195" y="55" text-anchor="middle" class="t">Разнообразие экосистем</text><text x="195" y="88" text-anchor="middle" class="s">Ecosystem diversity</text><text x="195" y="135" text-anchor="middle" class="s">Разные местообитания, сообщества и процессы</text><text x="195" y="160" text-anchor="middle" class="s">Different habitats, communities and processes</text></g><path d="M250 330 H1150" class="arr"/><text x="700" y="365" text-anchor="middle" class="t">Основные прямые факторы утраты / Major direct drivers of loss</text><g transform="translate(35 420)"><rect width="240" height="145" rx="14" class="d"/><text x="120" y="58" text-anchor="middle" class="t">Землепользование</text><text x="120" y="92" text-anchor="middle" class="s">Land/sea-use change</text></g><g transform="translate(305 420)"><rect width="240" height="145" rx="14" class="d"/><text x="120" y="58" text-anchor="middle" class="t">Эксплуатация</text><text x="120" y="92" text-anchor="middle" class="s">Direct exploitation</text></g><g transform="translate(575 420)"><rect width="240" height="145" rx="14" class="d"/><text x="120" y="58" text-anchor="middle" class="t">Климат</text><text x="120" y="92" text-anchor="middle" class="s">Climate change</text></g><g transform="translate(845 420)"><rect width="240" height="145" rx="14" class="d"/><text x="120" y="58" text-anchor="middle" class="t">Загрязнение</text><text x="120" y="92" text-anchor="middle" class="s">Pollution</text></g><g transform="translate(1115 420)"><rect width="240" height="145" rx="14" class="d"/><text x="120" y="58" text-anchor="middle" class="t">Инвазивные виды</text><text x="120" y="92" text-anchor="middle" class="s">Invasive species</text></g><text x="700" y="640" text-anchor="middle" class="s">Прямые факторы взаимодействуют с косвенными социальными и экономическими причинами. / Direct drivers interact with indirect social and economic causes.</text><text x="700" y="680" text-anchor="middle" class="s">Уровни биоразнообразия взаимосвязаны: изменение одного уровня может влиять на другие. / Biodiversity levels are interrelated; change at one level can affect the others.</text></svg>