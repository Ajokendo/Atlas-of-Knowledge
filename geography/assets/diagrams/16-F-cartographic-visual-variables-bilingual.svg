<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Визуальные переменные картографии / Cartographic visual variables</title><desc id="d">Примеры визуальных переменных для кодирования данных на карте: положение, размер, форма, цветовой тон, светлота, насыщенность и текстура. Разные переменные подходят для разных типов данных; цветовой тон часто применяют для категорий, а светлоту или размер — для упорядоченных величин. / Examples of visual variables for encoding map data: position, size, shape, hue, value, saturation and texture. Different variables suit different data types; hue is often used for categories, while value or size can encode ordered quantities.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:16px Arial;fill:#526879}.p{fill:#f3f7f9;stroke:#7893a1;stroke-width:2}.c{fill:#6f9fba;stroke:#315d76;stroke-width:2}</style><rect width="1400" height="800" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="h">Визуальные переменные / Visual variables</text><g transform="translate(35 115)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Положение / Position</text><text x="320" y="62" text-anchor="middle" class="s">Где расположен объект</text><text x="320" y="84" text-anchor="middle" class="s">Where a feature is located</text><g transform="translate(160 0)"><circle cx="100" cy="120" r="14" class="c"/><circle cx="185" cy="70" r="14" class="c"/><circle cx="255" cy="145" r="14" class="c"/></g></g><g transform="translate(715 115)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Размер / Size</text><text x="320" y="62" text-anchor="middle" class="s">Количество или величина</text><text x="320" y="84" text-anchor="middle" class="s">Quantity or magnitude</text><g transform="translate(160 0)"><circle cx="95" cy="110" r="12" class="c"/><circle cx="180" cy="110" r="25" class="c"/><circle cx="270" cy="110" r="42" class="c"/></g></g><g transform="translate(35 320)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Форма / Shape</text><text x="320" y="62" text-anchor="middle" class="s">Категории</text><text x="320" y="84" text-anchor="middle" class="s">Categories</text><g transform="translate(160 0)"><circle cx="90" cy="110" r="25" class="c"/><rect x="150" y="85" width="50" height="50" class="c"/><path d="M265 80 L295 135 L235 135Z" class="c"/></g></g><g transform="translate(715 320)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Цветовой тон / Hue</text><text x="320" y="62" text-anchor="middle" class="s">Различные категории</text><text x="320" y="84" text-anchor="middle" class="s">Distinct categories</text><g transform="translate(160 0)"><rect x="60" y="85" width="50" height="50" fill="#5b8cbd"/><rect x="125" y="85" width="50" height="50" fill="#d17b54"/><rect x="190" y="85" width="50" height="50" fill="#6c9a72"/></g></g><g transform="translate(35 525)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Светлота / Value</text><text x="320" y="62" text-anchor="middle" class="s">Упорядоченные величины</text><text x="320" y="84" text-anchor="middle" class="s">Ordered values</text><g transform="translate(160 0)"><rect x="55" y="85" width="45" height="50" fill="#dce8ee"/><rect x="110" y="85" width="45" height="50" fill="#9fc2d3"/><rect x="165" y="85" width="45" height="50" fill="#5d91ad"/><rect x="220" y="85" width="45" height="50" fill="#244d68"/></g></g><g transform="translate(715 525)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Насыщенность / Saturation</text><text x="320" y="62" text-anchor="middle" class="s">Сила цветового акцента</text><text x="320" y="84" text-anchor="middle" class="s">Colour intensity</text><g transform="translate(160 0)"><rect x="55" y="85" width="45" height="50" fill="#d6e0e6"/><rect x="110" y="85" width="45" height="50" fill="#a7c4d4"/><rect x="165" y="85" width="45" height="50" fill="#6e9eb9"/><rect x="220" y="85" width="45" height="50" fill="#2c729c"/></g></g><g transform="translate(35 730)"><rect width="640" height="180" rx="14" class="p"/><text x="320" y="35" text-anchor="middle" class="t">Текстура / Texture</text><text x="320" y="62" text-anchor="middle" class="s">Плотность или тип рисунка</text><text x="320" y="84" text-anchor="middle" class="s">Pattern or texture</text><g transform="translate(160 0)"><rect x="55" y="85" width="65" height="50" fill="#edf3f6" stroke="#7893a1"/><path d="M55 90 L115 130 M55 105 L95 135 M75 85 L120 115" stroke="#315d76" stroke-width="3"/><rect x="155" y="85" width="65" height="50" fill="#edf3f6" stroke="#7893a1"/><circle cx="170" cy="100" r="4" class="c"/><circle cx="195" cy="100" r="4" class="c"/><circle cx="210" cy="120" r="4" class="c"/></g></g><text x="700" y="770" text-anchor="middle" class="s">Выбирайте переменную по типу данных: категории, порядок или количественная величина.</text><text x="700" y="795" text-anchor="middle" class="s">Choose variables to match data type: category, order or quantitative magnitude.</text></svg>