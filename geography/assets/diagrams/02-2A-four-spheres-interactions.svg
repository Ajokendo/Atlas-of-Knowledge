<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Interactions between four Earth spheres / Взаимодействие четырёх оболочек Земли</title><desc id="d">Examples of exchanges: evaporation, weathering, photosynthesis and runoff. / Примеры обмена: испарение, выветривание, фотосинтез и сток.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">How Earth's spheres interact / Как взаимодействуют оболочки Земли</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="520" y="150" width="460" height="130" rx="24" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="750" y="205" font-size="34" font-weight="700" fill="#174e78">Atmosphere / Атмосфера</text><text x="750" y="245" font-size="22" fill="#17324d">Rain, wind, heat / Дождь, ветер, тепло</text><rect x="110" y="390" width="460" height="150" rx="24" fill="#d9eef0" stroke="#278c96" stroke-width="4"/><text x="340" y="450" font-size="34" font-weight="700" fill="#17656d">Hydrosphere / Гидросфера</text><text x="340" y="495" font-size="22" fill="#17324d">Water and ice / Вода и лёд</text><rect x="930" y="390" width="460" height="150" rx="24" fill="#f1e4d2" stroke="#a66b35" stroke-width="4"/><text x="1160" y="450" font-size="34" font-weight="700" fill="#805024">Lithosphere / Литосфера</text><text x="1160" y="495" font-size="22" fill="#17324d">Rocks and soils / Породы и почвы</text><rect x="520" y="650" width="460" height="150" rx="24" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="750" y="710" font-size="34" font-weight="700" fill="#386432">Biosphere / Биосфера</text><text x="750" y="755" font-size="22" fill="#17324d">Organisms / Организмы</text></g><g stroke="#52697c" stroke-width="7" fill="none" stroke-linecap="round"><path d="M590 280L410 380"/><path d="M910 280L1090 380"/><path d="M570 540L650 640"/><path d="M930 540L850 640"/><path d="M570 450Q750 350 930 450"/></g><g fill="#52697c"><path d="M420 350l-10 30 30-10z"/><path d="M1060 370l30 10-10-30z"/><path d="M630 610l20 30 10-30z"/><path d="M840 610l10 30 20-30z"/><path d="M900 430l30 20-30 20z"/></g><g font-family="Arial,sans-serif" font-size="21" fill="#38566f"><text x="230" y="310">Evaporation / Испарение</text><text x="1070" y="310">Weathering / Выветривание</text><text x="190" y="615">Runoff / Сток</text><text x="1050" y="615">Soil nutrients / Питательные вещества</text><text x="750" y="355" text-anchor="middle">Precipitation / Осадки</text></g></svg>