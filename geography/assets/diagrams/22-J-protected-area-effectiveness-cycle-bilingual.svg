<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Оценка эффективности управления ООПТ / Protected-area management effectiveness</title><desc id="desc">Цикл адаптивного управления по шести компонентам; индикаторы подбирают под конкретную территорию. / Adaptive-management cycle with six components; indicators are tailored to each site.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Оценка эффективности управления ООПТ / Protected-area management effectiveness</text><text x="50" y="88" class="sub">Цикл адаптивного управления по шести компонентам; индикаторы подбирают под конкретную территорию. / Adaptive-management cycle with six components; indicators are tailored to each site.</text>
<rect x="65" y="160" width="360" height="150" fill="#e4eff6" class="box"/><text x="83" y="195" class="t">Контекст / Context</text><text x="83" y="230" class="s">Ценности, состояние, угрозы</text><text x="83" y="257" class="s">Values, status, threats</text>
<rect x="520" y="160" width="360" height="150" fill="#e5efe3" class="box"/><text x="538" y="195" class="t">Планирование / Planning</text><text x="538" y="230" class="s">Цели, дизайн, план действий</text><text x="538" y="257" class="s">Goals, design, action plan</text>
<rect x="975" y="160" width="360" height="150" fill="#f4ecd9" class="box"/><text x="993" y="195" class="t">Ресурсы / Inputs</text><text x="993" y="230" class="s">Персонал, бюджет, данные</text><text x="993" y="257" class="s">Staff, budget, information</text>
<rect x="975" y="405" width="360" height="150" fill="#f2e7e5" class="box"/><text x="993" y="440" class="t">Процессы / Processes</text><text x="993" y="475" class="s">Управление, участие, контроль</text><text x="993" y="502" class="s">Governance, participation, enforcement</text>
<rect x="520" y="405" width="360" height="150" fill="#e8eef4" class="box"/><text x="538" y="440" class="t">Результаты работы / Outputs</text><text x="538" y="475" class="s">Патрули, восстановление, услуги</text><text x="538" y="502" class="s">Patrols, restoration, services</text>
<rect x="65" y="405" width="360" height="150" fill="#e6efe5" class="box"/><text x="83" y="440" class="t">Итоги / Outcomes</text><text x="83" y="475" class="s">Состояние экосистем и видов</text><text x="83" y="502" class="s">Ecosystem and species condition</text>
<path d="M425 235 H520 M880 235 H975 M1155 310 V405 M975 480 H880 M520 480 H425 M245 405 V310" class="arr"/>
