<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Принцип дистанционного зондирования Земли / Remote-sensing principle</title><desc id="d">Схема пассивного оптического дистанционного зондирования: солнечное излучение проходит через атмосферу, взаимодействует с поверхностью, отражённая энергия проходит обратно к спутниковому сенсору и преобразуется в данные для обработки. Тепловой сенсор может измерять собственное излучение поверхности; активный радар посылает собственный импульс. / Passive optical remote-sensing diagram: solar radiation passes through the atmosphere, interacts with the surface, reflected energy returns to a satellite sensor and is processed into data. Thermal sensors can measure emitted surface radiation; active radar transmits its own pulse.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 22px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.sun{stroke:#d69b38;stroke-width:7;fill:none}.ref{stroke:#2c87aa;stroke-width:6;fill:none;marker-end:url(#ar)}.out{stroke:#b86b42;stroke-width:6;fill:none;marker-end:url(#or)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#2c87aa"/></marker><marker id="or" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#b86b42"/></marker></defs><rect width="1400" height="760" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Как работает оптическое ДЗЗ / How optical remote sensing works</text><circle cx="170" cy="180" r="55" fill="#f4d47d" stroke="#d69b38" stroke-width="4"/><text x="170" y="265" text-anchor="middle" class="t">Солнце / Sun</text><path d="M240 210 L470 420" class="sun"/><path d="M250 190 L490 395" class="sun"/><path d="M330 260 L515 430" class="sun"/><path d="M70 340 Q700 290 1330 340" stroke="#9eb9c7" stroke-width="5" fill="none" stroke-dasharray="12 8"/><text x="700" y="315" text-anchor="middle" class="s">Атмосфера: рассеяние и поглощение / Atmosphere: scattering and absorption</text><path d="M500 500 Q700 455 900 500 L900 560 L500 560Z" fill="#9ac18d" stroke="#64865d" stroke-width="4"/><text x="700" y="600" text-anchor="middle" class="t">Земная поверхность / Earth's surface</text><g transform="translate(1030 120)"><rect width="180" height="75" rx="14" fill="#e7eef5" stroke="#66899b" stroke-width="3"/><rect x="-55" y="22" width="55" height="30" fill="#b8d0df" stroke="#66899b" stroke-width="3"/><rect x="180" y="22" width="55" height="30" fill="#b8d0df" stroke="#66899b" stroke-width="3"/><text x="90" y="45" text-anchor="middle" class="t">Сенсор / Sensor</text></g><path d="M820 480 L1070 210" class="ref"/><text x="980" y="390" class="s">Отражённое излучение / Reflected radiation</text><path d="M900 520 L1120 215" class="out"/><text x="1040" y="535" class="s">Тепловое излучение / Thermal emission</text><rect x="980" y="650" width="260" height="70" rx="12" fill="#f3f7f9" stroke="#7893a1" stroke-width="2"/><text x="1110" y="680" text-anchor="middle" class="t">Обработка данных</text><text x="1110" y="705" text-anchor="middle" class="s">Data processing</text><path d="M1120 195 L1120 645" stroke="#315d76" stroke-width="3" stroke-dasharray="7 6"/><text x="700" y="690" text-anchor="middle" class="s">Схема показывает пассивный оптический принцип; активный SAR использует собственный радиолокационный импульс. / Diagram shows passive optical sensing; active SAR uses its own radar pulse.</text></svg>