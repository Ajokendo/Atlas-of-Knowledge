<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Угрозы природным территориям (качественная матрица) / Threats to natural areas (qualitative matrix)</title><desc id="desc">Какие угрозы типичны для лесов, лугов, озёр и высокогорья. / Which threats are typical for forests, meadows, lakes and high mountains.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Угрозы природным территориям (качественная матрица)</text><text x="40" y="74" class="sub" style="fill:#526579">Threats to natural areas (qualitative matrix)</text><text x="80" y="130" class="sm" text-anchor="start" >Таблица показывает, где угроза обычно значима (●) или менее выражена (○); это качественная оценка.</text><text x="360" y="170" class="lab" text-anchor="middle" >Пожары</text><text x="360" y="190" class="sm" text-anchor="middle" style="fill:#526579">Fires</text><text x="530" y="170" class="lab" text-anchor="middle" >Выпас</text><text x="530" y="190" class="sm" text-anchor="middle" style="fill:#526579">Grazing</text><text x="700" y="170" class="lab" text-anchor="middle" >Инфраструктура</text><text x="700" y="190" class="sm" text-anchor="middle" style="fill:#526579">Infrastructure</text><text x="870" y="170" class="lab" text-anchor="middle" >Инвазивные виды</text><text x="870" y="190" class="sm" text-anchor="middle" style="fill:#526579">Invasive species</text><text x="1040" y="170" class="lab" text-anchor="middle" >Загрязнение</text><text x="1040" y="190" class="sm" text-anchor="middle" style="fill:#526579">Pollution</text><text x="1210" y="170" class="lab" text-anchor="middle" >Климат</text><text x="1210" y="190" class="sm" text-anchor="middle" style="fill:#526579">Climate change</text><rect x="60" y="210" width="250" height="80" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="80" y="246" class="t" text-anchor="start" >Леса</text><text x="80" y="270" class="s" text-anchor="start" >Forests</text><text x="360" y="260" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="530" y="260" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="700" y="260" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="870" y="260" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="1040" y="260" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="1210" y="260" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><rect x="60" y="310" width="250" height="80" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="80" y="346" class="t" text-anchor="start" >Луга</text><text x="80" y="370" class="s" text-anchor="start" >Meadows</text><text x="360" y="360" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="530" y="360" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="700" y="360" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="870" y="360" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="1040" y="360" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="1210" y="360" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><rect x="60" y="410" width="250" height="80" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="80" y="446" class="t" text-anchor="start" >Озёра и водно-болотные</text><text x="80" y="470" class="s" text-anchor="start" >Lakes, wetlands</text><text x="360" y="460" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="530" y="460" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="700" y="460" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="870" y="460" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="1040" y="460" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="1210" y="460" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><rect x="60" y="510" width="250" height="80" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="80" y="546" class="t" text-anchor="start" >Высокогорье</text><text x="80" y="570" class="s" text-anchor="start" >High mountains</text><text x="360" y="560" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="530" y="560" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="700" y="560" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="870" y="560" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="1040" y="560" font-size="38" text-anchor="middle" style="fill:#7f8c8d">○</text><text x="1210" y="560" font-size="38" text-anchor="middle" style="fill:#c0392b">●</text><text x="80" y="680" class="s" text-anchor="start" >Качественная матрица: оценка угроз для конкретной территории требует мониторинга.</text><text x="80" y="704" class="s" text-anchor="start" style="fill:#526579">Qualitative matrix: assessing threats to a specific area requires monitoring.</text><text x="40" y="766" class="sm">Матрица обобщённая и не заменяет оценки конкретных территорий.</text><text x="40" y="786" class="sm" style="fill:#526579">Generalised matrix; it does not replace assessments of specific areas.</text></svg>