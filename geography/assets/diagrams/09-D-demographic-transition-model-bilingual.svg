<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Демографический переход / Demographic transition</title><desc id="d">Обобщённая концептуальная модель, а не универсальная траектория страны. / Generalised conceptual model, not a universal national pathway.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.axis{stroke:#526579;stroke-width:3;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Демографический переход / Demographic transition</text><text x="55" y="100" class="s">Обобщённая концептуальная модель, а не универсальная траектория страны. / Generalised conceptual model, not a universal national pathway.</text><path d="M140 650 V190 M140 650 H1270" class="axis"/><text x="55" y="190" class="n">Уровень / Rate</text><text x="650" y="715" class="s">Время и стадии / Time and stages</text><path d="M150 270 C330 265 400 320 520 450 S850 575 1240 580" fill="none" stroke="#c06c4d" stroke-width="8"/><path d="M150 300 C340 310 430 520 580 575 S900 600 1240 600" fill="none" stroke="#3f8b76" stroke-width="8"/><path d="M150 610 C360 570 450 260 620 210 S900 400 1240 590" fill="none" stroke="#557aa8" stroke-width="7" stroke-dasharray="14 10"/><text x="1020" y="555" class="n">Рождаемость / Birth rate</text><text x="1020" y="620" class="n">Смертность / Death rate</text><text x="700" y="340" class="n">Естественный прирост / Natural increase</text><rect x="150" y="675" width="260" height="0" fill="none"/><text x="200" y="250" class="b">I</text><text x="200" y="280" class="n">Высокие уровни / High rates</text><rect x="430" y="675" width="260" height="0" fill="none"/><text x="480" y="250" class="b">II</text><text x="480" y="280" class="n">Снижение смертности / Mortality falls</text><rect x="710" y="675" width="260" height="0" fill="none"/><text x="760" y="250" class="b">III</text><text x="760" y="280" class="n">Снижение рождаемости / Fertility falls</text><rect x="990" y="675" width="260" height="0" fill="none"/><text x="1040" y="250" class="b">IV–V</text><text x="1040" y="280" class="n">Низкие уровни / Low rates</text><text x="55" y="750" class="n">Форма кривых условна; стадии и их число различаются в версиях модели. / Curves are illustrative; stages and their number vary by model.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No country-specific data implied</text></svg>