ight="54" fill="#a5d3e8" stroke="#5d9bc4"/><text x="662" y="464" class="r2" text-anchor="middle">С</text><rect x="703" y="313" width="49" height="127" fill="#a5d3e8" stroke="#5d9bc4"/><text x="728" y="464" class="r2" text-anchor="middle">О</text><rect x="768" y="295" width="49" height="145" fill="#a5d3e8" stroke="#5d9bc4"/><text x="792" y="464" class="r2" text-anchor="middle">Н</text><rect x="833" y="331" width="49" height="109" fill="#a5d3e8" stroke="#5d9bc4"/><text x="858" y="464" class="r2" text-anchor="middle">Д</text><polyline points="142,417 208,399 272,353 338,307 402,278 468,249 532,231 598,243 662,278 728,318 792,365 858,399" fill="none" stroke="#c0392b" stroke-width="4"/><path d="M110 382H890" stroke="#c0392b" stroke-dasharray="6 5" stroke-width="1.5"/><text x="102" y="388" class="e2" text-anchor="end" style="fill:#c0392b">0 °C</text><line x1="110" y1="108" x2="150" y2="108" stroke="#c0392b" stroke-width="5"/><text x="160" y="114" class="r2">температура, °C</text><rect x="420" y="98" width="26" height="20" fill="#a5d3e8" stroke="#5d9bc4"/><text x="456" y="114" class="r2">осадки, мм (столбцы)</text><text x="160" y="132" class="e2" style="font-size:12px">temperature</text><text x="456" y="132" class="e2" style="font-size:12px">precipitation</text><text x="30" y="520" class="r2" text-anchor="start">1. Когда теплее всего и холоднее всего?  2. Когда больше</text><text x="30" y="544" class="r2" text-anchor="start">осадков?  3. Совпадают ли тепло и влага?</text><text x="30" y="566" class="e2" text-anchor="start">1. When is it warmest and coldest?  2. When is it wettest?  3. Do warmth and</text><text x="30" y="585" class="e2" text-anchor="start">moisture coincide?</text><text x="30" y="661" class="sm">Учебный пример с условными числами — не данные станции.</text><text x="30" y="683" class="sm" style="fill:#526579">A teaching example with illustrative numbers, not station data.</text></svg>