<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Территориальное устройство государства / Territorial organisation of the state</title><desc id="d">Сравнение унитарной, федеративной и регионализованной моделей. / Comparison of unitary, federal and regionalised models.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.line{stroke:#526579;stroke-width:4;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Территориальное устройство государства / Territorial organisation of the state</text><text x="55" y="100" class="s">Сравнение унитарной, федеративной и регионализованной моделей. / Comparison of unitary, federal and regionalised models.</text><rect x="55" y="160" width="390" height="145" fill="#e6f0fb" class="box"/><text x="73" y="198" class="b">Унитарное / Unitary</text><text x="73" y="235" class="s">Единая конституционная система</text><text x="73" y="265" class="n">One constitutional system</text><rect x="505" y="160" width="390" height="145" fill="#e4eee3" class="box"/><text x="523" y="198" class="b">Федеративное / Federal</text><text x="523" y="235" class="s">Полномочия разделены конституцией</text><text x="523" y="265" class="n">Powers divided by constitution</text><rect x="955" y="160" width="390" height="145" fill="#f4e8d4" class="box"/><text x="973" y="198" class="b">Регионализованное / Regionalised</text><text x="973" y="235" class="s">Региональные полномочия закреплены законом</text><text x="973" y="265" class="n">Regional powers established by law</text><rect x="145" y="370" width="210" height="90" rx="16" fill="#d9e3ec" stroke="#526579" stroke-width="3"/><text x="250" y="425" text-anchor="middle" class="b">Центр / Centre</text><path d="M250 460 V520" class="line"/><rect x="80" y="520" width="340" height="90" rx="16" fill="#e9eee8" stroke="#526579" stroke-width="3"/><text x="250" y="575" text-anchor="middle" class="s">Региональные органы / Regional</text><rect x="595" y="370" width="210" height="90" rx="16" fill="#d9e3ec" stroke="#526579" stroke-width="3"/><text x="700" y="425" text-anchor="middle" class="b">Федеральный уровень / Federal</text><path d="M700 460 V520" class="line"/><rect x="530" y="520" width="340" height="90" rx="16" fill="#e9eee8" stroke="#526579" stroke-width="3"/><text x="700" y="575" text-anchor="middle" class="s">Субъекты федерации / States or provinces</text><rect x="1045" y="370" width="210" height="90" rx="16" fill="#d9e3ec" stroke="#526579" stroke-width="3"/><text x="1150" y="425" text-anchor="middle" class="b">Центр / Centre</text><path d="M1150 460 V520" class="line"/><rect x="980" y="520" width="340" height="90" rx="16" fill="#e9eee8" stroke="#526579" stroke-width="3"/><text x="1150" y="575" text-anchor="middle" class="s">Автономные регионы / Autonomous</text><text x="55" y="690" class="n">Конкретные полномочия определяются конституцией и законами каждой страны. / Actual powers are defined by each country's constitution and laws.</text><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No disputed or real-world boundary claims</text></svg>