<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Типы государственных границ / Types of state boundaries</title><desc id="d">Четыре концептуальных примера; это не юридические линии и не реальные спорные участки. / Four conceptual examples; not legal boundary lines or real disputed areas.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.line{stroke:#526579;stroke-width:4;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Типы государственных границ / Types of state boundaries</text><text x="55" y="100" class="s">Четыре концептуальных примера; это не юридические линии и не реальные спорные участки. / Four conceptual examples; not legal boundary lines or real disputed areas.</text><rect x="55" y="150" width="600" height="245" fill="#e6f0fb" class="box"/><text x="73" y="188" class="b">Геометрическая / Geometric</text><text x="73" y="225" class="s">Условная прямая линия по координатам</text><text x="73" y="255" class="n">An abstract straight line defined by coordinates</text><path d="M100 320 H600" stroke="#557aa8" stroke-width="7" stroke-dasharray="18 10"/><rect x="745" y="150" width="600" height="245" fill="#e5f1f2" class="box"/><text x="763" y="188" class="b">Речная / River boundary</text><text x="763" y="225" class="s">Граница следует условному руслу</text><text x="763" y="255" class="n">Boundary follows a schematic river channel</text><path d="M790 310 Q900 240 1010 315 T1300 310" stroke="#4c9ac2" stroke-width="24" fill="none"/><rect x="55" y="455" width="600" height="245" fill="#e4eee3" class="box"/><text x="73" y="493" class="b">По водоразделу / Watershed</text><text x="73" y="530" class="s">Линия по условному гребню между бассейнами</text><text x="73" y="560" class="n">Line along a schematic divide between catchments</text><path d="M100 650 L250 535 L390 610 L600 500" stroke="#4d7c48" stroke-width="8" fill="none"/><rect x="745" y="455" width="600" height="245" fill="#f4e8d4" class="box"/><text x="763" y="493" class="b">Историческая / Historical</text><text x="763" y="530" class="s">Сложилась в результате исторических процессов</text><text x="763" y="560" class="n">Formed through historical processes</text><path d="M790 640 Q930 520 1080 620 T1300 640" stroke="#b58b53" stroke-width="8" fill="none"/><text x="55" y="765" class="n">Atlas of Knowledge • Original bilingual conceptual diagram • No disputed or real-world boundary claims</text></svg>