<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
<title id="title">Geographical research cycle / Цикл географического исследования</title>
<desc id="desc">A project-specific six-stage learning model: ask a question, collect evidence, validate data, analyse spatial relationships, map results, and interpret and communicate findings. The cycle can be repeated. / Авторская шестиступенчатая учебная модель: поставить вопрос, собрать данные, проверить их, проанализировать пространственные связи, представить результаты на карте, интерпретировать и сообщить выводы. Цикл можно повторять.</desc>
<rect width="900" height="1500" fill="#f7fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d">
<text x="450" y="70" font-size="42" font-weight="700">Geographical research cycle</text>
<text x="450" y="118" font-size="38" font-weight="700">Цикл географического исследования</text>
<text x="450" y="165" font-size="28" fill="#425466">An iterative learning model / Итеративная учебная модель</text>
<g stroke="#3979a8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M450 315V345 M430 330L450 355L470 330"/>
<path d="M450 500V530 M430 515L450 540L470 515"/>
<path d="M450 685V715 M430 700L450 725L470 700"/>
<path d="M450 870V900 M430 885L450 910L470 885"/>
<path d="M450 1055V1085 M430 1070L450 1095L470 1070"/>
</g>
<rect x="100" y="195" width="700" height="120" rx="24" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/>
<text x="450" y="245" font-size="38" font-weight="700">1. Ask a question / 1. Поставить вопрос</text>
<text x="450" y="290" font-size="30">Define what needs to be understood / Определить, что нужно выяснить</text>
<rect x="100" y="380" width="700" height="120" rx="24" fill="#d9eef0" stroke="#278c96" stroke-width="4"/>
<text x="450" y="430" font-size="38" font-weight="700">2. Collect evidence / 2. Собрать данные</text>
<text x="450" y="475" font-size="30">Observe, measure and find sources / Наблюдать, измерять, искать источники</text>
<rect x="100" y="565" width="700" height="120" rx="24" fill="#e1eedc" stroke="#56874b" stroke-width="4"/>
<text x="450" y="615" font-size="38" font-weight="700">3. Validate data / 3. Проверить данные</text>
<text x="450" y="660" font-size="30">Check date, method, units and quality / Проверить дату, метод, единицы и качество</text>
<rect x="100" y="750" width="700" height="120" rx="24" fill="#f6eadb" stroke="#a66b35" stroke-width="4"/>
<text x="450" y="800" font-size="38" font-weight="700">4. Analyse space / 4. Анализировать пространство</text>
<text x="450" y="845" font-size="30">Find patterns and relationships / Выявить закономерности и связи</text>
<rect x="100" y="935" width="700" height="120" rx="24" fill="#eee8f7" stroke="#8064a5" stroke-width="4"/>
<text x="450" y="985" font-size="38" font-weight="700">5. Map results / 5. Показать результаты на карте</text>
<text x="450" y="1030" font-size="30">Choose a suitable visual form / Выбрать подходящий способ представления</text>
<rect x="100" y="1120" width="700" height="120" rx="24" fill="#f8e6e2" stroke="#b45a43" stroke-width="4"/>
<text x="450" y="1170" font-size="36" font-weight="700">6. Interpret and communicate</text>
<text x="450" y="1215" font-size="34" font-weight="700">6. Интерпретировать и сообщить выводы</text>
<path d="M800 1180H850V255H810" fill="none" stroke="#3979a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M825 235L800 255L825 275" fill="none" stroke="#3979a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="1335" font-size="30" fill="#425466">Review the question and repeat if needed</text>
<text x="450" y="1380" font-size="30" fill="#425466">При необходимости уточнить вопрос и повторить цикл</text>
</g>
</svg>