<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Сравнение основных заповедников / Comparison of the main nature reserves</title><desc id="desc">Где расположены заповедники и что они охраняют. / Where the reserves are and what they protect.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Сравнение основных заповедников</text><text x="40" y="74" class="sub" style="fill:#526579">Comparison of the main nature reserves</text><text x="40" y="120" class="lab" text-anchor="start" >Заповедник / Reserve</text><text x="330" y="120" class="lab" text-anchor="start" >Где / Where</text><text x="700" y="120" class="lab" text-anchor="start" >Что охраняется / What is protected</text><rect x="30" y="140" width="1340" height="78" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="46" y="172" class="t" text-anchor="start" >Сары-Челек</text><text x="46" y="198" class="s" text-anchor="start" >Sary-Chelek</text><text x="330" y="176" class="s" text-anchor="start" >Джалал-Абад; Чаткал</text><text x="700" y="170" class="s" text-anchor="start" >озеро, леса, луга; биосферный резерват UNESCO (1978)</text><text x="700" y="196" class="s" text-anchor="start" style="fill:#526579">lake, forests, meadows; UNESCO biosphere reserve (1978)</text><rect x="30" y="230" width="1340" height="78" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="46" y="262" class="t" text-anchor="start" >Беш-Арал</text><text x="46" y="288" class="s" text-anchor="start" >Besh-Aral</text><text x="330" y="266" class="s" text-anchor="start" >Джалал-Абад; Западный Тянь-Шань</text><text x="700" y="260" class="s" text-anchor="start" >горные экосистемы, редкие растения и животные</text><text x="700" y="286" class="s" text-anchor="start" style="fill:#526579">mountain ecosystems, rare plants and animals</text><rect x="30" y="320" width="1340" height="78" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="46" y="352" class="t" text-anchor="start" >Падыша-Ата</text><text x="46" y="378" class="s" text-anchor="start" >Padysha-Ata</text><text x="330" y="356" class="s" text-anchor="start" >Джалал-Абад</text><text x="700" y="350" class="s" text-anchor="start" >арчовые леса и горные экосистемы</text><text x="700" y="376" class="s" text-anchor="start" style="fill:#526579">juniper woodlands and mountain ecosystems</text><rect x="30" y="410" width="1340" height="78" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="46" y="442" class="t" text-anchor="start" >Нарынский</text><text x="46" y="468" class="s" text-anchor="start" >Naryn</text><text x="330" y="446" class="s" text-anchor="start" >Внутренний Тянь-Шань</text><text x="700" y="440" class="s" text-anchor="start" >горные леса, водосборы, высокогорье</text><text x="700" y="466" class="s" text-anchor="start" style="fill:#526579">mountain forests, watersheds, high mountains</text><rect x="30" y="500" width="1340" height="78" rx="14" fill="#e5efe3" stroke="#647789" stroke-width="2"/><text x="46" y="532" class="t" text-anchor="start" >Иссык-Кульский</text><text x="46" y="558" class="s" text-anchor="start" >Issyk-Kul</text><text x="330" y="536" class="s" text-anchor="start" >побережье Иссык-Куля</text><text x="700" y="530" class="s" text-anchor="start" >водно-болотные угодья, водоплавающие птицы</text><text x="700" y="556" class="s" text-anchor="start" style="fill:#526579">wetlands, waterbirds</text><rect x="30" y="590" width="1340" height="78" rx="14" fill="#f1f4f6" stroke="#647789" stroke-width="2"/><text x="46" y="622" class="t" text-anchor="start" >Каратал-Жапырык</text><text x="46" y="648" class="s" text-anchor="start" >Karatal-Zhapyryk</text><text x="330" y="626" class="s" text-anchor="start" >Сон-Куль, Чатыр-Куль</text><text x="700" y="620" class="s" text-anchor="start" >высокогорные озёра и водно-болотные места</text><text x="700" y="646" class="s" text-anchor="start" style="fill:#526579">high-mountain lakes and wetlands</text><text x="40" y="766" class="sm">По описаниям главы 22; угрозы, площади и точные границы — в официальных источниках.</text><text x="40" y="786" class="sm" style="fill:#526579">Based on the Chapter 22 descriptions; threats, areas and exact boundaries are in official sources.</text></svg>