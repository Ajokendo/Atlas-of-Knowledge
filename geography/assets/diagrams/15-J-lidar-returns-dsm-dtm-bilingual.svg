<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">LiDAR: отражения и модели поверхности / LiDAR returns and surface models</title><desc id="d">Лазерный сканер посылает импульсы к верхушкам кроны, ветвям и земле; часть импульсов даёт несколько отражений. Классифицированное облако точек разделяет растительность и наземные точки. DSM отображает верхние поверхности, DTM — рельеф земли без объектов, а модель высоты растительности равна DSM минус DTM. Не каждый импульс достигает земли. / A LiDAR scanner sends pulses to canopy tops, branches and ground; some pulses produce multiple returns. A classified point cloud separates vegetation and ground points. DSM represents top surfaces, DTM represents bare-earth terrain, and canopy height is DSM minus DTM. Not every pulse reaches the ground.</desc><style>.h{font:700 29px Arial;fill:#17324d}.th{font:700 20px Arial;fill:#17324d}.s{font:17px Arial;fill:#405968}.sm{font:15px Arial;fill:#526879}.p{fill:#f7fafb;stroke:#a8bbc5;stroke-width:2}.pulse{stroke:#b66a3c;stroke-width:3;stroke-dasharray:7 5}.pt{fill:#397a8d}.gr{fill:#638b58}</style><rect width="1200" height="700" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">LiDAR: импульсы, отражения и модели / LiDAR pulses, returns and models</text><g transform="translate(45 90)"><rect width="1110" height="260" rx="14" class="p"/><rect x="470" y="22" width="170" height="55" rx="12" fill="#dce8ec" stroke="#397a8d" stroke-width="2"/><text x="555" y="56" text-anchor="middle" class="th">Сканер / Scanner</text><g class="pulse"><path d="M500 78L350 210 M555 78L555 220 M610 78L760 205"/></g><g fill="#638b58"><path d="M270 210l35-110 35 110z M690 205l40-130 40 130z M830 210l35-100 35 100z"/></g><path d="M0 230L1110 230" stroke="#638b58" stroke-width="5"/><g class="pt"><circle cx="350" cy="210" r="6"/><circle cx="555" cy="220" r="6"/><circle cx="760" cy="205" r="6"/><circle cx="555" cy="155" r="6"/><circle cx="530" cy="125" r="6"/></g><text x="75" y="250" class="s">Рельеф / Ground</text><text x="800" y="250" class="s">Крона / Canopy</text><text x="555" y="110" class="sm">Первое и последующие отражения / First and later returns</text></g><g transform="translate(55 395)"><rect width="340" height="185" rx="14" class="p"/><text x="170" y="38" text-anchor="middle" class="th">DSM</text><text x="170" y="66" text-anchor="middle" class="s">Модель поверхности</text><text x="170" y="90" text-anchor="middle" class="s">Digital Surface Model</text><path d="M30 145L80 105L125 130L175 65L220 115L270 90L310 145Z" fill="#8eb9a2" stroke="#397a8d" stroke-width="2"/><text x="170" y="170" text-anchor="middle" class="sm">Крона и здания / Canopy and buildings</text></g><g transform="translate(430 395)"><rect width="340" height="185" rx="14" class="p"/><text x="170" y="38" text-anchor="middle" class="th">DTM</text><text x="170" y="66" text-anchor="middle" class="s">Цифровая модель рельефа</text><text x="170" y="90" text-anchor="middle" class="s">Digital Terrain Model</text><path d="M30 145L80 120L125 135L175 105L220 130L270 115L310 145Z" fill="#c8b58c" stroke="#8b7654" stroke-width="2"/><text x="170" y="170" text-anchor="middle" class="sm">Голая поверхность земли / Bare earth</text></g><g transform="translate(805 395)"><rect width="340" height="185" rx="14" class="p"/><text x="170" y="38" text-anchor="middle" class="th">CHM = DSM − DTM</text><text x="170" y="66" text-anchor="middle" class="s">Модель высоты кроны</text><text x="170" y="90" text-anchor="middle" class="s">Canopy Height Model</text><rect x="55" y="115" width="230" height="20" rx="8" fill="#d7e8ec"/><rect x="55" y="115" width="160" height="20" rx="8" fill="#638b58"/><text x="170" y="170" text-anchor="middle" class="sm">Высота объектов / Object height</text></g><text x="600" y="630" text-anchor="middle" class="s">Классификация точек и качество модели зависят от плотности импульсов, угла сканирования и фильтрации. / Point classification and model quality depend on pulse density, scan angle and filtering.</text><text x="600" y="660" text-anchor="middle" class="sm">Схема концептуальная; не является LiDAR-данными конкретной территории. / Conceptual diagram; not LiDAR data from a specific site.</text></svg>