<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="t"><title id="t">Круг деградации пастбищ / The pasture degradation cycle</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="750" fill="#fbfcfe"/><text x="30" y="46" class="h">Круг деградации пастбищ</text><text x="30" y="76" class="sub">The pasture degradation cycle</text><rect x="380" y="105" width="240" height="70" rx="14" fill="#f4d9cf" stroke="#647789" stroke-width="2"/><text x="500" y="138" class="r2" text-anchor="middle">Перевыпас</text><text x="500" y="159" class="e2" text-anchor="middle">Overgrazing</text><path d="M590 189L647 221" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="617" y="236" width="240" height="70" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="738" y="269" class="r2" text-anchor="middle">Меньше трав и корней</text><text x="738" y="290" class="e2" text-anchor="middle">Less vegetation and roots</text><path d="M703 352L681 402" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="526" y="448" width="240" height="70" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="647" y="482" class="r2" text-anchor="middle">Почва без защиты</text><text x="647" y="503" class="e2" text-anchor="middle">Unprotected soil</text><path d="M535 483L464 483" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="233" y="448" width="240" height="70" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="353" y="482" class="r2" text-anchor="middle">Эрозия, сели, засуха</text><text x="353" y="503" class="e2" text-anchor="middle">Erosion, mudflows, drought</text><path d="M318 402L296 352" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="142" y="236" width="240" height="70" rx="14" fill="#f3e6b0" stroke="#647789" stroke-width="2"/><text x="262" y="269" class="r2" text-anchor="middle">Меньше корма</text><text x="262" y="290" class="e2" text-anchor="middle">Less fodder</text><path d="M352 221L409 189" stroke="#526579" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="500" y="325" class="r" text-anchor="middle">Порочный круг</text><text x="500" y="349" class="e" text-anchor="middle">Vicious circle</text><text x="40" y="590" class="r2" text-anchor="start">Разорвать круг помогает ротация пастбищ, учёт нагрузки и</text><text x="40" y="614" class="r2" text-anchor="start">восстановление трав.</text><text x="40" y="636" class="e2" text-anchor="start">Pasture rotation, stocking limits and restoring vegetation break the circle.</text><text x="30" y="712" class="sm">Схема.</text><text x="30" y="734" class="sm" style="fill:#526579">A schematic.</text></svg>