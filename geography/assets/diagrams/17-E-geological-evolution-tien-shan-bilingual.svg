<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Геологическая эволюция Тянь-Шаня / Geological evolution of the Tien Shan</title>
<desc id="desc">Концептуальная временная схема на русском и английском языках: древний докембрийский фундамент, палеозойские океанические бассейны и аккреция, мезозойское выветривание и осадконакопление, кайнозойское внутриконтинентальное сжатие и поднятие. Не является точной реконструкцией конкретного участка или датировкой отдельных пород. / Bilingual conceptual timeline showing ancient Precambrian basement, Palaeozoic ocean basins and accretion, Mesozoic weathering and sedimentation, and Cenozoic intracontinental compression and uplift. Not a site-specific reconstruction or dating of individual rocks.</desc>
<rect width="1200" height="520" rx="24" fill="#f7f8fa"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172b4d">Геологическая эволюция Тянь-Шаня / Geological evolution of the Tien Shan</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#46566b">Концептуальная схема · Conceptual model</text>
<g font-family="Arial,sans-serif">
<rect x="35" y="118" width="270" height="300" rx="16" fill="#e8e1d2" stroke="#8b7653" stroke-width="2"/>
<rect x="330" y="118" width="270" height="300" rx="16" fill="#e3eef5" stroke="#477a9e" stroke-width="2"/>
<rect x="625" y="118" width="270" height="300" rx="16" fill="#e8eee4" stroke="#66845d" stroke-width="2"/>
<rect x="920" y="118" width="245" height="300" rx="16" fill="#f3e5dd" stroke="#a96c4e" stroke-width="2"/>
<g fill="#26364a" font-size="19" font-weight="700">
<text x="170" y="151" text-anchor="middle">Докембрий / Precambrian</text>
<text x="465" y="151" text-anchor="middle">Палеозой / Palaeozoic</text>
<text x="760" y="151" text-anchor="middle">Мезозой / Mesozoic</text>
<text x="1042" y="151" text-anchor="middle">Кайнозой / Cenozoic</text>
</g>
<g fill="#46566b" font-size="15">
<text x="170" y="180" text-anchor="middle">до ~538,8 млн лет</text><text x="170" y="200" text-anchor="middle">before ~538.8 Ma</text>
<text x="465" y="180" text-anchor="middle">538,8–251,9 млн лет</text><text x="465" y="200" text-anchor="middle">538.8–251.9 Ma</text>
<text x="760" y="180" text-anchor="middle">251,9–66,0 млн лет</text><text x="760" y="200" text-anchor="middle">251.9–66.0 Ma</text>
<text x="1042" y="180" text-anchor="middle">66 млн лет — сейчас</text><text x="1042" y="200" text-anchor="middle">66 Ma — present</text>
</g>
