<text x="170" y="360">Древние блоки</text><text x="170" y="381">фундамента</text><text x="170" y="401">Ancient basement blocks</text>
<text x="465" y="360">Субдукция, дуги,</text><text x="465" y="381">аккреция и столкновения</text><text x="465" y="401">Subduction, arcs, accretion</text>
<text x="760" y="360">Выветривание, денудация,</text><text x="760" y="381">осадочные бассейны</text><text x="760" y="401">Weathering, denudation, basins</text>
<text x="1042" y="360">Реактивация разломов,</text><text x="1042" y="381">сжатие и поднятие</text><text x="1042" y="401">Fault reactivation, uplift</text>
