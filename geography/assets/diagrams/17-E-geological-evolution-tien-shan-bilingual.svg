<text x="600" y="480" text-anchor="middle" font-size="16" fill="#34465b">От древнего фундамента к современному горному рельефу / From ancient basement to modern mountain relief</text>
<text x="600" y="504" text-anchor="middle" font-size="13" fill="#65758a">Границы эр — глобальная шкала ICS 2026/06; этапы упрощены и не датируют каждую местную породу. / Era boundaries follow ICS 2026/06; stages are simplified and do not date every local rock.</text>
