<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="t d">
<title id="t">Два вида экологической оценки и сквозной мониторинг / Two types of environmental assessment and cross-cutting monitoring</title>
<desc id="d">Сопоставлены оценка воздействия на окружающую среду проекта (ОВОС/EIA), стратегическая экологическая оценка планов и программ (СЭО/SEA) и экологический мониторинг. Мониторинг является сквозным процессом наблюдения и проверки результатов, а не третьим видом оценки, равнозначным ОВОС и СЭО. / Comparison of project environmental impact assessment (EIA), strategic environmental assessment of plans and programmes (SEA), and environmental monitoring. Monitoring is a cross-cutting process for observing conditions and checking outcomes, not a third assessment type equivalent to EIA and SEA.</desc>
<style>.h{font:700 31px Arial,sans-serif;fill:#17324d}.t{font:700 22px Arial,sans-serif;fill:#fff}.s{font:17px Arial,sans-serif;fill:#17324d}.sm{font:16px Arial,sans-serif;fill:#526879}.head{fill:#315d76}.box{fill:#f3f7f9;stroke:#c4d1d8;stroke-width:2}</style>
<rect width="1400" height="780" fill="#fff"/>
<text x="700" y="48" text-anchor="middle" class="h">Два вида экологической оценки и сквозной мониторинг / Two assessments and cross-cutting monitoring</text>
<g transform="translate(35 95)">
<rect width="420" height="590" rx="14" class="box"/><rect width="420" height="70" rx="14" class="head"/>
<text x="210" y="45" text-anchor="middle" class="t">ОВОС / EIA</text>
<text x="25" y="115" class="sm">Объект / Object</text><text x="25" y="150" class="s">Проект / Project</text>
<text x="25" y="215" class="sm">Когда / When</text><text x="25" y="250" class="s">До решения об одобрении проекта</text><text x="25" y="274" class="s">Before the project decision</text>
<text x="25" y="340" class="sm">Основной фокус / Main focus</text><text x="25" y="375" class="s">Альтернативы и вероятные воздействия</text><text x="25" y="399" class="s">Alternatives and likely effects</text><text x="25" y="423" class="s">Предотвращение и снижение ущерба</text><text x="25" y="447" class="s">Avoidance and impact mitigation</text>
<text x="25" y="505" class="sm">Типичный результат / Typical output</text><text x="25" y="540" class="s">Отчёт для принятия решения</text><text x="25" y="564" class="s">Assessment report for decision-making</text>
</g>
<g transform="translate(490 95)">
<rect width="420" height="590" rx="14" class="box"/><rect width="420" height="70" rx="14" class="head"/>
<text x="210" y="45" text-anchor="middle" class="t">СЭО / SEA</text>
<text x="25" y="115" class="sm">Объект / Object</text><text x="25" y="150" class="s">План, программа, иногда политика</text><text x="25" y="174" class="s">Plan, programme, sometimes policy</text>
<text x="25" y="215" class="sm">Когда / When</text><text x="25" y="250" class="s">На раннем этапе планирования</text><text x="25" y="274" class="s">Early in the planning process</text>
<text x="25" y="340" class="sm">Основной фокус / Main focus</text><text x="25" y="375" class="s">Альтернативы и кумулятивные эффекты</text><text x="25" y="399" class="s">Alternatives and cumulative effects</text><text x="25" y="423" class="s">Учёт среды при выборе направления</text><text x="25" y="447" class="s">Integrating environment into planning</text>
<text x="25" y="505" class="sm">Типичный результат / Typical output</text><text x="25" y="540" class="s">Экологический отчёт и рекомендации</text><text x="25" y="564" class="s">Environmental report and recommendations</text>
</g>
<g transform="translate(945 95)">
<rect width="420" height="590" rx="14" class="box"/><rect width="420" height="70" rx="14" class="head"/>
<text x="210" y="45" text-anchor="middle" class="t">Мониторинг / Monitoring</text>
<text x="25" y="115" class="sm">Объект / Object</text><text x="25" y="150" class="s">Состояние среды и воздействия</text><text x="25" y="174" class="s">Environmental conditions and pressures</text>
<text x="25" y="215" class="sm">Когда / When</text><text x="25" y="250" class="s">До, во время и после реализации</text><text x="25" y="274" class="s">Before, during and after implementation</text>
<text x="25" y="340" class="sm">Основной фокус / Main focus</text><text x="25" y="375" class="s">Повторные измерения, тенденции</text><text x="25" y="399" class="s">Repeated measurements and trends</text><text x="25" y="423" class="s">Соблюдение требований, раннее выявление</text><text x="25" y="447" class="s">Compliance and early detection</text>
<text x="25" y="505" class="sm">Типичный результат / Typical output</text><text x="25" y="540" class="s">Данные во времени и меры реагирования</text><text x="25" y="564" class="s">Time series and corrective action</text>
</g>
<rect x="65" y="710" width="1270" height="48" rx="10" fill="#edf3f6"/>
<text x="700" y="730" text-anchor="middle" class="sm">Мониторинг сопровождает оценки и реализацию решений, но не заменяет ОВОС или СЭО.</text>
<text x="700" y="750" text-anchor="middle" class="sm">Monitoring can accompany assessment and implementation, but does not replace EIA or SEA.</text>
</svg>