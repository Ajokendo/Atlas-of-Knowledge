<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d">
<title id="t">Geographical scales: local to global / Географические масштабы: от местного до глобального</title>
<desc id="d">Five schematic panels show how a question can be examined at local, regional, national, international and global levels. / Пять условных схем показывают, как исследовать вопрос на местном, региональном, национальном, международном и глобальном уровнях.</desc>
<rect width="1500" height="900" fill="#f7fafc"/>
<text x="750" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17324d">From local to global / От местного к глобальному</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(45 150)"><rect width="270" height="570" rx="22" fill="#eaf2f8" stroke="#3979a8" stroke-width="3"/><text x="135" y="58" font-size="28" font-weight="700" fill="#174e78">Local</text><text x="135" y="95" font-size="25" fill="#17324d">Местный</text><path d="M35 220L100 150 230 185 210 310 80 350Z" fill="#c7d8c4" stroke="#56874b" stroke-width="3"/><path d="M45 290L220 175 M60 170L205 330" stroke="#9b815e" stroke-width="9"/><rect x="100" y="220" width="70" height="55" fill="#d6a58b" stroke="#8f3f36" stroke-width="3"/><text x="135" y="420" font-size="22" fill="#17324d">Street • school •</text><text x="135" y="453" font-size="22" fill="#17324d">neighbourhood</text><text x="135" y="490" font-size="22" fill="#17324d">Улица • школа •</text><text x="135" y="523" font-size="22" fill="#17324d">район</text></g>
<g transform="translate(345 150)"><rect width="270" height="570" rx="22" fill="#edf5f2" stroke="#568b6a" stroke-width="3"/><text x="135" y="58" font-size="28" font-weight="700" fill="#386432">Regional</text><text x="135" y="95" font-size="25" fill="#17324d">Региональный</text><path d="M35 180Q80 120 145 165T235 210L210 335Q120 370 45 300Z" fill="#b9d7c4" stroke="#56874b" stroke-width="3"/><path d="M45 270Q100 210 145 250T225 245" fill="none" stroke="#4b9fc4" stroke-width="15"/><text x="135" y="420" font-size="22" fill="#17324d">Valley • river basin</text><text x="135" y="453" font-size="22" fill="#17324d">Долина • бассейн реки</text><text x="135" y="500" font-size="21" fill="#52697c">Several settlements</text><text x="135" y="530" font-size="21" fill="#52697c">Несколько поселений</text></g>
<g transform="translate(645 150)"><rect width="270" height="570" rx="22" fill="#f6f0e8" stroke="#a66b35" stroke-width="3"/><text x="135" y="58" font-size="28" font-weight="700" fill="#805024">National</text><text x="135" y="95" font-size="25" fill="#17324d">Национальный</text><path d="M65 160L190 135 225 225 190 330 85 345 35 250Z" fill="#e3cba9" stroke="#a66b35" stroke-width="4"/><path d="M75 260L185 200" stroke="#4b9fc4" stroke-width="12"/><circle cx="115" cy="235" r="10" fill="#b85c50"/><circle cx="180" cy="205" r="10" fill="#b85c50"/><text x="135" y="420" font-size="22" fill="#17324d">Country • regions</text><text x="135" y="453" font-size="22" fill="#17324d">Страна • регионы</text><text x="135" y="500" font-size="21" fill="#52697c">Internal differences</text><text x="135" y="530" font-size="21" fill="#52697c">Внутренние различия</text></g>
<g transform="translate(945 150)"><rect width="270" height="570" rx="22" fill="#f3eef7" stroke="#8562a6" stroke-width="3"/><text x="135" y="58" font-size="28" font-weight="700" fill="#62427f">International</text><text x="135" y="95" font-size="25" fill="#17324d">Международный</text><path d="M30 190L105 145 165 185 240 150 230 320 155 345 90 310 35 330Z" fill="#d9cce8" stroke="#8562a6" stroke-width="3"/><path d="M100 235Q135 190 170 240T225 245" fill="none" stroke="#4b9fc4" stroke-width="10"/><path d="M80 275L195 210" stroke="#b85c50" stroke-width="4" stroke-dasharray="10 8"/><text x="135" y="420" font-size="22" fill="#17324d">Neighbouring states</text><text x="135" y="453" font-size="22" fill="#17324d">Соседние государства</text><text x="135" y="500" font-size="21" fill="#52697c">Shared networks</text><text x="135" y="530" font-size="21" fill="#52697c">Общие сети</text></g>
<g transform="translate(1245 150)"><rect width="210" height="570" rx="22" fill="#f7eded" stroke="#b85c50" stroke-width="3"/><text x="105" y="58" font-size="28" font-weight="700" fill="#8f3f36">Global</text><text x="105" y="95" font-size="25" fill="#17324d">Глобальный</text><circle cx="105" cy="250" r="100" fill="#b9d9e8" stroke="#3979a8" stroke-width="4"/><path d="M40 210Q70 170 105 190T170 210L155 280 115 330 70 290Z" fill="#8fbc87" stroke="#56874b" stroke-width="3"/><path d="M25 250H185 M105 150V350" stroke="#fff" stroke-width="3" opacity=".8"/><text x="105" y="420" font-size="22" fill="#17324d">Planetary</text><text x="105" y="453" font-size="22" fill="#17324d">Планетарный</text><text x="105" y="500" font-size="20" fill="#52697c">Global systems</text><text x="105" y="530" font-size="20" fill="#52697c">Глобальные системы</text></g>
</g>
<text x="750" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#17324d">The same issue can look different at each level / Одна проблема может выглядеть по-разному на каждом уровне</text>
<text x="750" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#52697c">Schematic illustrations, not geographic boundary maps / Условные схемы, не карты географических границ</text>
</svg>