<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 679" role="img" aria-labelledby="t"><title id="t">«Пик воды»: что происходит с ледниковым стоком / «Peak water»: what happens to glacier runoff</title><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526579}.r{font-size:23px;font-weight:700}.e{font-size:18px;fill:#526579}.r2{font-size:19px;font-weight:700}.e2{font-size:15px;fill:#526579}.sm{font-size:15px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526579"/></marker></defs><rect width="1000" height="679" fill="#fbfcfe"/><text x="30" y="46" class="h">«Пик воды»: что происходит с ледниковым стоком</text><text x="30" y="76" class="sub">«Peak water»: what happens to glacier runoff</text><rect x="110" y="130" width="780" height="300" fill="#fff" stroke="#9aa9b6"/><polyline points="110,356 123,353 136,351 149,347 162,343 175,339 188,333 201,327 214,319 227,311 240,301 253,291 266,280 279,268 292,256 305,244 318,232 331,220 344,209 357,199 370,190 383,183 396,178 409,175 422,174 435,175 448,178 461,183 474,190 487,199 500,209 513,220 526,232 539,244 552,256 565,268 578,280 591,291 604,301 617,311 630,319 643,327 656,333 669,339 682,343 695,347 708,351 721,353 734,356 747,357 760,359 773,360 786,360 799,361 812,361 825,362 838,362 851,362 864,362 877,362 890,362" fill="none" stroke="#2e86c1" stroke-width="5"/><path d="M422 130V430" stroke="#c0392b" stroke-dasharray="7 5"/><text x="430" y="150" class="r2" style="fill:#c0392b">«Пик воды» / peak water</text><text x="500.0" y="458" class="r2" text-anchor="middle">время → / time →</text><text x="110" y="104" class="r2">сток от ледников</text><text x="110" y="122" class="e2">glacier runoff</text><text x="110" y="500" class="r2" text-anchor="start">Сначала ледник тает быстрее — талого стока больше. Затем льда</text><text x="110" y="524" class="r2" text-anchor="start">становится мало, и сток от ледников падает.</text><text x="110" y="546" class="e2" text-anchor="start">First the glacier melts faster and meltwater grows. Later little ice remains</text><text x="110" y="565" class="e2" text-anchor="start">and glacier runoff falls.</text><text x="30" y="641" class="sm">Общая схема; время «пика» зависит от ледника.</text><text x="30" y="663" class="sm" style="fill:#526579">A general scheme; the timing of the peak depends on the glacier.</text></svg>