<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Возрастно-половые пирамиды / Age-sex population pyramids</title><desc id="d">Три условных формы при одинаковой возрастной шкале; мужчины слева, женщины справа. / Three schematic shapes on the same age scale; males left, females right.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:34px;font-weight:bold}.s{font-size:22px}.b{font-size:25px;font-weight:bold}.n{font-size:18px}.box{stroke:#526579;stroke-width:3;rx:18}.axis{stroke:#526579;stroke-width:3;fill:none}</style><rect width="1400" height="800" fill="#fbfcfe"/><text x="55" y="65" class="h">Возрастно-половые пирамиды / Age-sex population pyramids</text><text x="55" y="100" class="s">Три условных формы при одинаковой возрастной шкале; мужчины слева, женщины справа. / Three schematic shapes on the same age scale; males left, females right.</text><text x="255" y="165" text-anchor="middle" class="b">Расширяющаяся / Expansive</text><path d="M255 220 V665" class="axis"/><rect x="215" y="245" width="40" height="54" fill="#7d9dbb" stroke="#526579" stroke-width="2"/><rect x="255" y="245" width="40" height="54" fill="#c98b86" stroke="#526579" stroke-width="2"/><rect x="190" y="323" width="65" height="54" fill="#7d9dbb" stroke="#526579" stroke-width="2"/><rect x="255" y="323" width="65" height="54" fill="#c98b86" stroke="#526579" stroke-width="2"/><rect x="160" y="401" width="95" height="54" fill="#7d9dbb" stroke="#526579" stroke-width="2"/><rect x="255" y="401" width="95" height="54" fill="#c98b86" stroke="#526579" stroke-width="2"/><rect x="130" y="479" width="125" height="54" fill="#7d9dbb" stroke="#526579" stroke-width="2"/><rect x="255" y="479" width="125" height="54" fill="#c98b86" stroke="#526579" stroke-width="2"/><rect x="100" y="557" width="155" height="54" fill="#7d9dbb" stroke="#526579" stroke-width="2"/><rect x="255" y="557" width="155" height="54" fill="#c98b86" stroke="#526579"