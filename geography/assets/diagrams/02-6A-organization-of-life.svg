<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Levels of biological organization / Уровни организации живой природы</title><desc id="d">Hierarchy from organism to population, community, ecosystem, biome and biosphere. / Иерархия от организма до популяции, сообщества, экосистемы, биома и биосферы.</desc><rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">From organism to biosphere / От организма к биосфере</text><g font-family="Arial" text-anchor="middle"><g><rect x="130" y="180" width="350" height="150" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="305" y="240" font-size="32" font-weight="700" fill="#386432">Organism / Организм</text><text x="305" y="285" font-size="22" fill="#17324d">One living individual / Отдельная особь</text></g><g><rect x="570" y="180" width="350" height="150" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="745" y="240" font-size="32" font-weight="700" fill="#386432">Population / Популяция</text><text x="745" y="285" font-size="22" fill="#17324d">Same species / Один вид</text></g><g><rect x="1010" y="180" width="350" height="150" rx="22" fill="#e1eedc" stroke="#56874b" stroke-width="4"/><text x="1185" y="240" font-size="32" font-weight="700" fill="#386432">Community / Сообщество</text><text x="1185" y="285" font-size="22" fill="#17324d">Different populations / Разные популяции</text></g><g><rect x="130" y="470" width="350" height="150" rx="22" fill="#d9eef0" stroke="#278c96" stroke-width="4"/><text x="305" y="530" font-size="32" font-weight="700" fill="#17656d">Biosphere / Биосфера</text><text x="305" y="575" font-size="22" fill="#17324d">All Earth's ecosystems / Все экосистемы Земли</text></g><g><rect x="570" y="470" width="350" height="150" rx="22" fill="#dcecf8" stroke="#3979a8" stroke-width="4"/><text x="745" y="530" font-size="32" font-weight="700" fill="#174e78">Biome / Биом</text><text x="745" y="575" font-size="22" fill="#17324d">Large ecological region / Крупная природная область</text></g><g><rect x="1010" y="470" width="350" height="150" rx="22" fill="#f1e4d2" stroke="#a66b35" stroke-width="4"/><text x="1185" y="530" font-size="32" font-weight="700" fill="#805024">Ecosystem / Экосистема</text><text x="1185" y="575" font-size="22" fill="#17324d">Community + environment / Сообщество + среда</text></g></g><g stroke="#52697c" stroke-width="6" fill="none"><path d="M480 255H560 M920 255H1000 M1185 340V460 M920 545H1000 M480 545H560"/></g><g fill="#52697c"><path d="M545 240l20 15-20 15z"/><path d="M985 240l20 15-20 15z"/><path d="M1170 445l15 25 15-25z"/><path d="M985 530l20 15-20 15z"/><path d="M545 530l20 15-20 15z"/></g><text x="750" y="730" text-anchor="middle" font-family="Arial" font-size="24" fill="#38566f">Levels are nested but not interchangeable / Уровни вложены друг в друга, но не взаимозаменяемы</text></svg>