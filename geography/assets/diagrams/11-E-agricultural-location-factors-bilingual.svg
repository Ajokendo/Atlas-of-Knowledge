<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Географические факторы сельского хозяйства / Geographical factors of agriculture</title><desc id="d">Концептуальный профиль сельскохозяйственного ландшафта связывает климат, почвы, рельеф, воду, труд, рынок и транспорт с различными видами землепользования. Не является картой или предписанием для конкретной территории. / Conceptual agricultural-landscape profile linking climate, soils, relief, water, labour, markets and transport to different land uses. Not a map or prescription for a specific territory.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 20px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.land{fill:#e1d3b8;stroke:#8d785b;stroke-width:4}.water{fill:#80c5e2;stroke:#327f9e;stroke-width:3}.box{fill:#f4f8fa;stroke:#7893a1;stroke-width:2}.arrow{stroke:#527d68;stroke-width:4;fill:none;stroke-dasharray:8 6}</style><rect width="1200" height="760" fill="#fff"/><text x="600" y="52" text-anchor="middle" class="h">Сельское хозяйство и география места / Agriculture and the geography of place</text><path class="land" d="M40 470 L180 390 L300 420 L450 270 L570 340 L700 410 L850 360 L1000 450 L1160 470 L1160 590 L40 590Z"/><path class="water" d="M40 510 Q180 485 300 510 T560 510 L560 545 L40 545Z"/><path d="M330 420 L420 360 L485 405 L485 450 L330 450Z" fill="#a8c58e" stroke="#64865d" stroke-width="3"/><path d="M620 410 L760 410 L820 455 L620 455Z" fill="#d4b56f" stroke="#a58948" stroke-width="3"/><path d="M900 440 L1030 455 L1080 485 L900 485Z" fill="#b6c98d" stroke="#64865d" stroke-width="3"/><path d="M180 390 L300 420 M450 270 L570 340" stroke="#8d785b" stroke-width="4" fill="none"/><g fill="none" stroke="#527d68" stroke-width="3"><path d="M360 430v-65m-12 18l12-18 12 18M690 420v-70m-12 18l12-18 12 18M965 450v-70m-12 18l12-18 12 18"/></g><g><rect x="45" y="110" width="245" height="110" rx="12" class="box"/><text x="167" y="150" text-anchor="middle" class="t">Климат / Climate</text><text x="167" y="185" text-anchor="middle" class="s">Тепло и осадки / Heat & precipitation</text><rect x="325" y="110" width="245" height="110" rx="12" class="box"/><text x="447" y="150" text-anchor="middle" class="t">Почвы / Soils</text><text x="447" y="185" text-anchor="middle" class="s">Глубина и плодородие / Depth & fertility</text><rect x="605" y="110" width="245" height="110" rx="12" class="box"/><text x="727" y="150" text-anchor="middle" class="t">Рельеф / Relief</text><text x="727" y="185" text-anchor="middle" class="s">Уклон и экспозиция / Slope & aspect</text><rect x="885" y="110" width="270" height="110" rx="12" class="box"/><text x="1020" y="150" text-anchor="middle" class="t">Вода / Water</text><text x="1020" y="185" text-anchor="middle" class="s">Осадки и орошение / Rain & irrigation</text></g><g class="arrow"><path d="M167 220 L260 330"/><path d="M447 220 L450 300"/><path d="M727 220 L700 325"/><path d="M1020 220 L950 350"/></g><text x="170" y="640" class="t">Пастбища / Pasture</text><text x="430" y="640" class="t">Сады и террасы / Orchards & terraces</text><text x="700" y="640" class="t">Полевые культуры / Field crops</text><text x="960" y="640" class="t">Орошаемые земли / Irrigated land</text><text x="600" y="705" text-anchor="middle" class="s">Труд, рынки, энергия и транспорт также влияют на размещение; выбор землепользования ограничен экологической устойчивостью. / Labour, markets, energy and transport also shape location; land use is constrained by environmental sustainability.</text></svg>