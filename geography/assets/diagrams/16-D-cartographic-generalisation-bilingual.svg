<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Картографическая генерализация / Cartographic generalisation</title><desc id="d">Одна и та же условная территория показана в крупном, среднем и мелком масштабе. При уменьшении масштаба часть мелких деталей удаляется, линии упрощаются, а важные объекты сохраняются или подчёркиваются. / The same conceptual area is shown at large, medium and small scales. As scale decreases, minor details are removed, lines simplified and important features retained or emphasised.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 22px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.p{fill:#f3f7f9;stroke:#7893a1;stroke-width:2}.road{stroke:#bd7951;stroke-width:5;fill:none}.river{stroke:#4b9fc2;stroke-width:7;fill:none}.town{fill:#b65c46;stroke:#fff;stroke-width:2}</style><rect width="1400" height="760" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="h">Одна территория — три масштаба / One area — three map scales</text><g transform="translate(35 115)"><rect width="410" height="470" rx="14" class="p"/><text x="205" y="45" text-anchor="middle" class="t">Крупный масштаб / Large scale</text><text x="205" y="78" text-anchor="middle" class="s">1:25 000</text><path d="M35 150 Q120 100 180 170 T370 145 M30 230 Q140 205 190 275 T370 300 M50 380 Q150 340 260 390 T380 360" class="river"/><path d="M40 120 L120 210 L200 160 L290 270 L370 210 M40 330 L140 280 L220 360 L370 300 M70 420 L190 380 L340 430" class="road"/><circle cx="80" cy="155" r="8" class="town"/><circle cx="130" cy="205" r="8" class="town"/><circle cx="200" cy="170" r="8" class="town"/><circle cx="260" cy="260" r="8" class="town"/><circle cx="310" cy="225" r="8" class="town"/><circle cx="110" cy="360" r="8" class="town"/><circle cx="220" cy="370" r="8" class="town"/><circle cx="335" cy="405" r="8" class="town"/><circle cx="175" cy="305" r="8" class="town"/><circle cx="290" cy="330" r="8" class="town"/><text x="205" y="445" text-anchor="middle" class="s">Много деталей / More detail</text></g><g transform="translate(495 115)"><rect width="410" height="470" rx="14" class="p"/><text x="205" y="45" text-anchor="middle" class="t">Средний масштаб / Medium scale</text><text x="205" y="78" text-anchor="middle" class="s">1:100 000</text><path d="M35 170 Q120 120 200 190 T370 170 M40 290 Q180 240 370 320 M50 390 Q200 350 360 390" class="river"/><path d="M45 130 L160 220 L270 170 L370 260 M45 370 L180 310 L360 390" class="road"/><circle cx="120" cy="190" r="11" class="town"/><circle cx="270" cy="190" r="11" class="town"/><circle cx="210" cy="340" r="11" class="town"/><circle cx="330" cy="380" r="11" class="town"/><text x="205" y="445" text-anchor="middle" class="s">Выбор главных объектов / Select key features</text></g><g transform="translate(955 115)"><rect width="410" height="470" rx="14" class="p"/><text x="205" y="45" text-anchor="middle" class="t">Мелкий масштаб / Small scale</text><text x="205" y="78" text-anchor="middle" class="s">1:500 000</text><path d="M40 180 Q200 130 370 190 M40 320 Q200 270 370 330" class="river"/><path d="M50 130 L200 240 L370 180 M50 400 L210 330 L360 400" class="road"/><circle cx="170" cy="230" r="15" class="town"/><circle cx="300" cy="360" r="15" class="town"/><text x="205" y="445" text-anchor="middle" class="s">Только ключевой рисунок / Key pattern only</text></g><text x="700" y="650" text-anchor="middle" class="s">Генерализация включает отбор, упрощение, объединение, смещение и преувеличение символов. / Generalisation includes selection, simplification, aggregation, displacement and symbol exaggeration.</text><text x="700" y="690" text-anchor="middle" class="s">Условная схема, не реальные геоданные; детали выбирают по цели карты, масштабу и аудитории. / Conceptual diagram, not real geodata; feature selection depends on map purpose, scale and audience.</text></svg>