<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Зональность озера и океана / Lake and ocean zonation</title><desc id="d">Концептуальное сравнение фотической и афотической вод, литорали, пелагиали и бентали. Границы меняются с прозрачностью и условиями среды. Conceptual comparison of photic and aphotic water, littoral, pelagic and benthic zones. Boundaries vary with water clarity and local conditions.</desc><rect width="900" height="560" fill="#f7fafc"/><text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold">ЗОНАЛЬНОСТЬ ВОДНЫХ БИОМОВ / AQUATIC ZONATION</text><text x="225" y="85" text-anchor="middle" font-size="22">ОЗЕРО / LAKE</text><text x="675" y="85" text-anchor="middle" font-size="22">ОКЕАН / OCEAN</text><path d="M40 150 Q90 130 140 180 L310 180 Q360 130 410 150 L410 430 Q225 520 40 430Z" fill="#287da2"/><path d="M40 150 Q90 130 140 180 L310 180 Q360 130 410 150 L410 300 L40 300Z" fill="#bce9ef"/><path d="M40 430 Q225 520 410 430" fill="none" stroke="#98734f" stroke-width="12"/><text x="225" y="245" text-anchor="middle" font-size="19">Фотическая / Photic</text><text x="225" y="350" text-anchor="middle" font-size="19" fill="white">Афотическая / Aphotic</text><text x="75" y="180" font-size="15">Литораль / Littoral</text><text x="225" y="405" text-anchor="middle" font-size="16" fill="white">Бенталь / Benthic</text><path d="M490 150 H860 V440 Q675 490 490 440Z" fill="#287da2"/><path d="M490 150 H860 V300 H490Z" fill="#bce9ef"/><path d="M490 440 Q675 490 860 440" fill="none" stroke="#98734f" stroke-width="12"/><path d="M490 150 L550 150 L610 230 L660 270 L660 440" fill="none" stroke="#98734f" stroke-width="10"/><text x="675" y="245" text-anchor="middle" font-size="19">Фотическая / Photic</text><text x="675" y="350" text-anchor="middle" font-size="19" fill="white">Афотическая / Aphotic</text><text x="505" y="180" font-size="15">Прибрежье / Coast</text><text x="675" y="415" text-anchor="middle" font-size="16" fill="white">Бенталь / Benthic</text><text x="450" y="535" text-anchor="middle" font-size="17">Пелагиаль — толща воды / Pelagic — water column</text></svg>