<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Природные пояса Кыргызстана (схема) / Natural belts of Kyrgyzstan (schematic)</title><desc id="desc">Смена природных поясов от долин к вершинам. / Change of natural belts from valleys to summits.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:15px}.lab{font-size:16px;font-weight:700}.it{font-style:italic}.box{stroke:#647789;stroke-width:2;rx:14}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="40" y="44" class="h">Природные пояса Кыргызстана (схема)</text><text x="40" y="74" class="sub" style="fill:#526579">Natural belts of Kyrgyzstan (schematic)</text><rect x="120" y="130" width="900" height="90" fill="#e8f6ff" stroke="#647789"/><text x="140" y="170" class="t" text-anchor="start" >Ледники и снега</text><text x="140" y="196" class="s" text-anchor="start" >Glaciers and snow</text><rect x="120" y="230" width="900" height="90" fill="#a8d5ba" stroke="#647789"/><text x="140" y="270" class="t" text-anchor="start" >Альпийские и субальпийские луга</text><text x="140" y="296" class="s" text-anchor="start" >Alpine and subalpine meadows</text><rect x="120" y="330" width="900" height="90" fill="#2e8b57" stroke="#647789"/><text x="140" y="370" class="t" text-anchor="start" >Леса: ель, арча</text><text x="140" y="396" class="s" text-anchor="start" >Forests: spruce, juniper</text><rect x="120" y="430" width="900" height="90" fill="#c8d86a" stroke="#647789"/><text x="140" y="470" class="t" text-anchor="start" >Степи и лугостепи</text><text x="140" y="496" class="s" text-anchor="start" >Steppes and meadow steppes</text><rect x="120" y="530" width="900" height="90" fill="#e6b85c" stroke="#647789"/><text x="140" y="570" class="t" text-anchor="start" >Полупустыни и пустыни</text><text x="140" y="596" class="s" text-anchor="start" >Semi-deserts and deserts</text><path d="M1100 560 L1100 140" class="arr"/><text x="1120" y="150" class="s" text-anchor="start" >выше / higher</text><text x="1120" y="560" class="s" text-anchor="start" >ниже / lower</text><text x="1120" y="300" class="sm" text-anchor="start" >Порядок поясов верный; высоты границ</text><text x="1120" y="320" class="sm" text-anchor="start" >зависят от склона и района</text><text x="1120" y="350" class="sm" text-anchor="start" >Order of belts is general; belt limits</text><text x="1120" y="370" class="sm" text-anchor="start" >depend on slope and region</text><text x="40" y="766" class="sm">Показан общий порядок поясов; высоты границ не приводятся, они зависят от экспозиции склона, района и увлажнения.</text><text x="40" y="786" class="sm" style="fill:#526579">General order of belts; belt altitudes are omitted because they depend on slope aspect, region and moisture.</text></svg>