<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Пищевая сеть высокогорной экосистемы / High-mountain food web</title><desc id="desc">Стрелки показывают направление передачи энергии; сеть упрощена для обучения. / Arrows show energy transfer; the web is simplified for teaching.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Пищевая сеть высокогорной экосистемы / High-mountain food web</text><text x="50" y="88" class="sub">Стрелки показывают направление передачи энергии; сеть упрощена для обучения. / Arrows show energy transfer; the web is simplified for teaching.</text>
<rect x="65" y="170" width="260" height="165" fill="#e5efe1" class="box"/><text x="83" y="205" class="t">Продуценты / Producers</text><text x="83" y="240" class="s">Альпийские травы, мхи</text><text x="83" y="267" class="s">Alpine plants, mosses</text>
<rect x="420" y="170" width="260" height="165" fill="#f4ecd9" class="box"/><text x="438" y="205" class="t">Травоядные / Herbivores</text><text x="438" y="240" class="s">Козероги, сурки, насекомые</text><text x="438" y="267" class="s">Ibex, marmots, insects</text>
<rect x="775" y="170" width="260" height="165" fill="#f5e6e2" class="box"/><text x="793" y="205" class="t">Хищники / Predators</text><text x="793" y="240" class="s">Снежный барс, волк, хищные птицы</text><text x="793" y="267" class="s">Snow leopard, wolf, raptors</text>
<rect x="1080" y="170" width="260" height="165" fill="#e5edf4" class="box"/><text x="1098" y="205" class="t">Падальщики / Scavengers</text><text x="1098" y="240" class="s">Грифы и другие падальщики</text><text x="1098" y="267" class="s">Vultures and other scavengers</text>
<rect x="500" y="470" width="380" height="155" fill="#eee9f4" class="box"/><text x="518" y="505" class="t">Редуценты / Decomposers</text><text x="518" y="540" class="s">Грибы и бактерии</text><text x="518" y="567" class="s">Fungi and bacteria</text><text x="518" y="594" class="s">Разложение органики / Organic matter breakdown</text>
