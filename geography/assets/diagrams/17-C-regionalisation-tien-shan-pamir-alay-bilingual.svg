<rect x="75" y="303" width="215" height="76" rx="12" fill="#d2e2eb" stroke="#5d8096" stroke-width="1.5"/>
<text x="182" y="333" font-size="18" font-weight="700" fill="#1c3447">Южный Тянь-Шань</text><text x="182" y="357" font-size="16" fill="#1c3447">Southern Tien Shan</text>
<rect x="320" y="303" width="215" height="76" rx="12" fill="#d2e2eb" stroke="#5d8096" stroke-width="1.5"/>
<text x="427" y="333" font-size="18" font-weight="700" fill="#1c3447">Памиро-Алай</text><text x="427" y="357" font-size="16" fill="#1c3447">Pamir–Alay</text>
