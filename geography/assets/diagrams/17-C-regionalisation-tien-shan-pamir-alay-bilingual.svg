<text x="600" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3f5268">Северная окраина Таримской платформы также выделяется в некоторых тектонических схемах</text>
<text x="600" y="433" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#3f5268">The northern margin of the Tarim Platform is also distinguished in some tectonic schemes</text>
