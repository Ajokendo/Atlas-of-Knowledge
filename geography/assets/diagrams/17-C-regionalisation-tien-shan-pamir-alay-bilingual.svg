<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Тянь-Шань и Памиро-Алай: схемы районирования / Tien Shan and Pamir–Alay: regionalisation schemes</title>
<desc id="desc">Сравнительная двуязычная схема двух разных способов деления горного региона. Слева показаны физико-географические районы: Северный, Срединный и Южный Тянь-Шань, а также Памиро-Алай. Справа показаны крупные тектонические единицы, используемые в региональных научных схемах: Северный, Срединный и Южный Тянь-Шань, Северный Памир и северная окраина Таримской платформы. Схема не является картой и не задаёт точных границ; классификации зависят от источника. / Bilingual comparison of two ways to divide the mountain region. Left: physical-geographical regions—Northern, Central and Southern Tien Shan, and Pamir–Alay. Right: major tectonic units used in regional scientific schemes—Northern, Middle and Southern Tien Shan, Northern Pamir and the northern margin of the Tarim Platform. This is not a map and does not define precise boundaries; classifications depend on the source.</desc>
<rect width="1200" height="560" rx="24" fill="#f7f9fb"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172b4d">Тянь-Шань и Памиро-Алай / Tien Shan and Pamir–Alay</text>
<text x="600" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52647a">Два разных подхода к районированию / Two different approaches to regionalisation</text>
<rect x="38" y="112" width="535" height="355" rx="18" fill="#e8f0f5" stroke="#5d8096" stroke-width="2"/>
<rect x="627" y="112" width="535" height="355" rx="18" fill="#f2ece2" stroke="#9b805b" stroke-width="2"/>
