<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Агропродовольственная цепочка создания стоимости / Agri-food value chain</title><desc id="desc">Обобщённые этапы от хозяйства до потребителя; конкретные культуры и маршруты зависят от региона. / General stages from farm to consumer; crops and routes vary by region.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.h{font-size:31px;font-weight:700}.sub{font-size:19px}.t{font-size:23px;font-weight:700}.s{font-size:18px}.sm{font-size:16px}.box{stroke:#647789;stroke-width:2;rx:16}.arr{stroke:#526579;stroke-width:4;fill:none;marker-end:url(#arrow)}.muted{fill:#f1f4f6}.green{fill:#e5efe3}.blue{fill:#e4eff6}.gold{fill:#f4ecd9}.rose{fill:#f5e7e4}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#526579"/></marker></defs><rect width="1400" height="800" fill="#fbfcfe"/><text x="50" y="55" class="h">Агропродовольственная цепочка создания стоимости / Agri-food value chain</text><text x="50" y="88" class="sub">Обобщённые этапы от хозяйства до потребителя; конкретные культуры и маршруты зависят от региона. / General stages from farm to consumer; crops and routes vary by region.</text>
<rect x="35" y="200" width="180" height="260" fill="#e5efe3" class="box"/><text x="53" y="235" class="t">Производство / Farm</text><text x="53" y="270" class="s">Выращивание</text><text x="53" y="297" class="s">Growing</text><text x="53" y="324" class="s">Уход и сбор</text><text x="53" y="351" class="s">Care and harvest</text>
<rect x="235" y="200" width="180" height="260" fill="#e4eff6" class="box"/><text x="253" y="235" class="t">Сбор / Collection</text><text x="253" y="270" class="s">Приём сырья</text><text x="253" y="297" class="s">Receiving</text><text x="253" y="324" class="s">Первичная очистка</text><text x="253" y="351" class="s">Initial cleaning</text>
<rect x="435" y="200" width="180" height="260" fill="#f4ecd9" class="box"/><text x="453" y="235" class="t">Хранение / Storage</text><text x="453" y="270" class="s">Сушка и холод</text><text x="453" y="297" class="s">Drying and cooling</text><text x="453" y="324" class="s">Контроль качества</text><text x="453" y="351" class="s">Quality control</text>
<rect x="635" y="200" width="180" height="260" fill="#f2e9e5" class="box"/><text x="653" y="235" class="t">Сортировка / Sorting</text><text x="653" y="270" class="s">Калибровка</text><text x="653" y="297" class="s">Grading</text><text x="653" y="324" class="s">Упаковка</text><text x="653" y="351" class="s">Packaging</text>
<rect x="835" y="200" width="180" height="260" fill="#e5edf4" class="box"/><text x="853" y="235" class="t">Переработка / Processing</text><text x="853" y="270" class="s">Подготовка</text><text x="853" y="297" class="s">Preparation</text><text x="853" y="324" class="s">Пищевая безопасность</text><text x="853" y="351" class="s">Food safety</text>
<rect x="1035" y="200" width="180" height="260" fill="#e7efe3" class="box"/><text x="1053" y="235" class="t">Логистика / Logistics</text><text x="1053" y="270" class="s">Транспорт</text><text x="1053" y="297" class="s">Transport</text><text x="1053" y="324" class="s">Прослеживаемость</text><text x="1053" y="351" class="s">Traceability</text>
<rect x="1235" y="200" width="145" height="260" fill="#f5eadc" class="box"/><text x="1253" y="235" class="t">Рынок / Market</text><text x="1253" y="270" class="s">Продажа</text><text x="1253" y="297" class="s">Sale</text><text x="1253" y="324" class="s">Потребитель</text><text x="1253" y="351" class="s">Consumer</text>
