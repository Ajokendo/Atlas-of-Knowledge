<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Туристская система территории / Tourism destination system</title><desc id="d">Концептуальная модель туристской территории: природные и культурные ресурсы, транспорт и инфраструктура, размещение и услуги, посетители, местные сообщества, управление и экологические ограничения. Стрелки показывают взаимосвязи и обратную связь от мониторинга к планированию. / Conceptual model of a tourism destination: natural and cultural resources, transport and infrastructure, accommodation and services, visitors, local communities, management and environmental limits. Arrows show relationships and feedback from monitoring to planning.</desc><style>.h{font:700 32px Arial;fill:#17324d}.t{font:700 21px Arial;fill:#17324d}.s{font:17px Arial;fill:#526879}.p{fill:#edf4f7;stroke:#66899b;stroke-width:2}.g{fill:#f4f8ef;stroke:#73946a;stroke-width:2}.n{fill:#f7f3e8;stroke:#b49a61;stroke-width:2}.a{stroke:#315d76;stroke-width:4;fill:none;marker-end:url(#ar)}.d{stroke:#73946a;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#gr)}</style><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#315d76"/></marker><marker id="gr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#73946a"/></marker></defs><rect width="1400" height="800" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="h">Туристская система территории / Tourism destination system</text><g transform="translate(45 125)"><rect width="360" height="145" rx="16" class="g"/><text x="180" y="48" text-anchor="middle" class="t">Ресурсы и привлекательность</text><text x="180" y="80" text-anchor="middle" class="s">Natural & cultural assets</text><text x="180" y="112" text-anchor="middle" class="s">Ландшафты • наследие • события</text></g><g transform="translate(520 125)"><rect width="360" height="145" rx="16" class="p"/><text x="180" y="48" text-anchor="middle" class="t">Доступ и инфраструктура</text><text x="180" y="80" text-anchor="middle" class="s">Access & infrastructure</text><text x="180" y="112" text-anchor="middle" class="s">Дороги • связь • вода • энергия</text></g><g transform="translate(995 125)"><rect width="360" height="145" rx="16" class="p"/><text x="180" y="48" text-anchor="middle" class="t">Услуги и предприятия</text><text x="180" y="80" text-anchor="middle" class="s">Services & businesses</text><text x="180" y="112" text-anchor="middle" class="s">Размещение • питание • гиды</text></g><path d="M405 195 H520 M880 195 H995" class="a"/><g transform="translate(520 350)"><rect width="360" height="135" rx="16" class="n"/><text x="180" y="48" text-anchor="middle" class="t">Посетители и опыт</text><text x="180" y="82" text-anchor="middle" class="s">Visitors & experience</text><text x="180" y="110" text-anchor="middle" class="s">Спрос • сезонность • удовлетворённость</text></g><path d="M700 270 V350" class="a"/><g transform="translate(65 560)"><rect width="360" height="135" rx="16" class="g"/><text x="180" y="48" text-anchor="middle" class="t">Местные сообщества</text><text x="180" y="82" text-anchor="middle" class="s">Local communities</text><text x="180" y="110" text-anchor="middle" class="s">Рабочие места • культура • участие</text></g><g transform="translate(520 560)"><rect width="360" height="135" rx="16" class="p"/><text x="180" y="48" text-anchor="middle" class="t">Управление и мониторинг</text><text x="180" y="82" text-anchor="middle" class="s">Management & monitoring</text><text x="180" y="110" text-anchor="middle" class="s">Планирование • данные • обратная связь</text></g><g transform="translate(995 560)"><rect width="360" height="135" rx="16" class="n"/><text x="180" y="48" text-anchor="middle" class="t">Экологические и социальные пределы</text><text x="180" y="82" text-anchor="middle" class="s">Environmental & social limits</text><text x="180" y="110" text-anchor="middle" class="s">Вода • отходы • местообитания • нагрузка</text></g><path d="M520 420 C430 440 300 490 245 560 M880 420 C970 440 1090 490 1175 560" class="a"/><path d="M425 625 H520 M880 625 H995" class="d"/><path d="M700 560 V485" class="d"/><text x="700" y="745" text-anchor="middle" class="s">Устойчивое управление учитывает качество опыта, выгоды для жителей и пределы экосистем; сезонные пики требуют отдельного планирования.</text><text x="700" y="775" text-anchor="middle" class="s">Sustainable management considers visitor experience, local benefits and ecosystem limits; seasonal peaks require specific planning.</text></svg>