<text x="1010" y="680" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#704f36">Аккумуляция / Deposition</text>
<text x="80" y="748" font-family="Arial,sans-serif" font-size="16" fill="#66788a">Учебная схема, не в масштабе. Реальные процессы зависят от геологии, климата, воды и уклона.</text><text x="80" y="770" font-family="Arial,sans-serif" font-size="15" fill="#66788a">Conceptual diagram, not to scale. Actual processes depend on geology, climate, water and slope.</text>
