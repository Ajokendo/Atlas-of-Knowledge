<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Профили температуры и солёности морской воды / Seawater temperature and salinity profiles</title>
<desc id="desc">Двуязычная качественная схема типичных вертикальных профилей температуры и солёности в субтропическом, умеренном и полярном океанических районах. Глубина увеличивается вниз. Показаны не численные измерения, а обобщённые формы профилей; реальные значения зависят от бассейна, сезона, водных масс и широты. / Bilingual qualitative diagram of typical vertical temperature and salinity profiles in subtropical, temperate and polar ocean regions. Depth increases downward. Curves are generalized patterns, not numerical observations; actual values vary with basin, season, water masses and latitude.</desc>
<defs>
<style>
.h{font:700 28px Arial,sans-serif;fill:#17324a}.sub{font:600 21px Arial,sans-serif;fill:#17324a}.axis{font:18px Arial,sans-serif;fill:#29485a}.note{font:17px Arial,sans-serif;fill:#29485a}.grid{stroke:#c5d2d9;stroke-width:1.5;stroke-dasharray:5 6}.axisline{stroke:#29485a;stroke-width:2.5}.curve{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.legend{font:19px Arial,sans-serif;fill:#17324a}
</style>
</defs>
<rect width="1600" height="1120" fill="#f5f8fa"/>
<text x="800" y="48" text-anchor="middle" class="h">Температура и солёность морской воды / Seawater temperature and salinity</text>
<text x="800" y="88" text-anchor="middle" class="note">Качественные профили; не численные данные / Qualitative profiles; not numerical data</text>
<!-- temperature panel -->
<rect x="45" y="125" width="1510" height="430" rx="18" fill="#ffffff" stroke="#c7d5dc" stroke-width="2"/>
<text x="80" y="165" class="h">Температура / Temperature</text>
<text x="1510" y="165" text-anchor="end" class="note">Холоднее ← → Теплее / Colder ← → Warmer</text>
<rect x="190" y="200" width="1240" height="285" fill="#f8fbfc"/>
<g class="grid"><path d="M190 200H1430 M190 270H1430 M190 340H1430 M190 410H1430 M190 485H1430"/><path d="M190 200V485 M500 200V485 M810 200V485 M1120 200V485 M1430 200V485"/></g>
<path d="M190 200V485H1430" class="axisline"/>
<g class="axis"><text x="165" y="207" text-anchor="end">0 м / m</text><text x="165" y="277" text-anchor="end">1 000</text><text x="165" y="347" text-anchor="end">2 000</text><text x="165" y="417" text-anchor="end">3 000</text><text x="165" y="492" text-anchor="end">5 000</text><text x="190" y="520">Холоднее / Colder</text><text x="1430" y="520" text-anchor="end">Теплее / Warmer</text><text x="75" y="360" transform="rotate(-90 75 360)" text-anchor="middle">Глубина / Depth</text></g>
<path d="M1320 200 C1260 230 950 250 800 310 S700 410 690 485" class="curve" stroke="#d97736"/>
<path d="M1080 200 C1040 230 930 260 850 300 S760 400 730 485" class="curve" stroke="#3b82a0"/>
<path d="M860 200 C875 250 900 310 930 365 S950 430 960 485" class="curve" stroke="#64748b"/>
<g class="legend"><line x1="1040" y1="180" x2="1080" y2="180" stroke="#d97736" stroke-width="6"/><text x="1090" y="187">Субтропический / Subtropical</text><line x1="1270" y1="180" x2="1310" y2="180" stroke="#3b82a0" stroke-width="6"/><text x="1320" y="187">Умеренный / Temperate</text></g>
<line x1="1040" y1="205" x2="1080" y2="205" stroke="#64748b" stroke-width="6"/><text x="1090" y="212" class="legend">Полярный / Polar</text>
<text x="830" y="545" text-anchor="middle" class="note">В тропиках термоклин обычно выражен; в умеренных широтах важна сезонность; в полярных водах профиль часто более однороден.</text>
<!-- salinity panel -->
<rect x="45" y="585" width="1510" height="430" rx="18" fill="#ffffff" stroke="#c7d5dc" stroke-width="2"/>
<text x="80" y="625" class="h">Солёность / Salinity</text>
<text x="1510" y="625" text-anchor="end" class="note">Ниже ← → Выше / Lower ← → Higher</text>
<rect x="190" y="660" width="1240" height="285" fill="#f8fbfc"/>
<g class="grid"><path d="M190 660H1430 M190 730H1430 M190 800H1430 M190 870H1430 M190 945H1430"/><path d="M190 660V945 M500 660V945 M810 660V945 M1120 660V945 M1430 660V945"/></g>
<path d="M190 660V945H1430" class="axisline"/>
<g class="axis"><text x="165" y="667" text-anchor="end">0 м / m</text><text x="165" y="737" text-anchor="end">1 000</text><text x="165" y="807" text-anchor="end">2 000</text><text x="165" y="877" text-anchor="end">3 000</text><text x="165" y="952" text-anchor="end">5 000</text><text x="190" y="980">Ниже / Lower</text><text x="1430" y="980" text-anchor="end">Выше / Higher</text><text x="75" y="820" transform="rotate(-90 75 820)" text-anchor="middle">Глубина / Depth</text></g>
<path d="M1280 660 C1260 700 1180 730 1110 765 S1060 880 1080 945" class="curve" stroke="#d97736"/>
<path d="M1080 660 C1060 700 1040 735 1080 790 S1100 880 1090 945" class="curve" stroke="#3b82a0"/>
<path d="M900 660 C930 700 990 735 1050 790 S1090 880 1100 945" class="curve" stroke="#64748b"/>
<g class="legend"><line x1="1040" y1="640" x2="1080" y2="640" stroke="#d97736" stroke-width="6"/><text x="1090" y="647">Субтропический / Subtropical</text><line x1="1270" y1="640" x2="1310" y2="640" stroke="#3b82a0" stroke-width="6"/><text x="1320" y="647">Умеренный / Temperate</text></g>
<line x1="1040" y1="665" x2="1080" y2="665" stroke="#64748b" stroke-width="6"/><text x="1090" y="672" class="legend">Полярный / Polar</text>
<text x="800" y="1045" text-anchor="middle" class="note">Поверхностная солёность зависит от испарения, осадков, речного стока и таяния льда.</text>
<text x="800" y="1073" text-anchor="middle" class="note">Surface salinity depends on evaporation, precipitation, river input and ice melt.</text>
<text x="800" y="1100" text-anchor="middle" class="note">В экваториальных дождливых районах солёность поверхности может быть ниже субтропической. / Rainy equatorial waters can be less saline than subtropical waters.</text>
</svg>