<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Внутреннее строение Земли / Earth's internal structure</title>
<desc id="desc">Разрез Земли с корой, литосферой, астеносферой, мантией, жидким внешним и твёрдым внутренним ядром. Химические и механические классификации показаны отдельно. / Earth cutaway showing crust, lithosphere, asthenosphere, mantle, liquid outer core and solid inner core; chemical and mechanical classifications are distinguished.</desc>
<rect width="1200" height="760" rx="24" fill="#f8fafc"/>
<text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">ВНУТРЕННЕЕ СТРОЕНИЕ ЗЕМЛИ / EARTH'S INTERNAL STRUCTURE</text>
<g transform="translate(355 385)">
<circle r="260" fill="#b45309" stroke="#78350f" stroke-width="3"/>
<circle r="225" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
<circle r="145" fill="#facc15" stroke="#a16207" stroke-width="3"/>
<circle r="92" fill="#fef08a" stroke="#a16207" stroke-width="3"/>
<circle r="38" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
















</g>
<g font-family="Arial,sans-serif" fill="#1e293b">
<path d="M615 130 L790 130" stroke="#475569" stroke-width="2"/><text x="810" y="124" font-size="22" font-weight="700">Кора / Crust</text><text x="810" y="150" font-size="17">тонкая внешняя оболочка / thin outer shell</text>
<path d="M590 230 L790 230" stroke="#475569" stroke-width="2"/><text x="810" y="224" font-size="22" font-weight="700">Мантия / Mantle</text><text x="810" y="250" font-size="17">преимущественно твёрдая, медленно деформируется</text><text x="810" y="274" font-size="17">mostly solid; deforms slowly</text>
<path d="M500 385 L790 385" stroke="#475569" stroke-width="2"/><text x="810" y="379" font-size="22" font-weight="700">Внешнее ядро / Outer core</text><text x="810" y="405" font-size="17">жидкое железо-никелевое вещество / liquid Fe–Ni</text>
<path d="M393 385 L180 520" stroke="#475569" stroke-width="2"/><text x="70" y="548" font-size="22" font-weight="700">Внутреннее ядро / Inner core</text><text x="70" y="574" font-size="17">твёрдое Fe–Ni / solid Fe–Ni</text>
<path d="M570 175 L790 315" stroke="#0f766e" stroke-width="2"/><text x="810" y="312" font-size="20" font-weight="700" fill="#0f766e">Литосфера / Lithosphere</text><text x="810" y="336" font-size="16">кора + жёсткая верхняя мантия</text><text x="810" y="357" font-size="16">crust + rigid uppermost mantle</text>
<path d="M520 285 L790 470" stroke="#0f766e" stroke-width="2"/><text x="810" y="468" font-size="20" font-weight="700" fill="#0f766e">Астеносфера / Asthenosphere</text><text x="810" y="492" font-size="16">пластичная часть верхней мантии</text><text x="810" y="513" font-size="16">ductile part of the upper mantle</text>
</g>
<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Схема не в масштабе; химические слои (кора, мантия, ядро) и механические слои (литосфера, астеносфера и др.) — разные классификации.</text>
<text x="600" y="718" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Not to scale; chemical layers (crust, mantle, core) and mechanical layers (lithosphere, asthenosphere, etc.) are different classifications.</text>
</svg>