<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Пути загрязнения океана / Ocean pollution pathways</title><desc id="d">Три основных пути поступления загрязнителей: речной сток с суши, сбросы и утечки с судов, атмосферное выпадение. Для каждого показаны меры предотвращения.</desc><rect width="1200" height="620" fill="#f4f9fb"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#173b52">Пути загрязнения океана / Ocean pollution pathways</text><g fill="#dceef5" stroke="#8aaebf" stroke-width="2"><rect x="40" y="100" width="345" height="380" rx="18"/><rect x="427" y="100" width="345" height="380" rx="18"/><rect x="814" y="100" width="345" height="380" rx="18"/></g><g font-family="Arial" text-anchor="middle" fill="#173b52"><text x="212" y="145" font-size="24" font-weight="bold">С суши / Land</text><text x="600" y="145" font-size="24" font-weight="bold">С судов / Ships</text><text x="986" y="145" font-size="24" font-weight="bold">Из атмосферы / Air</text><text x="212" y="230" font-size="20">Удобрения, стоки, пластик</text><text x="212" y="260" font-size="18">Nutrients, wastewater, plastics</text><text x="600" y="230" font-size="20">Нефть, мусор, балласт</text><text x="600" y="260" font-size="18">Oil, waste, ballast water</text><text x="986" y="230" font-size="20">Пыль, аэрозоли, выбросы</text><text x="986" y="260" font-size="18">Dust, aerosols, emissions</text><text x="212" y="340" font-size="21" font-weight="bold">Профилактика / Prevention</text><text x="600" y="340" font-size="21" font-weight="bold">Профилактика / Prevention</text><text x="986" y="340" font-size="21" font-weight="bold">Профилактика / Prevention</text><text x="212" y="385" font-size="18">Очистка стоков, буферные зоны</text><text x="212" y="412" font-size="17">Wastewater treatment, buffers</text><text x="600" y="385" font-size="18">Контроль сбросов и топлива</text><text x="600" y="412" font-size="17">Discharge and fuel controls</text><text x="986" y="385" font-size="18">Сокращение выбросов</text><text x="986" y="412" font-size="17">Emission reduction</text></g><path d="M210 480 Q600 550 990 480" stroke="#2784a8" stroke-width="12" fill="none"/><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="19" fill="#164a69">Все пути связаны с океанской средой / All pathways affect the marine environment</text></svg>