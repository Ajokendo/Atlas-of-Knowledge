<text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">АНАТОМИЯ ГОРНОГО ЛАНДШАФТА / ANATOMY OF A MOUNTAIN LANDSCAPE</text>
