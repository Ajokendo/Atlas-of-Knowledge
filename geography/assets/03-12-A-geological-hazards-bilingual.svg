<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ГЕОЛОГИЧЕСКИЕ ОПАСНОСТИ / GEOLOGICAL HAZARDS</title><desc id="desc">Четыре панели: землетрясение, оползень, сель и обвал; меры снижения риска. / Four panels: earthquake, landslide, debris flow and rockfall; risk reduction.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">ГЕОЛОГИЧЕСКИЕ ОПАСНОСТИ / GEOLOGICAL HAZARDS</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="55" y="105" width="520" height="230" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="315" y="145" font-size="24" font-weight="700" fill="#7f1d1d">Землетрясение / Earthquake</text><path d="M100 280 L210 210 L290 260 L390 180 L530 280" fill="none" stroke="#78350f" stroke-width="10"/><path d="M300 190 L270 250 L320 250 L285 310" stroke="#dc2626" stroke-width="6" fill="none"/><text x="315" y="315" font-size="17" fill="#7f1d1d">Надёжные здания, готовность / Safer buildings, preparedness</text></g><g><rect x="625" y="105" width="520" height="230" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="885" y="145" font-size="24" font-weight="700" fill="#7c2d12">Оползень / Landslide</text><path d="M670 280 L770 180 L900 260 L1090 180" fill="none" stroke="#78350f" stroke-width="10"/><path d="M870 205 L950 260" stroke="#dc2626" stroke-width="8"/><text x="885" y="315" font-size="17" fill="#7c2d12">Мониторинг склонов, дренаж / Slope monitoring, drainage</text></g><g><rect x="55" y="390" width="520" height="230" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="315" y="430" font-size="24" font-weight="700" fill="#1e3a8a">Сель / Debris flow</text><path d="M100 560 L220 465 L290 535 L400 460 L530 560" fill="none" stroke="#64748b" stroke-width="10"/><path d="M250 500 Q330 540 420 560" stroke="#92400e" stroke-width="24" fill="none"/><text x="315" y="600" font-size="17" fill="#1e3a8a">Зоны отвода, раннее оповещение / Deflection zones, warning</text></g><g><rect x="625" y="390" width="520" height="230" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="885" y="430" font-size="24" font-weight="700" fill="#334155">Обвал / Rockfall</text><path d="M690 570 L820 450 L900 570" fill="none" stroke="#64748b" stroke-width="12"/><g fill="#475569"><circle cx="930" cy="520" r="17"/><circle cx="970" cy="550" r="13"/><circle cx="1000" cy="580" r="10"/></g><text x="885" y="600" font-size="17" fill="#334155">Защитные барьеры, зоны ограничения / Barriers, exclusion zones</text></g></g><text x="600" y="690" text-anchor="middle" font-size="18" fill="#475569">Схемы показывают типы процессов, а не точный прогноз места и времени события. / Diagrams show process types, not precise prediction of event location or timing.</text></svg>