<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Строение речного бассейна / River basin anatomy</title><desc id="d">Схема водосбора: водораздел ограничивает бассейн, притоки соединяются с главным руслом, река течёт от истока через пойму к устью.</desc><rect width="1200" height="650" fill="#f2f8f2"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#234936">Строение речного бассейна / River basin anatomy</text><path d="M90 220 250 100 390 190 520 95 680 175 840 90 1090 220 990 520 180 520Z" fill="#d8e4c5" stroke="#627c52" stroke-width="5"/><path d="M250 140 340 260 480 330 610 390 780 430 980 470" fill="none" stroke="#2386b4" stroke-width="13" stroke-linecap="round"/><path d="M390 190 450 290 480 330 M520 125 560 290 610 390 M840 125 760 330 780 430 M180 300 350 360 480 330" fill="none" stroke="#55a9ca" stroke-width="8" stroke-linecap="round"/><path d="M250 100 390 190 520 95 680 175 840 90 1090 220" fill="none" stroke="#a36c3d" stroke-width="4" stroke-dasharray="12 8"/><path d="M940 470 Q1020 450 1100 470" stroke="#2386b4" stroke-width="15" fill="none"/><g font-family="Arial" font-size="20" font-weight="bold" fill="#234936"><text x="70" y="90">Водораздел / Watershed divide</text><text x="205" y="255">Исток / Source</text><text x="415" y="250">Притоки / Tributaries</text><text x="650" y="350">Главное русло / Main channel</text><text x="760" y="505">Пойма / Floodplain</text><text x="1000" y="555">Устье / Mouth</text></g><path d="M235 115 260 145 M290 270 310 230 M440 265 455 300 M750 365 720 405 M900 515 930 480" stroke="#234936" stroke-width="2" fill="none"/><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="17" fill="#294b5d">Учебная схема водосбора, не топографическая карта / Teaching catchment schematic, not a topographic map</text></svg>