<text x="600" y="700" text-anchor="middle" font-size="18" fill="#475569">Условная схема; ледниковые формы зависят от рельефа, типа ледника и истории оледенения. / Conceptual; glacial landforms depend on terrain, glacier type and glacial history.</text></svg>