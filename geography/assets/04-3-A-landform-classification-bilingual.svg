<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">КЛАССИФИКАЦИЯ ФОРМ РЕЛЬЕФА / LANDFORM CLASSIFICATION</title><desc id="desc">Панель примеров форм рельефа по происхождению и масштабу: тектонические, вулканические, речные, ледниковые, эоловые, карстовые и ударные. / Examples by origin and scale: tectonic, volcanic, fluvial, glacial, aeolian, karst and impact forms.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">КЛАССИФИКАЦИЯ ФОРМ РЕЛЬЕФА / LANDFORM CLASSIFICATION</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="55" y="115" width="340" height="210" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="225" y="155" font-size="22" font-weight="700">Тектонические / Tectonic</text><path d="M90 270 L165 210 L220 250 L285 185 L360 270" fill="none" stroke="#64748b" stroke-width="18"/></g><g><rect x="430" y="115" width="340" height="210" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="600" y="155" font-size="22" font-weight="700">Вулканические / Volcanic</text><path d="M500 270 L600 185 L700 270Z" fill="#b45309" stroke="#78350f" stroke-width="4"/><path d="M585 190 L600 165 L615 190" fill="#dc2626"/></g><g><rect x="805" y="115" width="340" height="210" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="975" y="155" font-size="22" font-weight="700">Речные / Fluvial</text><path d="M850 230 Q900 170 950 230 T1050 230" fill="none" stroke="#2563eb" stroke-width="18"/></g><g><rect x="55" y="370" width="340" height="210" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="225" y="410" font-size="22" font-weight="700">Ледниковые / Glacial</text><path d="M100 525 L190 430 L270 525Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/></g><g><rect x="430" y="370" width="340" height="210" rx="14" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><text x="600" y="410" font-size="22" font-weight="700">Эоловые / Aeolian</text><path d="M480 525 Q600 420 720 525" fill="#fbbf24" stroke="#a16207" stroke-width="4"/></g><g><rect x="805" y="370" width="340" height="210" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><text x="975" y="410" font-size="22" font-weight="700">Карстовые и ударные / Karst & impact</text><circle cx="920" cy="500" r="45" fill="#c4b5fd" stroke="#6d28d9" stroke-width="4"/><circle cx="1040" cy="500" r="55" fill="none" stroke="#6d28d9" stroke-width="8"/></g></g><text x="600" y="660" text-anchor="middle" font-size="18" fill="#475569">Формы классифицируют по генезису, размеру и положению; категории могут пересекаться. / Landforms are classified by origin, scale and setting; categories can overlap.</text></svg>