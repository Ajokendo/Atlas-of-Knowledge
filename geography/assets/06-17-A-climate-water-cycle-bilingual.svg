<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Изменение климата и круговорот воды / Climate change and the water cycle</title><desc id="d">Причинно-следственная схема: потепление увеличивает атмосферное влагосодержание и испарительный спрос; глобальные средние испарение и осадки в целом растут, но региональные изменения осадков, стока и экстремумов различаются.</desc><rect width="1200" height="650" fill="#f7fafb"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#173b52">Изменение климата и круговорот воды / Climate change and the water cycle</text><g fill="#e3f1f7" stroke="#6e9db2" stroke-width="2"><rect x="400" y="85" width="400" height="80" rx="18"/><rect x="70" y="260" width="300" height="100" rx="18"/><rect x="450" y="260" width="300" height="100" rx="18"/><rect x="830" y="260" width="300" height="100" rx="18"/><rect x="260" y="475" width="680" height="100" rx="18"/></g><g font-family="Arial" text-anchor="middle" fill="#173b52"><text x="600" y="135" font-size="25" font-weight="bold">Потепление / Warming</text><text x="220" y="300" font-size="22" font-weight="bold">Испарительный спрос</text><text x="220" y="330" font-size="19">Evaporative demand</text><text x="600" y="300" font-size="22" font-weight="bold">Изменение осадков</text><text x="600" y="330" font-size="19">Changing precipitation</text><text x="980" y="300" font-size="22" font-weight="bold">Таяние снега и льда</text><text x="980" y="330" font-size="19">Snow and ice melt</text><text x="600" y="520" font-size="23" font-weight="bold">Изменения стока, запасов воды и экстремумов</text><text x="600" y="550" font-size="19">Changes in runoff, storage and extremes</text></g><g stroke="#287fa4" stroke-width="5" fill="none"><path d="M470 165 250 255"/><path d="M600 165 600 255"/><path d="M730 165 950 255"/><path d="M220 360 440 470"/><path d="M600 360 600 470"/><path d="M980 360 760 470"/></g><g fill="#287fa4"><path d="M250 255 l-18 -4 10 17Z"/><path d="M600 255 l-10 -16 20 0Z"/><path d="M950 255 l18 -4 -10 17Z"/><path d="M440 470 l-18 -7 8 18Z"/><path d="M600 470 l-10 -16 20 0Z"/><path d="M760 470 l18 -7 -8 18Z"/></g><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="16" fill="#294b5d">Направления влияния зависят от региона; не все бассейны реагируют одинаково / Regional responses differ</text></svg>