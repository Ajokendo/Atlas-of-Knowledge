<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Компоненты криосферы / Cryosphere components</title><desc id="d">Схематичный ландшафт с горным ледником, ледяным щитом, морским льдом, сезонным снежным покровом и многолетней мерзлотой; различены лёд на суше и морской лёд.</desc><rect width="1200" height="620" fill="#eaf6fb"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#173b52">Компоненты криосферы / Cryosphere components</text><path d="M0 350 150 230 280 330 420 150 570 350 720 300 860 360 1000 300 1200 355 1200 520 0 520Z" fill="#8a9b9e"/><path d="M100 270 150 230 205 280 175 300Z M360 220 420 150 490 260 445 245Z" fill="#fff" stroke="#9ecfe3" stroke-width="3"/><path d="M0 520 Q300 500 600 520 T1200 510 L1200 620 0 620Z" fill="#8ac9e4"/><path d="M0 515 1200 515" stroke="#287fa4" stroke-width="4"/><path d="M650 355 820 355 900 520 600 520Z" fill="#d9f0f8" opacity=".9"/><g font-family="Arial" font-size="20" font-weight="bold" fill="#173b52"><text x="60" y="180">Сезонный снег / Seasonal snow</text><text x="340" y="115">Горный ледник / Mountain glacier</text><text x="750" y="185">Многолетняя мерзлота / Permafrost</text><text x="875" y="455">Морской лёд / Sea ice</text><text x="80" y="570">Морская вода / Ocean water</text><text x="950" y="260">Ледяной щит / Ice sheet</text></g><path d="M300 125 390 200 M850 200 820 370 M1010 275 1040 330" stroke="#315c70" stroke-width="2" fill="none"/><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="17" fill="#294b5d">Ледники и ледяные щиты лежат на суше; морской лёд образуется на воде / Land ice vs sea ice</text></svg>