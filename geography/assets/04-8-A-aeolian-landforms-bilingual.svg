<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ЭОЛОВЫЕ ФОРМЫ РЕЛЬЕФА / AEOLIAN LANDFORMS</title><desc id="desc">Схема бархана, продольной и поперечной дюн, дефляционной котловины и лёссового покрова. / Diagram of barchan, longitudinal and transverse dunes, deflation hollow and loess cover.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">ЭОЛОВЫЕ ФОРМЫ РЕЛЬЕФА / AEOLIAN LANDFORMS</text>
<g font-family="Arial,sans-serif" fill="#1e293b" text-anchor="middle"><path d="M70 420 Q180 210 300 420 Q390 500 470 420" fill="#fbbf24" stroke="#a16207" stroke-width="4"/><path d="M530 420 Q660 260 800 420" fill="#fcd34d" stroke="#a16207" stroke-width="4"/><path d="M860 420 Q930 260 1000 420 Q1070 260 1140 420" fill="#fde68a" stroke="#a16207" stroke-width="4"/><text x="270" y="160" font-size="23" font-weight="700">Бархан / Barchan</text><text x="665" y="160" font-size="23" font-weight="700">Продольная дюна / Longitudinal dune</text><text x="980" y="160" font-size="23" font-weight="700">Поперечные дюны / Transverse dunes</text><path d="M80 550 Q180 620 280 550" fill="none" stroke="#a16207" stroke-width="8"/><text x="180" y="660" font-size="20">Дефляционная котловина / Deflation hollow</text><rect x="600" y="535" width="510" height="55" fill="#d6b98c" stroke="#92400e" stroke-width="3"/><text x="850" y="630" font-size="20">Лёссовый покров / Loess deposit</text></g><path d="M120 220 L210 220 M190 205 L210 220 L190 235 M560 220 L650 220 M630 205 L650 220 L630 235 M870 220 L960 220 M940 205 L960 220 L940 235" stroke="#2563eb" stroke-width="5" fill="none"/><text x="600" y="90" text-anchor="middle" font-size="19" fill="#2563eb">Преобладающий ветер / Prevailing wind</text><text x="600" y="715" text-anchor="middle" font-size="17" fill="#475569">Форма дюн зависит от режима ветра, доступности песка и растительности. / Dune form depends on wind regime, sand supply and vegetation.</text></svg>