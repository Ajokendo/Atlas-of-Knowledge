<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ВЫВЕТРИВАНИЕ / WEATHERING PROCESSES</title><desc id="desc">Сравнение физического, химического и биологического выветривания. / Comparison of physical, chemical and biological weathering.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">ВЫВЕТРИВАНИЕ / WEATHERING PROCESSES</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="60" y="120" width="340" height="450" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="230" y="165" font-size="24" font-weight="700" fill="#7c2d12">Физическое / Physical</text><path d="M120 430 L190 270 L270 400 L330 300 L370 450Z" fill="#a8a29e" stroke="#57534e" stroke-width="4"/><path d="M220 280 L200 355 L245 390" stroke="#dc2626" stroke-width="5" fill="none"/><text x="230" y="510" font-size="19" fill="#7c2d12">Разрушение без изменения состава</text><text x="230" y="540" font-size="18" fill="#7c2d12">Breakdown without chemical change</text></g><g><rect x="430" y="120" width="340" height="450" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="600" y="165" font-size="24" font-weight="700" fill="#1e3a8a">Химическое / Chemical</text><path d="M490 430 Q600 240 710 430Z" fill="#d6b98c" stroke="#92400e" stroke-width="4"/><path d="M520 300 Q600 350 680 300" stroke="#2563eb" stroke-width="8" fill="none"/><text x="600" y="510" font-size="19" fill="#1e3a8a">Минералы изменяются реакциями</text><text x="600" y="540" font-size="18" fill="#1e3a8a">Minerals altered by reactions</text></g><g><rect x="800" y="120" width="340" height="450" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="970" y="165" font-size="24" font-weight="700" fill="#14532d">Биологическое / Biological</text><path d="M870 430 L930 300 L990 430 L1060 290 L1110 430Z" fill="#a8a29e" stroke="#57534e" stroke-width="4"/><path d="M970 290 Q960 230 930 215 M970 290 Q1000 220 1030 210" stroke="#15803d" stroke-width="8" fill="none"/><text x="970" y="510" font-size="19" fill="#14532d">Корни и организмы воздействуют на породу</text><text x="970" y="540" font-size="18" fill="#14532d">Roots and organisms affect rock</text></g></g><text x="600" y="670" text-anchor="middle" font-size="18" fill="#475569">Выветривание происходит на месте; эрозия включает удаление и перенос материала. / Weathering occurs in place; erosion involves removal and transport.</text></svg>