<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">СТРОЕНИЕ ЗЕМЛЕТРЯСЕНИЯ / ANATOMY OF AN EARTHQUAKE</title><desc id="desc">Разрез с разломом, очагом, эпицентром и путями P- и S-волн; отдельные вставки показывают продольное движение частиц в P-волне и поперечное движение в S-волне. / Cross-section showing the fault, hypocentre, epicentre and P- and S-wave paths; insets distinguish particle motion parallel to P-wave travel and perpendicular to S-wave travel.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">СТРОЕНИЕ ЗЕМЛЕТРЯСЕНИЯ / ANATOMY OF AN EARTHQUAKE</text>
<g font-family="Arial,sans-serif"><rect x="70" y="82" width="500" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="320" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">P-волна / P wave</text><path d="M120 155 L470 155 M450 140 L470 155 L450 170" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M175 135 L205 175 L235 135 L265 175 L295 135 L325 175 L355 135 L385 175" fill="none" stroke="#1d4ed8" stroke-width="3"/><text x="320" y="195" text-anchor="middle" font-size="15" fill="#1e3a8a">Частицы движутся вдоль распространения / Particle motion parallel to travel</text><rect x="630" y="82" width="500" height="125" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="880" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#115e59">S-волна / S wave</text><path d="M690 155 L1040 155 M1020 140 L1040 155 L1020 170" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M735 135 L735 175 L765 175 L765 135 L795 135 L795 175 L825 175 L825 135 L855 135 L855 175 L885 175" fill="none" stroke="#0f766e" stroke-width="3"/><text x="880" y="195" text-anchor="middle" font-size="15" fill="#115e59">Частицы движутся поперёк распространения / Particle motion perpendicular to travel</text></g>
