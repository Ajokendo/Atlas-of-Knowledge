<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">СТРОЕНИЕ ЗЕМЛЕТРЯСЕНИЯ / ANATOMY OF AN EARTHQUAKE</title><desc id="desc">Разрез с разломом, очагом, эпицентром и путями P- и S-волн. / Cross-section showing fault, focus, epicentre and P- and S-wave paths.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">СТРОЕНИЕ ЗЕМЛЕТРЯСЕНИЯ / ANATOMY OF AN EARTHQUAKE</text>
