<circle cx="780" cy="438" r="52" fill="#e9a23b"/><g stroke="#e9a23b" stroke-width="4"><path d="M780 365 v-18 M780 529 v-18 M707 438 h-18 M871 438 h-18 M728 386 l-13 -13 M845 503 l-13 -13 M832 386 l13 -13 M715 503 l13 -13"/></g>
