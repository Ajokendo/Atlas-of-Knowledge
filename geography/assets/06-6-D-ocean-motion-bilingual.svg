<text x="600" y="775" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526b7c">Упрощённая учебная схема; не показывает реальные маршруты и масштабы / Simplified teaching schematic; not actual routes or scale</text>
</svg>