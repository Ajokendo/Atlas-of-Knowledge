<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Волны, приливы и океанические течения / Waves, tides and ocean currents</title>
<desc id="desc">Три учебные панели: ветровая волна с орбитальным движением частиц воды; приливное поднятие уровня моря под действием Луны и Солнца; поверхностное ветровое и глубинное плотностное течение. Схема качественная, не в масштабе.</desc>
<rect width="1200" height="820" fill="#f7fbff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15324b">Волны, приливы и океанические течения</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31556e">Waves, tides and ocean currents</text>
<!-- panels -->
<g fill="#ffffff" stroke="#9bb8ca" stroke-width="2">
<rect x="35" y="105" width="1130" height="205" rx="18"/>
<rect x="35" y="325" width="1130" height="205" rx="18"/>
<rect x="35" y="545" width="1130" height="240" rx="18"/>
</g>
<!-- panel 1 -->
<text x="65" y="143" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15324b">1. Ветровые волны / Wind waves</text>
