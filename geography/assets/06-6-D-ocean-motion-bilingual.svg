<path d="M315 438 H392" stroke="#d97706" stroke-width="3"/><path d="M380 428 l12 10 -12 10" fill="none" stroke="#d97706" stroke-width="3"/>
<text x="425" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#31556e">Луна / Moon</text>
