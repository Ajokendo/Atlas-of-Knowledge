<g fill="none" stroke="#d97706" stroke-width="3">
<path d="M190 190 C220 155 265 165 265 200 C265 225 235 235 215 215" />
<path d="M185 205 l28 10 -5 -28"/>
<path d="M390 190 C420 155 465 165 465 200 C465 225 435 235 415 215"/>
<path d="M385 205 l28 10 -5 -28"/>
</g>
<path d="M800 164 l120 0" stroke="#d97706" stroke-width="4"/><path d="M905 154 l15 10 -15 10" fill="none" stroke="#d97706" stroke-width="4"/>
<text x="860" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#8a4b08">ветер / wind</text>
<text x="600" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#31556e">Энергия распространяется; частицы воды движутся по орбитам / Energy travels; water particles move in orbits</text>
<!-- panel 2 -->
<text x="65" y="363" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15324b">2. Приливы / Tides</text>
