<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Чтение топографической карты / Reading a topographic map</title>
<desc id="desc">Условный фрагмент топографической карты с горизонталями, высотной отметкой, долиной, водоразделом и линией профиля A–B. Не является реальной картой. / Schematic topographic map with contours, spot height, valley, drainage divide and A–B profile line. Not a real map.</desc>
<rect width="1200" height="760" rx="24" fill="#f8fafc"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">ЧТЕНИЕ ТОПОГРАФИЧЕСКОЙ КАРТЫ / READING A TOPOGRAPHIC MAP</text>
<rect x="75" y="100" width="1050" height="470" rx="14" fill="#eef6e8" stroke="#64748b" stroke-width="2"/>
<g fill="none" stroke="#a16207" stroke-width="3">
<path d="M130 180 C260 100 390 130 470 210 S690 330 790 200 S1000 100 1080 180"/>
<path d="M120 220 C260 145 375 170 455 245 S690 370 810 245 S1000 150 1090 220"/>
<path d="M110 270 C255 195 360 220 440 285 S680 415 830 290 S1000 200 1100 270"/>
<path d="M100 325 C245 250 350 275 430 330 S670 465 850 340 S1010 250 1110 325"/>
<path d="M100 385 C240 310 340 335 420 380 S660 515 870 395 S1020 310 1110 385"/>
<path d="M135 455 C260 385 350 400 420 435 S650 550 890 455 S1020 385 1080 455"/>
</g>
<g fill="none" stroke="#2563eb" stroke-width="5"><path d="M90 345 C240 355 300 390 420 385 S650 370 770 385 S980 390 1110 350"/></g>
<g fill="#1e40af" font-family="Arial,sans-serif" font-size="18"><text x="520" y="360">ручей / stream</text></g>
<g stroke="#0f766e" stroke-width="3" stroke-dasharray="9 7" fill="none"><path d="M600 125 L600 530"/></g>
<g font-family="Arial,sans-serif" fill="#78350f" font-size="18" font-weight="700"><text x="175" y="160">600 м</text><text x="250" y="245">620 м</text><text x="350" y="315">640 м</text><text x="900" y="185">620 м</text><text x="940" y="285">640 м</text></g>
<circle cx="600" cy="180" r="7" fill="#111827"/><text x="615" y="175" font-family="Arial,sans-serif" font-size="19" fill="#111827">точечная отметка / spot height: 658 м</text>
<g stroke="#dc2626" stroke-width="5" fill="none"><path d="M170 505 L1020 145"/></g>
<g fill="#991b1b" font-family="Arial,sans-serif" font-size="22" font-weight="700"><text x="150" y="535">A</text><text x="1030" y="140">B</text><text x="625" y="545">линия профиля A–B / profile line</text></g>
<text x="90" y="595" font-family="Arial,sans-serif" font-size="17" fill="#334155">Условные горизонтали: интервал 20 м / Illustrative contour interval: 20 m</text>
<text x="90" y="625" font-family="Arial,sans-serif" font-size="17" fill="#334155">Сближенные линии — более крутой склон; замкнутые контуры показывают возвышенность или впадину по отметкам.</text>
<text x="90" y="652" font-family="Arial,sans-serif" font-size="17" fill="#334155">Close contours indicate steeper slopes; closed contours indicate a hill or depression depending on elevation labels.</text>
<text x="600" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#64748b">Учебная схема, не геопривязана и не предназначена для навигации. / Teaching schematic, not georeferenced or for navigation.</text>
</svg>