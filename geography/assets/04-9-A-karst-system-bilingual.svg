<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">КАРСТОВАЯ СИСТЕМА / KARST SYSTEM</title><desc id="desc">Блок-диаграмма карстового массива с воронкой, понором, пещерой, подземным потоком, источником, сталактитами и сталагмитами. / Block diagram of a karst massif with sinkhole, swallow hole, cave, underground flow, spring, stalactites and stalagmites.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">КАРСТОВАЯ СИСТЕМА / KARST SYSTEM</text>
