<g font-family="Arial,sans-serif" font-size="20" fill="#1e293b"><text x="250" y="185">Воронка / Sinkhole</text><text x="670" y="185">Понор / Swallow hole</text><text x="400" y="550">Пещера / Cave</text><text x="840" y="550">Подземный поток / Underground stream</text><text x="900" y="355">Источник / Spring</text><text x="70" y="680">Сталактит / Stalactite — свисает сверху / hangs down</text><text x="670" y="680">Сталагмит / Stalagmite — растёт снизу / grows upward</text></g><text x="600" y="720" text-anchor="middle" font-size="16" fill="#475569">Схема условна; развитие карста зависит от растворимости пород, трещиноватости и движения воды. / Conceptual; karst development depends on rock solubility, fractures and water flow.</text></svg>