<text x="600" y="675" text-anchor="middle" font-size="18" fill="#475569">Процессы взаимодействуют: поднятие создаёт перепады высот, а внешние силы перерабатывают рельеф. / Processes interact: uplift creates relief, while surface processes reshape it.</text></svg>