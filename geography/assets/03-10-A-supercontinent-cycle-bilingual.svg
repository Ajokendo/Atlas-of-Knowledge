<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ЦИКЛ СУПЕРКОНТИНЕНТА / SUPERCONTINENT CYCLE</title><desc id="desc">Упрощённая последовательность рифтинга, раскрытия океана, субдукции, столкновения континентов и горообразования. / Simplified sequence of rifting, ocean opening, subduction, continental collision and mountain building.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">ЦИКЛ СУПЕРКОНТИНЕНТА / SUPERCONTINENT CYCLE</text>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#1e293b"><g><rect x="55" y="125" width="320" height="190" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="215" y="160" font-size="22" font-weight="700">1. Рифтинг / Rifting</text><path d="M95 250 L165 205 L195 230 L225 205 L295 250" fill="none" stroke="#92400e" stroke-width="18"/><path d="M195 230 L195 270" stroke="#dc2626" stroke-width="5"/></g><g><rect x="440" y="125" width="320" height="190" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="600" y="160" font-size="22" font-weight="700">2. Океан / Ocean opens</text><path d="M485 250 L545 210 L570 250 L630 250 L655 210 L715 250" fill="none" stroke="#92400e" stroke-width="18"/><path d="M580 220 L620 220" stroke="#2563eb" stroke-width="7"/></g><g><rect x="825" y="125" width="320" height="190" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><text x="985" y="160" font-size="22" font-weight="700">3. Субдукция / Subduction</text><path d="M855 240 L950 240 L1040 280 L1100 280" fill="none" stroke="#92400e" stroke-width="18"/><path d="M955 240 L1035 285" stroke="#dc2626" stroke-width="8"/></g><g><rect x="250" y="420" width="320" height="190" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><text x="410" y="455" font-size="22" font-weight="700">4. Столкновение / Collision</text><path d="M290 555 L365 495 L410 530 L455 495 L530 555" fill="none" stroke="#92400e" stroke-width="20"/></g><g><rect x="630" y="420" width="320" height="190" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="790" y="455" font-size="22" font-weight="700">5. Горообразование / Mountains</text><path d="M665 565 L725 510 L770 545 L825 485 L915 565" fill="none" stroke="#64748b" stroke-width="24"/></g></g><g stroke="#475569" stroke-width="4" fill="none"><path d="M375 220 L430 220 M415 205 L430 220 L415 235"/><path d="M760 220 L815 220 M800 205 L815 220 L800 235"/><path d="M985 320 Q980 370 800 405 L800 415 M785 400 L800 415 L815 400"/><path d="M570 515 L620 515 M605 500 L620 515 L605 530"/></g><text x="600" y="690" text-anchor="middle" font-size="18" fill="#475569">Схема концептуальная: суперконтинентальные циклы имеют разную длительность и не являются точным периодическим механизмом. / Conceptual: supercontinent cycles vary in duration and are not a precise periodic mechanism.</text></svg>