<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Типы озёр и строение озера / Lake types and structure</title><desc id="d">Сравнение четырёх происхождений озёрных котловин и разрез стратифицированного озера с эпилимнионом, термоклином и гиполимнионом.</desc><rect width="1200" height="680" fill="#f5f9fb"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#173b52">Типы озёр и строение озера / Lake types and structure</text><g fill="#dceef5" stroke="#7898a8" stroke-width="2"><rect x="35" y="85" width="265" height="220" rx="16"/><rect x="325" y="85" width="265" height="220" rx="16"/><rect x="615" y="85" width="265" height="220" rx="16"/><rect x="905" y="85" width="260" height="220" rx="16"/></g><g font-family="Arial" text-anchor="middle" fill="#173b52"><text x="167" y="125" font-size="21" font-weight="bold">Тектоническое / Tectonic</text><text x="457" y="125" font-size="21" font-weight="bold">Ледниковое / Glacial</text><text x="747" y="125" font-size="21" font-weight="bold">Вулканическое / Volcanic</text><text x="1035" y="125" font-size="21" font-weight="bold">Карстовое / Karst</text></g><g fill="#8ac7df" stroke="#315c70" stroke-width="3"><path d="M70 230 110 230 135 275 185 275 220 230 265 230 240 290 95 290Z"/><path d="M355 230 390 190 425 230 460 190 495 230 555 230 540 290 370 290Z"/><path d="M645 230 690 180 735 180 780 230 850 230 830 290 660 290Z"/><path d="M930 230 970 205 1010 230 1050 205 1090 230 1135 230 1120 290 945 290Z"/></g><rect x="35" y="340" width="1130" height="285" rx="18" fill="#eaf6fb" stroke="#8aaebf" stroke-width="2"/><text x="600" y="378" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#173b52">Стратификация озера / Lake stratification</text><path d="M100 430 Q600 405 1100 430 L1100 560 100 560Z" fill="#69b5d4"/><path d="M100 430 Q600 405 1100 430 L1100 465 Q600 445 100 465Z" fill="#a8dff0"/><path d="M100 465 Q600 445 1100 465 L1100 490 Q600 475 100 490Z" fill="#4c94b7"/><path d="M100 490 Q600 475 1100 490 L1100 560 100 560Z" fill="#23688e"/><path d="M100 560 Q600 545 1100 560" stroke="#725f4a" stroke-width="8" fill="none"/><g font-family="Arial" font-size="20" font-weight="bold" fill="#173b52"><text x="140" y="455">Эпилимнион / Epilimnion</text><text x="140" y="487">Металимнион (термоклин) / Metalimnion</text><text x="140" y="535" fill="#fff">Гиполимнион / Hypolimnion</text></g><text x="600" y="605" text-anchor="middle" font-family="Arial" font-size="16" fill="#294b5d">Схема сезонной стратификации; глубины и температуры условны / Seasonal stratification, not to scale</text></svg>