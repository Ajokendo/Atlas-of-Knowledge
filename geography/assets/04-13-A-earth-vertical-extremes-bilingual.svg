<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ВЕРТИКАЛЬНЫЕ КРАЙНОСТИ ЗЕМЛИ / EARTH'S VERTICAL EXTREMES</title><desc id="desc">Сравнение высоты Эвереста и глубины Челленджер-Дип с разными опубликованными оценками 2021 и 2026 годов. / Comparison of Everest elevation and Challenger Deep depth with published 2021 and 2026 estimates.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">ВЕРТИКАЛЬНЫЕ КРАЙНОСТИ ЗЕМЛИ / EARTH'S VERTICAL EXTREMES</text>
<g font-family="Arial,sans-serif"><path d="M600 130 L600 610" stroke="#64748b" stroke-width="3"/><path d="M600 130 L570 180 L590 175 L560 220 L600 205 L640 220 L610 175 L630 180Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><path d="M600 610 L560 550 L580 565 L550 520 L600 540 L650 520 L620 565 L640 550Z" fill="#1d4ed8"/><text x="90" y="170" font-size="25" font-weight="700" fill="#172554">Эверест / Everest</text><text x="90" y="210" font-size="22" fill="#334155">8,848.86 м над уровнем моря</text><text x="90" y="240" font-size="18" fill="#334155">8,848.86 m above sea level</text><path d="M400 220 L560 220" stroke="#475569" stroke-width="2"/><text x="720" y="475" font-size="25" font-weight="700" fill="#172554">Челленджер-Дип / Challenger Deep</text><text x="720" y="520" font-size="22" fill="#334155">2021: 10,935 ± 6 м</text><text x="720" y="550" font-size="22" fill="#334155">2026: предпочтительная сеточная оценка 10,927 м</text><text x="720" y="580" font-size="18" fill="#334155">2026 model sensitivity: 10,914–10,932 m</text><path d="M640 550 L700 550" stroke="#475569" stroke-width="2"/><text x="600" y="680" text-anchor="middle" font-size="17" fill="#475569">Показано направление относительно среднего уровня моря, а не единый линейный масштаб. / Relative to mean sea level; not one linear scale.</text></g><text x="600" y="715" text-anchor="middle" font-size="16" fill="#64748b">2026: multibeam gridded estimate; values depend on sound-speed model, survey geometry and vertical reference.</text></svg>