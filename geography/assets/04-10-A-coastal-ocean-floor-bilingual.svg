<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ПОБЕРЕЖЬЕ И РЕЛЬЕФ ДНА ОКЕАНА / COASTAL AND OCEAN-FLOOR RELIEF</title><desc id="desc">Профиль берега и океанического дна: абразионный и аккумулятивный участки, коса, томболо, барьерный остров, шельф, склон, абиссальная равнина, хребет и желоб. / Coastal and seafloor profile showing erosional and depositional coasts, spit, tombolo, barrier island, shelf, slope, abyssal plain, ridge and trench.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">ПОБЕРЕЖЬЕ И РЕЛЬЕФ ДНА ОКЕАНА / COASTAL AND OCEAN-FLOOR RELIEF</text>
<rect x="55" y="110" width="1090" height="500" rx="14" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><path d="M55 300 L220 300 L300 350 L370 410 L430 450 L510 470 L620 490 L730 520 L820 545 L920 560 L1030 590 L1145 600 L1145 650 L55 650Z" fill="#2563eb" opacity=".78"/><path d="M55 300 L220 300 L300 350 L370 410 L430 450 L510 470 L620 490 L730 520 L820 545 L920 560 L1030 590 L1145 600" fill="none" stroke="#92400e" stroke-width="6"/><path d="M250 300 Q300 260 360 300" fill="none" stroke="#a16207" stroke-width="12"/><path d="M380 300 Q420 250 460 300" fill="none" stroke="#a16207" stroke-width="12"/><path d="M500 300 L570 300 L570 330 L500 330Z" fill="#d6b98c"/><path d="M680 490 Q760 430 850 490" fill="none" stroke="#0f766e" stroke-width="10"/><path d="M930 560 L980 480 L1030 560" fill="none" stroke="#0f766e" stroke-width="10"/><path d="M1080 590 Q1100 470 1120 590" fill="none" stroke="#0f766e" stroke-width="10"/>
<g font-family="Arial,sans-serif" font-size="18" fill="#1e293b"><text x="70" y="240">Берег / Shore</text><text x="220" y="205">Коса / Spit</text><text x="370" y="235">Тombolo / Tombolo</text><text x="510" y="265">Барьерный остров / Barrier island</text><text x="600" y="430">Шельф / Shelf</text><text x="760" y="485">Материковый склон / Continental slope</text><text x="850" y="540">Абиссальная равнина / Abyssal plain</text><text x="970" y="435">Хребет / Ridge</text><text x="1070" y="455">Желоб / Trench</text></g><text x="600" y="690" text-anchor="middle" font-size="18" fill="#475569">Условный профиль, не в масштабе; формы побережья зависят от волн, приливов, течений и поступления наносов. / Conceptual, not to scale; coasts depend on waves, tides, currents and sediment supply.</text></svg>