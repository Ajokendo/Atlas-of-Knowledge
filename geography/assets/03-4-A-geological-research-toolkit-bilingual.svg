<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">МЕТОДЫ ГЕОЛОГИЧЕСКИХ ИССЛЕДОВАНИЙ / GEOLOGICAL RESEARCH TOOLKIT</title><desc id="desc">Полевые наблюдения, образец, тонкий шлиф, дифрактограмма и геофизический профиль. / Field observations, specimen, thin section, diffraction pattern and geophysical profile.</desc><rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">МЕТОДЫ ГЕОЛОГИЧЕСКИХ ИССЛЕДОВАНИЙ / GEOLOGICAL RESEARCH TOOLKIT</text>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#1e293b"><g><rect x="50" y="120" width="330" height="210" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><path d="M95 265 L155 180 L210 250 L280 160 L340 265" fill="none" stroke="#64748b" stroke-width="9"/><text x="215" y="155" font-size="22" font-weight="700">Полевая геология / Fieldwork</text><text x="215" y="305" font-size="17">Наблюдение и описание / Observe and record</text></g><g><rect x="435" y="120" width="330" height="210" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/><circle cx="600" cy="225" r="55" fill="#b45309" stroke="#78350f" stroke-width="4"/><circle cx="580" cy="205" r="13" fill="#fcd34d"/><circle cx="620" cy="235" r="17" fill="#64748b"/><text x="600" y="155" font-size="22" font-weight="700">Образец породы / Rock specimen</text><text x="600" y="305" font-size="17">Макроскопические свойства / Hand-sample properties</text></g><g><rect x="820" y="120" width="330" height="210" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="985" cy="220" r="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="5"/><path d="M945 220 Q985 160 1025 220 Q985 280 945 220" fill="none" stroke="#2563eb" stroke-width="4"/><text x="985" y="155" font-size="22" font-weight="700">Тонкий шлиф / Thin section</text><text x="985" y="305" font-size="17">Микроскопия / Microscopy</text></g><g><rect x="250" y="400" width="330" height="210" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><path d="M290 550 L340 550 L360 500 L390 460 L420 525 L455 480 L500 550" fill="none" stroke="#6d28d9" stroke-width="4"/><text x="415" y="440" font-size="22" font-weight="700">Дифракция / Diffraction</text><text x="415" y="585" font-size="17">Идентификация минералов / Mineral identification</text></g><g><rect x="620" y="400" width="330" height="210" rx="14" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><path d="M665 500 Q710 430 760 500 T900 500" fill="none" stroke="#a16207" stroke-width="5"/><path d="M665 545 L900 545" stroke="#64748b" stroke-width="2"/><text x="785" y="440" font-size="22" font-weight="700">Геофизика / Geophysics</text><text x="785" y="585" font-size="17">Измерения физических полей / Physical-field measurements</text></g></g><text x="600" y="690" text-anchor="middle" font-size="18" fill="#475569">Методы дополняют друг друга; отдельный метод редко даёт полную картину. / Methods complement one another; no single method usually provides the full picture.</text></svg>