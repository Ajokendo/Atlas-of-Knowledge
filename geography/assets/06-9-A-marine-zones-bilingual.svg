<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Зоны морской среды / Marine zones</title><desc id="d">Разрез от берега к глубокому океану с литоралью, рифом, пелагической толщей воды, бенталью и глубоководной зоной.</desc><rect width="1200" height="650" fill="#eaf6fb"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#173b52">Зоны морской среды / Marine zones</text><path d="M0 180 180 180 260 260 370 330 1200 330 1200 590 0 590Z" fill="#8bc8df"/><path d="M0 180 180 180 260 260 370 330 1200 330" fill="none" stroke="#315c70" stroke-width="5"/><path d="M0 180 180 180 260 260 370 330 1200 330 1200 590 0 590Z" fill="#4e9fc2" opacity=".24"/><path d="M370 330 1200 330 1200 590 370 590Z" fill="#176b96" opacity=".25"/><path d="M210 235 260 215 305 260 280 285Z" fill="#d4a76d" stroke="#8b673f" stroke-width="3"/><path d="M0 180 180 180 260 260 370 330 1200 330" stroke="#fff" stroke-width="2" fill="none"/><path d="M0 590 Q350 560 700 590 T1200 580" stroke="#5d493c" stroke-width="10" fill="none"/><g font-family="Arial" font-size="23" font-weight="bold" fill="#123e57"><text x="75" y="140">Литораль / Littoral</text><text x="250" y="205">Риф / Reef</text><text x="600" y="250">Пелагиаль / Pelagic</text><text x="650" y="550">Бенталь / Benthic</text><text x="950" y="390">Глубоководная зона / Deep sea</text></g><g stroke="#174c68" stroke-width="2" fill="none"><path d="M160 150 160 178"/><path d="M300 210 285 242"/><path d="M700 265 700 320"/><path d="M760 520 760 580"/></g><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="17" fill="#294b5d">Схема экологических зон, не батиметрический профиль / Ecological zones, not a bathymetric profile</text></svg>