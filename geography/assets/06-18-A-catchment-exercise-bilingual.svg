<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Практическая работа: водный баланс бассейна / Practical exercise: catchment water balance</title><desc id="d">Учебная схема водосбора, пример годового водного баланса и сезонная кривая расхода реки. Все значения иллюстративны, не являются наблюдениями.</desc><rect width="1200" height="650" fill="#f7fafb"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#173b52">Водный баланс бассейна / Catchment water balance</text><g fill="#e4f1f5" stroke="#8aaebf" stroke-width="2"><rect x="35" y="85" width="350" height="490" rx="18"/><rect x="425" y="85" width="350" height="490" rx="18"/><rect x="815" y="85" width="350" height="490" rx="18"/></g><g font-family="Arial" fill="#173b52" text-anchor="middle"><text x="210" y="130" font-size="22" font-weight="bold">Бассейн / Basin</text><path d="M75 280 130 185 205 260 260 175 345 280 320 420 100 420Z" fill="#cbdcb9" stroke="#627c52" stroke-width="3"/><path d="M130 200 180 300 245 345 315 390" fill="none" stroke="#2386b4" stroke-width="9"/><text x="210" y="485" font-size="18">Водораздел и русло</text><text x="210" y="512" font-size="16">Divide and channel</text><text x="600" y="130" font-size="22" font-weight="bold">Пример баланса / Example</text><text x="600" y="210" font-size="20">Осадки P = 800 мм</text><text x="600" y="245" font-size="18">Precipitation</text><text x="600" y="300" font-size="20">ET = 500 мм</text><text x="600" y="335" font-size="18">Эвапотранспирация</text><text x="600" y="390" font-size="20">Сток R = 250 мм</text><text x="600" y="425" font-size="18">Runoff</text><text x="600" y="480" font-size="20">ΔS = 50 мм</text><text x="600" y="515" font-size="18">Изменение запасов / Storage change</text><text x="990" y="130" font-size="22" font-weight="bold">Расход реки / Discharge</text><path d="M860 470 1125 470 M860 190 860 470" stroke="#34586a" stroke-width="3" fill="none"/><path d="M870 430 C900 410 925 390 950 300 S1000 200 1025 270 1060 390 1115 425" fill="none" stroke="#2386b4" stroke-width="6"/><text x="990" y="510" font-size="17">Зима — весна — лето — осень</text><text x="990" y="535" font-size="15">Winter — spring — summer — autumn</text></g><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="16" fill="#294b5d">Числа и кривая условны; используйте данные конкретного бассейна для реального анализа / Illustrative values only</text></svg>