<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Система подземных вод / Groundwater system</title><desc id="d">Геологический разрез с зоной аэрации, уровнем грунтовых вод, водоносными горизонтами, водоупорами, скважинами и выходом источника на склоне.</desc><rect width="1200" height="650" fill="#f5f8f3"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#234936">Система подземных вод / Groundwater system</text><path d="M0 190 180 145 330 205 520 165 720 215 900 150 1200 190 1200 590 0 590Z" fill="#cdbb91" stroke="#826d4d" stroke-width="3"/><path d="M0 360 Q350 320 650 365 T1200 340 L1200 450 Q700 475 0 440Z" fill="#7fc1d8"/><path d="M0 465 1200 465 1200 535 0 535Z" fill="#9a8668"/><path d="M0 535 1200 535 1200 590 0 590Z" fill="#d0b77e"/><path d="M0 300 Q350 270 650 310 T1200 285" stroke="#237fa5" stroke-width="4" stroke-dasharray="12 8" fill="none"/><g stroke="#263f4a" stroke-width="7" fill="none"><path d="M330 170 330 505"/><path d="M850 170 850 440"/></g><g fill="#f4f8fa" stroke="#263f4a" stroke-width="3"><rect x="315" y="260" width="30" height="120"/><rect x="835" y="320" width="30" height="90"/></g><path d="M900 150 Q940 190 965 220" stroke="#2386b4" stroke-width="8" fill="none"/><g font-family="Arial" font-size="20" font-weight="bold" fill="#234936"><text x="55" y="120">Зона аэрации / Unsaturated zone</text><text x="55" y="285">Уровень грунтовых вод / Water table</text><text x="420" y="410">Водоносный горизонт / Aquifer</text><text x="420" y="510">Водоупор / Aquitard</text><text x="270" y="570">Скважина / Well</text><text x="920" y="125">Источник / Spring</text></g><path d="M210 130 250 180 M230 290 300 300 M560 415 640 395 M550 515 620 515 M330 550 330 510 M920 140 950 195" stroke="#234936" stroke-width="2" fill="none"/><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="16" fill="#294b5d">Концептуальный геологический разрез, не данные конкретной скважины / Conceptual section, not site-specific data</text></svg>