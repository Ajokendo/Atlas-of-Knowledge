<text x="800" y="970" text-anchor="middle" class="h">Сравнивайте сезонность, амплитуду и сумму осадков — не только отдельные месяцы</text>
<text x="800" y="1005" text-anchor="middle" class="sub">Compare seasonality, annual range and total precipitation — not isolated months</text>
<text x="800" y="1045" text-anchor="middle" class="small">Примечание / Note: иллюстративные данные, не реальные метеостанции / illustrative data, not real weather stations</text>
</svg>