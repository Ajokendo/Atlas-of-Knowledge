<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Climate diagrams: continental and maritime examples / Климатограммы: континентальный и морской примеры</title>
<desc id="desc">Two illustrative climate diagrams with monthly precipitation bars and temperature lines. Synthetic teaching data, not real stations.</desc>
<defs>
<style>
.bg{fill:#f7fafc}.panel{fill:#fff;stroke:#b8c8d6;stroke-width:2}.h{font:700 31px Arial,sans-serif;fill:#18324b}.sub{font:20px Arial,sans-serif;fill:#40566b}.axis{stroke:#526779;stroke-width:2}.grid{stroke:#dce5ec;stroke-width:1}.month{font:17px Arial,sans-serif;fill:#34495e}.lab{font:18px Arial,sans-serif;fill:#34495e}.small{font:17px Arial,sans-serif;fill:#536779}.temp{fill:none;stroke:#d34d35;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.pt{fill:#d34d35;stroke:#fff;stroke-width:2}.bar{fill:#4b9bc2;opacity:.88}.legend{font:19px Arial,sans-serif;fill:#263d50}.note{font:18px Arial,sans-serif;fill:#34495e}
</style>
</defs>
<rect class="bg" width="1600" height="1080"/>
<text x="800" y="54" text-anchor="middle" class="h">КЛИМАТОГРАММЫ / CLIMATE DIAGRAMS</text>
<text x="800" y="88" text-anchor="middle" class="sub">Учебные примеры: месячная температура и осадки / Teaching examples: monthly temperature and precipitation</text>
<g transform="translate(55,125)">
<rect class="panel" width="720" height="790" rx="18"/>
<text x="360" y="48" text-anchor="middle" class="h">A. Континентальный пример / Continental</text>
<text x="360" y="80" text-anchor="middle" class="sub">Большая годовая амплитуда / Large annual temperature range</text>
