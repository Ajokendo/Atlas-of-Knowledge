<polyline class="temp" points="24,231.6655 71,223.99880000000002 118,208.66540000000003 165,185.6653 212,154.99850000000004 259,131.9984 306,116.66500000000002 353,116.66500000000002 400,139.6651 447,170.33190000000002 494,200.99870000000004 541,223.99880000000002"/>
