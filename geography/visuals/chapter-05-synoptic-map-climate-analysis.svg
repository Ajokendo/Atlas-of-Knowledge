<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Синоптическая карта и климатический анализ / Synoptic map and climate analysis</title>
<desc id="desc">Двуязычная учебная схема с условными центрами низкого и высокого давления, замкнутыми изобарами через 4 гектопаскаля, холодным и тёплым фронтами, станционными моделями и двумя синтетическими климатограммами. Не является реальной картой погоды. / Bilingual teaching schematic with synthetic low- and high-pressure centres, closed isobars at 4 hPa intervals, cold and warm fronts, station plots and two synthetic climate graphs. Not an actual weather map.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1D2D3A}.title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#465C6D}.panelTitle{font-size:21px;font-weight:700}.small{font-size:13px;fill:#435A6B}.tick{font-size:12px;fill:#526779}.month{font-size:10.5px;fill:#435A6B}.axis{font-size:12px;font-weight:600;fill:#435A6B}.iso{fill:none;stroke:#567B99;stroke-width:2.4}.isotext{font-size:15px;font-weight:700;fill:#345C78}.grid{stroke:#DCE5EB;stroke-width:1}.cold{fill:none;stroke:#2877B8;stroke-width:6;stroke-linecap:round}.warm{fill:none;stroke:#C94F4F;stroke-width:6;stroke-linecap:round}.station{fill:white;stroke:#1D2D3A;stroke-width:2.4}.stxt{font-size:14px;font-weight:700}.wind{stroke:#1D2D3A;stroke-width:2.4;stroke-linecap:round}
</style>
<rect width="1400" height="1080" fill="#F3F7FA"/>
<text x="40" y="48" class="title">5.18-A. Синоптическая карта и климатический анализ / Synoptic Map and Climate Analysis</text>
<text x="42" y="78" class="sub">Все значения условные. Не использовать для оценки реальной погоды или предупреждений. / All values are synthetic. Not for real-weather assessment or warnings.</text>
<rect x="36" y="102" width="1328" height="570" rx="20" fill="#fff" stroke="#A9BAC8" stroke-width="2"/>
<text x="62" y="140" class="panelTitle">Схематическая синоптическая карта / Schematic synoptic chart</text>
<text x="62" y="164" class="small">Условная схема для Северного полушария; географической привязки нет / Northern Hemisphere teaching schematic; no geographic location</text>
<rect x="58" y="180" width="1284" height="450" rx="12" fill="#F8FBFD" stroke="#D5E1E8"/><text x="1292" y="215" class="panelTitle" text-anchor="middle">N</text><path d="M1292 222 L1292 250 M1283 233 L1292 222 L1301 233" fill="none" stroke="#345C78" stroke-width="3"/>
<!-- Low: pressure rises outward -->
<ellipse class="iso" cx="410" cy="390" rx="230" ry="175"/><ellipse class="iso" cx="410" cy="390" rx="178" ry="132"/><ellipse class="iso" cx="410" cy="390" rx="126" ry="91"/>
<text class="isotext" x="204" y="292">1012</text><text class="isotext" x="260" y="324">1008</text><text class="isotext" x="326" y="354">1004</text><text class="isotext" x="410" y="394" text-anchor="middle">1000</text><text x="410" y="420" text-anchor="middle" class="small">L — циклон / Low</text>
<!-- High: pressure falls outward -->
<ellipse class="iso" cx="1000" cy="350" rx="220" ry="160"/><ellipse class="iso" cx="1000" cy="350" rx="165" ry="118"/><ellipse class="iso" cx="1000" cy="350" rx="112" ry="78"/>
<text class="isotext" x="1185" y="270">1020</text><text class="isotext" x="1130" y="302">1024</text><text class="isotext" x="1060" y="333">1028</text><text class="isotext" x="1000" y="354" text-anchor="middle">1032</text><text x="1000" y="380" text-anchor="middle" class="small">H — антициклон / High</text>
<!-- Cold front: triangles point SE -->
<path class="cold" d="M 360 410 C 315 450, 260 500, 205 565"/><polygon points="312,443 328,457 308,464" fill="#2877B8"/><polygon points="262,493 278,507 258,514" fill="#2877B8"/><polygon points="217,538 233,552 213,559" fill="#2877B8"/>
<!-- Warm front: semicircles -->
<path class="warm" d="M 475 330 C 570 305, 665 285, 780 270"/><path d="M 535 312 A 12 12 0 0 1 559 308 M 615 296 A 12 12 0 0 1 639 292 M 695 279 A 12 12 0 0 1 719 275" fill="none" stroke="#C94F4F" stroke-width="5"/>
<!-- Simplified station plots -->
<g transform="translate(210 220)"><circle class="station" r="15"/><text class="stxt" x="-42" y="-18">18</text><text class="stxt" x="-42" y="31">12</text><text class="stxt" x="22" y="-18">142</text><line class="wind" x1="0" y1="0" x2="30" y2="-28"/></g>
<g transform="translate(680 455)"><circle class="station" r="15"/><text class="stxt" x="-42" y="-18">11</text><text class="stxt" x="-42" y="31">8</text><text class="stxt" x="22" y="-18">118</text><line class="wind" x1="0" y1="0" x2="-28" y2="24"/></g>
<g transform="translate(1190 470)"><circle class="station" r="15"/><text class="stxt" x="-42" y="-18">25</text><text class="stxt" x="-42" y="31">17</text><text class="stxt" x="22" y="-18">208</text><line class="wind" x1="0" y1="0" x2="28" y2="-28"/></g>
<g transform="translate(76 590)"><line x1="0" y1="0" x2="42" y2="0" class="cold"/><polygon points="16,-8 31,0 16,8" fill="#2877B8"/><text x="52" y="5" class="small">Холодный фронт / Cold front</text><line x1="270" y1="0" x2="312" y2="0" class="warm"/><path d="M 280 0 A 10 10 0 0 1 300 0" fill="none" stroke="#C94F4F" stroke-width="4"/><text x="322" y="5" class="small">Тёплый фронт / Warm front</text><line x1="570" y1="0" x2="612" y2="0" class="iso"/><text x="622" y="5" class="small">Изобара / Isobar (hPa)</text><circle cx="930" cy="0" r="10" class="station"/><text x="950" y="5" class="small">Станционная модель / Station plot</text></g>
<text x="76" y="618" class="small">Станционная модель: температура (слева сверху), точка росы (слева снизу), код давления (справа сверху), линия показывает направление, откуда дует ветер. / Station plot: temperature (upper left), dew point (lower left), coded pressure (upper right); the staff points from the direction the wind comes.</text>
