<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Вертикальное строение атмосферы / Vertical structure of the atmosphere</title>
<desc id="desc">Оригинальная двуязычная схема пяти основных слоёв атмосферы, ориентировочных высот переходных границ, озонового слоя, области ионосферы и условной линии Кармана на высоте 100 километров. Масштаб условный, высоты меняются. / Original bilingual diagram of the five main atmospheric layers, approximate transition boundaries, ozone layer, overlapping ionosphere region and conventional Karman line at 100 kilometres. Not to scale; altitudes vary.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#203241}
.title{font-size:30px;font-weight:700}
.subtitle{font-size:16px;fill:#526777}
.layer{font-size:23px;font-weight:700}
.range{font-size:16px;font-weight:700}
.body{font-size:15px}
.small{font-size:13px;fill:#526777}
.boundary{font-size:14px;font-weight:700;fill:#41596B}
.axis{font-size:14px;font-weight:700;fill:#41596B}
.note{font-size:14px}
</style>
<rect width="1400" height="900" fill="#F5F8FA"/>
<text x="48" y="52" class="title">5.2-A. Вертикальное строение атмосферы / Vertical Structure of the Atmosphere</text>
<text x="50" y="82" class="subtitle">Схема не в масштабе: высоты границ меняются с широтой, сезоном и состоянием атмосферы. / Schematic, not to scale: boundary altitudes vary with latitude, season and atmospheric conditions.</text>

<!-- Altitude axis -->
<line x1="112" y1="180" x2="112" y2="790" stroke="#5C7181" stroke-width="3"/>
<path d="M102 196 L112 178 L122 196" fill="none" stroke="#5C7181" stroke-width="3"/>
<text x="68" y="164" class="axis">ВЫСОТА / ALTITUDE</text>
<g stroke="#5C7181" stroke-width="2">
<line x1="102" y1="790" x2="122" y2="790"/><line x1="102" y1="670" x2="122" y2="670"/>
<line x1="102" y1="540" x2="122" y2="540"/><line x1="102" y1="440" x2="122" y2="440"/>
<line x1="102" y1="290" x2="122" y2="290"/><line x1="102" y1="180" x2="122" y2="180"/>
</g>
<g class="boundary" text-anchor="end">
<text x="92" y="795">0 km</text><text x="92" y="675">≈ 8–18 km</text>
<text x="92" y="545">≈ 50 km</text><text x="92" y="445">≈ 85 km</text>
<text x="92" y="295">≈ 600 km</text><text x="92" y="185">≈ 10 000 km</text>
</g>

<!-- Layer bands -->
<rect x="150" y="180" width="620" height="110" rx="12" fill="#E5E9ED" stroke="#AAB7C1" stroke-width="2"/>
<rect x="150" y="290" width="620" height="150" rx="12" fill="#FCE7C8" stroke="#D9B47C" stroke-width="2"/>
<rect x="150" y="440" width="620" height="100" rx="12" fill="#DDECF2" stroke="#9ABBC9" stroke-width="2"/>
<rect x="150" y="540" width="620" height="130" rx="12" fill="#E7E1F3" stroke="#B8A9D3" stroke-width="2"/>
<rect x="150" y="670" width="620" height="120" rx="12" fill="#DCEBF5" stroke="#8CB4D0" stroke-width="2"/>

<!-- Exosphere -->
<text x="180" y="218" class="layer">Экзосфера / Exosphere</text>
<text x="180" y="245" class="range">≈ 600–10 000 km</text>
<text x="180" y="270" class="body">Переход к космическому пространству; часть атомов и молекул уходит в космос. / Gradual transition to space; some atoms and molecules escape.</text>

<!-- Thermosphere -->
<text x="180" y="326" class="layer">Термосфера / Thermosphere</text>
<text x="180" y="352" class="range">≈ 85–600 km</text>
<text x="180" y="378" class="body">Поглощение высокоэнергетического УФ- и рентгеновского излучения; температура растёт. / Absorbs high-energy UV and X-rays; temperature increases.</text>
<text x="180" y="410" class="body">Полярные сияния / Auroras</text>

<!-- Karman line -->
<line x1="150" y1="420" x2="770" y2="420" stroke="#B34D3F" stroke-width="3" stroke-dasharray="10 7"/>
<rect x="486" y="397" width="274" height="25" rx="8" fill="#FFF7F4" stroke="#B34D3F"/>
<text x="623" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3D34">Линия Кармана / Kármán line — 100 km</text>

<!-- Mesosphere -->
<text x="180" y="475" class="layer">Мезосфера / Mesosphere</text>
<text x="180" y="501" class="range">≈ 50–85 km</text>
<text x="180" y="524" class="body">Многие метеоры разрушаются / Many meteors ablate</text>

<!-- Stratosphere -->
<text x="180" y="575" class="layer">Стратосфера / Stratosphere</text>
<text x="180" y="601" class="range">От тропопаузы до ≈ 50 km / From tropopause to ≈ 50 km</text>
<rect x="470" y="615" width="255" height="37" rx="8" fill="#F4C9A7" stroke="#C88C5D"/>
<text x="597" y="639" text-anchor="middle" class="body">Озоновый слой / Ozone layer</text>
<text x="180" y="646" class="small">Температура обычно растёт с высотой / Temperature generally increases with altitude</text>

<!-- Troposphere -->
<text x="180" y="710" class="layer">Тропосфера / Troposphere</text>
<text x="180" y="737" class="range">От поверхности до ≈ 8–18 km / Surface to ≈ 8–18 km</text>
<text x="180" y="763" class="body">Почти вся погода и большая часть водяного пара / Nearly all weather and most water vapour</text>
<path d="M150 790 Q250 775 350 790 T550 790 T770 790" fill="none" stroke="#527C9A" stroke-width="5"/>

<!-- Boundary labels -->
<g class="boundary">
<text x="790" y="294">Термопауза / Thermopause</text>
<text x="790" y="444">Мезопауза / Mesopause</text>
<text x="790" y="544">Стратопауза / Stratopause</text>
<text x="790" y="674">Тропопауза / Tropopause</text>
</g>

<!-- Ionosphere overlap bracket -->
<path d="M1110 310 h24 M1122 310 v110 M1110 420 h24" fill="none" stroke="#6D6BA8" stroke-width="3" stroke-dasharray="7 5"/>
<text x="1150" y="365" class="layer" font-size="19">Ионосфера /</text>
<text x="1150" y="390" class="layer" font-size="19">Ionosphere</text>
<text x="1150" y="420" class="small">≈ 60–300 km; находится</text>
<text x="1150" y="440" class="small">в термосфере; её</text>
<text x="1150" y="460" class="small">плотность меняется днём и ночью. /</text>
<text x="1150" y="480" class="small">Within the</text>
<text x="1150" y="500" class="small">thermosphere;</text>
<text x="1150" y="520" class="small">ionisation varies between day and night.</text>

<!-- Temperature trend -->
<rect x="820" y="585" width="530" height="205" rx="16" fill="#FFFFFF" stroke="#C6D2DA" stroke-width="2"/>
<text x="845" y="620" class="layer" font-size="19">Изменение температуры / Temperature trend</text>
<text x="850" y="658" class="body">Тропосфера / Troposphere</text><text x="1305" y="658" text-anchor="end" font-size="20" font-weight="700" fill="#2876A6">↓</text>
<text x="850" y="688" class="body">Стратосфера / Stratosphere</text><text x="1305" y="688" text-anchor="end" font-size="20" font-weight="700" fill="#B45E3B">↑</text>
<text x="850" y="718" class="body">Мезосфера / Mesosphere</text><text x="1305" y="718" text-anchor="end" font-size="20" font-weight="700" fill="#2876A6">↓</text>
<text x="850" y="748" class="body">Термосфера / Thermosphere</text><text x="1305" y="748" text-anchor="end" font-size="20" font-weight="700" fill="#B45E3B">↑</text>
<text x="850" y="775" class="small">Экзосфера: крайне разреженный газ; простая температурная стрелка здесь не показана. / Exosphere: extremely thin gas; no simple temperature arrow shown.</text>

<text x="700" y="855" text-anchor="middle" class="small">Границы приблизительны; ионосфера — область ионизированного газа внутри термосферы, её плотность меняется между днём и ночью. Линия Кармана — условная граница, а не физическая стенка. / Boundaries are approximate; the ionosphere is an ionised region within the thermosphere, and its density changes between day and night. The Kármán line is a convention, not a physical wall.</text>
</svg>