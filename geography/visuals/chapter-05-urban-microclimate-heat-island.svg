<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Микроклимат и городской остров тепла / Microclimates and the Urban Heat Island</title>
<desc id="desc">Двуязычный концептуальный поперечный разрез от сельской местности через пригород к плотной городской застройке и зелёному коридору. Иллюстрируются затенение, испарительное охлаждение, накопление тепла покрытиями и зданиями, ограничение вентиляции и выделение антропогенного тепла. Показан качественный, не измеренный профиль температуры; эффект зависит от погоды, времени суток и городской формы. / Bilingual conceptual cross-section from rural land through suburbs to dense urban blocks and a green corridor. It illustrates shade, evaporative cooling, heat storage by built surfaces, restricted ventilation and anthropogenic heat. The temperature profile is qualitative, not measured; the effect depends on weather, time of day and urban form.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#203342}.h{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#526879}.pt{font-size:19px;font-weight:700}.lab{font-size:15px;fill:#40596B}.small{font-size:13px;fill:#526879}.ground{fill:#D9C9A5;stroke:#9B8A68;stroke-width:2}.green{fill:#79A879;stroke:#4F8058;stroke-width:2}.building{fill:#9EAFBC;stroke:#526879;stroke-width:2}.road{fill:#657583}.heat{fill:none;stroke:#D87543;stroke-width:5;stroke-linecap:round}.cool{fill:none;stroke:#3C91B8;stroke-width:5;stroke-linecap:round}.dash{stroke-dasharray:8 8}
</style>
<rect width="1400" height="900" fill="#F3F7FA"/>
<text x="45" y="52" class="h">5.13-A. Микроклимат и городской остров тепла / Microclimates and the Urban Heat Island</text>
<text x="48" y="82" class="sub">Условный разрез, без измеренной шкалы температуры / Conceptual cross-section; no measured temperature scale</text>
<rect x="38" y="110" width="1324" height="510" rx="20" fill="#fff" stroke="#A9BBC8" stroke-width="2"/>
<rect x="60" y="410" width="1280" height="165" fill="#E7E1D1"/>
<path class="ground" d="M60 410 L1340 410 L1340 575 L60 575 Z"/>
<!-- Rural -->
<path class="green" d="M80 410 Q120 365 160 410 Q200 355 240 410 Q280 370 320 410 Z"/>
<rect x="105" y="340" width="22" height="70" fill="#806A4D"/><circle cx="116" cy="325" r="43" class="green"/>
<rect x="260" y="350" width="18" height="60" fill="#806A4D"/><circle cx="269" cy="335" r="35" class="green"/>
<rect x="70" y="388" width="250" height="22" fill="#8FBF79"/>
<text x="190" y="470" class="pt" text-anchor="middle">Сельская зона / Rural</text>
<text x="190" y="495" class="lab" text-anchor="middle">Тень и испарение / Shade and evapotranspiration</text>
<!-- Suburb -->
<rect x="390" y="325" width="130" height="85" class="building"/><path d="M380 325 L455 275 L530 325 Z" fill="#7B8E9D" stroke="#526879" stroke-width="2"/>
<rect x="545" y="355" width="105" height="55" class="building"/><path d="M535 355 L598 315 L660 355 Z" fill="#7B8E9D" stroke="#526879" stroke-width="2"/>
<rect x="350" y="400" width="340" height="10" fill="#8FBF79"/>
<text x="520" y="470" class="pt" text-anchor="middle">Пригород / Suburb</text>
<text x="520" y="495" class="lab" text-anchor="middle">Смешанная застройка / Mixed cover</text>
<!-- Dense urban -->
<rect x="740" y="250" width="125" height="160" class="building"/><rect x="880" y="190" width="150" height="220" class="building"/><rect x="1045" y="270" width="105" height="140" class="building"/>
<g fill="#EAF1F4" stroke="#526879" stroke-width="1.5"><rect x="758" y="270" width="22" height="24"/><rect x="810" y="270" width="22" height="24"/><rect x="758" y="315" width="22" height="24"/><rect x="810" y="315" width="22" height="24"/><rect x="902" y="215" width="24" height="25"/><rect x="950" y="215" width="24" height="25"/><rect x="902" y="260" width="24" height="25"/><rect x="950" y="260" width="24" height="25"/><rect x="902" y="305" width="24" height="25"/><rect x="950" y="305" width="24" height="25"/><rect x="1060" y="290" width="22" height="24"/><rect x="1110" y="290" width="22" height="24"/></g>
<rect x="700" y="410" width="490" height="28" class="road"/>
<text x="940" y="470" class="pt" text-anchor="middle">Плотный город / Dense city</text>
<text x="940" y="495" class="lab" text-anchor="middle">Теплоёмкие покрытия и застройка / Heat-storing surfaces and buildings</text>
<!-- Green corridor -->
<rect x="1210" y="390" width="115" height="20" fill="#8FBF79"/><rect x="1248" y="340" width="18" height="70" fill="#806A4D"/><circle cx="1257" cy="325" r="42" class="green"/>
<text x="1268" y="470" class="pt" text-anchor="middle">Зелёный коридор</text><text x="1268" y="495" class="lab" text-anchor="middle">Green corridor</text>
<!-- qualitative air temperature curve -->
<path d="M80 220 C250 220 330 218 430 205 S650 190 760 155 S1020 125 1130 165 S1260 205 1320 205" class="heat" fill="none"/>
<text x="700" y="135" class="lab" text-anchor="middle">Качественный профиль температуры воздуха / Qualitative air-temperature profile</text>
<text x="700" y="160" class="small" text-anchor="middle">Не измеренные значения; форма зависит от погоды и времени суток / Not measured values; shape varies with weather and time</text>
<!-- process arrows -->
<path d="M150 300 C150 260 165 240 190 225" class="cool" fill="none"/><path d="M300 300 C300 270 285 250 265 235" class="cool" fill="none"/>
<text x="180" y="285" class="small" text-anchor="middle">Охлаждение / Cooling</text>
<path d="M810 390 C800 345 810 320 835 300" class="heat" fill="none"/><path d="M960 390 C950 345 960 320 985 300" class="heat" fill="none"/>
<text x="890" y="365" class="small" text-anchor="middle">Накопление и отдача тепла / Heat storage and release</text>
<path d="M700 300 L700 245 M700 245 l-10 15 M700 245 l10 15" stroke="#526879" stroke-width="3" fill="none"/>
<text x="700" y="225" class="small" text-anchor="middle">Ограниченный воздухообмен / Reduced ventilation</text>
<path d="M1080 385 C1080 345 1100 330 1120 315" class="heat" fill="none"/>
<text x="1125" y="350" class="small">Антропогенное тепло /</text><text x="1125" y="370" class="small">Anthropogenic heat</text>
<!-- mitigation strip -->
<rect x="45" y="655" width="1310" height="190" rx="18" fill="#fff" stroke="#A9BBC8" stroke-width="2"/>
<text x="70" y="692" class="pt">Как уменьшать перегрев / Ways to reduce overheating</text>
<g><circle cx="140" cy="755" r="27" class="green"/><rect x="135" y="755" width="10" height="40" fill="#806A4D"/><text x="190" y="750" class="lab">Деревья и тень</text><text x="190" y="774" class="lab">Trees and shade</text></g>
<g><path d="M470 760 Q500 720 530 760 Q560 800 590 760" class="cool"/><text x="610" y="750" class="lab">Вода и испарение</text><text x="610" y="774" class="lab">Water and evaporation</text></g>
<g><rect x="850" y="730" width="55" height="35" fill="#DCE8EF" stroke="#526879" stroke-width="2"/><path d="M845 730 L910 730" stroke="#416D89" stroke-width="6"/><text x="925" y="750" class="lab">Отражающие покрытия</text><text x="925" y="774" class="lab">Reflective surfaces</text></g>
<g><path d="M1160 760 L1225 760 M1210 745 L1225 760 L1210 775" stroke="#3C91B8" stroke-width="4" fill="none"/><text x="1240" y="750" class="lab">Вентиляция</text><text x="1240" y="774" class="lab">Ventilation</text></g>
<text x="700" y="875" class="sub" text-anchor="middle">Эффект острова тепла различается днём и ночью; локальные измерения нужны для оценки конкретного города. / Heat-island intensity differs by day and night; local measurements are needed to assess a particular city.</text>
</svg>