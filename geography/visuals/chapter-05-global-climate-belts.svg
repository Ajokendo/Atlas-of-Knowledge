<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Global climate belts / Климатические пояса мира</title>
<desc id="desc">Bilingual conceptual diagram of latitudinal climate belts in both hemispheres, with curved boundaries and seasonal shifts. Not a precise boundary map.</desc>
<defs>
 <linearGradient id="ocean" x2="0" y2="1"><stop stop-color="#e9f3f8"/><stop offset="1" stop-color="#d8e9f1"/></linearGradient>
 <clipPath id="mapclip"><rect x="80" y="150" width="1040" height="430" rx="22"/></clipPath>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#ffffff" opacity=".55"/></pattern>
</defs>
<rect width="1200" height="760" fill="#fbfcfe"/>
<text x="600" y="55" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#17324d">Климатические пояса мира</text>
<text x="600" y="91" font-family="Arial,sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#315b75">Global Climate Belts</text>
<text x="600" y="124" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">Широтная модель: пояса не образуют идеальные параллельные полосы / A latitudinal model: belts are not perfect parallel bands</text>
<g clip-path="url(#mapclip)">
 <rect x="80" y="150" width="1040" height="430" fill="url(#ocean)"/>
