  <path d="M80 207 C230 193 350 230 470 212 S690 190 800 205 S1000 194 1120 207"/>
  <path d="M80 270 C220 247 350 286 470 268 S680 248 800 260 S1000 247 1120 265"/>
  <path d="M80 350 C220 331 350 370 470 352 S680 330 800 345 S1000 333 1120 350"/>
