<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Global climate belts / Климатические пояса мира</title>
<desc id="desc">Bilingual conceptual diagram showing seven broad climatic belts in each hemisphere: polar, subpolar, temperate, subtropical, tropical and subequatorial, with one equatorial belt; boundaries are schematic and seasonally shifting.</desc>
<defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#e7f1f7"/><stop offset="1" stop-color="#d5e6ef"/></linearGradient><clipPath id="clip"><rect x="80" y="150" width="1040" height="430" rx="22"/></clipPath><pattern id="texture" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#fff" opacity=".45"/></pattern></defs>
