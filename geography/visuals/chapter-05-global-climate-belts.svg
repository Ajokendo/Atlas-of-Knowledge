 <path d="M80 350 C220 331 350 370 470 352 S680 330 800 345 S1000 333 1120 350 L1120 430 C1000 414 900 442 800 425 S580 412 470 432 S220 412 80 430Z" fill="#f0d99c"/>
 <path d="M80 430 C220 412 350 450 470 432 S680 412 800 425 S1000 414 1120 430 L1120 490 C1000 474 900 500 800 485 S580 470 470 492 S220 470 80 490Z" fill="#e9b98e"/>
 <path d="M80 490 C220 470 350 510 470 492 S680 470 800 485 S1000 474 1120 490 L1120 580 H80Z" fill="#9fc2dc"/>
 <rect x="80" y="150" width="1040" height="430" fill="url(#dots)"/>
