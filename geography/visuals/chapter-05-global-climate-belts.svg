<text x="600" y="91" font-family="Arial,sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#315b75">Global Climate Belts</text>
<text x="600" y="124" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">Условная широтная модель обоих полушарий / Conceptual latitudinal model of both hemispheres</text>
