<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Global climate belts / Климатические пояса мира</title>
<desc id="desc">Bilingual conceptual diagram showing mirrored latitudinal climate belts from the North Pole through the Equator to the South Pole, with schematic curved boundaries and seasonal shifts.</desc>
