  <path d="M80 490 C220 470 350 510 470 492 S680 470 800 485 S1000 474 1120 490"/>
 </g>
 <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">
  <text x="600" y="181">ПОЛЯРНЫЙ / POLAR</text>
  <text x="600" y="245">СУБПОЛЯРНЫЙ / SUBPOLAR</text>
  <text x="600" y="315">УМЕРЕННЫЙ / TEMPERATE</text>
  <text x="600" y="398">СУБТРОПИЧЕСКИЙ / SUBTROPICAL</text>
  <text x="600" y="466">ТРОПИЧЕСКИЙ / TROPICAL</text>
  <text x="600" y="545">ЭКВАТОРИАЛЬНЫЙ / EQUATORIAL</text>
 </g>
 <path d="M80 365 C260 348 380 382 520 365 S790 345 920 365 S1040 355 1120 365" fill="none" stroke="#fff" stroke-width="3"/>
 <text x="1040" y="389" font-family="Arial,sans-serif" font-size="15" fill="#17324d">0° экватор / Equator</text>
</g>
<rect x="80" y="150" width="1040" height="430" rx="22" fill="none" stroke="#56758a" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#334e62" font-size="15">
 <text x="80" y="610">90° с.ш. / N</text><text x="80" y="636">Северное полушарие / Northern Hemisphere</text>
 <text x="1120" y="610" text-anchor="end">90° ю.ш. / S</text><text x="1120" y="636" text-anchor="end">Южное полушарие / Southern Hemisphere</text>
</g>
<rect x="80" y="660" width="1040" height="62" rx="12" fill="#edf2f6"/>
<text x="100" y="686" font-family="Arial,sans-serif" font-size="15" fill="#17324d">Границы условны и меняются по сезонам; океаны, рельеф и циркуляция создают региональные отклонения.</text>
<text x="100" y="709" font-family="Arial,sans-serif" font-size="15" fill="#17324d">Boundaries are schematic and shift seasonally; oceans, relief and circulation create regional departures.</text>
</svg>