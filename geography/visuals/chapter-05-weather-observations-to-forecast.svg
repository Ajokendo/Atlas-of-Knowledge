<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">From weather observations to forecast / От наблюдений к прогнозу погоды</title>
<desc id="desc">Bilingual educational flow diagram showing observing systems, quality control, data assimilation, numerical prediction, forecaster interpretation, forecast products and verification.</desc>
<defs>
 <style>
 .bg{fill:#f7fafc}.panel{fill:#fff;stroke:#31536b;stroke-width:2.5}.head{fill:#173e59}.headtxt{font:700 25px Arial,sans-serif;fill:#fff}.h1{font:700 31px Arial,sans-serif;fill:#173e59}.sub{font:20px Arial,sans-serif;fill:#29485d}.txt{font:19px Arial,sans-serif;fill:#18384d}.small{font:16px Arial,sans-serif;fill:#38566a}.step{fill:#eaf3f8;stroke:#39718f;stroke-width:2}.gold{fill:#fff4d9;stroke:#a8751b;stroke-width:2}.green{fill:#e8f4ec;stroke:#4b8260;stroke-width:2}.purple{fill:#f0ecf8;stroke:#76619b;stroke-width:2}.arrow{stroke:#31536b;stroke-width:4;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 7}
 </style>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#31536b"/></marker>
</defs>
<rect class="bg" width="1400" height="980"/>
<text class="h1" x="700" y="48" text-anchor="middle">ОТ МЕТЕОРОЛОГИЧЕСКИХ НАБЛЮДЕНИЙ К ПРОГНОЗУ ПОГОДЫ</text>
<text class="h1" x="700" y="87" text-anchor="middle">FROM WEATHER OBSERVATIONS TO A FORECAST</text>
<text class="small" x="700" y="119" text-anchor="middle">A continuous cycle: observe → analyse → predict → communicate → verify</text>
<rect class="panel" x="55" y="155" width="1290" height="175" rx="18"/>
<rect class="head" x="55" y="155" width="1290" height="42" rx="16"/>
<text class="headtxt" x="700" y="184" text-anchor="middle">1. СИСТЕМЫ НАБЛЮДЕНИЙ / OBSERVING SYSTEMS</text>
<g class="txt" text-anchor="middle">
 <rect class="step" x="78" y="215" width="190" height="88" rx="12"/><text x="173" y="246">Наземные станции</text><text x="173" y="273">Surface stations</text>
 <rect class="step" x="292" y="215" width="190" height="88" rx="12"/><text x="387" y="246">Радиозонды</text><text x="387" y="273">Radiosondes</text>
 <rect class="step" x="506" y="215" width="190" height="88" rx="12"/><text x="601" y="246">Радар</text><text x="601" y="273">Radar</text>
 <rect class="step" x="720" y="215" width="190" height="88" rx="12"/><text x="815" y="246">Спутники</text><text x="815" y="273">Satellites</text>
 <rect class="step" x="934" y="215" width="190" height="88" rx="12"/><text x="1029" y="246">Суда и буи</text><text x="1029" y="273">Ships and buoys</text>
 <rect class="step" x="1148" y="215" width="174" height="88" rx="12"/><text x="1235" y="246">Авиация</text><text x="1235" y="273">Aircraft</text>
</g>
<path class="arrow" d="M700 331 V365"/>
<rect class="gold" x="370" y="372" width="660" height="92" rx="16"/>
<text class="txt" x="700" y="408" text-anchor="middle" font-weight="bold">2. Контроль качества данных / Quality control</text>
<text class="small" x="700" y="438" text-anchor="middle">Проверка единиц, времени, координат, пропусков и необычных значений</text>
<text class="small" x="700" y="457" text-anchor="middle">Check units, timing, location, missing values and anomalies</text>
<path class="arrow" d="M700 465 V497"/>
<rect class="purple" x="260" y="504" width="880" height="118" rx="16"/>
<text class="txt" x="700" y="540" text-anchor="middle" font-weight="bold">3. Усвоение данных / Data assimilation</text>
<text class="small" x="700" y="571" text-anchor="middle">Наблюдения + краткосрочный прогноз модели → наилучшая оценка текущего состояния атмосферы</text>
<text class="small" x="700" y="596" text-anchor="middle">Observations + model background → best estimate of the current atmospheric state</text>
<path class="arrow" d="M700 623 V654"/>
<rect class="step" x="370" y="661" width="660" height="94" rx="16"/>
<text class="txt" x="700" y="698" text-anchor="middle" font-weight="bold">4. Численный прогноз погоды / Numerical weather prediction</text>
<text class="small" x="700" y="727" text-anchor="middle">Компьютерная модель рассчитывает возможное развитие погоды</text>
<text class="small" x="700" y="748" text-anchor="middle">A computer model calculates the possible evolution of weather</text>
<path class="arrow" d="M700 756 V785"/>
<rect class="green" x="80" y="792" width="570" height="104" rx="16"/>
<text class="txt" x="365" y="827" text-anchor="middle" font-weight="bold">5. Прогнозист и ансамбль / Forecaster and ensemble</text>
<text class="small" x="365" y="856" text-anchor="middle">Сравнение сценариев, оценка неопределённости,</text>
<text class="small" x="365" y="878" text-anchor="middle">учёт рельефа и местных условий / local conditions</text>
<rect class="green" x="750" y="792" width="570" height="104" rx="16"/>
<text class="txt" x="1035" y="827" text-anchor="middle" font-weight="bold">6. Продукты и предупреждения / Products and warnings</text>
<text class="small" x="1035" y="856" text-anchor="middle">Прогноз температуры, ветра, осадков и опасных явлений</text>
<text class="small" x="1035" y="878" text-anchor="middle">Temperature, wind, precipitation and hazard forecasts</text>
<path class="arrow" d="M650 844 H738"/>
<path class="arrow dash" d="M1200 901 C1200 948 200 948 200 901"/>
<text class="small" x="700" y="944" text-anchor="middle">7. Проверка: прогноз сравнивают с фактическими наблюдениями / Verification: compare forecasts with observations</text>
<text class="small" x="700" y="970" text-anchor="middle">Неопределённость обычно растёт с увеличением срока прогноза / Uncertainty generally grows with forecast lead time</text>
</svg>