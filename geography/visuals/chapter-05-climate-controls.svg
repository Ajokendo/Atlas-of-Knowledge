<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Климатообразующие факторы / Climate controls</title>
<desc id="desc">Двуязычная концептуальная схема восьми взаимодействующих климатообразующих факторов: широты и солнечной радиации, высоты, суши и океана, океанических течений, атмосферной циркуляции, рельефа и экспозиции, снежно-ледового покрова и растительности, а также антропогенных изменений состава атмосферы и землепользования. Ни один фактор не действует изолированно. / Bilingual conceptual diagram of eight interacting climate controls: latitude and solar radiation, elevation, land and ocean distribution, ocean currents, atmospheric circulation, relief and slope aspect, snow/ice and vegetation, and human-driven atmospheric and land-use changes. No factor acts in isolation.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#203342}.h{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526879}.ct{font-size:20px;font-weight:700}.body{font-size:15px;fill:#40596B}.num{font-size:20px;font-weight:700;fill:#fff}.box{fill:#fff;stroke:#A9BBC8;stroke-width:2}.link{stroke:#7B9AAF;stroke-width:3;fill:none}.core{fill:#E8F1F6;stroke:#416D89;stroke-width:3}
</style>
<rect width="1400" height="900" fill="#F3F7FA"/>
<text x="48" y="52" class="h">5.10-A. Климатообразующие факторы / Climate Controls</text>
<text x="50" y="82" class="sub">Климат — результат взаимодействия факторов, а не действия одной причины / Climate reflects interacting controls, not a single cause</text>
<path class="link" d="M700 450 L350 235 M700 450 L1050 235 M700 450 L350 665 M700 450 L1050 665 M700 450 L700 170 M700 450 L700 740 M700 450 L190 450 M700 450 L1210 450"/>
<rect x="535" y="365" width="330" height="170" rx="24" class="core"/>
<text x="700" y="415" class="ct" text-anchor="middle">КЛИМАТ МЕСТНОСТИ</text>
<text x="700" y="447" class="ct" text-anchor="middle">LOCAL CLIMATE</text>
<text x="700" y="482" class="body" text-anchor="middle">Температура • осадки • сезонность</text>
<text x="700" y="507" class="body" text-anchor="middle">Temperature • precipitation • seasonality</text>
<g><rect x="45" y="130" width="390" height="170" rx="18" class="box"/><circle cx="82" cy="170" r="22" fill="#416D89"/><text x="82" y="177" class="num" text-anchor="middle">1</text><text x="118" y="174" class="ct">Широта и солнечная радиация</text><text x="118" y="200" class="ct">Latitude and solar radiation</text><text x="68" y="240" class="body">Угол падения и длительность освещения</text><text x="68" y="264" class="body">Sun angle and day length</text></g>
<g><rect x="965" y="130" width="390" height="170" rx="18" class="box"/><circle cx="1002" cy="170" r="22" fill="#416D89"/><text x="1002" y="177" class="num" text-anchor="middle">2</text><text x="1038" y="174" class="ct">Высота над уровнем моря</text><text x="1038" y="200" class="ct">Elevation above sea level</text><text x="988" y="240" class="body">Температура и фаза осадков меняются</text><text x="988" y="264" class="body">Temperature and precipitation phase vary</text></g>
<g><rect x="45" y="365" width="390" height="170" rx="18" class="box"/><circle cx="82" cy="405" r="22" fill="#416D89"/><text x="82" y="412" class="num" text-anchor="middle">3</text><text x="118" y="409" class="ct">Суша и океан</text><text x="118" y="435" class="ct">Land and ocean</text><text x="68" y="475" class="body">Вода медленнее нагревается и остывает</text><text x="68" y="499" class="body">Water warms and cools more slowly</text></g>
<g><rect x="965" y="365" width="390" height="170" rx="18" class="box"/><circle cx="1002" cy="405" r="22" fill="#416D89"/><text x="1002" y="412" class="num" text-anchor="middle">4</text><text x="1038" y="409" class="ct">Океанические течения</text><text x="1038" y="435" class="ct">Ocean currents</text><text x="988" y="475" class="body">Переносят тепло между широтами</text><text x="988" y="499" class="body">Redistribute heat across latitudes</text></g>
<g><rect x="45" y="600" width="390" height="170" rx="18" class="box"/><circle cx="82" cy="640" r="22" fill="#416D89"/><text x="82" y="647" class="num" text-anchor="middle">5</text><text x="118" y="644" class="ct">Атмосферная циркуляция</text><text x="118" y="670" class="ct">Atmospheric circulation</text><text x="68" y="710" class="body">Переносит воздушные массы и влагу</text><text x="68" y="734" class="body">Transports air masses and moisture</text></g>
<g><rect x="965" y="600" width="390" height="170" rx="18" class="box"/><circle cx="1002" cy="640" r="22" fill="#416D89"/><text x="1002" y="647" class="num" text-anchor="middle">6</text><text x="1038" y="644" class="ct">Рельеф и экспозиция склонов</text><text x="1038" y="670" class="ct">Relief and slope aspect</text><text x="988" y="710" class="body">Влияют на ветер, прогрев и осадки</text><text x="988" y="734" class="body">Affect wind, heating and precipitation</text></g>
<g><rect x="465" y="110" width="470" height="155" rx="18" class="box"/><circle cx="502" cy="150" r="22" fill="#416D89"/><text x="502" y="157" class="num" text-anchor="middle">7</text><text x="538" y="154" class="ct">Снег, лёд и растительность</text><text x="538" y="180" class="ct">Snow, ice and vegetation</text><text x="488" y="220" class="body">Меняют альбедо, затенение и испарение</text><text x="488" y="244" class="body">Change albedo, shade and evapotranspiration</text></g>
<g><rect x="465" y="650" width="470" height="155" rx="18" class="box"/><circle cx="502" cy="690" r="22" fill="#416D89"/><text x="502" y="697" class="num" text-anchor="middle">8</text><text x="538" y="694" class="ct">Деятельность человека</text><text x="538" y="720" class="ct">Human activity</text><text x="488" y="760" class="body">Меняет состав атмосферы и землепользование</text><text x="488" y="784" class="body">Changes atmospheric composition and land use</text></g>
<text x="700" y="860" class="sub" text-anchor="middle">Схема качественная: влияние факторов зависит от территории и их сочетания. / Qualitative model: effects depend on place and on how factors combine.</text>
</svg>