<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Как читать химическую формулу</title><desc id="d">В сульфате алюминия Al₂(SO₄)₃ индексы показывают число атомов, а индекс после скобок умножает всю группу. В записи 2H₂O коэффициент перед формулой умножает весь её состав.</desc><rect width="900" height="430" rx="24" fill="#f7faf7"/><text x="42" y="52" font-family="Arial" font-size="27" font-weight="700" fill="#164e3b">ЧТЕНИЕ ХИМИЧЕСКИХ ФОРМУЛ</text><rect x="45" y="92" width="810" height="150" rx="18" fill="#fff" stroke="#b7d8ca" stroke-width="2"/><text x="90" y="175" font-family="Arial" font-size="66" font-weight="700" fill="#173f33">Al₂(SO₄)₃</text><g font-family="Arial" font-size="18" fill="#245646"><path d="M147 185 L147 218 L80 218" stroke="#279477" stroke-width="2" fill="none"/><text x="80" y="235">₂ · атомов Al</text><path d="M285 185 L285 218 L250 218" stroke="#d39a3e" stroke-width="2" fill="none"/><text x="250" y="235">₄ · число атомов O</text><path d="M365 185 L365 218 L485 218" stroke="#277eae" stroke-width="2" fill="none"/><text x="485" y="235">₃ · умножает всю группу (SO₄)</text></g><rect x="45" y="275" width="390" height="100" rx="16" fill="#e4f2ec"/><text x="70" y="316" font-family="Arial" font-size="22" font-weight="700" fill="#164e3b">2H₂O</text><text x="70" y="348" font-family="Arial" font-size="18" fill="#45665b">2 × (2 H + 1 O)</text><text x="70" y="370" font-family="Arial" font-size="16" fill="#45665b">= 4 атома H + 2 атома O</text><rect x="465" y="275" width="390" height="100" rx="16" fill="#fff" stroke="#b7d8ca" stroke-width="2"/><text x="490" y="316" font-family="Arial" font-size="20" font-weight="700" fill="#164e3b">Коэффициент и индекс</text><text x="490" y="348" font-family="Arial" font-size="17" fill="#45665b">Индекс задаёт состав;</text><text x="490" y="371" font-family="Arial" font-size="17" fill="#45665b">коэффициент задаёт число формульных единиц.</text></svg>