<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Isotopes and weighted atomic mass</title><desc id="d">Carbon-12 and carbon-13 nuclei each have six protons but six or seven neutrons. Their natural abundances contribute to a weighted mean atomic mass.</desc><rect width="900" height="430" rx="24" fill="#f3faf7"/><text x="40" y="48" fill="#164e3b" font-family="Arial" font-size="25" font-weight="700">ISOTOPES · SAME PROTON NUMBER, DIFFERENT NEUTRONS</text><g font-family="Arial" text-anchor="middle"><g transform="translate(205 185)"><circle r="91" fill="#e1f1eb" stroke="#4d9b7c" stroke-width="3"/><g fill="#238b70"><circle cx="-24" cy="-22" r="17"/><circle cx="18" cy="-22" r="17"/><circle cx="-24" cy="19" r="17"/><circle cx="18" cy="19" r="17"/><circle cx="-3" cy="-1" r="17"/><circle cx="0" cy="49" r="17"/></g><g fill="#e0a64d"><circle cx="-3" cy="-47" r="17"/></g><text y="125" font-size="23" font-weight="700" fill="#183c31">¹²C · carbon-12</text><text y="153" font-size="17" fill="#45665b">6 p⁺ · 6 n⁰</text><text y="180" font-size="16" fill="#45665b">≈ 98.9% natural abundance</text></g><g transform="translate(470 185)"><circle r="91" fill="#e1f1eb" stroke="#4d9b7c" stroke-width="3"/><g fill="#238b70"><circle cx="-24" cy="-22" r="17"/><circle cx="18" cy="-22" r="17"/><circle cx="-24" cy="19" r="17"/><circle cx="18" cy="19" r="17"/><circle cx="-3" cy="-1" r="17"/><circle cx="0" cy="49" r="17"/></g><g fill="#e0a64d"><circle cx="-3" cy="-47" r="17"/><circle cx="42" cy="48" r="17"/></g><text y="125" font-size="23" font-weight="700" fill="#183c31">¹³C · carbon-13</text><text y="153" font-size="17" fill="#45665b">6 p⁺ · 7 n⁰</text><text y="180" font-size="16" fill="#45665b">≈ 1.1% natural abundance</text></g><g transform="translate(720 190)"><rect x="-130" y="-90" width="250" height="200" rx="18" fill="#fff" stroke="#9fcbb8" stroke-width="2"/><text y="-50" font-size="19" font-weight="700" fill="#164e3b">WEIGHTED MEAN</text><text y="-8" font-size="19" fill="#244d40">Aᵣ(C) = Σ xᵢmᵢ</text><text y="28" font-size="16" fill="#45665b">0.989 × 12 +</text><text y="52" font-size="16" fill="#45665b">0.011 × 13</text><text y="88" font-size="22" font-weight="700" fill="#14765a">≈ 12.011</text></g></g><text x="40" y="395" font-family="Arial" font-size="16" fill="#45665b">Schematic illustration · nucleus particle positions are not to scale</text></svg>