<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Isotopes and weighted atomic mass</title><desc id="d">Carbon-12 and carbon-13 each contain six protons. Carbon-12 has six neutrons and about 98.9 percent natural abundance; carbon-13 has seven neutrons and about 1.1 percent abundance. Their weighted mean atomic mass is approximately 12.011 unified atomic mass units. Schematic nuclei are not to scale.</desc><rect width="900" height="430" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="26" font-weight="700" fill="#164e3b">CARBON ISOTOPES</text><g font-family="Arial" text-anchor="middle"><g transform="translate(205 185)"><circle r="82" fill="#e2f0e9" stroke="#4d947a" stroke-width="3"/><circle fill="#238b70" cx="-28" cy="-25" r="12"/><circle fill="#238b70" cx="5" cy="-35" r="12"/><circle fill="#238b70" cx="32" cy="-5" r="12"/><circle fill="#238b70" cx="-30" cy="15" r="12"/><circle fill="#238b70" cx="0" cy="35" r="12"/><circle fill="#238b70" cx="31" cy="28" r="12"/><circle fill="#e0a64d" cx="-2" cy="-5" r="12"/><circle fill="#e0a64d" cx="0" cy="-62" r="12"/><circle fill="#e0a64d" cx="-57" cy="-35" r="12"/><circle fill="#e0a64d" cx="56" cy="0" r="12"/><circle fill="#e0a64d" cx="-55" cy="48" r="12"/><circle fill="#e0a64d" cx="55" cy="48" r="12"/><text y="120" font-size="22" font-weight="700" fill="#164e3b">¹²C · 6p + 6n</text><text y="148" font-size="17" fill="#45665b">≈ 98.9% natural abundance</text></g><g transform="translate(470 185)"><circle r="82" fill="#e2f0e9" stroke="#4d947a" stroke-width="3"/><circle fill="#238b70" cx="-28" cy="-25" r="12"/><circle fill="#238b70" cx="5" cy="-35" r="12"/><circle fill="#238b70" cx="32" cy="-5" r="12"/><circle fill="#238b70" cx="-30" cy="15" r="12"/><circle fill="#238b70" cx="0" cy="35" r="12"/><circle fill="#238b70" cx="31" cy="28" r="12"/><circle fill="#e0a64d" cx="-2" cy="-5" r="12"/><circle fill="#e0a64d" cx="0" cy="-62" r="12"/><circle fill="#e0a64d" cx="-57" cy="-35" r="12"/><circle fill="#e0a64d" cx="56" cy="0" r="12"/><circle fill="#e0a64d" cx="-55" cy="48" r="12"/><circle fill="#e0a64d" cx="55" cy="48" r="12"/><circle fill="#e0a64d" cx="0" cy="0" r="12"/><text y="120" font-size="22" font-weight="700" fill="#164e3b">¹³C · 6p + 7n</text><text y="148" font-size="17" fill="#45665b">≈ 1.1% natural abundance</text></g></g><text x="38" y="365" font-size="17" fill="#45665b">Weighted mean: 0.989 × 12 + 0.011 × 13 ≈ 12.011 u.</text><text x="38" y="395" font-size="16" fill="#45665b">Same proton number defines the element; neutron number distinguishes isotopes. Schematic; not to scale.</text></svg>