<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Isotopes and weighted atomic mass</title><desc id="d">Carbon-12 and carbon-13 each contain six protons. Carbon-12 has six neutrons and carbon-13 has seven. Their natural abundances determine the weighted mean atomic mass.</desc><rect width="900" height="430" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="26" font-weight="700" fill="#164e3b">CARBON ISOTOPES</text><g font-family="Arial" text-anchor="middle"><g transform="translate(230 190)"><circle r="82" fill="#e2f0e9" stroke="#4d947a" stroke-width="3"/><g fill="#238b70"><circle cx="-28" cy="-25" r="12"/><circle cx="5" cy="-35" r="12"/><circle cx="32" cy="-5" r="12"/><circle cx="-30" cy="15" r="12"/><circle cx="0" cy="35" r="12"/><circle cx="31" cy="28" r="12"/></g><g fill="#d69a42"><circle cx="-2" cy="-5" r="12"/><circle cx="0" cy="-62" r="12"/><circle cx="-57" cy="-35" r="12"/><circle cx="56" cy="0" r="12"/><circle cx="-55" cy="48" r="12"/><circle cx="55" cy="48" r="12"/></g><text y="120" font-size="22" font-weight="700" fill="#164e3b">¹²C · 6p + 6n</text></g><g transform="translate(650 190)"><circle r="82" fill="#e2f0e9" stroke="#4d947a" stroke-width="3"/><g fill="#238b70"><circle cx="-28" cy="-25" r="12"/><circle cx="5" cy="-35" r="12"/><circle cx="32" cy="-5" r="12"/><circle cx="-30" cy="15" r="12"/><circle cx="0" cy="35" r="12"/><circle cx="31" cy="28" r="12"/></g><g fill="#d69a42"><circle cx="-2" cy="-5" r="12"/><circle cx="0" cy="-62" r="12"/><circle cx="-57" cy="-35" r="12"/><circle cx="56" cy="0" r="12"/><circle cx="-55" cy="48" r="12"/><circle cx="55" cy="48" r="12"/><circle cx="0" cy="0" r="12"/></g><text y="120" font-size="22" font-weight="700" fill="#164e3b">¹³C · 6p + 7n</text></g></g><text x="38" y="385" font-size="18" fill="#45665b">Same proton number defines the element; neutron number distinguishes isotopes.</text></svg>