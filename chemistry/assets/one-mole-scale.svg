<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">One mole and molar mass</title><desc id="d">One mole always contains Avogadro's number of specified entities. For water, one mole has a mass of about 18.015 grams.</desc><rect width="900" height="420" rx="24" fill="#f3faf7"/><text x="42" y="52" font-family="Arial" font-size="27" font-weight="700" fill="#164e3b">ONE MOLE · A FIXED NUMBER OF ENTITIES</text><g transform="translate(215 220)"><circle r="105" fill="#e2f2ec" stroke="#4c9a7a" stroke-width="3"/><g fill="#269477"><circle cx="-42" cy="-30" r="11"/><circle cx="-5" cy="-48" r="11"/><circle cx="35" cy="-23" r="11"/><circle cx="-48" cy="15" r="11"/><circle cx="-8" cy="12" r="11"/><circle cx="35" cy="28" r="11"/><circle cx="4" cy="54" r="11"/></g><text y="145" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#164e3b">1 mol</text></g><g font-family="Arial"><text x="390" y="150" font-size="24" font-weight="700" fill="#164e3b">Nₐ = 6.022 140 76 × 10²³</text><text x="390" y="185" font-size="19" fill="#45665b">entities per mole (exactly)</text><path d="M390 210 H810" stroke="#9fcbb8" stroke-width="2"/><text x="390" y="255" font-size="20" font-weight="700" fill="#164e3b">WATER · H₂O</text><text x="390" y="291" font-size="19" fill="#45665b">Molar mass M ≈ 18.015 g mol⁻¹</text><rect x="390" y="315" width="390" height="54" rx="12" fill="#dcefe7"/><text x="585" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#146c52">1 mol H₂O ≈ 18.015 g</text></g><text x="42" y="395" font-family="Arial" font-size="16" fill="#45665b">The particle count is fixed; the mass depends on the substance.</text></svg>