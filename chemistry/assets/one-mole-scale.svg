<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">One mole and molar mass</title><desc id="d">One mole contains exactly 6.02214076 times 10 to the 23 specified entities. One mole of water has a molar mass of approximately 18.015 grams per mole.</desc><rect width="900" height="420" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">ONE MOLE · A COUNTING UNIT</text><circle cx="205" cy="215" r="112" fill="#e2f0e9" stroke="#4d947a" stroke-width="4"/><g fill="#238b70"><circle cx="160" cy="170" r="12"/><circle cx="210" cy="155" r="12"/><circle cx="250" cy="190" r="12"/><circle cx="165" cy="225" r="12"/><circle cx="215" cy="220" r="12"/><circle cx="250" cy="260" r="12"/><circle cx="190" cy="275" r="12"/></g><text x="205" y="365" text-anchor="middle" font-size="23" font-weight="700" fill="#164e3b">1 mol</text><g fill="#164e3b"><text x="390" y="150" font-size="27" font-weight="700">Nₐ = 6.022 140 76 × 10²³</text><text x="390" y="185" font-size="19">entities (exact value)</text><path d="M390 215 H830" stroke="#9fcbb8" stroke-width="2"/><text x="390" y="265" font-size="23" font-weight="700">WATER · H₂O</text><text x="390" y="305" font-size="20">M ≈ 18.015 g mol⁻¹</text><text x="390" y="345" font-size="17">The mass depends on the substance.</text></g></svg>