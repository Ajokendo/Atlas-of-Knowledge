<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Common organic functional groups</title><desc id="d">Generic structures of alkenes, alcohols, aldehydes, ketones, carboxylic acids, amines, esters, ethers and arenes, with their characteristic groups highlighted.</desc><rect width="1000" height="520" rx="24" fill="#f7faf7"/><text x="38" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#164e3b">COMMON ORGANIC FUNCTIONAL GROUPS</text><g font-family="Arial"><g fill="#fff" stroke="#b7d8ca" stroke-width="2"><rect x="35" y="82" width="295" height="112" rx="14"/><rect x="352" y="82" width="295" height="112" rx="14"/><rect x="669" y="82" width="295" height="112" rx="14"/><rect x="35" y="211" width="295" height="112" rx="14"/><rect x="352" y="211" width="295" height="112" rx="14"/><rect x="669" y="211" width="295" height="112" rx="14"/><rect x="35" y="340" width="295" height="112" rx="14"/><rect x="352" y="340" width="295" height="112" rx="14"/><rect x="669" y="340" width="295" height="112" rx="14"/></g><g fill="#164e3b" font-size="19" font-weight="700"><text x="55" y="116">Alkene</text><text x="372" y="116">Alcohol</text><text x="689" y="116">Aldehyde</text><text x="55" y="245">Ketone</text><text x="372" y="245">Carboxylic acid</text><text x="689" y="245">Amine</text><text x="55" y="374">Ester</text><text x="372" y="374">Ether</text><text x="689" y="374">Arene</text></g><g font-size="27" font-weight="700" fill="#238b70"><text x="55" y="158">R–CH=CH₂</text><text x="372" y="158">R–OH</text><text x="689" y="158">R–C(=O)H</text><text x="55" y="287">R–C(=O)–R′</text><text x="372" y="287">R–C(=O)OH</text><text x="689" y="287">R–NH₂</text><text x="55" y="416">R–C(=O)–O–R′</text><text x="372" y="416">R–O–R′</text><text x="689" y="416">Ar–H</text></g><g fill="#45665b" font-size="15"><text x="55" y="180">C=C</text><text x="372" y="180">hydroxy group</text><text x="689" y="180">–CHO</text><text x="55" y="309">carbonyl within chain</text><text x="372" y="309">carboxyl group</text><text x="689" y="309">amino group</text><text x="55" y="438">ester linkage</text><text x="372" y="438">C–O–C</text><text x="689" y="438">aromatic ring</text></g></g><text x="38" y="490" font-family="Arial" font-size="16" fill="#45665b">R and R′ represent carbon-containing groups; Ar represents an aromatic group.</text></svg>