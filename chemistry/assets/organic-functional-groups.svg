<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Common organic functional groups</title><desc id="d">Nine generic structural patterns: alkene C=C, alcohol R–OH, aldehyde R–CHO, ketone R–CO–R, carboxylic acid R–COOH, primary amine R–NH2, ester R–COO–R, ether R–O–R and arene Ar.</desc><rect width="1000" height="520" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">COMMON ORGANIC FUNCTIONAL GROUPS</text><g font-family="Arial"><g fill="#fff" stroke="#a9cdbd" stroke-width="2"><rect x="35" y="82" width="295" height="112" rx="14"/><rect x="352" y="82" width="295" height="112" rx="14"/><rect x="669" y="82" width="295" height="112" rx="14"/><rect x="35" y="211" width="295" height="112" rx="14"/><rect x="352" y="211" width="295" height="112" rx="14"/><rect x="669" y="211" width="295" height="112" rx="14"/><rect x="35" y="340" width="295" height="112" rx="14"/><rect x="352" y="340" width="295" height="112" rx="14"/><rect x="669" y="340" width="295" height="112" rx="14"/></g><g fill="#164e3b" font-size="19" font-weight="700"><text x="55" y="116">Alkene</text><text x="372" y="116">Alcohol</text><text x="689" y="116">Aldehyde</text><text x="55" y="245">Ketone</text><text x="372" y="245">Carboxylic acid</text><text x="689" y="245">Primary amine</text><text x="55" y="374">Ester</text><text x="372" y="374">Ether</text><text x="689" y="374">Arene</text></g><g fill="#287c68" font-size="26" font-weight="700"><text x="55" y="160">C=C</text><text x="372" y="160">R–OH</text><text x="689" y="160">R–CHO</text><text x="55" y="289">R–CO–R′</text><text x="372" y="289">R–COOH</text><text x="689" y="289">R–NH₂</text><text x="55" y="418">R–COO–R′</text><text x="372" y="418">R–O–R′</text><text x="689" y="418">Ar–H</text><g fill="#45665b" font-size="15"><text x="55" y="180">carbon–carbon double bond</text><text x="372" y="180">hydroxyl group</text><text x="689" y="180">–CHO group</text><text x="55" y="309">carbonyl group within a chain</text><text x="372" y="309">carboxyl group</text><text x="689" y="309">amino group</text><text x="55" y="438">ester linkage</text><text x="372" y="438">C–O–C linkage</text><text x="689" y="438">aromatic ring</text></g></g></g><text x="38" y="490" font-size="17" fill="#45665b">R and R′ represent carbon-containing groups; Ar represents an aromatic group.</text></svg>