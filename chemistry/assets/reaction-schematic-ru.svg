<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Перегруппировка атомов при химической реакции</title><desc id="d">Схема показывает перегруппировку атомов из исходных веществ в продукты: атомы сохраняются, а химические связи изменяются.</desc><rect width="900" height="300" rx="18" fill="#fbfbfa"/><g font-family="Inter,Arial" font-size="15" fill="#57575a" text-anchor="middle"><text x="170" y="35">ИСХОДНЫЕ ВЕЩЕСТВА</text><text x="730" y="35">ПРОДУКТЫ</text></g><g stroke="#8ca99e" stroke-width="7" stroke-linecap="round"><path d="M112 150L168 150M168 150L224 150M112 150L112 100"/><path d="M650 150L706 150M706 150L762 150M762 150L762 100"/></g><g><circle cx="112" cy="150" r="28" fill="#bd7059"/><circle cx="168" cy="150" r="22" fill="#7caeb5"/><circle cx="224" cy="150" r="28" fill="#bd7059"/><circle cx="112" cy="100" r="17" fill="#7caeb5"/><circle cx="650" cy="150" r="28" fill="#bd7059"/><circle cx="706" cy="150" r="22" fill="#7caeb5"/><circle cx="762" cy="150" r="28" fill="#bd7059"/><circle cx="650" cy="100" r="17" fill="#7caeb5"/></g><g stroke="#39836f" stroke-width="3" fill="none" stroke-linecap="round"><path d="M350 150H540"/><path d="M520 132L542 150L520 168"/></g><g fill="#66666b" font-family="Inter,Arial" font-size="12" text-anchor="middle"><text x="445" y="126">связи разрываются</text><text x="445" y="190">образуются новые связи</text></g></svg>