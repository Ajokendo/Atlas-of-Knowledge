<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Atom rearrangement in a chemical reaction</title><desc id="desc">Schematic: bonds in the reactants A–B and C–D break and new bonds form in A–C and B–D; the atoms are conserved.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:26px;font-weight:700}.s{font-size:19px}.c{font-size:20px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2f7d5a"/></marker></defs><rect width="900" height="300" fill="#fbfcfe"/><text x="150" y="40" text-anchor="middle" class="t">REACTANTS</text><text x="750" y="40" text-anchor="middle" class="t">PRODUCTS</text><line x1="70" y1="120" x2="140" y2="120" stroke="#7f8c8d" stroke-width="8"/><circle cx="70" cy="120" r="30" fill="#c0674f"/><circle cx="140" cy="120" r="30" fill="#4f9aa6"/><text x="70" y="126" text-anchor="middle" class="c" style="fill:#fff">A</text><text x="140" y="126" text-anchor="middle" class="c" style="fill:#fff">B</text><line x1="70" y1="220" x2="140" y2="220" stroke="#7f8c8d" stroke-width="8"/><circle cx="70" cy="220" r="30" fill="#c0674f"/><circle cx="140" cy="220" r="30" fill="#4f9aa6"/><text x="70" y="226" text-anchor="middle" class="c" style="fill:#fff">C</text><text x="140" y="226" text-anchor="middle" class="c" style="fill:#fff">D</text><text x="205" y="125" class="s">+</text><line x1="670" y1="120" x2="740" y2="120" stroke="#7f8c8d" stroke-width="8"/><circle cx="670" cy="120" r="30" fill="#c0674f"/><circle cx="740" cy="120" r="30" fill="#c0674f"/><text x="670" y="126" text-anchor="middle" class="c" style="fill:#fff">A</text><text x="740" y="126" text-anchor="middle" class="c" style="fill:#fff">C</text><line x1="670" y1="220" x2="740" y2="220" stroke="#7f8c8d" stroke-width="8"/><circle cx="670" cy="220" r="30" fill="#4f9aa6"/><circle cx="740" cy="220" r="30" fill="#4f9aa6"/><text x="670" y="226" text-anchor="middle" class="c" style="fill:#fff">B</text><text x="740" y="226" text-anchor="middle" class="c" style="fill:#fff">D</text><path d="M290 170L610 170" stroke="#2f7d5a" stroke-width="6" fill="none" marker-end="url(#a)"/><text x="450" y="150" text-anchor="middle" class="s">old bonds break</text><text x="450" y="205" text-anchor="middle" class="s">new bonds form</text><text x="450" y="285" text-anchor="middle" class="s">The same atoms (A, B, C, D) appear before and after.</text></svg>