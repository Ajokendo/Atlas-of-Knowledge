<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Acid base neutralisation</title><desc id="d">Hydronium donates a proton to hydroxide in the net ionic reaction H3O plus plus OH minus yields two water molecules. The ideal strong acid strong base titration curve has equivalence near pH 7 at 25 degrees Celsius.</desc><rect width="960" height="460" rx="24" fill="#f7faf7"/><text x="42" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#164e3b">NEUTRALISATION · PROTON TRANSFER</text><rect x="45" y="82" width="870" height="125" rx="18" fill="#fff" stroke="#b7d8ca" stroke-width="2"/><g font-family="Arial" text-anchor="middle"><text x="180" y="145" font-size="34" font-weight="700" fill="#b75c54">H₃O⁺</text><text x="330" y="145" font-size="32" fill="#45665b">+</text><text x="455" y="145" font-size="34" font-weight="700" fill="#277eae">OH⁻</text><text x="575" y="145" font-size="32" fill="#45665b">→</text><text x="750" y="145" font-size="34" font-weight="700" fill="#168366">2H₂O</text><text x="180" y="178" font-size="16" fill="#45665b">proton donor</text><text x="455" y="178" font-size="16" fill="#45665b">proton acceptor</text><text x="750" y="178" font-size="16" fill="#45665b">water formed</text></g><g transform="translate(95 245)" font-family="Arial"><path d="M0 0 V150 H370" fill="none" stroke="#45665b" stroke-width="2"/><path d="M20 132 C90 132 120 130 145 112 C160 100 164 75 185 75 C206 75 210 50 225 35 C250 18 300 20 350 20" fill="none" stroke="#238b70" stroke-width="5"/><path d="M185 10 V150" stroke="#d29a42" stroke-width="2" stroke-dasharray="6 6"/><text x="0" y="-12" font-size="18" font-weight="700" fill="#164e3b">Idealised titration curve</text><text x="185" y="175" text-anchor="middle" font-size="15" fill="#9a6a22">equivalence</text><text x="-15" y="8" text-anchor="end" font-size="15" fill="#45665b">14</text><text x="-15" y="140" text-anchor="end" font-size="15" fill="#45665b">0</text><text x="185" y="202" text-anchor="middle" font-size="15" fill="#45665b">Added base →</text></g><g transform="translate(550 260)" font-family="Arial"><rect width="340" height="125" rx="16" fill="#e3f1eb"/><text x="22" y="36" font-size="19" font-weight="700" fill="#164e3b">Brønsted–Lowry model</text><text x="22" y="68" font-size="17" fill="#45665b">Acid: proton donor</text><text x="22" y="94" font-size="17" fill="#45665b">Base: proton acceptor</text><text x="22" y="116" font-size="13" fill="#45665b">Strong acid + strong base, 25 °C</text></g><text x="42" y="435" font-family="Arial" font-size="15" fill="#45665b">Equivalence pH is approximately 7 only for an ideal strong-acid/strong-base titration at 25 °C.</text></svg>