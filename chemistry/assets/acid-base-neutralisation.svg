<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Acid-base neutralisation</title><desc id="d">The net ionic reaction is hydronium plus hydroxide forming two water molecules. For an ideal strong acid and strong base titration at 25 degrees Celsius, the equivalence point is near pH 7.</desc><rect width="960" height="460" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">NEUTRALISATION · PROTON TRANSFER</text><rect x="45" y="85" width="870" height="130" rx="18" fill="#fff" stroke="#a9cdbd" stroke-width="2"/><g font-family="Arial" text-anchor="middle"><text x="180" y="155" font-size="35" font-weight="700" fill="#b75e4d">H₃O⁺</text><text x="320" y="155" font-size="30" fill="#45665b">+</text><text x="445" y="155" font-size="35" font-weight="700" fill="#277eae">OH⁻</text><text x="575" y="155" font-size="30" fill="#45665b">→</text><text x="750" y="155" font-size="35" font-weight="700" fill="#168366">2H₂O</text></g><text x="180" y="190" text-anchor="middle" font-size="16" fill="#45665b">acid</text><text x="445" y="190" text-anchor="middle" font-size="16" fill="#45665b">base</text><text x="750" y="190" text-anchor="middle" font-size="16" fill="#45665b">water</text><g transform="translate(105 255)"><path d="M0 0 V145 H360" fill="none" stroke="#45665b" stroke-width="3"/><path d="M20 132 C90 132 120 130 145 112 C160 100 164 75 185 75 C206 75 210 50 225 35 C250 18 300 20 350 20" fill="none" stroke="#277eae" stroke-width="5"/><path d="M185 20 V145" stroke="#b75e4d" stroke-dasharray="6 6" stroke-width="2"/><text x="185" y="172" text-anchor="middle" font-size="15" fill="#45665b">equivalence</text><text x="-15" y="8" text-anchor="end" font-size="15" fill="#45665b">14</text><text x="-15" y="140" text-anchor="end" font-size="15" fill="#45665b">0</text><text x="185" y="202" text-anchor="middle" font-size="15" fill="#45665b">Base added →</text><text x="535" y="300" font-size="19" font-weight="700" fill="#164e3b">Brønsted–Lowry model</text><text x="535" y="335" font-size="17" fill="#45665b">Acid: proton donor</text><text x="535" y="365" font-size="17" fill="#45665b">Base: proton acceptor</text><text x="535" y="405" font-size="15" fill="#45665b">Strong acid + strong base, 25 °C:</text><text x="535" y="430" font-size="15" fill="#45665b">equivalence point near pH 7.</text></svg>