<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">How to read a chemical formula</title><desc id="d">In Al2(SO4)3, the subscript outside parentheses multiplies every atom in the group. A leading coefficient such as 2 in 2H2O multiplies the entire formula.</desc><style>@media (max-width: 600px) {.annotation{font-size:27px}}</style><rect width="900" height="430" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">READING A CHEMICAL FORMULA</text><rect x="45" y="85" width="810" height="185" rx="18" fill="#fff" stroke="#a9cdbd" stroke-width="2"/><text x="100" y="175" font-size="66" font-weight="700" fill="#164e3b">Al₂(SO₄)₃</text><path d="M150 190 V215 H90 M290 190 V215 H270 M390 190 V215 H520" stroke-width="2.5" fill="none" stroke="#238b70"/><g class="annotation" font-size="17" fill="#245646"><text x="70" y="238">₂: Al atoms</text><text x="240" y="238">₄: O atoms</text><text x="520" y="232">₃: multiplies the whole</text><text x="520" y="253">SO₄ group</text></g><rect x="45" y="290" width="390" height="100" rx="16" fill="#e2f0e9"/><text x="75" y="330" font-size="32" font-weight="700" fill="#164e3b">2H₂O</text><text x="75" y="350" font-size="17" fill="#45665b">2 × (2 H + 1 O)</text><text x="75" y="375" font-size="16" fill="#45665b">= 4 H atoms + 2 O atoms</text><rect x="465" y="290" width="390" height="100" rx="16" fill="#fff1dc"/><text x="495" y="330" font-size="23" font-weight="700" fill="#81551e">Coefficient ≠ subscript</text><text x="495" y="360" font-size="17" fill="#765b35">Changing a subscript changes the substance.</text></svg>