<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">Daniell galvanic cell</title><desc id="d">Zinc is oxidised at the anode, releasing electrons that travel through the external circuit to the copper cathode, where copper ions are reduced. A salt bridge maintains ionic charge balance.</desc><rect width="960" height="450" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">DANIELL CELL · Zn | Zn²⁺ || Cu²⁺ | Cu</text><path d="M265 140 V95 H695 V140" fill="none" stroke="#394f49" stroke-width="5"/><path d="M430 95 H690 M675 82 L695 95 L675 108" fill="none" stroke="#238b70" stroke-width="4"/><text x="485" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#14765a">electron flow →</text><g><rect x="120" y="160" width="300" height="210" rx="18" fill="#dceef4" stroke="#6d9eac" stroke-width="3"/><rect x="540" y="160" width="300" height="210" rx="18" fill="#dceef4" stroke="#6d9eac" stroke-width="3"/><rect x="245" y="130" width="42" height="205" rx="5" fill="#929f9b"/><rect x="665" y="130" width="42" height="205" rx="5" fill="#c77c45"/><path d="M420 245 C455 205 505 205 540 245" fill="none" stroke="#d69a42" stroke-width="24" stroke-linecap="round"/><path d="M420 245 C455 205 505 205 540 245" fill="none" stroke="#fff0d6" stroke-width="14" stroke-linecap="round"/></g><g text-anchor="middle" fill="#164e3b"><text x="270" y="400" font-size="21" font-weight="700">Zn anode (−)</text><text x="690" y="400" font-size="21" font-weight="700">Cu cathode (+)</text><text x="270" y="190" font-size="20">Zn²⁺ solution</text><text x="690" y="190" font-size="20">Cu²⁺ solution</text><text x="480" y="235" font-size="16">salt bridge</text></g><text x="38" y="435" font-size="16" fill="#45665b">Anode: Zn → Zn²⁺ + 2e⁻ · Cathode: Cu²⁺ + 2e⁻ → Cu</text></svg>