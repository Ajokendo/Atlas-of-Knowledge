<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">Daniell galvanic cell</title><desc id="d">Zinc is oxidised at the anode to zinc ions and electrons. Electrons flow through the external wire to the copper cathode, where copper ions are reduced. A salt bridge maintains charge balance.</desc><rect width="960" height="450" rx="24" fill="#f3faf7"/><text x="42" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#164e3b">DANIELL CELL · Zn | Zn²⁺ || Cu²⁺ | Cu</text><g><path d="M280 125 V90 H690 V125" fill="none" stroke="#394f49" stroke-width="5"/><path d="M470 90 H690" stroke="#238b70" stroke-width="4"/><path d="M675 80 L695 90 L675 100" fill="none" stroke="#238b70" stroke-width="4"/><text x="480" y="75" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#14765a">e⁻ flow →</text><path d="M145 160 Q145 135 180 135 H365 Q400 135 400 160 V350 H145 Z" fill="#dceef4" stroke="#6d9eac" stroke-width="3"/><path d="M560 160 Q560 135 595 135 H780 Q815 135 815 160 V350 H560 Z" fill="#dceef4" stroke="#6d9eac" stroke-width="3"/><rect x="245" y="120" width="45" height="210" rx="5" fill="#9aa6a4" stroke="#66736f" stroke-width="2"/><rect x="655" y="120" width="45" height="210" rx="5" fill="#c77c45" stroke="#995b32" stroke-width="2"/><path d="M400 245 C440 245 440 205 480 205 C520 205 520 245 560 245" fill="none" stroke="#d29a42" stroke-width="16" stroke-linecap="round"/><path d="M400 245 C440 245 440 205 480 205 C520 205 520 245 560 245" fill="none" stroke="#fff2d7" stroke-width="8" stroke-linecap="round"/><g font-family="Arial" text-anchor="middle"><text x="270" y="365" font-size="20" font-weight="700" fill="#164e3b">Zn anode (−)</text><text x="680" y="365" font-size="20" font-weight="700" fill="#164e3b">Cu cathode (+)</text><text x="270" y="395" font-size="17" fill="#45665b">Zn → Zn²⁺ + 2e⁻</text><text x="680" y="395" font-size="17" fill="#45665b">Cu²⁺ + 2e⁻ → Cu</text><text x="480" y="180" font-size="16" fill="#8b6428">salt bridge</text><text x="270" y="225" font-size="18" fill="#45665b">Zn²⁺</text><text x="680" y="225" font-size="18" fill="#45665b">Cu²⁺</text></g></g><text x="42" y="432" font-family="Arial" font-size="15" fill="#45665b">Anions migrate toward the anode compartment; cations toward the cathode compartment.</text></svg>