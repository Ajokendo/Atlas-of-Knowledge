<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">Изотопы и средняя атомная масса</title>
<desc id="d">Схематические ядра углерода-12 и углерода-13. Оба содержат по шесть протонов; у углерода-12 шесть нейтронов, у углерода-13 — семь. Их природные доли учитываются при расчёте средней атомной массы.</desc>
<rect width="900" height="430" rx="24" fill="#f3faf7"/>
<text x="40" y="48" fill="#164e3b" font-family="Arial" font-size="25" font-weight="700">ИЗОТОПЫ · ОДИНАКОВОЕ ЧИСЛО ПРОТОНОВ, РАЗНОЕ ЧИСЛО НЕЙТРОНОВ</text>
<g font-family="Arial" text-anchor="middle">
