<g transform="translate(470 185)"><circle r="91" fill="#e1f1eb" stroke="#4d9b7c" stroke-width="3"/><circle cx="-30" cy="-30" r="10" fill="#238b70" stroke="#fff" stroke-width="1.5"/><circle cx="0" cy="-42" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><circle cx="30" cy="-30" r="10" fill="#238b70" stroke="#fff" stroke-width="1.5"/><circle cx="-42" cy="0" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><circle cx="-12" cy="0" r="10" fill="#238b70" stroke="#fff" stroke-width="1.5"/><circle cx="18" cy="0" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><circle cx="42" cy="0" r="10" fill="#238b70" stroke="#fff" stroke-width="1.5"/><circle cx="-30" cy="30" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><circle cx="0" cy="42" r="10" fill="#238b70" stroke="#fff" stroke-width="1.5"/><circle cx="30" cy="30" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><circle cx="-10" cy="30" r="10" fill="#238b70" stroke="#fff" stroke-width="1.5"/><circle cx="10" cy="-10" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><circle cx="-45" cy="30" r="10" fill="#e0a64d" stroke="#fff" stroke-width="1.5"/><text y="125" font-size="23" font-weight="700" fill="#183c31">¹³C · углерод-13</text><text y="153" font-size="17" fill="#45665b">6 p⁺ · 7 n⁰</text><text y="180" font-size="16" fill="#45665b">≈ 1,1% в природной смеси</text></g>
<g transform="translate(720 190)"><rect x="-130" y="-90" width="250" height="200" rx="18" fill="#fff" stroke="#9fcbb8" stroke-width="2"/><text y="-50" font-size="19" font-weight="700" fill="#164e3b">ВЗВЕШЕННОЕ СРЕДНЕЕ</text><text y="-8" font-size="19" fill="#244d40">Aᵣ(C) = Σ xᵢmᵢ</text><text y="28" font-size="16" fill="#45665b">0,989 × 12 +</text><text y="52" font-size="16" fill="#45665b">0,011 × 13</text><text y="88" font-size="22" font-weight="700" fill="#14765a">≈ 12,011</text></g>
