<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Электронная плотность</title><desc id="desc">Схема плотности вероятности для s-орбитали (сфера) и p-орбитали (две доли) вокруг ядра. Чем темнее, тем вероятнее найти электрон.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:26px;font-weight:700}.s{font-size:19px}.c{font-size:20px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2f7d5a"/></marker></defs><rect width="1200" height="720" fill="#fbfcfe"/><text x="600" y="50" text-anchor="middle" class="t">ЭЛЕКТРОННАЯ ПЛОТНОСТЬ</text><circle cx="330" cy="380" r="230" fill="#2f9e8f" fill-opacity="0.07"/><circle cx="330" cy="380" r="190" fill="#2f9e8f" fill-opacity="0.09"/><circle cx="330" cy="380" r="150" fill="#2f9e8f" fill-opacity="0.12"/><circle cx="330" cy="380" r="110" fill="#2f9e8f" fill-opacity="0.16"/><circle cx="330" cy="380" r="70" fill="#2f9e8f" fill-opacity="0.22"/><circle cx="330" cy="380" r="35" fill="#2f9e8f" fill-opacity="0.3"/><circle cx="330" cy="380" r="9" fill="#c0392b"/><text x="330" y="670" text-anchor="middle" class="c">s-орбиталь</text><text x="330" y="698" text-anchor="middle" class="s">сферическое облако</text><ellipse cx="775" cy="380" rx="76.0" ry="95" fill="#2f9e8f" fill-opacity="0.08"/><ellipse cx="775" cy="380" rx="56.0" ry="70" fill="#2f9e8f" fill-opacity="0.12"/><ellipse cx="775" cy="380" rx="36.0" ry="45" fill="#2f9e8f" fill-opacity="0.2"/><ellipse cx="945" cy="380" rx="76.0" ry="95" fill="#2f9e8f" fill-opacity="0.08"/><ellipse cx="945" cy="380" rx="56.0" ry="70" fill="#2f9e8f" fill-opacity="0.12"/><ellipse cx="945" cy="380" rx="36.0" ry="45" fill="#2f9e8f" fill-opacity="0.2"/><circle cx="860" cy="380" r="9" fill="#c0392b"/><line x1="860" y1="250" x2="860" y2="510" stroke="#647789" stroke-dasharray="6 6"/><text x="860" y="670" text-anchor="middle" class="c">p-орбиталь</text><text x="860" y="698" text-anchor="middle" class="s">две доли, в ядре узел</text><text x="600" y="110" text-anchor="middle" class="s">Темнее — выше вероятность найти электрон.</text><text x="600" y="140" text-anchor="middle" class="s">Орбиталь — область вероятности, а не траектория или орбита.</text><text x="350" y="320" class="s" fill="#243447"></text></svg>