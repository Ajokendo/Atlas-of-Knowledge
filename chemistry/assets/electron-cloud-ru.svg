<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Электронная плотность вокруг ядра</title><desc id="d">Схематическое изображение атомного ядра и облака электронной плотности. Облако показывает области вероятного обнаружения электронов, а не траектории.</desc><rect width="1000" height="600" rx="24" fill="#f4f8f6"/><text x="48" y="62" font-size="30" font-weight="700" fill="#164e3b">ЭЛЕКТРОННОЕ ОБЛАКО</text><g transform="translate(470 315)"><ellipse rx="300" ry="150" fill="#6da99a" opacity=".16"/><ellipse rx="245" ry="205" transform="rotate(55)" fill="#6da99a" opacity=".2"/><ellipse rx="190" ry="260" transform="rotate(-42)" fill="#6da99a" opacity=".18"/><ellipse rx="135" ry="110" fill="#3d8977" opacity=".22"/><circle r="42" fill="#b75e4d"/><circle cx="-15" cy="-8" r="12" fill="#f3c28d"/><circle cx="15" cy="12" r="12" fill="#f3c28d"/></g><path d="M670 175 L790 115" stroke="#287c68" stroke-width="3"/><text x="800" y="108" font-size="21" fill="#164e3b">Электронная</text><text x="800" y="135" font-size="21" fill="#164e3b">плотность</text><path d="M470 315 L245 455" stroke="#b75e4d" stroke-width="3"/><text x="95" y="490" font-size="22" fill="#164e3b">Ядро атома</text><text x="95" y="530" font-size="18" fill="#45665b">Схема условная; размеры не в масштабе</text><text x="48" y="570" font-size="17" fill="#45665b">Облако отражает вероятность обнаружения электронов, а не их орбиты.</text></svg>