<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Круговорот углерода: основные резервуары и потоки</title>
<desc id="desc">Схема обмена углеродом между атмосферой, биосферой, океаном и геологическими резервуарами. Фотосинтез переносит углерод в биомассу; дыхание и разложение возвращают углекислый газ. Океан обменивается CO₂ с атмосферой, а выветривание и вулканизм связывают атмосферу с геологическими резервуарами.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#397f6b"/></marker>
  <style>
    .node{stroke-width:3}
    .heading{font:700 22px Inter,Arial,sans-serif;fill:#214b40;text-anchor:middle}
    .sub{font:16px Inter,Arial,sans-serif;fill:#526c64;text-anchor:middle}
    .process{font:600 16px Inter,Arial,sans-serif;fill:#315f51;text-anchor:middle}
    .flow{fill:none;stroke:#397f6b;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1000" height="560" rx="22" fill="#fbfbfa"/>
