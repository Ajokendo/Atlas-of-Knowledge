  <path d="M730 294L750 258L772 288L795 250L817 292" fill="none" stroke="#a27c68" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="heading" x="810" y="315" style="font-size:17px">ГЕОЛОГИЧЕСКИЕ ЗАПАСЫ</text>
</g>
<g>
  <rect x="205" y="135" width="190" height="34" rx="17" fill="#fbfbfa" stroke="#c9ddd4"/>
  <text class="process" x="300" y="158">Фотосинтез</text>
  <rect x="205" y="175" width="210" height="34" rx="17" fill="#fbfbfa" stroke="#c9ddd4"/>
  <text class="process" x="310" y="198">Дыхание и разложение</text>
  <rect x="605" y="135" width="220" height="34" rx="17" fill="#fbfbfa" stroke="#c9ddd4"/>
  <text class="process" x="715" y="158">Выветривание</text>
  <rect x="605" y="175" width="220" height="34" rx="17" fill="#fbfbfa" stroke="#c9ddd4"/>
  <text class="process" x="715" y="198">Вулканические выбросы</text>
  <rect x="530" y="235" width="245" height="34" rx="17" fill="#fbfbfa" stroke="#c9ddd4"/>
  <text class="process" x="652" y="258">Обмен CO₂ океан—атмосфера</text>
</g>
<text x="500" y="540" font-family="Inter,Arial,sans-serif" font-size="15" fill="#566a62" text-anchor="middle">Упрощённая схема: углерод также циркулирует через почвы, осадки и пищевые сети.</text>
</svg>