  <path d="M245 220C290 155 345 115 405 105"/>
  <path d="M595 135C655 155 715 195 755 245"/>
  <path d="M755 220C710 155 655 115 595 105"/>
  <path d="M470 165C485 240 485 325 470 395"/>
  <path d="M530 395C515 325 515 240 530 165"/>
</g>
<g>
  <rect class="node" x="365" y="38" width="270" height="112" rx="22" fill="#f0e5d1" stroke="#c9a878"/>
  <circle cx="500" cy="78" r="19" fill="#d2b17c"/>
  <path d="M500 49V107M471 78H529" stroke="#a7834d" stroke-width="3" stroke-linecap="round"/>
  <text class="heading" x="500" y="125">АТМОСФЕРА</text>
  <rect class="node" x="55" y="225" width="270" height="112" rx="22" fill="#e1eee3" stroke="#9dbca5"/>
  <path d="M190 285V250M190 266C162 236 146 260 180 278M190 263C220 233 239 258 200 278" fill="none" stroke="#54866c" stroke-width="6" stroke-linecap="round"/>
  <text class="heading" x="190" y="315">БИОСФЕРА</text>
  <rect class="node" x="365" y="395" width="270" height="112" rx="22" fill="#e0eef0" stroke="#9bbbc0"/>
  <path d="M405 455Q435 433 465 455T525 455T585 455" fill="none" stroke="#6599a4" stroke-width="5"/>
  <text class="heading" x="500" y="485">ОКЕАН</text>
