<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Круговорот углерода: основные резервуары и потоки</title><desc id="d">Упрощённый обмен углеродом между атмосферой, живыми организмами, океаном и геологическими резервуарами. Показаны фотосинтез, дыхание и разложение, обмен CO₂ с океаном, захоронение и вулканическое возвращение углерода.</desc><rect width="1000" height="560" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">КРУГОВОРОТ УГЛЕРОДА</text><g font-family="Arial" text-anchor="middle"><rect x="365" y="90" width="270" height="95" rx="18" fill="#e6f1f7" stroke="#6d9eac" stroke-width="3"/><text x="500" y="130" font-size="23" font-weight="700" fill="#164e3b">Атмосфера</text><text x="500" y="160" font-size="18" fill="#45665b">CO₂</text><rect x="65" y="270" width="250" height="105" rx="18" fill="#e3f1e8" stroke="#5d9b78" stroke-width="3"/><text x="190" y="310" font-size="22" font-weight="700" fill="#164e3b">Биосфера</text><text x="190" y="340" font-size="17" fill="#45665b">растения и организмы</text><rect x="685" y="270" width="250" height="105" rx="18" fill="#e1f0f3" stroke="#5f9eae" stroke-width="3"/><text x="810" y="310" font-size="22" font-weight="700" fill="#164e3b">Океан</text><text x="810" y="340" font-size="17" fill="#45665b">растворённый углерод</text><rect x="365" y="430" width="270" height="95" rx="18" fill="#f4ead9" stroke="#c49a5b" stroke-width="3"/><text x="500" y="470" font-size="22" font-weight="700" fill="#164e3b">Геологические</text><text x="500" y="498" font-size="18" fill="#45665b">породы и осадки</text></g><g fill="none" stroke="#287c68" stroke-width="4"><path d="M390 185 C330 220 270 235 230 270"/><path d="M250 250 L230 270 L258 268"/><path d="M280 270 C330 230 365 215 405 185"/><path d="M610 185 C670 220 730 235 770 270"/><path d="M740 250 L770 270 L742 268"/><path d="M720 270 C670 230 635 215 595 185"/><path d="M500 185 V430"/><path d="M485 410 L500 430 L515 410"/><path d="M560 430 V185"/><path d="M545 205 L560 185 L575 205"/></g><g font-size="17" font-weight="700" fill="#245646" text-anchor="middle"><text x="270" y="220">Фотосинтез</text><text x="330" y="250">Дыхание</text><text x="730" y="220">Обмен CO₂</text><text x="650" y="250">Возврат в атмосферу</text><text x="545" y="315">Захоронение</text><text x="545" y="340">и осадконакопление</text><text x="760" y="420">Вулканический возврат CO₂</text></g><text x="38" y="548" font-size="16" fill="#45665b">Модель упрощена: почвы, пищевые сети и многие геохимические потоки не показаны.</text></svg>