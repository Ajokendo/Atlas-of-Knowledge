<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Четыре основные группы биомолекул</title><desc id="d">Углеводы, белки, липиды и нуклеиновые кислоты представлены упрощёнными структурными мотивами. Липиды химически разнообразны и не все являются полимерами.</desc><rect width="1000" height="470" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="27" font-weight="700" fill="#164e3b">ЧЕТЫРЕ ОСНОВНЫЕ ГРУППЫ БИОМОЛЕКУЛ</text><g font-family="Arial"><g fill="#fff" stroke="#a9cdbd" stroke-width="2"><rect x="35" y="82" width="450" height="155" rx="16"/><rect x="515" y="82" width="450" height="155" rx="16"/><rect x="35" y="260" width="450" height="155" rx="16"/><rect x="515" y="260" width="450" height="155" rx="16"/></g><g fill="#164e3b" font-size="21" font-weight="700"><text x="58" y="116">Углеводы</text><text x="538" y="116">Белки</text><text x="58" y="294">Липиды</text><text x="538" y="294">Нуклеиновые кислоты</text></g><g stroke="#238b70" stroke-width="4" fill="#dcefe7"><circle cx="100" cy="165" r="24"/><circle cx="155" cy="165" r="24"/><circle cx="210" cy="165" r="24"/><path d="M124 165H131 M179 165H186"/></g><g stroke="#277eae" stroke-width="5" fill="none"><path d="M560 170 L595 145 L630 170 L665 145 L700 170 L735 145"/></g><g stroke="#d69a42" stroke-width="5" fill="none"><path d="M95 330 V390 M115 330 V390 M135 330 V390"/><circle cx="115" cy="322" r="18" fill="#f3d8a7" stroke="#d69a42"/></g><g stroke="#238b70" stroke-width="4" fill="none"><path d="M565 335 C600 300 635 370 670 335 S740 300 775 335"/><path d="M565 355 C600 390 635 320 670 355 S740 390 775 355"/></g><g fill="#45665b" font-size="16"><text x="58" y="215">Связанные звенья сахаров</text><text x="538" y="215">Цепь аминокислот</text><text x="58" y="395">Пример: фосфолипид</text><text x="538" y="395">Цепь нуклеотидов / ДНК</text></g></g><text x="38" y="448" font-size="16" fill="#45665b">Упрощённые мотивы; строение и функции внутри каждой группы различаются.</text></svg>