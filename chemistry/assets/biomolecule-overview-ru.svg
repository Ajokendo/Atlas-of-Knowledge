<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Четыре основные группы биомолекул</title><desc id="d">Углеводы are shown as linked sugar rings, proteins as amino-acid chains, lipids as a phospholipid with polar head and nonpolar tails, and nucleic acids as nucleotide chains.</desc><rect width="1000" height="470" rx="24" fill="#f3faf7"/><text x="38" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#164e3b">ЧЕТЫРЕ ОСНОВНЫЕ ГРУППЫ БИОМОЛЕКУЛ</text><g font-family="Arial"><g fill="#fff" stroke="#b7d8ca" stroke-width="2"><rect x="35" y="82" width="450" height="155" rx="16"/><rect x="515" y="82" width="450" height="155" rx="16"/><rect x="35" y="260" width="450" height="155" rx="16"/><rect x="515" y="260" width="450" height="155" rx="16"/></g><g fill="#164e3b" font-size="21" font-weight="700"><text x="58" y="116">Углеводы</text><text x="538" y="116">Белки</text><text x="58" y="294">Липиды</text><text x="538" y="294">Нуклеиновые кислоты</text></g><g stroke="#238b70" stroke-width="5" fill="#dcefe7"><path d="M95 164 l30 -22 32 22 -30 24 Z M157 164 l30 -22 32 22 -30 24 Z M219 164 l30 -22 32 22 -30 24 Z" stroke-linejoin="round"/></g><g fill="#45665b" font-size="16"><text x="58" y="215">Связанные звенья моносахаридов</text><text x="538" y="215">Остатки аминокислот, соединённые пептидными связями</text><text x="58" y="395">Разнообразные вещества; не все — полимеры</text><text x="538" y="395">Цепь нуклеотидов: сахар + фосфат + основание</text></g><g stroke="#277eae" stroke-width="5" fill="none"><path d="M555 150 C580 125 605 175 630 150 S680 125 705 150 S755 175 780 150 S830 125 855 150 S905 175 930 150"/></g><g fill="#dcefe7" stroke="#238b70" stroke-width="3"><circle cx="105" cy="350" r="20"/><circle cx="165" cy="350" r="20"/><circle cx="225" cy="350" r="20"/><circle cx="285" cy="350" r="20"/></g><g stroke="#c58a35" stroke-width="5" stroke-linecap="round"><path d="M105 371 L92 410 M105 371 L118 410 M165 371 L152 410 M165 371 L178 410 M225 371 L212 410 M225 371 L238 410 M285 371 L272 410 M285 371 L298 410"/></g><g stroke="#238b70" stroke-width="2"><path d="M555 165 C620 190 680 125 745 165 S870 205 930 165 M555 180 C620 205 680 140 745 180 S870 220 930 180"/></g><g fill="#c58a35"><circle cx="580" cy="166" r="6"/><circle cx="640" cy="173" r="6"/><circle cx="700" cy="151" r="6"/><circle cx="760" cy="183" r="6"/><circle cx="820" cy="195" r="6"/><circle cx="880" cy="185" r="6"/></g></g><text x="38" y="448" font-family="Arial" font-size="15" fill="#45665b">Условные структурные мотивы; липиды не являются единым классом полимеров.</text></svg>