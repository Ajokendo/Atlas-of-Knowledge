<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Carbon cycle: major reservoirs and exchanges</title><desc id="desc">Conceptual diagram of carbon exchange among the atmosphere, biosphere, ocean and geological stores.</desc><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:26px;font-weight:700}.s{font-size:19px}.c{font-size:20px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2f7d5a"/></marker></defs><rect width="1000" height="560" fill="#fbfcfe"/><text x="500" y="40" text-anchor="middle" class="t">CARBON CYCLE</text><rect x="380" y="70" width="240" height="90" rx="18" fill="#f1e6d0" stroke="#647789" stroke-width="2"/><text x="500.0" y="113.0" text-anchor="middle" class="c">Atmosphere</text><text x="500.0" y="139.0" text-anchor="middle" class="s">CO₂</text><rect x="40" y="250" width="240" height="90" rx="18" fill="#e1eedf" stroke="#647789" stroke-width="2"/><text x="160.0" y="293.0" text-anchor="middle" class="c">Biosphere</text><text x="160.0" y="319.0" text-anchor="middle" class="s">plants and organisms</text><rect x="700" y="250" width="280" height="90" rx="18" fill="#efe1dc" stroke="#647789" stroke-width="2"/><text x="840.0" y="293.0" text-anchor="middle" class="c">Geological stores</text><text x="840.0" y="319.0" text-anchor="middle" class="s">rocks and sediments</text><rect x="380" y="430" width="240" height="90" rx="18" fill="#e0eef3" stroke="#647789" stroke-width="2"/><text x="500.0" y="473.0" text-anchor="middle" class="c">Ocean</text><text x="500.0" y="499.0" text-anchor="middle" class="s">dissolved carbon</text><path d="M400 160L215 250" stroke="#2f7d5a" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M170 250L360 160" stroke="#2f7d5a" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M600 160L785 250" stroke="#2f7d5a" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M830 250L640 160" stroke="#2f7d5a" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M440 160L440 430" stroke="#2f7d5a" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M560 430L560 160" stroke="#2f7d5a" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="300" y="235" text-anchor="start" class="s">Photosynthesis</text><text x="235" y="185" text-anchor="end" class="s">Respiration, decay</text><text x="725" y="235" text-anchor="end" class="s">Weathering</text><text x="790" y="190" text-anchor="start" class="s">Volcanic CO₂</text><text x="425" y="320" text-anchor="end" class="s">CO₂ into the ocean</text><text x="575" y="320" text-anchor="start" class="s">CO₂ out of the ocean</text><text x="500" y="548" text-anchor="middle" class="s">Simplified model: soils, food webs and many geochemical fluxes are not shown.</text></svg>