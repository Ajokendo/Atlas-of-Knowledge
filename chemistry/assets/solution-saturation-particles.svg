<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Solution saturation particle models</title><desc id="d">At the same temperature, an unsaturated solution can dissolve more solute, a saturated solution is at the solubility limit, and a supersaturated solution contains more dissolved solute than the equilibrium amount and is metastable.</desc><rect width="960" height="430" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="26" font-weight="700" fill="#164e3b">THREE STATES AT THE SAME TEMPERATURE</text><g font-family="Arial" text-anchor="middle"><g transform="translate(165 105)"><rect x="-105" y="0" width="210" height="205" rx="16" fill="#e4f1f2" stroke="#6aa9a0" stroke-width="3"/><g fill="#238b70"><circle cx="-55" cy="45" r="9"/><circle cx="0" cy="32" r="9"/><circle cx="52" cy="62" r="9"/><circle cx="-25" cy="105" r="9"/><circle cx="55" cy="145" r="9"/></g><text y="245" font-size="21" font-weight="700" fill="#164e3b">Unsaturated</text><text y="271" font-size="16" fill="#45665b">More solute can dissolve</text></g><g transform="translate(480 105)"><rect x="-105" y="0" width="210" height="205" rx="16" fill="#e4f1f2" stroke="#6aa9a0" stroke-width="3"/><g fill="#238b70"><circle cx="-55" cy="45" r="9"/><circle cx="0" cy="32" r="9"/><circle cx="52" cy="62" r="9"/><circle cx="-25" cy="105" r="9"/><circle cx="55" cy="145" r="9"/><circle cx="-70" cy="185" r="8"/><circle cx="-45" cy="185" r="8"/><circle cx="-20" cy="185" r="8"/><circle cx="5" cy="185" r="8"/></g><text y="245" font-size="21" font-weight="700" fill="#164e3b">Saturated</text><text y="271" font-size="16" fill="#45665b">At the solubility limit</text></g><g transform="translate(795 105)"><rect x="-105" y="0" width="210" height="205" rx="16" fill="#e4f1f2" stroke="#6aa9a0" stroke-width="3"/><g fill="#238b70"><circle cx="-65" cy="35" r="9"/><circle cx="-20" cy="28" r="9"/><circle cx="30" cy="45" r="9"/><circle cx="65" cy="85" r="9"/><circle cx="-55" cy="95" r="9"/><circle cx="0" cy="105" r="9"/><circle cx="45" cy="145" r="9"/><circle cx="-20" cy="160" r="9"/><circle cx="5" cy="65" r="9"/><circle cx="-75" cy="150" r="9"/></g><text y="245" font-size="21" font-weight="700" fill="#164e3b">Supersaturated</text><text y="271" font-size="16" fill="#45665b">Metastable; may crystallise</text></g></g><text x="38" y="390" font-size="17" fill="#45665b">Particle counts are schematic, not measured concentrations.</text></svg>