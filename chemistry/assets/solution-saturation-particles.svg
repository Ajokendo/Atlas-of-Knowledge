<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Solution saturation particle models</title><desc id="d">At the same temperature and amount of solvent, an unsaturated solution can dissolve more solute; a saturated solution is in dynamic equilibrium with undissolved solute; a supersaturated solution contains more dissolved solute than the equilibrium amount, is metastable, and may crystallise when seeded.</desc><rect width="960" height="430" rx="24" fill="#f4f8f6"/><text x="38" y="48" font-size="26" font-weight="700" fill="#164e3b">THREE STATES AT THE SAME TEMPERATURE</text><g font-family="Arial" text-anchor="middle"><g transform="translate(165 105)"><rect x="-105" y="0" width="210" height="205" rx="16" fill="#e4f1f2" stroke="#6aa9a0" stroke-width="3"/><g fill="#238b70"><circle cx="-55" cy="45" r="9"/><circle cx="0" cy="32" r="9"/><circle cx="52" cy="62" r="9"/><circle cx="-25" cy="105" r="9"/><circle cx="55" cy="145" r="9"/></g><text y="245" font-size="21" font-weight="700" fill="#164e3b">Unsaturated</text><text y="271" font-size="16" fill="#45665b">More solute can dissolve</text></g><g transform="translate(480 105)"><rect x="-105" y="0" width="210" height="205" rx="16" fill="#e4f1f2" stroke="#6aa9a0" stroke-width="3"/><g fill="#238b70"><circle cx="-55" cy="45" r="9"/><circle cx="0" cy="32" r="9"/><circle cx="52" cy="62" r="9"/><circle cx="-25" cy="105" r="9"/><circle cx="55" cy="145" r="9"/><circle cx="-70" cy="185" r="8"/><circle cx="-45" cy="185" r="8"/><circle cx="-20" cy="185" r="8"/><circle cx="5" cy="185" r="8"/></g><path d="M-70 195 l18 -12 18 12 18 -12 18 12 18 -12 18 12" fill="none" stroke="#c58a35" stroke-width="5"/><text y="245" font-size="21" font-weight="700" fill="#164e3b">Saturated</text><text y="271" font-size="16" fill="#45665b">Dynamic equilibrium with solid</text></g><g transform="translate(795 105)"><rect x="-105" y="0" width="210" height="205" rx="16" fill="#e4f1f2" stroke="#6aa9a0" stroke-width="3"/><g fill="#238b70"><circle cx="-65" cy="35" r="9"/><circle cx="-20" cy="28" r="9"/><circle cx="30" cy="45" r="9"/><circle cx="65" cy="85" r="9"/><circle cx="-55" cy="95" r="9"/><circle cx="0" cy="105" r="9"/><circle cx="45" cy="145" r="9"/><circle cx="-20" cy="160" r="9"/><circle cx="5" cy="65" r="9"/><circle cx="-75" cy="150" r="9"/></g><text y="245" font-size="21" font-weight="700" fill="#164e3b">Supersaturated</text><text y="271" font-size="16" fill="#45665b">Metastable; seeding may trigger crystals</text></g></g><text x="38" y="390" font-size="17" fill="#45665b">Particle counts are schematic, not measured concentrations.</text></svg>