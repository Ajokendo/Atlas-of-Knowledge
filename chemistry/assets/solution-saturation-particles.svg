<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Solution saturation particle models</title><desc id="d">At the same temperature and solvent amount, an unsaturated solution has capacity for more solute, a saturated solution is at equilibrium with undissolved solute, and a supersaturated solution is metastable and can crystallise after seeding.</desc><rect width="960" height="430" rx="24" fill="#f3faf7"/><text x="38" y="48" font-family="Arial" font-size="26" font-weight="700" fill="#164e3b">SOLUBILITY AT THE SAME TEMPERATURE</text><g font-family="Arial" text-anchor="middle"><g transform="translate(170 105)"><rect x="-112" y="0" width="224" height="205" rx="18" fill="#e6f4f4" stroke="#6aa9a0" stroke-width="3"/><g fill="#25947a"><circle cx="-65" cy="48" r="9"/><circle cx="-15" cy="35" r="9"/><circle cx="40" cy="57" r="9"/><circle cx="75" cy="105" r="9"/><circle cx="-50" cy="130" r="9"/><circle cx="8" cy="105" r="9"/><circle cx="48" cy="158" r="9"/></g><text y="244" font-size="22" font-weight="700" fill="#164e3b">Unsaturated</text><text y="270" font-size="16" fill="#45665b">More solute can dissolve</text></g><g transform="translate(480 105)"><rect x="-112" y="0" width="224" height="205" rx="18" fill="#e6f4f4" stroke="#6aa9a0" stroke-width="3"/><g fill="#25947a"><circle cx="-65" cy="48" r="9"/><circle cx="-15" cy="35" r="9"/><circle cx="40" cy="57" r="9"/><circle cx="75" cy="105" r="9"/><circle cx="-50" cy="130" r="9"/><circle cx="8" cy="105" r="9"/><circle cx="48" cy="158" r="9"/><circle cx="-22" cy="170" r="9"/><circle cx="0" cy="188" r="8"/></g><path d="M-62 194 l22 -15 20 15 20 -15 22 15" fill="none" stroke="#c58a35" stroke-width="5"/><text y="244" font-size="22" font-weight="700" fill="#164e3b">Saturated</text><text y="270" font-size="16" fill="#45665b">Dynamic equilibrium</text></g><g transform="translate(790 105)"><rect x="-112" y="0" width="224" height="205" rx="18" fill="#e6f4f4" stroke="#6aa9a0" stroke-width="3"/><g fill="#25947a"><circle cx="-65" cy="48" r="9"/><circle cx="-15" cy="35" r="9"/><circle cx="40" cy="57" r="9"/><circle cx="75" cy="105" r="9"/><circle cx="-50" cy="130" r="9"/><circle cx="8" cy="105" r="9"/><circle cx="48" cy="158" r="9"/><circle cx="-22" cy="170" r="9"/><circle cx="0" cy="188" r="8"/><circle cx="-80" cy="90" r="8"/><circle cx="65" cy="28" r="8"/></g><path d="M-30 193 l15 -20 15 20 15 -20 15 20" fill="none" stroke="#c58a35" stroke-width="5"/><text y="244" font-size="22" font-weight="700" fill="#164e3b">Supersaturated</text><text y="270" font-size="16" fill="#45665b">Metastable · seed → crystal</text></g></g><rect x="55" y="365" width="850" height="38" rx="12" fill="#dcefe7"/><text x="480" y="390" text-anchor="middle" font-family="Arial" font-size="17" fill="#245646">Schematic particle counts · a seed crystal can trigger nucleation and precipitation</text></svg>