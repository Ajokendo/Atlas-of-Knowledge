<main><section class="intro"><p class="eyebrow" data-i="eyebrow">СПРАВОЧНЫЙ РАЗДЕЛ · RU / EN</p><h1 data-i="title">Словарь химии</h1><p class="lead" data-i="lead">Ключевые понятия химии — от атома и моля до кислотности и окислительно-восстановительных процессов.</p></section>

<script>
const entries=[
["Атом","Atom","Наименьшая электрически нейтральная частица химического элемента, сохраняющая его химическую идентичность.","The smallest electrically neutral unit of an element that retains its chemical identity.","matter"],
["Атомное число","Atomic number","Число протонов в ядре атома; определяет, к какому химическому элементу относится атом.","The number of protons in an atom's nucleus; it defines the element.","matter"],
["Изотоп","Isotope","Разновидность атомов одного элемента с одинаковым числом протонов, но разным числом нейтронов.","Atoms of the same element with equal proton counts but different neutron counts.","matter"],
["Ион","Ion","Атом или группа атомов с электрическим зарядом из-за потери или присоединения электронов.","An atom or group of atoms with a net charge due to electron loss or gain.","matter"],
["Молекула","Molecule","Электрически нейтральная группа атомов, связанных химическими связями.","An electrically neutral group of atoms held together by chemical bonds.","matter"],
["Химический элемент","Chemical element","Вид атомов с одинаковым числом протонов в ядре.","A type of atom defined by the same number of protons in its nucleus.","matter"],
["Периодический закон","Periodic law","Свойства элементов и их соединений периодически зависят от атомного номера.","The properties of elements and their compounds are periodic functions of atomic number.","matter"],
["Валентные электроны","Valence electrons","Электроны, участвующие в образовании химических связей; у элементов главных групп это обычно электроны внешнего уровня, а у переходных металлов могут участвовать и d-электроны.","Electrons that participate in chemical bonding; for main-group elements these are usually outer-shell electrons, while d electrons can also participate in transition metals.","matter"],
["Ковалентная связь","Covalent bond","Химическая связь, возникающая при совместном использовании атомами одной или нескольких электронных пар.","A chemical bond formed when atoms share one or more pairs of electrons.","matter"],
["Ионная связь","Ionic bond","Электростатическое притяжение между противоположно заряженными ионами.","Electrostatic attraction between oppositely charged ions.","matter"],
["Электроотрицательность","Electronegativity","Способность атома притягивать общую электронную пару в химической связи.","The tendency of an atom to attract shared electrons in a chemical bond.","matter"],
["Моль","Mole","Единица количества вещества; один моль содержит ровно 6,02214076 × 10²³ элементарных сущностей.","The unit of amount of substance; one mole contains exactly 6.02214076 × 10²³ specified entities.","matter"],
["Молярная масса","Molar mass","Масса одного моля вещества; обычно выражается в г/моль.","The mass of one mole of a substance, commonly expressed in g/mol.","matter"],
["Химическая реакция","Chemical reaction","Процесс превращения исходных веществ в продукты посредством перестройки химических связей.","A process in which reactants become products through rearrangement of chemical bonds.","reaction"],
["Катализатор","Catalyst","Вещество, которое изменяет скорость реакции, обеспечивая альтернативный путь с меньшей энергией активации, но регенерируется к концу каталитического цикла и не расходуется суммарно.","A substance that changes reaction rate by providing an alternative pathway with lower activation energy and is regenerated by the end of the catalytic cycle and is not consumed overall.","reaction"],
["Окисление","Oxidation","Отдача электронов или формальное повышение степени окисления; в ковалентных соединениях это отражает смещение электронной плотности от атома.","Loss of electrons or a formal increase in oxidation state; in covalent compounds this reflects a shift of electron density away from the atom.","reaction"],
["Восстановление","Reduction","Присоединение электронов или формальное понижение степени окисления; в ковалентных соединениях это отражает смещение электронной плотности к атому.","Gain of electrons or a formal decrease in oxidation state; in covalent compounds this reflects a shift of electron density towards the atom.","reaction"],
["Степень окисления","Oxidation state","Условный заряд атома в соединении при формальном отнесении электронов связи к более электроотрицательному атому.","The formal charge assigned to an atom when bonding electrons are allocated to the more electronegative atom.","reaction"],
["Экзотермическая реакция","Exothermic reaction","Реакция, при которой система выделяет энергию в окружающую среду; при постоянном давлении ΔH < 0.","A reaction that releases energy to its surroundings; at constant pressure, ΔH < 0.","reaction"],
["Эндотермическая реакция","Endothermic reaction","Реакция, при которой система поглощает энергию из окружающей среды; при постоянном давлении ΔH > 0.","A reaction that absorbs energy from its surroundings; at constant pressure, ΔH > 0.","reaction"],
["Раствор","Solution","Однородная смесь растворителя и одного или нескольких растворённых веществ.","A homogeneous mixture of a solvent and one or more solutes.","solution"],
["Концентрация","Concentration","Количественная характеристика содержания компонента в заданном объёме или массе смеси.","A quantitative measure of the amount of a component in a given volume or mass of mixture.","solution"],
["Молярная концентрация","Molar concentration","Количество растворённого вещества, делённое на объём раствора; единица СИ — моль/м³, часто используют моль/л.","Amount of dissolved substance divided by solution volume; commonly expressed in mol/L.","solution"],
["Кислота","Acid","По Бренстеду—Лоури, частица, способная отдавать протон H⁺.","In Brønsted–Lowry theory, a species capable of donating a proton, H⁺.","solution"],
["Основание","Base","По Бренстеду—Лоури, частица, способная принимать протон H⁺.","In Brønsted–Lowry theory, a species capable of accepting a proton, H⁺.","solution"],
["pH","pH","Величина, связанная с активностью ионов водорода; в разбавленных растворах часто приближённо pH = −log₁₀[H⁺].","A measure related to hydrogen-ion activity; in dilute solutions pH is often approximated by −log₁₀[H⁺].","solution"],
["Нейтрализация","Neutralization","Реакция кислоты и основания; для сильной кислоты и сильного основания в водном растворе часто приводит к образованию воды и соли.","An acid–base reaction; strong acid–strong base reactions in water commonly form water and a salt.","solution"],
["Углеводород","Hydrocarbon","Органическое соединение, состоящее только из атомов углерода и водорода.","An organic compound containing only carbon and hydrogen.","organic"],
["Алкан","Alkane","Насыщенный ациклический углеводород с общей формулой CₙH₂ₙ₊₂.","A saturated acyclic hydrocarbon with the general formula CₙH₂ₙ₊₂.","organic"],
["Функциональная группа","Functional group","Атом или группа атомов, определяющая характерные реакции органического соединения.","An atom or group of atoms responsible for characteristic reactions of an organic compound.","organic"],
["Полимер","Polymer","Вещество, молекулы которого состоят из повторяющихся структурных звеньев.","A substance whose molecules consist of repeating structural units.","organic"],
["Орбиталь","Orbital","Математическое описание состояния электрона в атоме; квадрат модуля волновой функции связан с распределением вероятности обнаружить электрон в пространстве.","A mathematical description of an electron state in an atom; the squared magnitude of its wavefunction gives the probability distribution for finding the electron in space.","matter"],
["Аллотропия","Allotropy","Существование одного химического элемента в виде нескольких простых веществ с различным строением и свойствами, например алмаз и графит.","The existence of an element in different structural forms with distinct properties, such as diamond and graphite.","matter"],
["Стехиометрия","Stoichiometry","Раздел химии о количественных соотношениях реагентов и продуктов, определяемых сбалансированными уравнениями реакций.","The study of quantitative relationships between reactants and products described by balanced chemical equations.","reaction"],
["Лимитирующий реагент","Limiting reactant","Реагент, который при заданных начальных количествах расходуется первым и ограничивает теоретическое количество продукта.","The reactant that is consumed first for the given starting amounts and limits the theoretical amount of product.","reaction"],
["Степень превращения","Reaction extent","Величина, характеризующая ход реакции; изменение количества каждого вещества связано с ней его стехиометрическим коэффициентом.","A quantity describing the progress of a reaction; the amount change of each species is related to it through its stoichiometric coefficient.","reaction"],
["Точка эквивалентности","Equivalence point","Момент титрования, когда добавленное количество титранта стехиометрически соответствует количеству определяемого вещества согласно уравнению реакции.","The point in a titration at which the amount of titrant added is stoichiometrically equivalent to the analyte amount according to the reaction equation.","solution"],
["Растворимость","Solubility","Равновесное количество вещества, которое может раствориться в заданном количестве растворителя при определённых температуре и давлении.","The equilibrium amount of a substance that can dissolve in a given amount of solvent at specified temperature and pressure.","solution"],
["Идеальный газ","Ideal gas","Модель газа, в которой частицы считаются точечными, а их взаимодействием вне упругих столкновений пренебрегают.","A gas model in which particles are treated as point-like and interactions are neglected except during elastic collisions.","matter"],
["Массовое число","Mass number","Общее число протонов и нейтронов в конкретном атомном ядре; обозначается A и всегда является целым числом.","The total number of protons and neutrons in a particular atomic nucleus; denoted A and always an integer.","matter"],
["Относительная атомная масса","Relative atomic mass","Отношение средней массы атомов элемента в заданном изотопном составе к 1/12 массы атома углерода-12; величина безразмерная.","The ratio of the mean mass of atoms of an element in a specified isotopic composition to one-twelfth of the mass of a carbon-12 atom; it is dimensionless.","matter"],
["Постоянная Авогадро","Avogadro constant","Число заданных элементарных сущностей в одном моле; точное значение в СИ — 6,02214076 × 10²³ моль⁻¹.","The number of specified elementary entities in one mole; its exact SI value is 6.02214076 × 10²³ mol⁻¹.","matter"],
["Эмпирическая формула","Empirical formula","Формула, показывающая простейшее целочисленное соотношение атомов элементов в соединении.","A formula showing the simplest whole-number ratio of atoms of each element in a compound.","matter"],
["Молекулярная формула","Molecular formula","Формула, показывающая фактическое число атомов каждого элемента в одной молекуле.","A formula showing the actual number of atoms of each element in one molecule.","matter"],
["Скорость реакции","Reaction rate","Изменение концентрации реагента или продукта за единицу времени.","The change in concentration of a reactant or product per unit time.","reaction"],
["Энергия активации","Activation energy","Энергетический барьер, который необходимо преодолеть реагирующей системе для протекания реакции по определённому механизму.","The energy barrier that a reacting system must overcome for a reaction to proceed by a particular mechanism.","reaction"],
["Химическое равновесие","Chemical equilibrium","Динамическое состояние обратимой реакции, при котором скорости прямого и обратного процессов равны, а макроскопический состав системы не меняется.","The dynamic state of a reversible reaction in which forward and reverse reaction rates are equal and the macroscopic composition remains constant.","reaction"],
["Энтальпия","Enthalpy","Термодинамическая функция состояния H = U + pV; при постоянном давлении изменение энтальпии равно теплоте, переданной системе, если выполняется только работа расширения.","A thermodynamic state function H = U + pV; at constant pressure, its change equals heat transferred to the system when only pressure–volume work is done.","reaction"],
["Межмолекулярные взаимодействия","Intermolecular forces","Взаимодействия между отдельными частицами вещества, влияющие, например, на температуры кипения, плавления и растворимость.","Interactions between separate particles of a substance that influence properties such as boiling point, melting point and solubility.","matter"],
["Буферный раствор","Buffer solution","Раствор, который противодействует значительному изменению pH при добавлении небольших количеств кислоты или основания; обычно содержит сопряжённую кислотно-основную пару.","A solution that resists a large pH change when small amounts of acid or base are added; it usually contains a conjugate acid–base pair.","solution"],
["Степень окисления","Oxidation state","Формальная величина, назначаемая атому по правилам распределения электронов в связях; сумма степеней окисления равна заряду частицы.","A formal value assigned to an atom using bond-electron allocation rules; the sum of oxidation states equals the species charge.","reaction"],
["Окислитель","Oxidising agent","Частица, принимающая электроны и сама восстанавливающаяся в окислительно-восстановительной реакции.","A species that accepts electrons and is itself reduced in a redox reaction.","reaction"],
["Восстановитель","Reducing agent","Частица, отдающая электроны и сама окисляющаяся в окислительно-восстановительной реакции.","A species that donates electrons and is itself oxidised in a redox reaction.","reaction"],
["Анод","Anode","Электрод, на котором происходит окисление; его знак зависит от того, является ли элемент гальваническим или электролитическим.","The electrode where oxidation occurs; its sign depends on whether the cell is galvanic or electrolytic.","reaction"],
["Катод","Cathode","Электрод, на котором происходит восстановление; его знак зависит от типа электрохимического элемента.","The electrode where reduction occurs; its sign depends on the type of electrochemical cell.","reaction"],
["Гальванический элемент","Galvanic cell","Электрохимический элемент, в котором самопроизвольная окислительно-восстановительная реакция преобразует химическую энергию в электрическую.","An electrochemical cell in which a spontaneous redox reaction converts chemical energy into electrical energy.","reaction"],
["Стандартная ЭДС элемента","Standard cell potential","Разность стандартных потенциалов восстановления катода и анода; для реакции в записанном направлении положительное значение соответствует отрицательному стандартному изменению энергии Гиббса.","The difference between the standard reduction potentials of the cathode and anode; a positive value for the reaction as written corresponds to a negative standard Gibbs-energy change.","reaction"],
["Закон Гесса","Hess’s law","Изменение энтальпии реакции зависит только от начального и конечного состояний, а не от последовательности стадий.","The enthalpy change depends only on the initial and final states, not on the sequence of reaction steps.","reaction"],
["Фермент","Enzyme","Биологический катализатор, обычно белок, ускоряющий реакцию без суммарного расходования; некоторые каталитические молекулы РНК также существуют.","A biological catalyst, usually a protein, that speeds up a reaction without being consumed overall; some catalytic RNA molecules also exist.","matter"],
["Нуклеиновая кислота","Nucleic acid","Полимер нуклеотидов; ДНК хранит наследственную информацию, а РНК выполняет разнообразные функции в её реализации.","A nucleotide polymer; DNA stores hereditary information, while RNA has diverse roles in its expression.","matter"],
["Кетон","Ketone","Органическое соединение с карбонильной группой C=O, связанной с двумя атомами углерода.","An organic compound with a carbonyl group, C=O, bonded to two carbon atoms.","organic"],
["Сложный эфир","Ester","Производное карбоновой кислоты с функциональной группой R–COO–R′.","A carboxylic-acid derivative containing the R–COO–R′ functional group.","organic"],
["Простой эфир","Ether","Органическое соединение, в котором атом кислорода связан с двумя углеродсодержащими группами: R–O–R′.","An organic compound in which an oxygen atom is bonded to two carbon-containing groups: R–O–R′.","organic"],
["Арен","Arene","Ароматический углеводород с делокализованной π-электронной системой; пример — бензол.","An aromatic hydrocarbon with a delocalised π-electron system; benzene is an example.","organic"],
["Уравнение Хендерсона — Хассельбаха","Henderson–Hasselbalch equation","Приближённое соотношение pH = pKₐ + log₁₀([A⁻]/[HA]) для буферного раствора при применимых условиях.","An approximate relation, pH = pKₐ + log₁₀([A⁻]/[HA]), for a buffer solution under applicable conditions.","solution"],
["Электролиз","Electrolysis","Протекание несамопроизвольной окислительно-восстановительной реакции под действием внешнего электрического напряжения.","The driving of a non-spontaneous redox reaction by an external electrical voltage.","reaction"],
["Полуреакция","Half-reaction","Запись отдельной части окислительно-восстановительного процесса, показывающая отдачу или присоединение электронов.","An equation for one part of a redox process, showing electron loss or gain.","reaction"],
["Стандартный потенциал восстановления","Standard reduction potential","Потенциал полуреакции восстановления относительно стандартного водородного электрода при стандартных условиях.","The potential of a reduction half-reaction relative to the standard hydrogen electrode under standard conditions.","reaction"],
["Насыщенный раствор","Saturated solution","Раствор, находящийся в равновесии с избытком растворённого вещества при заданных температуре и давлении.","A solution in equilibrium with excess undissolved solute at a specified temperature and pressure.","solution"],
["Произведение растворимости","Solubility product","Равновесное произведение активностей ионов малорастворимого электролита, возведённых в степени их стехиометрических коэффициентов.","The equilibrium product of the activities of ions in a sparingly soluble electrolyte, each raised to its stoichiometric power.","solution"],
["Ионное произведение","Ionic product","Произведение текущих активностей ионов в растворе; сравнение Qₛₚ с Kₛₚ помогает оценить насыщение и возможность осаждения.","The product of the current ionic activities in solution; comparing Qₛₚ with Kₛₚ helps assess saturation and possible precipitation.","solution"],
["Константа кислотности","Acid-dissociation constant","Константа равновесия передачи протона кислотой; её значение характеризует силу кислоты в заданном растворителе и при заданной температуре.","The equilibrium constant for proton transfer from an acid; its value characterises acid strength in a given solvent and at a given temperature.","solution"],
["Сопряжённая кислотно-основная пара","Conjugate acid–base pair","Две частицы, отличающиеся на один протон: кислота и основание, которое образуется после отдачи этого протона.","Two species that differ by one proton: an acid and the base formed when it donates that proton.","solution"],
["Водородная связь","Hydrogen bond","Направленное межмолекулярное или внутримолекулярное притяжение с участием атома водорода, связанного с электроотрицательным атомом.","A directional intermolecular or intramolecular attraction involving a hydrogen atom bonded to an electronegative atom.","matter"],
["Полярная молекула","Polar molecule","Молекула с неравномерным распределением электрического заряда и ненулевым дипольным моментом.","A molecule with an uneven charge distribution and a non-zero dipole moment.","matter"],
["Растворитель","Solvent","Компонент раствора, в котором распределены растворённые вещества; в водных растворах растворителем является вода.","The component of a solution in which solutes are dispersed; water is the solvent in aqueous solutions.","solution"],
["Дипольный момент","Dipole moment","Векторная мера разделения положительного и отрицательного зарядов в системе; для молекулы зависит от распределения зарядов и геометрии.","A vector measure of the separation of positive and negative charge in a system; for a molecule it depends on charge distribution and geometry.","matter"],

["Дезоксирибоза","Deoxyribose","Пентозный сахар в ДНК; отличается от рибозы отсутствием атома кислорода при 2′-атоме углерода.","The pentose sugar in DNA; it differs from ribose by lacking an oxygen atom at the 2′ carbon.","matter"],
["Рибоза","Ribose","Пентозный сахар, входящий в состав РНК и ряда других биологически важных молекул.","A pentose sugar found in RNA and several other biologically important molecules.","matter"],

["Структурный изомер","Structural isomer","Одно из соединений с одинаковой молекулярной формулой, но разным порядком соединения атомов.","One of compounds with the same molecular formula but a different connectivity of atoms.","organic"],
["Гомологический ряд","Homologous series","Ряд органических соединений одного класса, соседние представители которого отличаются на одну группу –CH₂– и имеют сходное строение и типичные химические свойства.","A series of organic compounds in the same class whose successive members differ by one –CH₂– group and share similar structural features and characteristic chemical properties.","organic"],
["Парниковый эффект","Greenhouse effect","Потепление поверхности и нижней атмосферы из-за поглощения и повторного излучения инфракрасной энергии парниковыми газами.","The warming of Earth's surface and lower atmosphere as greenhouse gases absorb and re-emit infrared energy.","environment"],
["Закисление океана","Ocean acidification","Снижение pH морской воды, главным образом связанное с поглощением океаном атмосферного CO₂ и последующими кислотно-основными равновесиями.","The decrease in seawater pH, mainly associated with ocean uptake of atmospheric CO₂ and the resulting acid–base equilibria.","environment"],
["Реакционный коэффициент","Reaction quotient","Безразмерное отношение активностей продуктов реакции к активностям реагентов в текущем состоянии системы, каждое в степени своего стехиометрического коэффициента.","The dimensionless ratio of product activities to reactant activities at the system's current state, each raised to its stoichiometric coefficient.","reaction"],
["Принцип Ле Шателье","Le Chatelier principle","Качественное правило: при внешнем изменении условий равновесная система смещается в направлении, частично ослабляющем это воздействие.","A qualitative rule stating that when conditions change, an equilibrium system shifts in a direction that partly opposes the imposed change.","reaction"],
["Ароматичность","Aromaticity","Особая стабилизация циклической сопряжённой системы π-электронов; бензол — классический пример ароматического соединения.","The special stabilisation of a cyclic, conjugated π-electron system; benzene is a classic aromatic example.","organic"],
["Правило Хюккеля","Hückel rule","Для простых плоских моноциклических полностью сопряжённых систем ароматичность характерна при 4n + 2 π-электронах; при 4n π-электронах такая система антиароматична.","For simple planar, monocyclic, fully conjugated systems, 4n + 2 π electrons indicate aromaticity; a system with 4n π electrons under the same conditions is antiaromatic.","organic"],
["Количество вещества","Amount of substance","Физическая величина, характеризующая число заданных элементарных сущностей в системе; единица СИ — моль.","A physical quantity measuring the number of specified elementary entities in a system; its SI unit is the mole.","matter"],
["Формульная единица","Formula unit","Условная запись минимального целочисленного соотношения ионов в ионном соединении; не является отдельной молекулой.","The symbolic representation of the simplest whole-number ratio of ions in an ionic compound; it is not a discrete molecule.","matter"],
["Аминокислота","Amino acid","Органическое соединение, содержащее аминогруппу и карбоксильную группу; аминокислоты служат строительными блоками белков.","An organic compound containing amino and carboxyl groups; amino acids are the building blocks of proteins.","matter"],
["Пептидная связь","Peptide bond","Ковалентная связь между карбонильным углеродом одного аминокислотного остатка и атомом азота следующего остатка в пептиде или белке.","The covalent bond between the carbonyl carbon of one amino-acid residue and the nitrogen atom of the next residue in a peptide or protein.","matter"],
["Электронный баланс","Electron balance","Подбор коэффициентов в окислительно-восстановительной реакции так, чтобы число отданных электронов равнялось числу принятых.","The balancing of a redox equation so that the number of electrons lost equals the number gained.","reaction"],
["Первичная структура белка","Protein primary structure","Линейная последовательность аминокислотных остатков в полипептидной цепи.","The linear sequence of amino-acid residues in a polypeptide chain.","matter"]
