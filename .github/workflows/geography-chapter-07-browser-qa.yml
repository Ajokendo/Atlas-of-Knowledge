name: Geography Chapter 07 browser and visual acceptance

on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/07-biosphere-and-natural-biomes.md"
      - "geography/assets/diagrams/07-*.svg"
      - "geography/scripts/build_chapter_07_preview.py"
      - "geography/scripts/chapter_07_browser_smoke.mjs"
      - ".github/workflows/geography-chapter-07-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-chapter-07-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-07-browser:
    name: Chapter 07 full-size SVG, mobile/desktop and contrast checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build full-size visual gallery
        run: python geography/scripts/build_chapter_07_preview.py /tmp/geography-chapter-07-preview.html
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Render every SVG and test mobile/desktop, clipping and contrast
        run: node geography/scripts/chapter_07_browser_smoke.mjs
      - name: Upload full-size visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-chapter-07-browser-qa
          path: /tmp/chapter-07-*.png
          if-no-files-found: ignore
          retention-days: 14
