name: Geography Chapter 03 visual browser QA
on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/03-lithosphere-and-geological-processes.md"
      - "geography/assets/03-*.svg"
      - "geography/scripts/build_chapter_03_preview.py"
      - "geography/scripts/chapter_03_browser_smoke.mjs"
      - ".github/workflows/geography-chapter-03-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geography-chapter-03-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate isolated Chapter 03 preview
        run: python geography/scripts/build_chapter_03_preview.py /tmp/geography-chapter-03-preview.html
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop rendering and image decoding
        run: node geography/scripts/chapter_03_browser_smoke.mjs
