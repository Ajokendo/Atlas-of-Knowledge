name: Geography Chapter 07 static visual acceptance
# Current acceptance scope: nine bilingual SVGs, 18 Markdown embeds; regenerated RESOLVE maps include WGS 84 projection metadata.

on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/07-biosphere-and-natural-biomes.md"
      - "geography/assets/diagrams/07-*.svg"
      - "geography/scripts/check_chapter_07_assets.py"
      - ".github/workflows/geography-chapter-07-static-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-chapter-07-static-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-07-assets:
    name: Chapter 07 bilingual inventory and SVG structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bilingual image inventory and SVG XML/ARIA
        run: python geography/scripts/check_chapter_07_assets.py
