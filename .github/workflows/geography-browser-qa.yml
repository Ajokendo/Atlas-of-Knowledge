name: Geography Chapter 02 visual browser QA

on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/02-geographic-envelope.md"
      - "geography/scripts/build_chapter_02_preview.py"
      - "geography/scripts/chapter_02_browser_smoke.mjs"
      - ".github/workflows/geography-image-checks.yml"
      - ".github/workflows/geography-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate isolated QA preview from chapter Markdown
        run: python geography/scripts/build_chapter_02_preview.py /tmp/geography-chapter-02-preview.html
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop rendering
        run: node geography/scripts/chapter_02_browser_smoke.mjs
