name: Build and verify Issyk-Kul flora images

on:
  push:
    branches:
      - workspace/biology
    paths:
      - ".github/workflows/biology-issyk-flora-assets.yml"
      - "biology/scripts/build_issyk_flora_assets.py"
      - "biology/scripts/smoke_issyk_flora.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biology-issyk-flora-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected biology branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download originals, verify live Commons SHA-1 metadata, and build WebP
        run: python biology/scripts/build_issyk_flora_assets.py
      - name: Install Chromium for chapter image QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository and run bilingual chapter QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          sleep 2
          node biology/scripts/smoke_issyk_flora.mjs
      - name: Commit generated assets and source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biology/images/generated/flora-issyk-*.webp biology/images/generated/flora-issyk-assets-manifest.json
          git diff --cached --quiet || git commit -m "Add verified Issyk-Kul flora WebP assets"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
