name: Geography Chapter 06 browser and accessibility acceptance

on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/06-hydrosphere-and-world-ocean.md"
      - "geography/assets/06-*.svg"
      - "geography/scripts/check_chapter_06_assets.py"
      - "geography/scripts/build_chapter_06_preview.py"
      - "geography/scripts/chapter_06_browser_smoke.mjs"
      - ".github/workflows/geography-chapter-06-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-chapter-06-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-06-browser:
    name: Chapter 06 Chromium, image and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bilingual image inventory and SVG XML/ARIA
        run: python geography/scripts/check_chapter_06_assets.py
      - name: Build isolated visual gallery
        run: python geography/scripts/build_chapter_06_preview.py /tmp/geography-chapter-06-preview.html
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Test images, mobile/desktop layout, keyboard and WCAG rules
        run: node geography/scripts/chapter_06_browser_smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-chapter-06-browser-qa
          path: /tmp/chapter-06-*.png
          if-no-files-found: ignore
          retention-days: 14
