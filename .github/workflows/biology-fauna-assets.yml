name: Build and browser-check shortlisted Chuy fauna and habitat assets

on:
  push:
    branches:
      - workspace/biology
    paths:
      - ".github/workflows/biology-fauna-assets.yml"
      - "biology/scripts/build_chuy_fauna_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected biology branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download originals, verify Commons SHA-1, and build WebP
        run: python biology/scripts/build_chuy_fauna_assets.py
      - name: Install Chromium for focused browser QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository and run focused Chuy fauna browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          sleep 2
          node biology/scripts/smoke_chuy_fauna.mjs
      - name: Commit generated assets and source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biology/images/generated/fauna-chuy-squirrel.webp biology/images/generated/fauna-chuy-pit-viper.webp biology/images/generated/habitat-chuy-ak-suu.webp biology/images/generated/habitat-chuy-ala-archa.webp biology/images/generated/fauna-chuy-assets-manifest.json
          git diff --cached --quiet || git commit -m "Add verified Chuy fauna WebP assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
