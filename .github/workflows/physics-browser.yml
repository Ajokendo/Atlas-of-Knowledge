name: Physics browser and accessibility smoke

on:
  push:
    branches: [workspace/physics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-browser-${{ github.sha }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/physics-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/original-engine/kinematics/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/newton/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/circular/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/energy/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/momentum/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/oscillations/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/rotation/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/fluids/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/electrostatics/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/gauss/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/potential/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/capacitors/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/circuits/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/magnetism/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/induction/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/physics-http.log
          exit 1
      - name: Test Chapter 14–15 new visual assets on desktop and mobile viewports
        run: node original-engine/visual-assets-smoke.mjs
      - name: Check contextual canvas labels across all 15 chapters
        run: node original-engine/canvas-accessibility-smoke.mjs
      - name: Upload Chapter 14–15 visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-visual-review
          path: /tmp/physics-visual-review/*.png
          if-no-files-found: warn
      - name: Test Chapter 1 kinematics on desktop and mobile viewports
        run: node original-engine/browser-smoke.mjs
      - name: Upload Chapter 1 visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-visual-review
          path: /tmp/physics-visual-review/chapter1/*.png
          if-no-files-found: warn
      - name: Test Chapter 2 Newton laws on desktop and mobile viewports
        if: always()
        run: node original-engine/newton-smoke.mjs
      - name: Upload Chapter 2 Newton visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-newton-visual-review
          path: /tmp/physics-visual-review/newton/*.png
          if-no-files-found: warn
      - name: Test Chapter 4 work and energy on desktop and mobile viewports
        run: node original-engine/work-energy-smoke.mjs
      - name: Test Chapter 6 oscillations on desktop and mobile viewports
        run: node original-engine/oscillations/browser-smoke.mjs
      - name: Upload Chapter 6 oscillation visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter6-oscillations-visual-review
          path: /tmp/physics-visual-review/oscillations/*.png
          if-no-files-found: warn
      - name: Test Chapter 7 rotation on desktop and mobile viewports
        run: node original-engine/rotation/browser-smoke.mjs
      - name: Test Chapter 8 fluids on desktop and mobile viewports
        run: node original-engine/fluids/browser-smoke.mjs
      - name: Test Chapter 9 electrostatics on desktop and mobile viewports
        run: node original-engine/electrostatics/browser-smoke.mjs
      - name: Test Chapter 14 magnetic fields on desktop and mobile viewports
        run: node original-engine/magnetism/browser-smoke.mjs
      - name: Test Chapter 15 electromagnetic induction on desktop and mobile viewports
        run: node original-engine/induction/browser-smoke.mjs
      - name: Test Chapter 10 Gauss law on desktop and mobile viewports
        run: node original-engine/gauss/browser-smoke.mjs
      - name: Test Chapter 3 circular motion on desktop and mobile viewports
        env:
          MODULE: circular
          EXPECTED_PAGES: "13"
        run: node original-engine/book-smoke.mjs
      - name: Test Chapter 3 standalone lesson, controls and quiz on desktop and mobile
        run: node original-engine/circular/standalone-smoke.mjs
      - name: Upload Chapter 3 circular-motion visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-circular-visual-review
          path: /tmp/physics-visual-review/circular/*.png
          if-no-files-found: warn
      - name: Test Chapter 5 momentum on desktop and mobile viewports
        env:
          MODULE: momentum
          EXPECTED_PAGES: "12"
        run: node original-engine/book-smoke.mjs
      - name: Test Chapter 11 electric potential on desktop and mobile viewports
        env:
          MODULE: potential
          EXPECTED_PAGES: "9"
        run: node original-engine/book-smoke.mjs
      - name: Test Chapter 12 capacitors on desktop and mobile viewports
        env:
          MODULE: capacitors
          EXPECTED_PAGES: "9"
        run: node original-engine/book-smoke.mjs
      - name: Test Chapter 13 electric circuits on desktop and mobile viewports
        env:
          MODULE: circuits
          EXPECTED_PAGES: "9"
        run: node original-engine/book-smoke.mjs
      - name: Test Chapter 13 schematic and interactive book on desktop and mobile viewports
        run: |
          node original-engine/circuits/standalone-smoke.mjs
          MODULE=circuits EXPECTED_PAGES=9 node original-engine/book-smoke.mjs


  all-book-visual-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/physics-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/original-engine/kinematics/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/induction/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/physics-http.log
          exit 1
      - name: Capture every interactive-book page on desktop and mobile
        run: |
          set -e
          while read -r module pages; do
            MODULE="$module" EXPECTED_PAGES="$pages" SCREENSHOT_DIR="/tmp/physics-visual-review/all-books/$module" node original-engine/book-smoke.mjs
          done <<'EOF'
          kinematics 11
          newton 13
          circular 13
          energy 12
          momentum 12
          oscillations 12
          rotation 15
          fluids 9
          electrostatics 9
          gauss 9
          potential 9
          capacitors 9
          circuits 9
          magnetism 9
          induction 10
          EOF
      - name: Upload all 15 chapters visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-15-chapters-visual-review
          path: /tmp/physics-visual-review/all-books/**/*.png
          if-no-files-found: warn

