name: Physics browser and accessibility smoke

on:
  push:
    branches: [workspace/physics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-browser-${{ github.sha }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: npm install --no-save playwright @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/physics-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/original-engine/kinematics/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/newton/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/oscillations/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/rotation/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/fluids/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/original-engine/electrostatics/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/physics-http.log
          exit 1
      - name: Test Chapter 1 kinematics on desktop and mobile viewports
        run: node original-engine/browser-smoke.mjs
      - name: Test Chapter 2 Newton laws on desktop and mobile viewports
        run: node original-engine/newton-smoke.mjs
      - name: Test Chapter 4 work and energy on desktop and mobile viewports
        run: node original-engine/work-energy-smoke.mjs
      - name: Test Chapter 6 oscillations on desktop and mobile viewports
        run: node original-engine/oscillations/browser-smoke.mjs
      - name: Test Chapter 7 rotation on desktop and mobile viewports
        run: node original-engine/rotation/browser-smoke.mjs
      - name: Test Chapter 8 fluids on desktop and mobile viewports
        run: node original-engine/fluids/browser-smoke.mjs
      - name: Test Chapter 9 electrostatics on desktop and mobile viewports
        run: node original-engine/electrostatics/browser-smoke.mjs
