name: Geography Chapter 06 static visual acceptance

on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/06-hydrosphere-and-world-ocean.md"
      - "geography/assets/06-*.svg"
      - "geography/scripts/check_chapter_06_assets.py"
      - ".github/workflows/geography-chapter-06-static-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geography-chapter-06-static-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-06-assets:
    name: Chapter 06 bilingual image and SVG validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bilingual image inventory and SVG XML/ARIA
        run: python geography/scripts/check_chapter_06_assets.py
