name: Geography Chapter 05 technical acceptance

on:
  push:
    branches: [workspace/geography]
    paths:
      - "geography/chapters/05-atmosphere-and-climatology.md"
      - "geography/visuals/chapter-05-*.svg"
      - "geography/assets/CHAPTER_05_ASSET_LICENSE.md"
      - "geography/scripts/build_chapter_05_preview.py"
      - "geography/scripts/check_chapter_05_assets.py"
      - "geography/scripts/chapter_05_browser_smoke.mjs"
      - "geography/scripts/vendor_chapter_05_noaa_assets.py"
      - ".github/workflows/geography-chapter-05-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geography-chapter-05-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-browser-qa:
    name: Chapter 05 static and Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace/geography
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bilingual image inventory, SVG structure and licence scope
        run: python geography/scripts/check_chapter_05_assets.py
      - name: Mirror unchanged NOAA assets to avoid GitHub external-image proxy failures
        run: python geography/scripts/vendor_chapter_05_noaa_assets.py
      - name: Commit local NOAA mirrors to the Geography working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geography/assets/chapter-05-noaa
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -m "Mirror official NOAA images for Geography Chapter 05"
            git push origin HEAD:workspace/geography
          fi
      - name: Build isolated visual QA page
        run: python geography/scripts/build_chapter_05_preview.py /tmp/geography-chapter-05-preview.html
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Test isolated preview and GitHub Markdown on mobile and desktop
        run: node geography/scripts/chapter_05_browser_smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-chapter-05-browser-qa
          path: /tmp/chapter-05-*.png
          if-no-files-found: ignore
          retention-days: 14
