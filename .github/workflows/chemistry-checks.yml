name: Chemistry atlas checks

on:
  push:
    branches: [main, portal-foundation, workspace/chemistry]
    paths:
      - "chemistry/**"
      - "catalog.html"
      - "progress.html"
      - "portal.html"
      - "index.html"
      - ".github/workflows/chemistry-checks.yml"
  pull_request:
    paths:
      - "chemistry/**"
      - "catalog.html"
      - "portal.html"
      - "progress.html"
      - "index.html"
      - ".github/workflows/chemistry-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate chemistry pages, links, assets and scripts
        run: node chemistry/checks.mjs
      - name: Install pinned browser audit tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1 axe-core@4.14.0
          npm ls --depth=0
          npx playwright install --with-deps chromium
      - name: Start local site server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
      - name: Test every Chemistry Atlas page in Chromium
        run: node chemistry/browser-smoke.mjs
